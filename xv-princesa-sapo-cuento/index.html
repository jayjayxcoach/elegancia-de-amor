    <p class="dato claro" data-campo="bendicion"></p>
    <div id="padres-nombres"></div>
    <p class="dato claro y" id="padrinos-titulo"></p>
    <div id="padrinos-nombres"></div>
  </div>

  <!-- 4. LA BARCA DE LOTOS: te invito + 15 años -->
  <div class="capa revela" id="invita">
    <p class="dato caps claro" id="invitacion"></p>
    <div class="quince script oro sombra-oro"><b>15</b>Años</div>
  </div>

  <!-- 5. LA ISLITA DEL SAPITO: reserva la fecha -->
  <div class="capa recuadro revela" id="fecha">
    <div class="titulo script oro sombra-oro">Reserva la Fecha</div>
    <p class="grande claro" data-campo="fechaLarga"></p>
    <p class="hora dato claro">A partir de las <b data-campo="hora"></b></p>
  </div>

  <!-- 6. LOS 4 FAROLITOS SOBRE NENÚFARES: falta poco -->
  <div class="capa script oro sombra-oro revela" id="falta">Falta poco</div>
  <div class="celda" style="left:13.33cqw;top:833.80cqw"><b id="c0">00</b></div><div class="etiqueta" style="left:13.33cqw;top:846.76cqw">Días</div><div class="celda" style="left:38.33cqw;top:833.80cqw"><b id="c1">00</b></div><div class="etiqueta" style="left:38.33cqw;top:846.76cqw">Horas</div><div class="celda" style="left:61.67cqw;top:833.80cqw"><b id="c2">00</b></div><div class="etiqueta" style="left:61.67cqw;top:846.76cqw">Min</div><div class="celda" style="left:86.67cqw;top:833.80cqw"><b id="c3">00</b></div><div class="etiqueta" style="left:86.67cqw;top:846.76cqw">Seg</div>

  <!-- 7. LA CAPILLITA: eucaristía -->
  <div class="capa recuadro revela" id="misa">
    <div class="titulo script oro sombra-oro" data-sub="misa.titulo"></div>
    <p class="lugar claro" data-sub="misa.lugar"></p>
    <p class="direccion claro" data-sub="misa.direccion"></p>
    <div class="hora-linea claro" data-sub="misa.hora"></div>
    <a class="boton" data-mapa="misa" target="_blank" rel="noopener"></a>
  </div>

  <!-- 8. LA TERRAZA DE LA FIESTA: recepción -->
  <div class="capa recuadro revela" id="fiesta">
    <div class="titulo script oro sombra-oro" data-sub="fiesta.titulo"></div>
    <p class="lugar claro" data-sub="fiesta.lugar"></p>
    <p class="direccion claro" data-sub="fiesta.direccion"></p>
    <div class="hora-linea claro" data-sub="fiesta.hora"></div>
    <a class="boton" data-mapa="fiesta" target="_blank" rel="noopener"></a>
  </div>

  <!-- 9. LA GLORIETA DEL VESTIDO: vestimenta -->
  <div class="capa recuadro revela" id="vestimenta">
    <div class="titulo script oro sombra-oro">Código de Vestimenta</div>
    <p class="estilo claro" data-sub="vestimenta.estilo"></p>
    <p class="dato claro" data-sub="vestimenta.nota"></p>
  </div>

  <!-- 10. EL PUENTE DE LOS FAROLES: confirmación -->
  <div class="capa recuadro noche revela" id="confirma">
    <div class="titulo script oro sombra-oro-noche">Confirma tu Asistencia</div>
    <p class="dato oscuro" data-sub="confirmacion.texto"></p>
    <a class="boton" id="confirmacion-boton" target="_blank" rel="noopener" data-sub="confirmacion.boton"></a>
  </div>

  <!-- 11. LA NOCHE DE ESTRELLAS: te espero -->
  <div class="capa revela" id="cierre">
    <p class="frase oscuro" data-sub="despedida.frase"></p>
    <div class="titulo script oro sombra-oro-noche" data-sub="despedida.cierre"></div>
    <div class="nombre script oro sombra-oro-noche" data-campo="festejada"></div>
    <p class="caps" data-campo="fechaCorta"></p>
  </div>
</main>

<footer id="credito"></footer>
<div id="luces" aria-hidden="true"></div>
<button id="musica-boton" class="pausado" aria-label="Pausar o poner la música">
  <svg class="icono-pausa" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  <svg class="icono-play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
</button>
<audio id="musica" loop preload="auto"></audio>
<div id="aviso"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const C = CONFIG;
  const sub = r => r.split('.').reduce((o, k) => (o || {})[k], C);
  document.querySelectorAll('[data-campo]').forEach(e => e.textContent = C[e.dataset.campo] || '');
  document.querySelectorAll('[data-sub]').forEach(e => { let v = sub(e.dataset.sub) || ''; if (e.classList.contains('hora-linea')) v = v.replace(' · ', String.fromCharCode(10)); e.textContent = v; if (!v && !e.classList.contains('titulo')) e.style.display = 'none'; });
  $('invitacion').innerHTML = C.invitacion;
  const nombres = (id, lista) => $(id).innerHTML = lista.map(n => '<div class="nombre script oro sombra-oro"></div>').join('');
  nombres('padres-nombres', C.padres); $('padres-nombres').querySelectorAll('.nombre').forEach((e, i) => e.textContent = C.padres[i]);
  if (C.padrinos.length) { $('padrinos-titulo').textContent = C.tituloPadrinos; nombres('padrinos-nombres', C.padrinos); $('padrinos-nombres').querySelectorAll('.nombre').forEach((e, i) => e.textContent = C.padrinos[i]); }
  else $('padrinos-titulo').style.display = 'none';
  document.querySelectorAll('[data-mapa]').forEach(a => { const d = C[a.dataset.mapa]; a.href = d.mapa; a.textContent = d.boton; });   // el mapa SÍ funciona en la muestra
  if (!C.misa.lugar) $('misa').style.display = 'none';
  const cr = C.credito;
  $('credito').innerHTML = cr.texto + '<br><a href="' + cr.enlace + '" target="_blank" rel="noopener">' + cr.marca + ' · ' + cr.boton + ' ›</a>';

  /* WhatsApp: solo se activa en la versión final pagada */
  const aviso = $('aviso'); aviso.textContent = C.muestra.aviso; let tA;
  const mostrarAviso = e => { e.preventDefault(); aviso.classList.add('ver'); clearTimeout(tA); tA = setTimeout(() => aviso.classList.remove('ver'), 2200); };
  const boton = $('confirmacion-boton');
  if (C.confirmacion.whatsapp && !C.muestra.activa) boton.href = 'https://wa.me/' + C.confirmacion.whatsapp.replace(/\D/g, '') + '?text=' + encodeURIComponent(C.confirmacion.mensaje);
  else { boton.removeAttribute('href'); boton.addEventListener('click', mostrarAviso); }

  /* marca de agua (antes del pago); ?sinmarca solo la quita para revisar */
  if (C.muestra.activa && !location.search.includes('sinmarca')) {
    document.body.classList.add('muestra');
    const t = C.muestra.texto;
    const fila = (x, y) => "<text x='" + x + "' y='" + y + "' text-anchor='middle' font-family='Georgia,serif' font-size='14' font-weight='700' letter-spacing='2.5' fill='rgba(15,8,8,.45)' stroke='rgba(255,255,255,.3)' stroke-width='.5'>" + t + "</text>";
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='260' height='200'><g transform='rotate(-28 130 100)'>" + fila(130, 70) + fila(0, 160) + fila(260, 160) + "</g></svg>";
    const capa = document.createElement('div'); capa.id = 'marca-agua'; capa.setAttribute('aria-hidden', 'true');
    capa.style.setProperty('--marca', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
    document.body.appendChild(capa);
    ['contextmenu', 'dragstart', 'selectstart', 'copy', 'cut'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
    document.addEventListener('keydown', e => { const k = (e.key || '').toLowerCase(), m = e.ctrlKey || e.metaKey;
      if (e.key === 'F12' || (m && ['s', 'u', 'p', 'c', 'a'].includes(k)) || (m && e.shiftKey && ['i', 'j', 'c'].includes(k))) e.preventDefault(); });
  }

  /* cuenta regresiva */
  const meta = new Date(C.cuentaHasta).getTime(), dos = n => String(n).padStart(2, '0');
  const cuenta = () => { const r = Math.max(0, meta - Date.now());
    $('c0').textContent = Math.floor(r / 864e5); $('c1').textContent = dos(Math.floor(r % 864e5 / 36e5));
    $('c2').textContent = dos(Math.floor(r % 36e5 / 6e4)); $('c3').textContent = dos(Math.floor(r % 6e4 / 1e3)); };
  cuenta(); setInterval(cuenta, 1000);

  /* luciérnagas por todo el dibujo */
  const esc = $('escena');
  for (let i = 0; i < 60; i++) {
    const l = document.createElement('span'); l.className = 'chispa';
    l.style.left = (4 + Math.random() * 92) + '%'; l.style.top = (Math.random() * 100) + '%';
    l.style.setProperty('--t', (6 + Math.random() * 7).toFixed(1) + 's'); l.style.setProperty('--d', (-Math.random() * 8).toFixed(1) + 's');
    esc.appendChild(l);
  }
  /* luciérnagas que suben por la pantalla */
  const luces = $('luces');
  for (let i = 0; i < 9; i++) {
    const p = document.createElement('i');
    p.style.cssText = '--x:' + (Math.random() * 100).toFixed(1) + '%;--t:' + (4 + Math.random() * 3).toFixed(0) + 'px;--d:' + (14 + Math.random() * 10).toFixed(1) + 's;--r:' + (-Math.random() * 20).toFixed(1) + 's;--dx:' + ((Math.random() - .5) * 100).toFixed(0) + 'px';
    luces.appendChild(p);
  }

  /* aparecen al bajar */
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visto'); io.unobserve(e.target); } }), { threshold: .15 });
  document.querySelectorAll('.revela').forEach(e => io.observe(e));

  /* música */
  const musica = $('musica'), mb = $('musica-boton'); musica.src = C.musica;
  const tocar = () => { const p = musica.play(); if (p && p.then) p.then(() => mb.classList.remove('pausado')).catch(() => mb.classList.add('pausado')); };
  mb.addEventListener('click', () => { if (musica.paused) { delete musica.dataset.pausadoPorUsuario; tocar(); } else { musica.pause(); musica.dataset.pausadoPorUsuario = '1'; mb.classList.add('pausado'); } });
  document.addEventListener('touchend', () => { if (listo && musica.paused && !musica.dataset.pausadoPorUsuario) tocar(); }, { passive: true });

  /* sobre: tocar el sello → (video si lo hay, si no un fundido) → el cuento */
  const SB = C.sobre, sobre = $('sobre'), url = r => 'url("' + r + '")';
  sobre.innerHTML = '<div class="sobre-fondo"></div><div class="sobre-caja"><video playsinline webkit-playsinline preload="auto" muted></video><div class="sello"></div></div><div class="toca"></div>';
  sobre.querySelector('.toca').textContent = SB.texto;
  sobre.querySelector('.sobre-fondo').style.backgroundImage = url(SB.imagen);
  const sello = sobre.querySelector('.sello'); sello.style.left = SB.selloX + '%'; sello.style.top = SB.selloY + '%';
  const vid = sobre.querySelector('video'); vid.poster = SB.imagen; vid.style.backgroundImage = url(SB.imagen); if (SB.video) vid.src = SB.video;
  vid.muted = true; vid.defaultMuted = true;      // el video va sin sonido para no cortar la canción (iPhone)
  let abierto = false, listo = false;
  const terminar = () => {
    if (listo) return; listo = true;
    sobre.classList.add('sale'); document.body.classList.remove('cerrado'); window.scrollTo(0, 0);
    setTimeout(() => sobre.remove(), 1100);
  };
  const abrir = () => {
    if (abierto) return; abierto = true; tocar(); mb.classList.add('ver');
    sobre.classList.add('abierto');
    if (!SB.video) { setTimeout(terminar, 700); return; }
    const vel = parseFloat(new URLSearchParams(location.search).get('vel')) || 2;
    vid.playbackRate = vid.defaultPlaybackRate = vel;
    vid.play().catch(terminar);
    vid.ontimeupdate = () => { if (vid.duration && vid.currentTime >= vid.duration - .45) terminar(); };
    vid.onended = terminar; setTimeout(() => { if (vid.currentTime < .1) terminar(); }, 6000); setTimeout(terminar, 9000);
  };
  sobre.addEventListener('click', abrir);
  if (location.search.includes('directo')) { sobre.remove(); listo = true; document.body.classList.remove('cerrado'); mb.classList.add('ver'); }
})();
</script>
</body>
</html>
