<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F3C9CF">
<title>Mis XV Años</title>

<!--
  ==========================================================================
   INVITACIÓN DE QUINCE AÑOS  ·  "Princesa Rosa"
  ==========================================================================

   CÓMO EDITAR ESTA INVITACIÓN (no necesitas saber programar):

   1) Baja hasta el bloque  >>> CONFIGURACIÓN <<<. Ahí están los textos,
      la fecha, las imágenes y la música. Cambia lo que está entre
      comillas "..." y guarda.

   2) Este archivo va SIEMPRE con la carpeta "recursos". Si mueves la
      invitación, mueve también la carpeta.

   ESTRUCTURA (de arriba hacia abajo):
     · Apertura  → puertas del castillo cerradas con un medallón dorado.
                   La invitada toca el medallón, las puertas se abren
                   hacia adentro, entra la luz y arranca la canción.
     · Portada   → (provisional: se reemplaza con el arte de la quinceañera)
     · Resto de secciones: en construcción.
  ==========================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">

<script>
/* =========================================================================
   >>> CONFIGURACIÓN <<<   —   AQUÍ SE CAMBIA TODO
   ========================================================================= */
const CONFIG = {

  /* ---------- LA QUINCEAÑERA ---------- */
  quinceanera: {
    nombre: "Kaori Vania"
  },

  /* ---------- FECHA ---------- */
  fecha: {
    texto:  "Sábado 05 · Septiembre · 2026",
    exacta: "2026-09-05T20:00:00-05:00"   // para la cuenta regresiva. -05:00 = hora Ecuador
  },

  /* =====================================================================
     APERTURA  (lo primero que ve el invitado)
     ---------------------------------------------------------------------
     Las puertas vienen de UNA sola imagen (puertas-cerradas.jpg) que se
     separó en tres capas: el marco de piedra con las flores, la puerta
     izquierda y la puerta derecha. El marco se queda quieto y solo se
     abren las puertas.
     "sello" es el medallón que se toca. Si la imagen no existe todavía,
     se dibuja un medallón dorado de respaldo automáticamente.
     ===================================================================== */
  apertura: {
    imagenCompleta: "recursos/puertas-cerradas.jpg",   // la imagen original (se usa de fondo en pantallas anchas)
    marco:          "recursos/apertura-marco.webp",
    puertaIzquierda:"recursos/apertura-puerta-izq.webp",
    puertaDerecha:  "recursos/apertura-puerta-der.webp",
    sello:          "recursos/sello-corona.webp",
    textoAbrir:     "Toca para abrir"
  },

  /* ---------- MÚSICA DE FONDO ----------
     Empieza a sonar cuando el invitado toca el medallón y aparece un
     botón redondo para pausarla. Debe ser un archivo .mp3 (no sirve un
     enlace de YouTube ni de Spotify). Guárdalo en "recursos" y escribe
     su nombre, por ejemplo "recursos/musica.mp3", o pega el enlace
     directo al .mp3. Deja "" (vacío) si no quieres música. */
  musica: "recursos/musica.mp3"   // "Veo en ti la luz" (Enredados), recortada sin silencios para que repita limpio
};
</script>

<style>
/* =========================================================================
   ESTILOS
   ========================================================================= */
:root {
  --rosa:        #F3C9CF;
  --rosa-claro:  #FBE9EC;
  --rosa-fuerte: #C7728A;
  --vino-rosa:   #9E4A62;
  --oro:         #C99A3E;
  --oro-claro:   #F3D892;
  --oro-oscuro:  #8E6420;
  --crema:       #FFF8F1;
  --texto:       #5B3A42;
  --script: "Great Vibes", "Pinyon Script", cursive;
  --serif:  "Playfair Display", Georgia, serif;
  --caps:   "Cinzel", Georgia, serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--crema);
  color: var(--texto);
  font-family: var(--serif);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.bloqueado { overflow: hidden; height: 100svh; }
img { display: block; max-width: 100%; }

/* ---------- APERTURA: puertas del castillo ---------- */
#apertura {
  position: fixed; inset: 0; z-index: 100;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
/* Relleno de los costados en pantallas anchas (computadora) */
#apertura .relleno {
  position: absolute; inset: -40px;
  background-size: cover; background-position: center;
  filter: blur(28px) saturate(1.1) brightness(1.02);
  transform: scale(1.1);
  transition: opacity .5s ease;
}
/* El escenario conserva la proporción exacta de la imagen (1438 x 2576)
   para que las tres capas encajen siempre al píxel */
#apertura .escena {
  position: absolute; left: 50%; top: 50%;
  width: max(100vw, calc(100svh * 0.55823));
  aspect-ratio: 1438 / 2576;
  transform: translate(-50%, -50%);
  perspective: 1700px;
  perspective-origin: 50% 55%;
}
@media (min-aspect-ratio: 3/4) {
  #apertura .escena { width: calc(100svh * 0.55823); }
}
#apertura .capa { position: absolute; }
#apertura .marco { inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

/* Hueco de la puerta (coordenadas medidas sobre la imagen original) */
#apertura .hueco, #apertura .puerta, #apertura .luz {
  top: 12.4612%; height: 87.5388%;
}
#apertura .hueco { left: 10.918%; width: 78.164%; }

/* Luz dorada detrás de las puertas */
#apertura .luz {
  left: 10.918%; width: 78.164%;
  border-radius: 50% 50% 0 0 / 26% 26% 0 0;
  background:
    radial-gradient(ellipse 60% 45% at 50% 48%, rgba(255,255,250,1) 0%, rgba(255,240,214,.95) 35%, rgba(255,214,190,.0) 100%);
  opacity: 0; z-index: 1;
}

/* Puertas */
#apertura .puerta {
  width: 39.082%; z-index: 3;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  transform-style: preserve-3d;
  will-change: transform;
}
#apertura .puerta img { width: 100%; height: 100%; }
#apertura .puerta.izq { left: 10.918%; transform-origin: 0% 50%; }
#apertura .puerta.der { left: 50%;     transform-origin: 100% 50%; }
/* Sombra que aparece mientras la puerta gira */
#apertura .puerta::after {
  content: ""; position: absolute; inset: 0; opacity: 0;
  transition: opacity 1.9s cubic-bezier(.55,.05,.3,1) .5s;
  -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
}
#apertura .puerta.izq::after {
  background: linear-gradient(90deg, rgba(90,40,30,.05), rgba(90,40,30,.55));
  -webkit-mask-image: url("recursos/apertura-puerta-izq.webp"); mask-image: url("recursos/apertura-puerta-izq.webp");
}
#apertura .puerta.der::after {
  background: linear-gradient(270deg, rgba(90,40,30,.05), rgba(90,40,30,.55));
  -webkit-mask-image: url("recursos/apertura-puerta-der.webp"); mask-image: url("recursos/apertura-puerta-der.webp");
}

/* Brillo de la rendija entre las puertas */
#apertura .rendija {
  left: 50%; top: 13%; height: 86%; width: 1.4%;
  transform: translateX(-50%);
  background: linear-gradient(180deg, rgba(255,250,235,0), rgba(255,250,235,.95) 12%, rgba(255,246,225,.95) 88%, rgba(255,250,235,0));
  filter: blur(6px);
  z-index: 4; mix-blend-mode: screen;
  animation: respira 2.8s ease-in-out infinite;
}
@keyframes respira { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

/* Medallón */
#apertura .sello {
  left: 50%; top: 50.1%; width: 28%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  z-index: 6;
  border: 0; background: none; cursor: pointer; padding: 0;
  border-radius: 50%;
  animation: latido 2.4s ease-in-out infinite;
}
#apertura .sello img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 14px rgba(255,244,222,.95)) drop-shadow(0 8px 12px rgba(110,60,30,.4)); }
#apertura .sello::before {
  content: ""; position: absolute; inset: -10%;
  border-radius: 50%;
  border: 2px solid rgba(255,236,190,.85);
  animation: anillo 2.4s ease-out infinite;
}
@keyframes latido { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.045); } }
@keyframes anillo { 0% { transform: scale(.92); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }

/* Medallón de respaldo (si todavía no existe la imagen) */
#apertura .sello .respaldo {
  position: absolute; inset: 0; border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #FFF4C9 0%, #F0CF7A 22%, #C99A3E 55%, #8E6420 100%);
  box-shadow: inset 0 0 0 3px rgba(255,240,200,.7), inset 0 0 0 8px rgba(142,100,32,.35), 0 8px 18px rgba(110,60,30,.35);
  display: none; align-items: center; justify-content: center;
}
#apertura .sello.sin-imagen img { display: none; }
#apertura .sello.sin-imagen .respaldo { display: flex; }
#apertura .sello .respaldo svg { width: 58%; height: 58%; }

#apertura .texto-abrir {
  left: 50%; top: 59.4%;
  transform: translateX(-50%);
  z-index: 6; white-space: nowrap;
  font-family: var(--script);
  font-size: clamp(26px, 7.4vw, 40px);
  color: var(--vino-rosa);
  text-shadow: 0 0 10px rgba(255,248,236,.95), 0 0 2px rgba(255,248,236,.9);
  pointer-events: none;
  animation: titila 2.4s ease-in-out infinite;
}
@media (min-aspect-ratio: 3/4) { #apertura .texto-abrir { font-size: clamp(26px, 4.2svh, 40px); } }
@keyframes titila { 0%,100% { opacity: .75; } 50% { opacity: 1; } }

/* Destellos flotantes */
#apertura .destello {
  position: absolute; z-index: 6; width: 8px; height: 8px;
  background: radial-gradient(circle, #fff 0%, rgba(255,236,180,.9) 35%, rgba(255,236,180,0) 70%);
  border-radius: 50%; pointer-events: none; opacity: 0;
  animation: destello 3.6s ease-in-out infinite;
}
@keyframes destello {
  0%   { opacity: 0; transform: translateY(0) scale(.6); }
  40%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
}

/* --- Secuencia de apertura --- */
#apertura.abriendo .relleno   { opacity: 0; }
#apertura.abriendo .sello     { animation: none; transition: transform .7s ease, opacity .6s ease; transform: translate(-50%,-50%) scale(1.25); opacity: 0; }
#apertura.abriendo .sello::before { display: none; }
#apertura.abriendo .texto-abrir { animation: none; transition: opacity .4s ease; opacity: 0; }
#apertura.abriendo .rendija   { animation: rendijaAbre 1.7s ease .2s forwards; }
@keyframes rendijaAbre {
  0%   { opacity: .8; width: 1.4%; }
  35%  { opacity: 1;  width: 10%; }
  100% { opacity: 0;  width: 34%; }
}
#apertura.abriendo .puerta.izq { transition: transform 2s cubic-bezier(.55,.05,.3,1) .5s; transform: rotateY(84deg); }
#apertura.abriendo .puerta.der { transition: transform 2s cubic-bezier(.55,.05,.3,1) .5s; transform: rotateY(-84deg); }
#apertura.abriendo .puerta::after { opacity: 1; }
#apertura.abriendo .luz { animation: rafaga 2.4s ease .45s forwards; }
@keyframes rafaga { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
#apertura.abriendo .escena { transition: transform 1.5s cubic-bezier(.5,0,.3,1) 1.5s; transform: translate(-50%,-50%) scale(1.35); }
#apertura.abriendo { transition: opacity 1.1s ease 1.8s; opacity: 0; }
/* Al abrirse se deja ver la portada a través del hueco */
#apertura.abriendo .rendija { mix-blend-mode: normal; }

@media (prefers-reduced-motion: reduce) {
  #apertura .sello, #apertura .rendija, #apertura .texto-abrir, #apertura .destello { animation: none; }
  #apertura.abriendo, #apertura.abriendo * { transition-duration: .01s !important; transition-delay: 0s !important; animation-duration: .01s !important; }
  #apertura.abriendo { transition: opacity .6s ease; }
}

/* ---------- Botón de música ---------- */
#botonMusica {
  position: fixed; right: 16px; bottom: 16px; z-index: 90;
  width: 46px; height: 46px; border-radius: 50%; border: 0;
  background: linear-gradient(145deg, #E7A3B3, var(--rosa-fuerte));
  box-shadow: 0 6px 16px rgba(158,74,98,.35);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: opacity .5s ease, transform .2s ease;
  cursor: pointer;
}
#botonMusica.visible { opacity: 1; visibility: visible; }
#botonMusica:active { transform: scale(.92); }
#botonMusica svg { width: 18px; height: 18px; fill: #FFF6EE; }
#botonMusica.sonando::after {
  content: ""; position: absolute; inset: -5px; border-radius: 50%;
  border: 1px solid rgba(231,163,179,.8); animation: anilloMusica 2.4s ease-out infinite;
}
@keyframes anilloMusica { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }

/* ---------- PORTADA PROVISIONAL ---------- */
.contenedor { max-width: 480px; margin: 0 auto; position: relative; }
#portada {
  min-height: 100svh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 48px 24px;
  background:
    radial-gradient(ellipse at 50% 30%, #FFF6F0 0%, #FBE3E7 45%, #F3C9CF 100%);
}
#portada .titulo {
  font-family: var(--script);
  font-size: clamp(64px, 20vw, 96px); line-height: .95;
  background: linear-gradient(180deg, #F7E3A6 0%, #D9AE55 45%, #A8792B 70%, #E9C978 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 1px rgba(142,100,32,.25));
}
#portada .nombre { font-family: var(--script); font-size: 46px; color: var(--vino-rosa); margin-top: 18px; }
#portada .fecha  { font-family: var(--caps); letter-spacing: .18em; font-size: 13px; margin-top: 14px; color: var(--texto); }
#portada .nota   { font-style: italic; font-size: 13px; margin-top: 40px; opacity: .6; max-width: 280px; }
</style>
</head>

<body class="bloqueado">

<!-- ============================ APERTURA ============================ -->
<div id="apertura" role="dialog" aria-label="Abrir la invitación">
  <div class="relleno" aria-hidden="true"></div>
  <div class="escena">
    <div class="capa luz" aria-hidden="true"></div>
    <div class="capa puerta izq" aria-hidden="true"><img id="imgPuertaIzq" alt=""></div>
    <div class="capa puerta der" aria-hidden="true"><img id="imgPuertaDer" alt=""></div>
    <div class="capa rendija" aria-hidden="true"></div>
    <img class="capa marco" id="imgMarco" alt="">
    <button class="capa sello" id="sello" aria-label="Toca para abrir la invitación">
      <img id="imgSello" alt="">
      <span class="respaldo" aria-hidden="true">
        <!-- tiara dibujada: se usa solo si falta la imagen del sello -->
        <svg viewBox="0 0 100 80" fill="none">
          <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6D8"/><stop offset="1" stop-color="#F3D892"/></linearGradient></defs>
          <path d="M10 58 L18 26 L32 44 L50 14 L68 44 L82 26 L90 58 Z" fill="url(#g)" stroke="#8E6420" stroke-width="2.4" stroke-linejoin="round"/>
          <rect x="10" y="58" width="80" height="9" rx="3" fill="url(#g)" stroke="#8E6420" stroke-width="2.4"/>
          <circle cx="18" cy="24" r="4" fill="#F7C6D2" stroke="#8E6420" stroke-width="1.8"/>
          <circle cx="50" cy="12" r="5" fill="#F7C6D2" stroke="#8E6420" stroke-width="1.8"/>
          <circle cx="82" cy="24" r="4" fill="#F7C6D2" stroke="#8E6420" stroke-width="1.8"/>
          <path d="M50 40 C46 34 39 38 43 44 L50 51 L57 44 C61 38 54 34 50 40 Z" fill="#E59AAE" stroke="#8E6420" stroke-width="1.6"/>
        </svg>
      </span>
    </button>
    <div class="capa texto-abrir" id="textoAbrir"></div>
  </div>
</div>

<!-- Música -->
<audio id="musica" loop preload="auto"></audio>
<button id="botonMusica" aria-label="Pausar o reanudar música">
  <svg id="iconoPausa" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  <svg id="iconoPlay" viewBox="0 0 24 24" style="display:none"><path d="M8 5v14l11-7z"/></svg>
</button>

<!-- ============================ PORTADA (provisional) ============================ -->
<main class="contenedor">
  <section id="portada">
    <div class="titulo">Mis<br>XV Años</div>
    <div class="nombre" id="nombrePortada"></div>
    <div class="fecha" id="fechaPortada"></div>
    <p class="nota">Portada provisional: aquí va el arte de la quinceañera frente al castillo.</p>
  </section>
</main>

<script>
/* =========================================================================
   PROGRAMA
   ========================================================================= */
(function () {
  const C = CONFIG, $ = id => document.getElementById(id);

  /* ---------- Textos ---------- */
  $('nombrePortada').textContent = C.quinceanera.nombre;
  $('fechaPortada').textContent  = C.fecha.texto;
  $('textoAbrir').textContent    = C.apertura.textoAbrir;

  /* ---------- Imágenes de la apertura ---------- */
  $('imgMarco').src     = C.apertura.marco;
  $('imgPuertaIzq').src = C.apertura.puertaIzquierda;
  $('imgPuertaDer').src = C.apertura.puertaDerecha;
  document.querySelector('#apertura .relleno').style.backgroundImage = 'url("' + C.apertura.imagenCompleta + '")';

  const sello = $('sello'), imgSello = $('imgSello');
  if (C.apertura.sello) {
    imgSello.onerror = () => sello.classList.add('sin-imagen');
    imgSello.src = C.apertura.sello;
  } else {
    sello.classList.add('sin-imagen');
  }

  /* Destellos flotantes alrededor de las puertas */
  const escena = document.querySelector('#apertura .escena');
  const puntos = [[18,62],[80,58],[30,40],[70,36],[50,30],[24,78],[76,80],[60,70],[40,66]];
  puntos.forEach((p, i) => {
    const s = document.createElement('span');
    s.className = 'destello';
    s.style.left = p[0] + '%'; s.style.top = p[1] + '%';
    s.style.animationDelay = (i * 0.45) + 's';
    escena.appendChild(s);
  });

  /* ---------- Música ---------- */
  const musica = $('musica'), botonMusica = $('botonMusica');
  const hayMusica = !!C.musica;
  if (hayMusica) musica.src = C.musica;
  function actualizarIcono() {
    $('iconoPausa').style.display = musica.paused ? 'none' : '';
    $('iconoPlay').style.display  = musica.paused ? '' : 'none';
    botonMusica.classList.toggle('sonando', !musica.paused);
  }
  musica.addEventListener('play', actualizarIcono);
  musica.addEventListener('pause', actualizarIcono);
  botonMusica.addEventListener('click', () => { musica.paused ? musica.play() : musica.pause(); });

  /* ---------- Abrir las puertas ---------- */
  const apertura = $('apertura');
  let abierto = false;
  function abrir() {
    if (abierto) return;
    abierto = true;
    if (hayMusica) { const p = musica.play(); if (p && p.catch) p.catch(() => {}); }
    apertura.classList.add('abriendo');
    const reducido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(() => {
      apertura.remove();
      document.body.classList.remove('bloqueado');
      if (hayMusica) botonMusica.classList.add('visible');
    }, reducido ? 700 : 3000);
  }
  apertura.addEventListener('click', abrir);
  sello.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); } });
})();
</script>
</body>
</html>
