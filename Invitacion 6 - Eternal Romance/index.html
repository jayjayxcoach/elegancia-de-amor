<style>
/* ============================================================
   ESTILOS
   ============================================================ */

/* Tipografías (guardadas en la carpeta recursos, no dependen de internet) */
@font-face { font-family: 'Beau Rivage'; font-weight: 400; font-display: swap; src: url('recursos/fuente-beau-rivage.woff2') format('woff2'); }
@font-face { font-family: 'Great Vibes'; font-weight: 400; font-display: swap; src: url('recursos/fuente-great-vibes.woff2') format('woff2'); }
@font-face { font-family: 'Rufina';      font-weight: 400; font-display: swap; src: url('recursos/fuente-rufina.woff2') format('woff2'); }

:root {
  --texto: #4a4a4a;          /* gris del texto principal */
  --gris: #616161;           /* gris de etiquetas y título del cronograma */
  --azul: #1287b4;           /* botones */

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; overflow-x: hidden; }
body {
  background: #fff;

  font-family: var(--serif);
  font-size: 19px;
  line-height: 1.55;

body.bloqueado { overflow: hidden; height: 100vh; }
img { display: block; max-width: 100%; }

/* Columna central (la invitación tiene formato de celular) */
.pagina { width: 100%; overflow-x: hidden; overflow-x: clip; }
.invitacion { position: relative; width: 100%; max-width: var(--ancho); margin: 0 auto; }
section { position: relative; }

/* Elementos colocados con coordenadas (igual que el diseño original) */
.pos { position: absolute; left: calc(50% - 220px + var(--x, 0px)); }
/* --x es la distancia desde el borde izquierdo de la columna de 440 px; en pantallas más angostas todo queda centrado igual que en el original */

.titulo { font-family: var(--script); font-weight: 400; font-size: 33px; line-height: 1.55; text-align: center; color: var(--texto); }
.texto  { font-size: 19px; line-height: 1.55; text-align: center; color: var(--texto); }

/* Animaciones de aparición al hacer scroll */
.aparece     { opacity: 0; transition: opacity 1s ease, transform 1s ease; }
.aparece-izq { opacity: 0; transform: translateX(-100px); transition: opacity 1s ease, transform 1s ease; }
.aparece-der { opacity: 0; transform: translateX(100px);  transition: opacity 1s ease, transform 1s ease; }
.aparece-sub { opacity: 0; transform: translateY(100px);  transition: opacity 1s ease, transform 1s ease; }
.aparece.visible, .aparece-izq.visible, .aparece-der.visible, .aparece-sub.visible { opacity: 1; transform: none; }
.aparece-lento { opacity: 0; transition: opacity 2s ease; }
.aparece-lento.visible { opacity: 1; }

/* ------------------------------------------------------------
   1. BIENVENIDA (ventana sobre fondo oscuro)
   ------------------------------------------------------------ */
#bienvenida { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, .9); display: flex; justify-content: center; align-items: center; overflow: hidden; transition: opacity .5s ease; }

#bienvenida .circulo {
  position: relative; width: 100%; max-width: 450px; min-width: 350px; aspect-ratio: 1.22;
  background: no-repeat center / contain;
  display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 10px;
}
#bienvenida h2 { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: 2.3rem; color: #313131; line-height: 1.2; }
#bienvenida p  { font-size: 1rem; line-height: 1.5; color: #313131; margin: 10px 80px 20px 90px; }
#bienvenida button {
  padding: 12px 20px; font-size: .9rem; font-family: var(--serif); background: var(--azul); color: #fff;
  border: none; border-radius: 15px; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease;
}

#cuenta { height: 680px; padding-top: 15px; }

#vestimenta { height: 1584px; }

    <img class="pos marco-arriba" src="recursos/confirmacion-adorno-5.png" alt="">
    <img class="pos marco-abajo"  src="recursos/confirmacion-adorno-3.png" alt="">
    <div class="pos titulo" id="confirmacion-titulo"></div>
    <form class="pos" id="formulario" autocomplete="off">
      <label class="campo" for="campo-nombre" id="etiqueta-nombre"></label>
      <input type="text" id="campo-nombre" name="nombre" required>

      <div class="campo" id="etiqueta-asistencia"></div>
      <div class="opciones" id="opciones-asistencia"></div>

      <label class="campo" for="campo-invitados" id="etiqueta-invitados"></label>
      <input type="number" id="campo-invitados" name="invitados" min="1" required>

      <label class="campo" for="campo-dieta" id="etiqueta-dieta"></label>
      <input type="text" id="campo-dieta" name="dieta">

      <label class="campo" for="campo-bebida" id="etiqueta-bebida"></label>
      <input type="text" id="campo-bebida" name="bebida" required>

      <button class="boton" type="submit" id="boton-enviar"></button>
    </form>
    <div class="pos gracias" id="gracias" style="--x:76px;top:125px;width:289px"></div>
  </section>

  <!-- ============================================================
       8. DETALLES
       ============================================================ -->
  <section id="detalles">
    <div class="pos titulo" id="detalles-titulo"></div>
    <div class="pos texto texto-intro" id="detalles-texto"></div>
    <div class="pos telefono telefono-1 aparece" id="detalles-telefono-1"></div>
    <div class="pos telefono telefono-2 aparece" id="detalles-telefono-2" style="transition-delay:.1s"></div>
    <div class="pos texto regalos" id="detalles-regalos"></div>
    <div class="pos foto" id="detalles-foto"></div>
  </section>

  <!-- ============================================================
       9. DESPEDIDA
       ============================================================ -->
  <section id="despedida">
    <div class="pos titulo aparece-lento" id="despedida-titulo"></div>
    <div class="pos texto nombres aparece-lento" id="despedida-nombres" style="transition-delay:.2s"></div>
    <div class="pos corazon aparece-lento" id="despedida-corazon" style="transition-delay:.4s"></div>
  </section>

</div><!-- /.invitacion -->
</div><!-- /.pagina -->

<!-- Música de fondo y botón flotante -->
<audio id="musica" loop preload="none"></audio>
<div id="musica-boton" class="pausado" title="Música">
  <svg class="icono-pausa" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  <svg class="icono-play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
</div>

<script>
/* ============================================================
   FUNCIONAMIENTO (no hace falta tocar nada de aquí abajo)
   ============================================================ */
(function () {
  const $ = (id) => document.getElementById(id);

  /* ---------- Rellenar textos desde CONFIG ---------- */
  $('bienvenida-circulo').style.backgroundImage = 'url("' + CONFIG.bienvenida.marco + '")';
  $('bienvenida-titulo').textContent = CONFIG.bienvenida.titulo;
  $('bienvenida-texto').textContent = CONFIG.bienvenida.texto;
  $('bienvenida-boton').textContent = CONFIG.bienvenida.boton;

  $('portada-fecha').textContent = CONFIG.fechaTexto;
  $('portada-etq-fecha').textContent = CONFIG.etiquetaFecha;
  $('portada-lugar').textContent = CONFIG.lugar;
  $('portada-etq-lugar').textContent = CONFIG.etiquetaLugar;
  $('portada-nombres').textContent = CONFIG.noviosTexto;
  $('portada-titulo').textContent = CONFIG.portada.titulo;
  $('portada-subtitulo').textContent = CONFIG.portada.subtitulo;
  $('portada-foto').src = CONFIG.portada.foto;

  $('mensaje-titulo').textContent = CONFIG.mensaje.titulo;
  $('mensaje-texto').textContent = CONFIG.mensaje.texto;
  $('mensaje-cierre').textContent = CONFIG.mensaje.cierre;
  $('mensaje-adorno').style.backgroundImage = 'url("' + CONFIG.mensaje.adorno + '")';

  $('cronograma-titulo').textContent = CONFIG.cronograma.titulo;
  $('cronograma-fecha').textContent = CONFIG.fechaLarga;
  // Eventos: uno cada 42 px, hora a la izquierda y nombre a la derecha (aparecen uno tras otro)
  const cont = $('cronograma-eventos');
  CONFIG.cronograma.eventos.forEach((ev, i) => {
    const top = 140 + i * 42;
    const hora = document.createElement('div'); hora.className = 'pos evento-hora aparece'; hora.style.top = top + 'px'; hora.style.transitionDelay = (i * .1) + 's'; hora.textContent = ev.hora;
    const nombre = document.createElement('div'); nombre.className = 'pos evento-nombre aparece'; nombre.style.top = top + 'px'; nombre.style.transitionDelay = (i * .1) + 's'; nombre.textContent = ev.nombre;
    cont.append(hora, nombre);
  });

  $('cuenta-titulo').textContent = CONFIG.cuentaRegresiva.titulo;
  $('cuenta-foto').src = CONFIG.cuentaRegresiva.foto;
  ['dias', 'horas', 'minutos', 'segundos'].forEach((k, i) => { $('etq-' + k).textContent = CONFIG.cuentaRegresiva.etiquetas[i]; });

  const v = CONFIG.vestimenta;
  $('vestimenta-titulo').textContent = v.titulo;
  $('vestimenta-texto').textContent = v.texto;
  $('vestimenta-damas').textContent = v.damas;
  $('vestimenta-caballeros').textContent = v.caballeros;
  $('vestimenta-colores').textContent = v.colores;
  [v.foto1, v.foto2, v.foto3, v.foto4, v.foto5].forEach((src, i) => { $('vestimenta-foto-' + (i + 1)).style.backgroundImage = 'url("' + src + '")'; });

  $('confirmacion-titulo').textContent = CONFIG.confirmacion.titulo;
  const f = CONFIG.confirmacion.formulario;
  $('etiqueta-nombre').textContent = f.campoNombre;
  $('etiqueta-asistencia').textContent = f.campoAsistencia;
  f.opciones.forEach((op) => {
    const l = document.createElement('label'); l.className = 'opcion';
    l.innerHTML = '<input type="checkbox" name="asistencia" value="' + op + '"><span>' + op + '</span>';
    $('opciones-asistencia').appendChild(l);
  });
  $('etiqueta-invitados').textContent = f.campoInvitados;
  $('etiqueta-dieta').textContent = f.campoDieta;
  $('etiqueta-bebida').textContent = f.campoBebida;
  $('boton-enviar').textContent = f.botonEnviar;
  $('gracias').textContent = f.gracias;

  $('detalles-titulo').textContent = CONFIG.detalles.titulo;
  $('detalles-texto').textContent = CONFIG.detalles.texto;
  $('detalles-telefono-1').textContent = CONFIG.detalles.telefono1;
  $('detalles-telefono-2').textContent = CONFIG.detalles.telefono2;
  $('detalles-regalos').textContent = CONFIG.detalles.regalos;
  $('detalles-foto').style.backgroundImage = 'url("' + CONFIG.detalles.foto + '")';

  $('despedida-titulo').textContent = CONFIG.despedida.titulo;
  $('despedida-nombres').textContent = CONFIG.noviosTexto;
  $('despedida-corazon').style.backgroundImage = 'url("' + CONFIG.despedida.corazon + '")';

  $('musica').src = CONFIG.musica;

  /* ---------- Bienvenida: entrar y arrancar la música ---------- */
  const bienvenida = $('bienvenida'), musica = $('musica'), musicaBoton = $('musica-boton');
  $('bienvenida-boton').addEventListener('click', () => {
    bienvenida.classList.add('cerrada');
    document.body.classList.remove('bloqueado');
    musica.play().then(() => musicaBoton.classList.remove('pausado')).catch(() => {});
    musicaBoton.classList.add('visible');
    setTimeout(() => bienvenida.remove(), 600);
    setTimeout(() => document.querySelectorAll('#portada .aparece').forEach(e => e.classList.add('visible')), 100);
  });

  /* ---------- Música: pausar / reanudar ---------- */
  musicaBoton.addEventListener('click', () => {
    if (musica.paused) { musica.play(); musicaBoton.classList.remove('pausado'); }
    else { musica.pause(); musicaBoton.classList.add('pausado'); }
  });

  /* ---------- Animaciones al entrar en pantalla ---------- */
  const observador = new IntersectionObserver((entradas) => {
    entradas.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observador.unobserve(e.target); } });
  }, { threshold: .1 });
  document.querySelectorAll('.aparece, .aparece-izq, .aparece-der, .aparece-sub, .aparece-lento').forEach(el => { if (!el.closest('#portada')) observador.observe(el); });

  /* ---------- Cuenta regresiva ---------- */
  const fe = CONFIG.fecha;
  const fechaEvento = new Date(fe.anio, fe.mes - 1, fe.dia, fe.hora, fe.minuto, 0);
  function actualizarCuenta() {
    const resta = fechaEvento - new Date();
    if (resta <= 0) { $('contador').innerHTML = '<div class="terminado">' + CONFIG.cuentaRegresiva.terminado + '</div>'; clearInterval(reloj); return; }
    const p = (n) => String(n).padStart(2, '0');
    $('dias').textContent = p(Math.floor(resta / 86400000));
    $('horas').textContent = p(Math.floor(resta % 86400000 / 3600000));
    $('minutos').textContent = p(Math.floor(resta % 3600000 / 60000));
    $('segundos').textContent = p(Math.floor(resta % 60000 / 1000));
  }
  const reloj = setInterval(actualizarCuenta, 1000); actualizarCuenta();

  /* ---------- Formulario (solo visual por ahora) ---------- */
  $('formulario').addEventListener('submit', (e) => {
    e.preventDefault();
    $('formulario').style.display = 'none';
    $('gracias').style.display = 'block';
  });
})();
</script>
</body>
</html>
