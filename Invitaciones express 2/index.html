*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{background:#f0e8de;font-family:'Cormorant Garamond',Georgia,serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;}

/* ── CONTENEDOR ── */
.pp-root{width:100%;min-height:100vh;min-height:100svh;background:#f0e8de;display:flex;align-items:center;justify-content:center;position:relative;padding:24px 16px;overflow:hidden;}
.pp-root::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 55% at 50% 15%,rgba(200,155,130,.15) 0%,transparent 58%),radial-gradient(ellipse 55% 55% at 5% 92%,rgba(170,130,110,.10) 0%,transparent 52%);pointer-events:none;}
.pp-sc{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;animation:ppFU 1.4s cubic-bezier(.16,1,.3,1) forwards;opacity:0;}
@keyframes ppFU{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── ENCABEZADO ── */
.pp-hd{text-align:center;margin-bottom:18px;}
.pp-ey{font-family:"Cinzel",serif;font-size:11px;letter-spacing:4.5px;color:#9a7060;text-transform:uppercase;margin-bottom:7px;opacity:.8;}
.pp-nm{font-family:"Cormorant Garamond",serif;font-size:clamp(36px,9.5vw,54px);font-weight:300;font-style:italic;color:#2a1510;line-height:1;letter-spacing:-.5px;}
.pp-nm .pp-am{font-family:"GFS Didot",serif;font-style:normal;font-weight:400;color:#9a7060;font-size:.90em;margin:0 7px;display:inline-block;}

/* ── CORAZÓN ── */
.pp-hw{position:relative;width:min(340px,calc(100vw - 40px));flex-shrink:0;}
.pp-sv{width:100%;height:auto;display:block;overflow:visible;}
.pp-tc{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:block;}
.pp-pc{position:absolute;pointer-events:none;display:block;}
.pp-ov{position:absolute;inset:0;touch-action:none;cursor:crosshair;}

/* ── PISTA ── */
.pp-hn{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .5s;}
.pp-hh{width:20px;height:20px;flex-shrink:0;animation:ppHF 1.8s ease-in-out infinite;opacity:.75;}
@keyframes ppHF{0%,100%{transform:translate(0,0) rotate(-8deg);}50%{transform:translate(3px,-3px) rotate(5deg);}}
.pp-ht{font-family:"Cinzel",serif;font-size:12px;letter-spacing:3px;text-align:center;color:#9a7060;text-transform:uppercase;opacity:.85;animation:ppHP 2.8s ease-in-out 1.5s infinite;}
@keyframes ppHP{0%,100%{opacity:.55}50%{opacity:1}}

/* ── PIE ── */
.pp-ft{margin-top:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;}
.pp-lc{font-family:"Cormorant Garamond",serif;font-size:clamp(16px,3.8vw,20px);font-weight:300;font-style:italic;color:#8a6858;letter-spacing:.4px;}
.pp-rl{display:flex;align-items:center;gap:10px;}
.pp-rl hr{width:36px;border:none;border-top:.5px solid #e0c4b4;}
.pp-rl span{font-size:10px;color:#b87060;opacity:.65;}
.pp-sb{font-family:"Cinzel",serif;font-size:clamp(10px,2.2vw,12.5px);letter-spacing:3px;text-transform:uppercase;color:#9a7060;opacity:.75;}

/* confeti de pétalos + cursor de mano */
#pp-cc{position:fixed;inset:0;pointer-events:none;z-index:9999;}
#pp-cur{position:fixed;pointer-events:none;z-index:9999;width:32px;height:40px;transform:translate(-8px,-4px);display:none;opacity:.75;}

/* botón de música */
#pp-music{position:fixed;bottom:22px;right:22px;width:52px;height:52px;min-width:52px;min-height:52px;border-radius:50%;padding:0;background:rgba(154,112,96,.92);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(0,0,0,.22);opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s,transform .2s;z-index:10000;-webkit-appearance:none;appearance:none;flex-shrink:0;}
#pp-music.pp-vis{opacity:1;visibility:visible;}
#pp-music:hover{transform:scale(1.08);}
#pp-music svg{width:20px;height:20px;flex-shrink:0;fill:#fff;display:block;}

/* ── MÚSICA ── */

/* ── PÉTALOS: 3 variantes por imagen (normal, espejo horizontal, espejo vertical) ── */
var sprites=[],loadedN=0,appStarted=false;
function preRender(img,fx,fy){
  var oc=document.createElement("canvas");
  oc.width=img.naturalWidth;oc.height=img.naturalHeight;
  var x=oc.getContext("2d");
  x.save();
  if(fx){x.translate(oc.width,0);x.scale(-1,1);}
  if(fy){x.translate(0,oc.height);x.scale(1,-1);}
  x.drawImage(img,0,0);x.restore();
  oc.sw=oc.width;oc.sh=oc.height;
  sprites.push(oc);
}
CONFIG.petalos.forEach(function(src){
  var im=new Image();
  im.onload=function(){preRender(im,false,false);preRender(im,true,false);preRender(im,false,true);loadedN++;if(loadedN>=CONFIG.petalos.length)initApp();};
  im.onerror=function(){loadedN++;if(loadedN>=CONFIG.petalos.length)initApp();};
  im.src=src;
});
setTimeout(function(){if(!appStarted)initApp();},3000);

function initApp(){
  if(appStarted)return;appStarted=true;
  var txtCvs=document.getElementById("textCanvas"),txtCtx=txtCvs.getContext("2d");
  var cvs=document.getElementById("petalCanvas"),ctx=cvs.getContext("2d");
  var ovl=document.getElementById("evtOverlay"),wrap=document.getElementById("heartWrap");
  var hintRow=document.getElementById("hintRow"),brushCur=document.getElementById("pp-cur");
  var cc=document.getElementById("pp-cc"),ccx=cc.getContext("2d");
  var OFFSET=90,SW=300,CW=SW+OFFSET*2,CH=288+OFFSET*2;
  var HP="M150 272 C148 270 10 188 10 96 C10 50 46 16 90 16 C115 16 138 29 150 50 C162 29 185 16 210 16 C254 16 290 50 290 96 C290 188 152 270 150 272Z";
  var dA=0,showD=false,ptls=[],isDown=false,rev=false,orb=false,an=false,lx=0,ly=0,mDone=false;

  /* texto dentro del corazón */
  function sTC(){var r=wrap.getBoundingClientRect(),dpr=window.devicePixelRatio||1;txtCvs.width=Math.round(300*dpr);txtCvs.height=Math.round(288*dpr);txtCvs.style.width=r.width+"px";txtCvs.style.height=r.height+"px";txtCtx.setTransform(1,0,0,1,0,0);txtCtx.scale(dpr,dpr);}
  function dTxt(){
    var dpr=window.devicePixelRatio||1;
    txtCtx.clearRect(0,0,300*dpr,288*dpr);
    txtCtx.save();txtCtx.clip(new Path2D(HP));
    txtCtx.textAlign="center";txtCtx.textBaseline="middle";
    txtCtx.font="400 9.5px Cinzel,serif";txtCtx.letterSpacing="3px";
    txtCtx.fillStyle="rgba(184,112,96,0.82)";txtCtx.fillText(CONFIG.etiqueta,150,104);
    txtCtx.font="300 14px 'Cormorant Garamond',serif";txtCtx.letterSpacing="0px";
    txtCtx.fillStyle="rgba(138,104,88,1)";
    txtCtx.fillText(CONFIG.linea1,150,126);
    txtCtx.fillText(CONFIG.linea2,150,145);
    txtCtx.strokeStyle="rgba(184,112,96,0.3)";txtCtx.lineWidth=0.8;
    txtCtx.beginPath();txtCtx.moveTo(122,157);txtCtx.lineTo(178,157);txtCtx.stroke();
    txtCtx.font="italic 500 25px 'Cormorant Garamond',serif";txtCtx.letterSpacing="0.5px";
    txtCtx.fillStyle="rgba(42,21,16,"+(showD?dA:0.12).toFixed(2)+")";
    txtCtx.fillText(CONFIG.fecha,150,182);
    txtCtx.restore();
  }
  function animD(){showD=true;(function s(){dA=Math.min(dA+0.04,1);dTxt();if(dA<1)requestAnimationFrame(s);})();}

  var lastW=0;
  function resize(){
    var r=wrap.getBoundingClientRect();
    if(Math.abs(r.width-lastW)>1){
      lastW=r.width;cvs.width=CW;cvs.height=CH;
      var sc=r.width/SW,off=OFFSET*sc;
      cvs.style.width=(r.width+off*2)+"px";cvs.style.height=(r.height+off*2)+"px";
      cvs.style.left=(-off)+"px";cvs.style.top=(-off)+"px";
      sTC();if(!an)paintPile();
    }
    dTxt();
  }

  function toC(cx,cy){var r=ovl.getBoundingClientRect(),sc=SW/r.width;return{x:(cx-r.left)*sc+OFFSET,y:(cy-r.top)*sc+OFFSET};}
  function inH(x,y){var nx=(x-150)/133,ny=(y-148)/116;return Math.pow(nx*nx+ny*ny-1,3)-nx*nx*Math.pow(Math.abs(ny),3)<0.08;}

  function mkP(sx,sy){
    if(!sprites.length)return null;
    var idx=Math.floor(Math.random()*sprites.length),sp=sprites[idx];
    var w=25+Math.random()*13,h=w*sp.sh/sp.sw;
    return{x:sx+OFFSET,y:sy+OFFSET,vx:(Math.random()-.5)*.10,vy:(Math.random()-.5)*.10,rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.018,w:w,h:h,idx:idx,op:Math.random()*.10+.86,bvx:0,bvy:0,fr:.83,phase:"pile",oT:Math.random(),oTgt:0,oP:Math.random()*Math.PI*2,age:0,alive:true};
  }
  function gen(){ptls=[];var tries=0;while(ptls.length<340&&tries<10000){tries++;var x=12+Math.random()*276,y=16+Math.random()*256;if(inH(x,y)){var p=mkP(x,y);if(p)ptls.push(p);}}}
  function dP(p){
    if(!p.alive||!sprites.length)return;
    var sp=sprites[p.idx];
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=p.op;
    ctx.shadowColor="rgba(60,0,0,0.35)";ctx.shadowBlur=3;ctx.shadowOffsetX=1;ctx.shadowOffsetY=2;
    ctx.drawImage(sp,-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
  }
  function paintPile(){ctx.clearRect(0,0,CW,CH);ctx.save();ctx.translate(OFFSET,OFFSET);ctx.clip(new Path2D(HP));ctx.translate(-OFFSET,-OFFSET);ptls.forEach(dP);ctx.restore();}

  gen();resize();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(dTxt);else setTimeout(dTxt,800);
  window.addEventListener("resize",resize);setTimeout(resize,100);
  window.addEventListener("scroll",function(){dTxt();},{passive:true});

  function startAnim(){if(an)return;an=true;loop();}
  function loop(){
    ctx.clearRect(0,0,CW,CH);
    if(!orb){ctx.save();ctx.translate(OFFSET,OFFSET);ctx.clip(new Path2D(HP));ctx.translate(-OFFSET,-OFFSET);}
    ptls.forEach(function(p){
      if(!p.alive)return;
      if(p.phase==="pile"){
        p.x+=p.vx+p.bvx;p.y+=p.vy+p.bvy;p.bvx*=p.fr;p.bvy*=p.fr;p.rotV*=.97;p.rot+=p.rotV;
        p.x=Math.max(OFFSET+8,Math.min(OFFSET+292,p.x));p.y=Math.max(OFFSET+14,Math.min(OFFSET+274,p.y));
      }else if(p.phase==="orbit"){
        p.age++;var diff=p.oTgt-p.oT;if(diff>.5)diff-=1;if(diff<-.5)diff+=1;
        var spd=p.age<20?.18:.065;p.oT+=diff*spd;p.oT=(p.oT%1+1)%1;
        var i2=Math.floor(p.oT*ORBIT.length)%ORBIT.length,pt=ORBIT[i2];
        p.x+=(pt[0]+OFFSET+Math.cos(p.age*.026+p.oP)*2-p.x)*.14;
        p.y+=(pt[1]+OFFSET+Math.sin(p.age*.020+p.oP)*2.5-p.y)*.14;
        p.rot+=.009;if(p.age>45){p.op-=.018;if(p.op<=0)p.alive=false;}
      }
      dP(p);
    });
    if(!orb)ctx.restore();
    if(an)requestAnimationFrame(loop);
  }

  /* ── APARTAR PÉTALOS ── */
  var BR=54,PF=4.2;
  function brush(a,b,c,d){
    if(!mDone){mDone=true;ppStartMusic();}
    var dx=a-c,dy=b-d,sp2=Math.sqrt(dx*dx+dy*dy),nx=sp2>.5?dx/sp2:0,ny=sp2>.5?dy/sp2:0;
    ptls.forEach(function(p){
      if(p.phase!=="pile")return;
      var bx=p.x-a,by=p.y-b,dist=Math.sqrt(bx*bx+by*by);
      if(dist<BR&&dist>.5){var f=(1-dist/BR)*PF*(1+sp2*.05),ang=Math.atan2(by,bx);p.bvx+=Math.cos(ang)*f*.85+nx*f*.55;p.bvy+=Math.sin(ang)*f*.85+ny*f*.35;p.rotV+=(Math.random()-.5)*.13;}
    });
    startAnim();if(!rev)checkRev();
  }
  function checkRev(){var cnt=0;ptls.forEach(function(p){var dx=(p.x-OFFSET)-150,dy=(p.y-OFFSET)-148;if(Math.sqrt(dx*dx+dy*dy)<72)cnt++;});if(cnt<ptls.length*.15)doRev();}
  function doRev(){if(rev)return;rev=true;hintRow.style.opacity="0";animD();setTimeout(startOrbit,400);}
  function startOrbit(){orb=true;ptls.forEach(function(p,i){p.phase="orbit";p.oTgt=i/ptls.length;p.age=0;p.op=Math.min(p.op,.82);});confetti();}

  document.addEventListener("mousemove",function(e){if(brushCur){brushCur.style.left=e.clientX+"px";brushCur.style.top=e.clientY+"px";brushCur.style.display="block";}});
  ovl.addEventListener("mouseleave",function(){if(brushCur)brushCur.style.display="none";});
  ovl.addEventListener("mousedown",function(e){isDown=true;var c=toC(e.clientX,e.clientY);lx=c.x;ly=c.y;brush(c.x,c.y,c.x,c.y);});
  ovl.addEventListener("mousemove",function(e){if(!isDown)return;var c=toC(e.clientX,e.clientY);brush(c.x,c.y,lx,ly);lx=c.x;ly=c.y;});
  ovl.addEventListener("mouseup",function(){isDown=false;});
  ovl.addEventListener("mouseleave",function(){isDown=false;});
  ovl.addEventListener("touchstart",function(e){e.preventDefault();isDown=true;var t=e.touches[0],c=toC(t.clientX,t.clientY);lx=c.x;ly=c.y;brush(c.x,c.y,c.x,c.y);},{passive:false});
  ovl.addEventListener("touchmove",function(e){e.preventDefault();if(!isDown)return;var t=e.touches[0],c=toC(t.clientX,t.clientY);brush(c.x,c.y,lx,ly);lx=c.x;ly=c.y;},{passive:false});
  ovl.addEventListener("touchend",function(){isDown=false;});

  /* ── LLUVIA DE PÉTALOS ── */
  function confetti(){
    cc.width=window.innerWidth;cc.height=window.innerHeight;
    if(!sprites.length)return;
    var ps=[];
    for(var i=0;i<60;i++){var idx=Math.floor(Math.random()*sprites.length),sp=sprites[idx],w2=25+Math.random()*11;ps.push({x:Math.random()*cc.width,y:-20-Math.random()*200,vy:Math.random()*1.6+0.5,vx:(Math.random()-.5)*1.6,w:w2,h:w2*sp.sh/sp.sw,rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*.08,idx:idx,al:Math.random()*.4+.55,dr:Math.random()*Math.PI*2,ds:Math.random()*.022+.008});}
    var f=0,max=340;
    (function draw(){ccx.clearRect(0,0,cc.width,cc.height);var fade=Math.max(0,1-f/max);ps.forEach(function(p){var sp=sprites[p.idx];ccx.save();ccx.globalAlpha=p.al*fade;ccx.translate(p.x,p.y);ccx.rotate(p.rot);ccx.shadowColor="rgba(80,0,0,.3)";ccx.shadowBlur=3;ccx.shadowOffsetY=2;ccx.drawImage(sp,-p.w/2,-p.h/2,p.w,p.h);ccx.restore();p.y+=p.vy;p.x+=p.vx+Math.sin(p.dr)*.5;p.rot+=p.rv;p.dr+=p.ds;if(p.y>cc.height+20){p.y=-20;p.x=Math.random()*cc.width;}});f++;if(f<max)requestAnimationFrame(draw);else ccx.clearRect(0,0,cc.width,cc.height);})();
  }
  window.addEventListener("resize",function(){cc.width=window.innerWidth;cc.height=window.innerHeight;});
}
})();
</script>
