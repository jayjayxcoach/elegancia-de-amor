* { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: hidden; }

/* Columna central (formato celular). "cqw" = 1 % del ancho de la columna */
.invitacion { position: relative; z-index: 1; width: 100%; max-width: var(--ancho); margin: 0 auto; container-type: inline-size; overflow: hidden; box-shadow: 0 0 70px rgba(120, 50, 50, .22); }

.destellos { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.destellos i, .estrella {

.mariposa { position: absolute; z-index: 4; width: var(--w, 10cqw); aspect-ratio: 1; pointer-events: none; perspective: 40cqw; animation: vuela var(--d, 16s) var(--r, 0s) ease-in-out infinite; }

  background: url("data:image/webp;base64,UklGRsIAAABXRUJQVlA4ILYAAADwBgCdASobADAAPrVQoEynJKMiJWzI4BaJYwCxHyJMvI5APPXTCtFCV38Skc82VvL5/zD6NDKeEGMjwfZRgmQ4APwBX2Pq+44IQZvbwz6qIohA+BHakX7/sYcdIuUfTZFv29CFO2p5OiadJXk9V5ZPmcocmAN+eiSRag1ntwvQrYvt8HUAN4qyKgLp3gBKLbxVkIWVIeX9EhehFKViuAsHmkGkgj28PL2zzuULiL1OMCbVw3AAAA==") center / cover no-repeat; }
/* El escenario conserva la proporción exacta de la imagen original (1438 × 2576) para que las capas encajen al píxel */
#apertura .escena { position: absolute; left: 50%; top: 50%; width: max(100vw, 100svh * .55823); aspect-ratio: 1438 / 2576; translate: -50% -50%; perspective: 1700px; perspective-origin: 50% 55%; opacity: 0; transition: opacity .5s ease; }
@media (min-aspect-ratio: 3/4) { #apertura .escena { width: calc(100svh * .55823); } }
#apertura .escena.lista { opacity: 1; }
#apertura .capa { position: absolute; }
#apertura .marco { inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
/* Hueco de la puerta (medido sobre la imagen original) */
#apertura .puerta, #apertura .luz { top: 12.4612%; height: 87.5388%; }
#apertura .luz { left: 10.918%; width: 78.164%; z-index: 1; opacity: 0; border-radius: 50% 50% 0 0 / 26% 26% 0 0;
  background: radial-gradient(ellipse 60% 45% at 50% 48%, rgba(255, 255, 250, 1) 0%, rgba(255, 240, 214, .95) 35%, rgba(255, 214, 190, 0) 100%); }
#apertura .puerta { width: 39.082%; z-index: 3; backface-visibility: hidden; -webkit-backface-visibility: hidden; will-change: transform; }
#apertura .puerta img { width: 100%; height: 100%; }
#apertura .puerta.izq { left: 10.918%; transform-origin: 0% 50%; }
#apertura .puerta.der { left: 50%; transform-origin: 100% 50%; }
/* Sombra que aparece mientras la puerta gira */
#apertura .puerta::after { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity 1.9s cubic-bezier(.55, .05, .3, 1) .5s; -webkit-mask: var(--mascara) center / 100% 100% no-repeat; mask: var(--mascara) center / 100% 100% no-repeat; }
#apertura .puerta.izq::after { background: linear-gradient(90deg, rgba(90, 40, 30, .05), rgba(90, 40, 30, .55)); }
#apertura .puerta.der::after { background: linear-gradient(270deg, rgba(90, 40, 30, .05), rgba(90, 40, 30, .55)); }
/* Brillo de la rendija entre las puertas */
#apertura .rendija { left: 50%; top: 13%; height: 86%; width: 1.4%; translate: -50% 0; z-index: 4; mix-blend-mode: screen; filter: blur(6px);
  background: linear-gradient(180deg, rgba(255, 250, 235, 0), rgba(255, 250, 235, .95) 12%, rgba(255, 246, 225, .95) 88%, rgba(255, 250, 235, 0));
  animation: respira 2.8s ease-in-out infinite; }
@keyframes respira { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
/* Sello de la corona */
#apertura .sello { left: 50%; top: 50.1%; width: 27%; aspect-ratio: 1; translate: -50% -50%; z-index: 6; border-radius: 50%; animation: latido 2.4s ease-in-out infinite; opacity: 0; transition: opacity .4s ease; }
#apertura .sello.cargado { opacity: 1; }
#apertura .sello img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 14px rgba(255, 244, 222, .95)) drop-shadow(0 8px 12px rgba(110, 60, 30, .4)); }
#apertura .sello::before, #apertura .sello::after { content: ""; position: absolute; inset: -6%; border-radius: 50%; border: 2px solid rgba(255, 236, 200, .95); box-shadow: 0 0 16px rgba(255, 220, 170, .9); animation: anillo 2.4s ease-out infinite; }
#apertura .sello::after { animation-delay: 1.2s; }
@keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
@keyframes anillo { 0% { transform: scale(.9); opacity: 0; } 20% { opacity: 1; } 100% { transform: scale(1.45); opacity: 0; } }
#apertura .sello.sin-imagen { background: radial-gradient(circle at 35% 30%, #fff4c9 0%, #f0cf7a 22%, #c99a3e 55%, #8e6420 100%); box-shadow: inset 0 0 0 3px rgba(255, 240, 200, .7), 0 8px 18px rgba(110, 60, 30, .35); }
#apertura .sello.sin-imagen img { display: none; }
#apertura .sello.sin-imagen > b { position: absolute; inset: 22%; background: var(--corona-respaldo) center / contain no-repeat; }
#apertura .toca { position: absolute; left: 50%; bottom: max(6%, env(safe-area-inset-bottom) + 18px); translate: -50% 0; z-index: 8; padding: .6em 1.5em; border-radius: 99px; white-space: nowrap; background: rgba(255, 248, 243, .93); box-shadow: 0 4px 16px rgba(120, 50, 50, .25);
  font: 600 clamp(12px, 3.5vw, 15px) var(--serif); letter-spacing: .16em; text-transform: uppercase; color: var(--rosa-titulo); animation: toca-pulso 2.2s 1s ease-in-out infinite; transition: opacity .4s ease; }
@keyframes toca-pulso { 0%, 100% { scale: 1; box-shadow: 0 4px 16px rgba(120, 50, 50, .25); } 50% { scale: 1.05; box-shadow: 0 4px 22px rgba(255, 226, 170, .9); } }
#apertura .destello { position: absolute; z-index: 6; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(circle, #fff 0%, rgba(255, 236, 180, .9) 35%, rgba(255, 236, 180, 0) 70%); animation: sube-destello 3.6s ease-in-out infinite; }
@keyframes sube-destello { 0% { opacity: 0; transform: translateY(0) scale(.6); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-40px) scale(1.2); } }
/* Al tocar: el sello se va, la rendija se abre, las puertas giran hacia adentro, entra la luz y la escena avanza */
#apertura.tocado .toca { animation: none; opacity: 0; }
#apertura.abriendo .relleno { opacity: 0; }
#apertura.abriendo .sello { animation: none; transition: transform .7s ease, opacity .6s ease; transform: scale(1.25); opacity: 0; }
#apertura.abriendo .sello::before, #apertura.abriendo .sello::after { display: none; }
#apertura.abriendo .rendija { mix-blend-mode: normal; animation: rendija-abre 1.7s ease .2s forwards; }
@keyframes rendija-abre { 0% { opacity: .8; width: 1.4%; } 35% { opacity: 1; width: 10%; } 100% { opacity: 0; width: 34%; } }
#apertura.abriendo .puerta.izq { transition: transform 2s cubic-bezier(.55, .05, .3, 1) .5s; transform: rotateY(84deg); }
#apertura.abriendo .puerta.der { transition: transform 2s cubic-bezier(.55, .05, .3, 1) .5s; transform: rotateY(-84deg); }
#apertura.abriendo .puerta::after { opacity: 1; }
#apertura.abriendo .luz { animation: rafaga 2.4s ease .45s forwards; }
@keyframes rafaga { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
#apertura.abriendo .escena { transition: opacity .5s ease, scale 1.5s cubic-bezier(.5, 0, .3, 1) 1.5s; scale: 1.35; }
#apertura.sin-zoom.abriendo .escena { scale: 1; }   /* sin portada: la escena no avanza, así el arco queda igual y solo desaparecen las puertas */
#apertura.abriendo { background: transparent; transition: opacity 1.1s ease 1.8s, background .3s ease .4s; opacity: 0; }

/* ------------------------------------------------------------
   2. PORTADA
   ------------------------------------------------------------ */
#portada { min-height: 100svh; aspect-ratio: 720 / 1290; }
/* Sin imagen de portada: se queda el mismo arco de piedra de las puertas, ya abiertas, con el nombre en la luz */
#portada.sin-imagen { background: radial-gradient(ellipse 52% 44% at 50% 50%, #fffdf8 0%, #fff3e6 42%, #fbe0d4 78%, rgba(249, 222, 211, 0) 100%); }
#portada .arco-respaldo { display: none; }
#portada.sin-imagen .arco-respaldo { display: block; position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; pointer-events: none;
  -webkit-mask-image: linear-gradient(#000 78%, transparent 99%); mask-image: linear-gradient(#000 78%, transparent 99%); }
#portada.sin-imagen .velo { display: none; }
#portada.sin-imagen .encabezado { top: 34%; }
#portada .fecha-portada { display: none; margin-top: 4cqw; opacity: 0; }
#portada.sin-imagen .fecha-portada { display: block; }
#portada.visible .fecha-portada { animation: sube .9s 1.6s ease-out forwards; }
#portada.sin-imagen .baja { bottom: 9cqw; }
#portada .portada-img { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; transform: scale(1.08);
  -webkit-mask-image: linear-gradient(#000 82%, transparent); mask-image: linear-gradient(#000 82%, transparent); }
#portada.visible .portada-img { animation: acerca 9s ease-out forwards; }
@keyframes acerca { to { transform: scale(1); } }
#portada .velo { position: absolute; inset: 0 0 auto; z-index: 1; height: 62cqw; background: linear-gradient(rgba(255, 248, 242, .55), transparent); }
#portada .encabezado { position: absolute; left: 0; right: 0; top: 10cqw; z-index: 3; }
#portada .corona { --cw: 20cqw; opacity: 0; transform: translateY(-4cqw); }
#portada:not(.sin-imagen) .corona { display: none; }   /* con la imagen de portada (ella ya lleva tiara) */
#portada:not(.sin-imagen) .encabezado { top: 5cqw; }
#portada:not(.sin-imagen) .nombre { width: 80cqw; }
#portada .nombre { width: 86cqw; min-height: 22cqw; margin: 1cqw auto 0; display: flex; justify-content: center; align-items: center; opacity: 0; transform: scale(.9); }
.nombre { position: relative; }
.nombre img { width: 100%; height: auto; filter: drop-shadow(0 2px 3px rgba(120, 60, 30, .35)); }
.script-oro { font: 400 var(--tam-nombre, 21cqw)/1.2 var(--script); background: linear-gradient(180deg, #fff1c4 0%, #ecc86e 30%, #bd8b32 55%, #f4d98f 78%, #b7852e 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 0 rgba(110, 60, 10, .45)); padding: 0 .14em; white-space: nowrap; }
#portada .arriba { margin-top: 1cqw; font: 600 5cqw/1 var(--caps); letter-spacing: .24em; padding-left: .24em; text-transform: uppercase; color: var(--rosa-titulo); text-shadow: 0 0 10px rgba(255, 248, 242, .95), 0 0 2px rgba(255, 248, 242, .9); opacity: 0; transform: translateY(3cqw); }
#portada.visible .corona { animation: sube 1s .1s ease-out forwards; }
#portada.visible .nombre { animation: aparece-nombre 1.3s .4s cubic-bezier(.2, .8, .3, 1) forwards; }
#portada.visible .arriba { animation: sube .9s 1.2s ease-out forwards; }
@keyframes aparece-nombre { to { opacity: 1; transform: none; } }
@keyframes sube { to { opacity: 1; transform: none; } }
.estrella { z-index: 3; }
#portada .baja { position: absolute; left: 50%; bottom: 6cqw; z-index: 4; translate: -50% 0; font: 600 3cqw/1 var(--caps); letter-spacing: .25em; padding-left: .25em; text-transform: uppercase; color: var(--rosa-titulo); text-shadow: 0 0 6px #fff, 0 0 2px #fff; animation: flota 2s ease-in-out infinite; }
#portada .baja::after { content: ""; display: block; width: 2.6cqw; height: 2.6cqw; margin: 2cqw auto 0; border-right: 2px solid var(--oro); border-bottom: 2px solid var(--oro); transform: rotate(45deg); }
@keyframes flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.6cqw); } }

/* ------------------------------------------------------------
   3. MENSAJE EN EL MARCO DORADO
   ------------------------------------------------------------ */
#mensaje { padding: 34cqw 0 6cqw; overflow: visible; }
#mensaje:not(:has(.guirnalda)) { padding-top: 16cqw; }
.marco-arco { position: relative; width: 92cqw; margin: 0 auto; }
.marco-arco .relleno { position: absolute; z-index: 1; border-radius: 50% 50% 3% 3% / 25% 25% 3% 3%; background: linear-gradient(180deg, #fff8f3 0%, #fce7de 100%); }
.marco-arco .marco-img { position: relative; z-index: 2; width: 100%; height: auto; filter: drop-shadow(0 10px 16px rgba(120, 60, 50, .25)); }
.marco-arco .texto { position: absolute; z-index: 3; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 1cqw; }
.marco-arco .texto p { font: italic 500 5cqw/1.45 var(--serif); color: var(--texto); }
.marco-arco .firma { margin-top: 3cqw; font: 400 11cqw/1 var(--script) !important; font-style: normal !important; color: var(--rosa-titulo) !important; }
/* Sin imagen del marco: arco con doble moldura dorada, como los paneles de las puertas */
.marco-arco.sin-marco { width: 84cqw; padding: 30cqw 8cqw 15cqw; border-radius: 42cqw 42cqw 3cqw 3cqw / 36cqw 36cqw 3cqw 3cqw; background: var(--panel);
  box-shadow: 0 0 0 1.6px var(--oro), 0 0 0 5px rgba(255, 248, 240, .9), 0 0 0 6.4px var(--oro), 0 18px 36px rgba(140, 60, 60, .2); }
.marco-arco.sin-marco::before { content: ""; position: absolute; inset: 2.8cqw; z-index: 1; border: 1.4px solid var(--oro); border-radius: 39cqw 39cqw 1.6cqw 1.6cqw / 33cqw 33cqw 1.6cqw 1.6cqw; pointer-events: none; }
.marco-arco.sin-marco .relleno, .marco-arco.sin-marco .marco-img { display: none; }
.marco-arco.sin-marco .texto { position: relative; padding: 0; }
.marco-arco .corona-arco { position: absolute; z-index: 4; left: 50%; top: 8cqw; translate: -50% 0; --cw: 24cqw; display: none; }
.marco-arco.sin-marco .corona-arco { display: block; }

/* ------------------------------------------------------------
   4. PADRES Y PADRINOS
   ------------------------------------------------------------ */
#padres { padding: 12cqw 8cqw 6cqw; }
#padres .corona { --cw: 34cqw; margin-bottom: 3cqw; }
#padres .intro { max-width: 76cqw; margin: 0 auto; }
.nombres { margin-top: 3cqw; font: 400 10.4cqw/1.15 var(--script); color: var(--rosa-titulo); }
.nombres .y { display: block; font-size: .7em; line-height: 1; color: var(--oro); }
#padrinos-caja .nombres { font-size: 9cqw; }
#padres .invito { max-width: 74cqw; margin: 8cqw auto 0; }

/* ------------------------------------------------------------
   PANELES (como los paneles de las puertas: arco, doble moldura dorada)
   ------------------------------------------------------------ */
.bloque { padding: 22cqw 0 0; overflow: visible; }   /* visible: la sombra del panel no se corta */
.panel { position: relative; width: 82cqw; margin: 0 auto; padding: 14cqw 7cqw 14cqw;   /* con esquinas doradas, abajo 21cqw (ver más abajo) */
  border-radius: 41cqw 41cqw 3cqw 3cqw / 30cqw 30cqw 3cqw 3cqw; background: var(--panel);
  box-shadow: 0 0 0 1.6px var(--oro), 0 0 0 5px rgba(255, 248, 240, .9), 0 0 0 6.4px var(--oro), 0 18px 36px rgba(140, 60, 60, .18); }
.panel::before { content: ""; position: absolute; inset: 2.6cqw; z-index: 0; border: 1.4px solid var(--oro); border-radius: 38.4cqw 38.4cqw 1.6cqw 1.6cqw / 27.4cqw 27.4cqw 1.6cqw 1.6cqw; pointer-events: none; }
.panel > * { position: relative; z-index: 1; }
.panel > .corona { position: absolute; left: 50%; top: -15cqw; translate: -50% 0; --cw: 36cqw; z-index: 3; }
.panel .esq { position: absolute; z-index: 0; bottom: 3.4cqw; right: 3.4cqw; width: 19cqw; aspect-ratio: 300 / 355; background: var(--img-esquina) center / contain no-repeat; pointer-events: none; }
.panel .esq.izq { right: auto; left: 3.4cqw; scale: -1 1; }
.panel:has(.esq) { padding-bottom: 21cqw; }
.panel .titulo-script { --tam: 11cqw; }
.panel .titulo-script + .parrafo { margin-top: 3cqw; }

/* Iconos: imagen de IA o dibujo de línea dorada de respaldo */
.icono { display: flex; justify-content: center; align-items: center; width: var(--iw, 30cqw); margin: 0 auto 2cqw; }
.icono img { width: 100%; height: auto; filter: drop-shadow(0 4px 6px rgba(130, 70, 30, .2)); }
.icono svg { width: 21cqw; height: 21cqw; padding: 4.4cqw; border-radius: 50%; background: rgba(255, 252, 248, .9); box-shadow: 0 0 0 1.4px var(--oro), 0 0 0 2.8cqw rgba(150, 40, 60, .22);
  fill: none; stroke: var(--oro-osc); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.icono.con-imagen svg { display: none; }

/* Reserva la fecha */
#fecha .mes { margin-top: 2cqw; font: 400 12cqw/1 var(--script); color: var(--rosa-titulo); }
.fecha-fila { display: flex; justify-content: center; align-items: center; gap: 3cqw; margin-top: 2cqw; }
.fecha-fila .lado { width: 21cqw; padding: 2.2cqw 0; border-top: 1.5px solid var(--oro); border-bottom: 1.5px solid var(--oro); font: 600 3.7cqw/1 var(--caps); letter-spacing: .12em; padding-left: .12em; color: var(--oro-osc); text-transform: uppercase; }
.fecha-fila b { font: 600 19cqw/1 var(--serif); font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1; color: var(--rosa-titulo); }
#fecha .hora-linea { margin-top: 4cqw; font: italic 500 5cqw/1.3 var(--serif); color: var(--texto); }
#fecha .hora-linea b { font-style: normal; font-weight: 600; font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1; }

/* Ceremonia y recepción */
.lugar { margin-top: 3cqw; font: 600 5.6cqw/1.3 var(--serif); color: var(--texto); }
.lugar small { display: block; margin-top: 1cqw; font: 500 4.6cqw/1.35 var(--serif); }
.hora { display: flex; align-items: center; justify-content: center; gap: 3cqw; margin-top: 4cqw; font: 600 4.6cqw/1 var(--caps); font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1; letter-spacing: .08em; color: var(--oro-osc); }
.hora::before, .hora::after { content: ""; width: 9cqw; height: 1.5px; background: var(--oro); }
.boton-linea { display: inline-flex; align-items: center; gap: 2cqw; margin-top: 6cqw; padding: 3cqw 7cqw; border: 1.5px solid var(--oro); border-radius: 99px; background: rgba(255, 252, 248, .7); font: 600 3.5cqw/1 var(--caps); letter-spacing: .12em; text-transform: uppercase; color: var(--rosa-titulo); transition: transform .2s ease, background .2s; }
.boton-linea svg { width: 4.4cqw; height: 4.4cqw; fill: var(--oro); }
.boton-linea:active { transform: scale(.96); background: rgba(207, 156, 76, .12); }

/* Vestimenta */
#vestimenta .estilo { margin-top: 2cqw; font: 600 7cqw/1.2 var(--caps); letter-spacing: .14em; padding-left: .14em; text-transform: uppercase; color: var(--rosa-titulo); }
#vestimenta .nota { margin-top: 3cqw; }

/* Cuenta regresiva: cuatro "puertitas" con moldura dorada */
#cuenta { padding-top: 20cqw; }
#cuenta .titulo-script { --tam: 13cqw; text-shadow: 0 0 14px rgba(255, 248, 244, .95), 0 0 4px rgba(255, 248, 244, .9); }
.contador { display: flex; justify-content: center; gap: 3.2cqw; margin: 4cqw auto 0; }
.contador > div { width: 18.6cqw; padding: 7cqw 0 3.6cqw; border-radius: 9.3cqw 9.3cqw 1.6cqw 1.6cqw / 8cqw 8cqw 1.6cqw 1.6cqw; background: var(--panel);
  box-shadow: 0 0 0 1.4px var(--oro), 0 0 0 3.4px rgba(255, 248, 240, .9), 0 0 0 4.6px var(--oro), 0 8px 18px rgba(140, 60, 60, .18); }
.contador b { display: block; font: 600 9.6cqw/1 var(--serif); font-variant-numeric: lining-nums tabular-nums; font-feature-settings: 'lnum' 1, 'tnum' 1; color: var(--rosa-titulo); }
.contador span { display: block; margin-top: 2cqw; font: 600 2.5cqw/1 var(--caps); letter-spacing: .1em; padding-left: .1em; text-transform: uppercase; color: var(--oro-osc); }
.contador.fin { display: block; }
.contador .terminado { width: auto; padding: 6cqw 8cqw; font: 400 10cqw/1 var(--script); color: var(--rosa-titulo); border-radius: 4cqw; }

/* Galería deslizable */
#galeria { padding-top: 20cqw; }
#galeria .titulo-script { --tam: 13cqw; text-shadow: 0 0 14px rgba(255, 248, 244, .95); }
.carrusel { display: flex; gap: 5cqw; overflow-x: auto; scroll-snap-type: x mandatory; padding: 5cqw 17cqw 6cqw; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.carrusel::-webkit-scrollbar { display: none; }
.carrusel figure { flex: 0 0 66cqw; scroll-snap-align: center; aspect-ratio: 3 / 4.2; padding: 1.8cqw; border-radius: 33cqw 33cqw 2.4cqw 2.4cqw / 26cqw 26cqw 2.4cqw 2.4cqw; background: linear-gradient(160deg, #fbe7b4, #cf9c4c 45%, #f3d48f 70%, #b8833a); box-shadow: 0 10px 22px rgba(130, 60, 50, .25); }
.carrusel img { width: 100%; height: 100%; object-fit: cover; border-radius: 31cqw 31cqw 1.4cqw 1.4cqw / 24cqw 24cqw 1.4cqw 1.4cqw; background: #f3e2d6; }
#galeria .desliza { font: 600 3cqw/1 var(--caps); letter-spacing: .22em; text-transform: uppercase; color: var(--oro-osc); }

/* Confirmación */
#confirmacion { padding: 18cqw 0 0; }
.bruma { width: 94cqw; margin: 0 auto; padding: 12cqw 10cqw; background: radial-gradient(ellipse 62% 56% at 50% 50%, rgba(255, 250, 246, .92) 0%, rgba(255, 250, 246, .66) 55%, rgba(255, 250, 246, 0) 100%); }
#confirmacion .titulo-script { --tam: 11.5cqw; }
#confirmacion .parrafo { margin-top: 3cqw; font-size: 5.2cqw; }
#confirmacion .limite { margin-top: 4cqw; }

      </div>
      <h2 class="titulo-script" id="recepcion-titulo"></h2>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.4-.9-2.8-1.2-4.6-4.1-4.7-4.3-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.7-.1 1.3z"/></svg><span></span>

       13. DESPEDIDA
       ============================================================ -->

      <img class="guirnalda" data-img="guirnalda" alt="" loading="lazy" decoding="async">
      <div class="destellos"></div>
      <div class="mariposa" style="--w:9cqw;right:8cqw;top:40cqw;--d:16s;--r:-4s;--giro:16deg;--x1:-14cqw;--y1:8cqw;--x2:-26cqw;--y2:-2cqw;--x3:-10cqw;--y3:-10cqw"><div class="cuerpo"><i></i><i></i></div></div>
      <p class="frase revela" id="despedida-frase"></p>

<div id="petalos" aria-hidden="true"></div>

<audio id="musica" loop preload="metadata"></audio>
<div id="musica-boton" class="pausado" title="Música" aria-label="Música" role="button">
  <svg class="icono-pausa" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  <svg class="icono-play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
</div>

<script>
/* ============================================================
   FUNCIONAMIENTO (no hace falta tocar nada de aquí abajo)
   ============================================================ */
(function () {
  const $ = (id) => document.getElementById(id);
  // Invitación en pausa: solo se ve un aviso
  if (CONFIG.pausada) {
    document.body.className = '';
    document.body.innerHTML = '<div class="pausa"><b></b><p>Esta invitación no está disponible por el momento.</p></div>';
    document.querySelector('.pausa b').textContent = CONFIG.nombre;
    return;
  }
  const $$ = (sel, raiz) => [...(raiz || document).querySelectorAll(sel)];
  const IM = CONFIG.imagenes || {};
  const texto = (id, t) => { const el = $(id); if (el) el.textContent = t || ''; };
  const url = (ruta) => 'url("' + ruta + '")';
  const quitar = (id) => { const el = $(id); if (el) el.remove(); };

  /* ---------- Fecha ---------- */
  const fe = CONFIG.fecha;
  const fechaEvento = new Date(fe.anio, fe.mes - 1, fe.dia, fe.hora, fe.minuto, 0);
  const DIAS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  const dos = (n) => String(n).padStart(2, '0');
  const horaTexto = ((fe.hora % 12) || 12) + ':' + dos(fe.minuto) + (fe.hora < 12 ? ' a.m.' : ' p.m.');

  /* ---------- Textos ---------- */
  document.title = CONFIG.arriba + ' · ' + CONFIG.nombre;
  texto('arriba', CONFIG.arriba);
  texto('lema', CONFIG.lema || '');
  texto('mensaje-texto', CONFIG.mensaje.texto);
  texto('mensaje-firma', CONFIG.nombre);

  // Nombres en dos líneas con "&" en medio
  const ponerNombres = (id, lista) => {
    const el = $(id); el.textContent = '';
    (lista || []).forEach((n, i) => {
      const [nom, rol] = n.split('|');
      if (i && lista.length < 3) { const y = document.createElement('span'); y.className = 'y'; y.textContent = '&'; el.appendChild(y); }
      el.appendChild(document.createTextNode(nom));
      if (rol) { const r = document.createElement('span'); r.className = 'rol'; r.textContent = rol; el.appendChild(r); }
    });
  };
  texto('padres-titulo', CONFIG.padres.titulo);
  ponerNombres('padres-nombres', CONFIG.padres.nombres);
  const pd = CONFIG.padrinos || {};
  if (pd.nombres && pd.nombres.length) { texto('padrinos-titulo', pd.titulo); ponerNombres('padrinos-nombres', pd.nombres); } else quitar('padrinos-caja');
  if (CONFIG.invitacion) texto('invitacion', CONFIG.invitacion); else quitar('invitacion');

  const cr = CONFIG.cuentaRegresiva;
  texto('cuenta-titulo', cr.titulo);
  $$('#contador span').forEach((s, i) => s.textContent = cr.etiquetas[i]);

  const rf = CONFIG.reservaFecha;
  texto('fecha-titulo', rf.titulo);
  texto('mes-texto', MESES[fe.mes - 1]);
  texto('dia-semana', DIAS[fechaEvento.getDay()]);
  texto('dia-numero', dos(fe.dia));
  texto('anio-texto', String(fe.anio));
  $('hora-linea').innerHTML = '<span></span> <b></b>';
  $('hora-linea').children[0].textContent = rf.hora;
  $('hora-linea').children[1].textContent = horaTexto;

  // Ceremonia y recepción
  [['ceremonia', CONFIG.ceremonia], ['recepcion', CONFIG.recepcion]].forEach(([id, ev]) => {
    if (!ev || !ev.lugar) { quitar(id); return; }
    texto(id + '-titulo', ev.titulo);
    texto(id + '-lugar', ev.lugar);
    texto(id + '-direccion', ev.direccion);
    if (ev.hora) texto(id + '-hora', ev.hora); else quitar(id + '-hora');
    const b = $(id + '-mapa');
    if (ev.enlace) { b.href = ev.enlace; b.querySelector('span').textContent = ev.boton; } else b.remove();
  });

  const ve = CONFIG.vestimenta;
  texto('vestimenta-titulo', ve.titulo);
  texto('vestimenta-estilo', ve.estilo);
  if (ve.nota) texto('vestimenta-nota', ve.nota); else quitar('vestimenta-nota');

  // Galería
  const ga = CONFIG.galeria || {};
  if (ga.fotos && ga.fotos.length) {
    texto('galeria-titulo', ga.titulo);
    ga.fotos.forEach((ruta, i) => {
      const f = document.createElement('figure'), img = new Image();
      img.loading = 'lazy'; img.decoding = 'async'; img.alt = CONFIG.nombre + ' · foto ' + (i + 1); img.src = ruta;
      f.appendChild(img); $('carrusel').appendChild(f);
    });
    if (ga.fotos.length < 2) document.querySelector('#galeria .desliza').remove();
  } else quitar('galeria');

  texto('regalos-titulo', CONFIG.regalos.titulo);
  texto('regalos-texto', CONFIG.regalos.texto);

  const co = CONFIG.confirmacion;
  texto('confirmacion-titulo', co.titulo);
  texto('confirmacion-texto', co.texto);
  if (co.limite) texto('confirmacion-limite', co.limite); else quitar('confirmacion-limite');
  $('confirmacion-boton').href = co.whatsapp ? 'https://wa.me/' + co.whatsapp + '?text=' + encodeURIComponent(co.mensaje) : '#';
  $('confirmacion-boton').querySelector('span').textContent = co.boton;

  texto('despedida-frase', CONFIG.despedida.frase);
  texto('fecha-corta', dos(fe.dia) + ' · ' + dos(fe.mes) + ' · ' + fe.anio);
  texto('fecha-portada', dos(fe.dia) + ' · ' + dos(fe.mes) + ' · ' + fe.anio);
  const cd = CONFIG.credito || {};
  if (cd.marca) {
    $('credito').href = cd.enlace || '#';
    $('credito').innerHTML = '<span></span><b></b><em></em>';
    $('credito').children[0].textContent = cd.texto; $('credito').children[1].textContent = cd.marca; $('credito').children[2].textContent = cd.boton + ' ›';
  } else $('credito').remove();

  /* ---------- Letras doradas: imagen de IA o letras con degradado ---------- */
  function oro(caja, ruta, palabra, clase) {
    const conTexto = () => { caja.innerHTML = '<span class="script-oro"></span>'; caja.firstChild.textContent = palabra; if (clase) caja.firstChild.classList.add(clase); };
    if (ruta) {
      const img = new Image(); img.loading = 'lazy'; img.decoding = 'async'; img.alt = palabra; if (clase === 'te-espero-texto') img.className = 'te-espero';
      img.onerror = conTexto; img.src = ruta; caja.appendChild(img);
    } else conTexto();
  }
  $$('[data-nombre]').forEach(caja => {
    caja.style.setProperty('--tam-nombre', Math.min(21, 168 / CONFIG.nombre.length).toFixed(1) + 'cqw');   // nombres largos, letra más pequeña
    oro(caja, IM.nombreOro, CONFIG.nombre);
    [[8, 20, 0], [60, 4, .9], [92, 58, 1.7], [32, 82, 2.3]].forEach(([x, y, r]) => {
      const e = document.createElement('i'); e.className = 'estrella';
      e.style.cssText = 'left:' + x + '%;top:' + y + '%;--t:14px;--d:2.6s;--r:' + (2 + r) + 's';
      caja.appendChild(e);
    });
  });
  oro($('te-espero'), IM.teEspero, CONFIG.despedida.cierre, 'te-espero-texto');

  /* ---------- Imágenes de IA: si no están, se quitan (queda el respaldo) ---------- */
  $$('img[data-img]').forEach(img => {
    const ruta = IM[img.dataset.img];
    if (ruta) { img.onerror = () => img.remove(); img.src = ruta; } else img.remove();
  });
  if (!IM.portada) { $('portada').classList.add('sin-imagen'); $('arco-respaldo').src = CONFIG.apertura.marco; }
  else quitar('arco-respaldo');
  const raiz = document.querySelector('.invitacion');
  if (IM.corona) raiz.style.setProperty('--img-corona', url(IM.corona));
  if (IM.mariposa) raiz.style.setProperty('--img-mariposa', url(IM.mariposa)); else $$('.mariposa').forEach(m => m.remove());
  if (IM.esquina) {
    raiz.style.setProperty('--img-esquina', url(IM.esquina));
    $$('.panel').forEach(p => { p.insertAdjacentHTML('afterbegin', '<i class="esq izq"></i><i class="esq"></i>'); });
  }
  if (IM.fondo) { $('fondo-fijo').classList.add('con-imagen'); $('fondo-fijo').style.setProperty('--img', url(IM.fondo)); }
  // Iconos
  $$('[data-icono]').forEach(caja => {
    const ruta = IM[caja.dataset.icono];
    if (!ruta) return;
    const img = new Image(); img.loading = 'lazy'; img.decoding = 'async'; img.alt = '';
    img.onerror = () => { img.remove(); caja.classList.remove('con-imagen'); };
    img.src = ruta; caja.appendChild(img); caja.classList.add('con-imagen');
  });
  // Marco dorado del mensaje: el relleno y el texto van justo en el hueco
  const marco = $('marco-arco'), vm = IM.ventanaMarco || {};
  const ubicar = (el, c, extra) => { el.style.left = (c.x - extra) + '%'; el.style.top = (c.y - extra) + '%'; el.style.width = (c.w + 2 * extra) + '%'; el.style.height = (c.h + 2 * extra) + '%'; };
  if (IM.marcoFiligrana && vm.w) { ubicar(marco.querySelector('.relleno'), vm, .6); ubicar(marco.querySelector('.texto'), IM.textoMarco || vm, 0); }
  else marco.classList.add('sin-marco');
  const marcoImg = marco.querySelector('.marco-img');
  if (marcoImg) marcoImg.addEventListener('error', () => { marco.classList.add('sin-marco'); $$('.relleno, .texto', marco).forEach(el => el.removeAttribute('style')); });

  /* ---------- Destellos ---------- */
  $$('.destellos').forEach(capa => {
    for (let i = 0; i < 8; i++) {
      const d = document.createElement('i');
      d.style.cssText = 'left:' + (Math.random() * 94) + '%;top:' + (4 + Math.random() * 90) + '%;--t:' + (7 + Math.random() * 11).toFixed(0) + 'px;--d:' + (2.4 + Math.random() * 3).toFixed(1) + 's;--r:' + (Math.random() * 4).toFixed(1) + 's';
      capa.appendChild(d);
    }
  });

  /* ---------- Títulos en dorado (Gemini) ---------- */
  Object.entries(CONFIG.titulos || {}).forEach(([id, ruta]) => {
    const h = $(id); if (!h || !ruta) return;
    const alt = h.textContent; h.textContent = '';
    const im = document.createElement('img'); im.className = 'titulo-oro'; im.src = ruta; im.alt = alt; im.decoding = 'async';
    h.appendChild(im);
  });
  if (IM.nombreOro && $('mensaje-firma')) {
    const f = $('mensaje-firma'); f.textContent = '';
    const im = document.createElement('img'); im.className = 'firma-oro'; im.src = IM.nombreOro; im.alt = CONFIG.nombre; f.appendChild(im);
  }
  if (CONFIG.misXvOro && $('arriba')) {
    const a = $('arriba'); a.textContent = '';
    const im = document.createElement('img'); im.src = CONFIG.misXvOro; im.alt = CONFIG.arriba; a.appendChild(im);
  }
  if (CONFIG.marcoFlores) {
    const m = document.createElement('img'); m.className = 'marco-flores'; m.src = CONFIG.marcoFlores; m.alt = ''; m.decoding = 'async';
    $('portada').appendChild(m);
  }

  /* ---------- Pétalos ---------- */
  if (CONFIG.petalos) {
    const capa = $('petalos');
    for (let i = 0; i < 8; i++) {
      const p = document.createElement('i');
      p.style.cssText = '--x:' + (Math.random() * 100).toFixed(1) + '%;--t:' + (9 + Math.random() * 8).toFixed(0) + 'px;--d:' + (10 + Math.random() * 8).toFixed(1) + 's;--r:' + (-Math.random() * 16).toFixed(1) + 's;--dx:' + ((Math.random() - .5) * 120).toFixed(0) + 'px';
      capa.appendChild(p);
    }
  }

  /* ---------- Animaciones al aparecer en pantalla ---------- */
  const observador = new IntersectionObserver((entradas) => {
    entradas.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observador.unobserve(e.target); } });
  }, { threshold: .15 });
  function observar() { $$('.revela').forEach(el => observador.observe(el)); }

  /* ---------- Cuenta regresiva ---------- */
  let reloj;
  function actualizarCuenta() {
    const resta = fechaEvento - new Date();
    if (resta <= 0) { const c = $('contador'); c.classList.add('fin'); c.innerHTML = '<div class="terminado"></div>'; c.firstChild.textContent = cr.terminado; clearInterval(reloj); return; }
    $('dias').textContent = String(Math.floor(resta / 86400000));
    $('horas').textContent = dos(Math.floor(resta % 86400000 / 3600000));
    $('minutos').textContent = dos(Math.floor(resta % 3600000 / 60000));
    $('segundos').textContent = dos(Math.floor(resta % 60000 / 1000));
  }
  reloj = setInterval(actualizarCuenta, 1000); actualizarCuenta();

  /* ---------- Aviso flotante (modo muestra o WhatsApp sin número) ---------- */
  const MU = CONFIG.muestra || {};
  const aviso = document.createElement('div'); aviso.id = 'aviso'; aviso.textContent = MU.aviso || ''; document.body.appendChild(aviso);
  let tAviso;
  const mostrarAviso = (e) => { e.preventDefault(); aviso.classList.add('ver'); clearTimeout(tAviso); tAviso = setTimeout(() => aviso.classList.remove('ver'), 2200); };
  if (!co.whatsapp) $('confirmacion-boton').addEventListener('click', mostrarAviso);

  /* ---------- Vista previa para el cliente: marca de agua y protección ---------- */
  // ?sinmarca = Jay revisa el diseño sin la marca de agua (la clienta recibe el enlace normal, con marca)
  if (MU.activa && !location.search.includes('sinmarca')) {
    document.body.classList.add('muestra');
    const t = (MU.texto || 'MUESTRA').replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const tinta = { negro: ["rgba(15,8,8,.45)", "rgba(255,255,255,.3)"], blanco: ["rgba(255,255,255,.5)", "rgba(0,0,0,.2)"] }[MU.color] || ["rgba(184,135,58,.42)", "rgba(255,255,255,.25)"];
    const fila = (x, y) => "<text x='" + x + "' y='" + y + "' text-anchor='middle' font-family='Georgia,serif' font-size='14' font-weight='700' letter-spacing='2.5' fill='" + tinta[0] + "' stroke='" + tinta[1] + "' stroke-width='.5'>" + t + "</text>";
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='260' height='200'><g transform='rotate(-28 130 100)'>" + fila(130, 70) + fila(0, 160) + fila(260, 160) + "</g></svg>";
    const capa = document.createElement('div'); capa.id = 'marca-agua'; capa.setAttribute('aria-hidden', 'true');
    capa.style.setProperty('--marca', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
    document.body.appendChild(capa);
    // sin menú de clic derecho, sin arrastrar ni seleccionar, sin atajos de guardar/copiar/imprimir/ver código
    ['contextmenu', 'dragstart', 'selectstart', 'copy', 'cut'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
    document.addEventListener('keydown', e => {
      const k = (e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey;
      if (e.key === 'F12' || (mod && ['s', 'u', 'p', 'c', 'a'].includes(k)) || (mod && e.shiftKey && ['i', 'j', 'c'].includes(k))) e.preventDefault();
    });
    // mapas y WhatsApp: avisan que se activan en la versión final
    ['ceremonia-mapa', 'recepcion-mapa', 'confirmacion-boton'].forEach(id => { const b = $(id); if (b) b.addEventListener('click', mostrarAviso); });
  }

  /* ---------- Música ---------- */
  const musica = $('musica'), musicaBoton = $('musica-boton');
  if (CONFIG.musica) musica.src = CONFIG.musica;
  function reproducirMusica() {
    if (!CONFIG.musica) return;
    const intento = musica.play();
    if (intento && intento.then) intento.then(() => musicaBoton.classList.remove('pausado')).catch(() => musicaBoton.classList.add('pausado'));
  }
  document.addEventListener('touchend', () => { if (termino && musica.paused && !musica.dataset.pausadoPorUsuario) reproducirMusica(); }, { passive: true });
  musicaBoton.addEventListener('click', (e) => {
    e.stopPropagation();
    if (musica.paused) { delete musica.dataset.pausadoPorUsuario; reproducirMusica(); }
    else { musica.pause(); musica.dataset.pausadoPorUsuario = '1'; musicaBoton.classList.add('pausado'); }
  });

  /* ---------- Puertas del castillo: tocar → se abren → portada ---------- */
  const AP = CONFIG.apertura, ap = $('apertura');
  ap.innerHTML =
    '<div class="relleno"></div>' +
    '<div class="escena">' +
      '<div class="capa luz"></div>' +
      '<div class="capa puerta izq"><img alt="" decoding="async"></div>' +
      '<div class="capa puerta der"><img alt="" decoding="async"></div>' +
      '<div class="capa rendija"></div>' +
      '<img class="capa marco" alt="" decoding="async">' +
      (AP.video ? '<video class="capa video" muted playsinline preload="auto"></video>' : '') +
      '<div class="capa sello"><img alt="" decoding="async"><b></b></div>' +
    '</div>' +
    '<div class="toca"></div>';
  const escena = ap.querySelector('.escena'), selloCaja = ap.querySelector('.sello');
  if (!IM.portada) ap.classList.add('sin-zoom');
  ap.querySelector('.toca').textContent = AP.textoAbrir;
  ap.querySelector('.puerta.izq').style.setProperty('--mascara', url(AP.puertaIzquierda));
  ap.querySelector('.puerta.der').style.setProperty('--mascara', url(AP.puertaDerecha));
  [[18, 62], [80, 58], [30, 40], [70, 36], [50, 30], [24, 78], [76, 80], [60, 70], [40, 66]].forEach((p, i) => {
    const s = document.createElement('span'); s.className = 'destello';
    s.style.left = p[0] + '%'; s.style.top = p[1] + '%'; s.style.animationDelay = (i * .45) + 's';
    escena.appendChild(s);
  });

  let lista = false, pidio = false, abierto = false, termino = false, cargadas = 0;
  const capas = [['.marco', AP.marco], ['.puerta.izq img', AP.puertaIzquierda], ['.puerta.der img', AP.puertaDerecha]];
  capas.forEach(([sel, ruta]) => {
    const img = ap.querySelector(sel);
    const lista1 = () => { if (++cargadas === capas.length) preparar(); };
    if (!ruta) { lista1(); return; }
    img.onload = img.onerror = lista1; img.src = ruta;
  });
  // El sello aparece apenas llega (no hace esperar a las puertas)
  const imgSello = ap.querySelector('.sello img');
  imgSello.onload = () => selloCaja.classList.add('cargado');
  imgSello.onerror = () => selloCaja.classList.add('sin-imagen', 'cargado');
  if (AP.sello) imgSello.src = AP.sello; else imgSello.onerror();
  function preparar() {
    if (lista) return; lista = true;
    escena.classList.add('lista');
    setTimeout(soltar, 1200);            // el resto de la invitación empieza a bajar después de las puertas
    if (pidio) setTimeout(abrir, 350);
  }
  const vid = ap.querySelector('video.video');
  if (vid) { vid.src = AP.video; vid.load(); }
  function abrir() {
    if (abierto) return; abierto = true;
    if (vid && vid.readyState >= 2) {
      ap.classList.add('con-video', 'abriendo');
      vid.play().catch(() => {});
      const dur = (vid.duration || 7.8) * 1000;
      setTimeout(() => $('portada').classList.add('visible'), dur - 600);
      vid.onended = terminar; setTimeout(terminar, dur + 600);
      return;
    }
    ap.classList.add('abriendo');
    setTimeout(() => $('portada').classList.add('visible'), 1500);
    setTimeout(terminar, 2950);
  }
  function terminar() {
    if (termino) return; termino = true;
    soltar();
    ap.remove();
    document.body.classList.remove('bloqueado');
    $('portada').classList.add('visible');
    observar();
    if (CONFIG.musica) {
      musicaBoton.classList.add('visible');
      if (musica.paused && !musica.dataset.pausadoPorUsuario) reproducirMusica();
    }
  }
  ap.addEventListener('click', () => {
    if (pidio) return; pidio = true;
    ap.classList.add('tocado');
    soltar();
    reproducirMusica();
    if (lista) abrir();
    else setTimeout(() => { preparar(); abrir(); }, 2500);   // si las puertas tardan, se abre igual
  });

  /* ---------- Velocidad: primero las puertas; el resto empieza a bajar después ---------- */
  function soltar() { document.body.classList.remove('esperando'); }
  setTimeout(() => { preparar(); soltar(); }, 5000);   // por si acaso

  // Para revisar sin las puertas: abre la página con ?directo al final de la dirección
  if (location.search.includes('directo')) { pidio = abierto = true; terminar(); }
})();
</script>
</body>
</html>
