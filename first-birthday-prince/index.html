<script>
/* ============================================================
   CONFIGURACIÓN DE LA INVITACIÓN
   Todo lo que aparece en la invitación sale de este bloque.
   Donde dice {nombre} se pone solo el nombre del príncipe.
   ============================================================ */
const CONFIG = {

  // ---------- Príncipe ----------
  nombre: "Mateo",
  arriba: "Our Little Prince",               // texto encima del nombre en la portada
  edad: { numero: "1", texto: "year old" },  // el número grande dorado y el texto a su lado

  // ---------- Fecha y hora de la fiesta ----------
  // La fecha escrita, la hora y la cuenta regresiva salen solas de aquí.
  fecha: { anio: 2027, mes: 2, dia: 20, hora: 16, minuto: 0 },   // mes: 1 = enero … 12 = diciembre · hora en formato 24 h

  // ---------- Sobre (pantalla inicial) ----------
  sobre: {
    textoAbrir: "Tap the seal to open",
    imagen: "recursos/sobre-cerrado.webp",   // portada del sobre (primer cuadro del video de Gemini). Vacío = sobre dibujado con código
    video: "recursos/sobre-video.mp4",       // el sobre abriéndose (10 s, sin audio, termina en la luz dorada)
    selloX: 50.1, selloY: 56                 // dónde está el sello en la imagen (%), para el brillo que late
  },

  // ---------- El Reino está de fiesta (dentro del marco de pergamino) ----------
  reino: {
    titulo: "A Royal Celebration!",
    texto: "Our little Prince {nombre} is turning one and invites you to share this magical moment with us.",
    firma: "With love, Mom & Dad",
    padres: "Andrés & Carolina"
  },

  // ---------- Foto del príncipe ----------
  foto: {
    titulo: "My First Year",
    texto: "Twelve months of smiles, hugs and royal adventures.",
    imagen: "recursos/principe-1.webp"   // foto del bebé (cuadrada, la cara al centro). Vacío = corona en su lugar
  },
  // Galería deslizable (vacía [] = no aparece)
  galeria: [
    "recursos/principe-2.webp",
    "recursos/principe-3.webp"
  ],

  // ---------- ¿Cuándo y dónde? ----------
  lugar: {
    titulo: "When & Where",
    nombre: "Royal Palace Event Hall",
    direccion: "123 Royal Crown Ave, Miami, FL",
    boton: "View location",
    enlace: "https://maps.google.com/?q=Miami+FL",   // Google Maps → Compartir → Copiar enlace
    mapa: ""      // opcional: enlace "embed" de Google Maps (Compartir → Insertar un mapa). Vacío = sin mapa
  },

  // ---------- Cuenta regresiva ----------
  cuentaRegresiva: {
    titulo: "Almost Time",
    subtitulo: "until the big royal party",
    etiquetas: ["Days", "Hours", "Min", "Sec"],
    terminado: "The big day is here!"
  },

  // ---------- Código de vestimenta (mostrar: false = no aparece) ----------
  vestimenta: {
    mostrar: true,
    titulo: "Dress Code",
    estilo: "Smart casual",
    texto: "Suggested colors: navy blue, white and gold",
    tonos: ["#1f2f66", "#ffffff", "#d9b45a"]      // puntos de color
  },

  // ---------- Sugerencia de regalo ----------
  // icono: "ropa", "calzado" o "juguetes" (usa las imágenes de abajo)
  regalos: {
    titulo: "Gift Ideas",
    lista: [
      { icono: "ropa",     texto: "Clothes",  detalle: "size 18 – 24 months" },
      { icono: "calzado",  texto: "Shoes",    detalle: "toddler size 5" },
      { icono: "juguetes", texto: "Toys",     detalle: "" }
    ],
    nota: "Every gift from the heart is warmly welcome!"
  },

  // ---------- Confirmación (por WhatsApp) ----------
  confirmacion: {
    titulo: "Please RSVP",
    texto: "Having you there means the world to us. Please let us know by February 10.",
    boton: "RSVP on WhatsApp",
    whatsapp: "",                     // número con código de país, sin + ni espacios (ej. 593991234567)
    mensaje: "Hi! I'm confirming my attendance at Prince {nombre}'s first birthday 👑"
  },

  // ---------- Despedida ----------
  despedida: {
    frase: "Thank you for being part of our little prince's kingdom",
    cierre: "See You There!"          // se usa si no hay imagen dorada
  },

  // Pie de página: enlace a nuestros trabajos en la web (vacío marca = no aparece)
  credito: {
    texto: "Made with love by",
    marca: "Elegancia de Amor",
    boton: "See our work",
    enlace: "https://eleganciadeamor.com/#nuestros-trabajos"
  },

  // ---------- Vista previa para el cliente (antes del pago final) ----------
  // activa: true = marca de agua en toda la página, sin copiar/guardar imágenes,
  // y los botones de mapa y WhatsApp avisan que se activan en la versión final.
  // Al entregar la invitación pagada: activa: false
  muestra: {
    activa: false,
    texto: "SAMPLE · ELEGANCIA DE AMOR",
    color: "dorado",         // color de la marca de agua: "negro", "blanco" o "dorado"
    aviso: "Available in the final version ✨"
  },
  pausada: false,            // true = la invitación no se muestra (ej. si no se completa el pago)

  // ---------- Imágenes hechas con Gemini ----------
  // Vacío ("") = no se muestra o se usa la versión dibujada con código.
  imagenes: {
    portada: "recursos/portada.webp",            // entrada del castillo con la alfombra azul
    nombreOro: "recursos/nombre-oro.webp",       // "Mateo" en dorado 3D (si cambias el nombre, cambia o borra esta imagen)
    numeroOro: "recursos/numero-oro.webp",       // "1" dorado con corona
    corona: "recursos/corona.webp",              // corona dorada (tarjetas y despedida)
    marcoReal: "recursos/marco-real.webp",       // marco azul y dorado con pergamino
    ventanaMarco: { x: 16, y: 23, w: 68, h: 65 },   // dónde va el texto dentro del pergamino (%): izquierda, arriba, ancho, alto
    fondoBalcon: "recursos/fondo-balcon.webp",   // balcón con cortinas y el castillo (detrás del pergamino)
    fondoSalon: "recursos/fondo-salon.webp",     // salón del trono (fondo fijo de las tarjetas)
    marcoFoto: "recursos/marco-foto.webp",       // marco redondo dorado con corona
    huecoFoto: { x: 49.9, y: 51, d: 59.5 },      // centro (%) y diámetro (% del ancho) del hueco del marco redondo
    iconoCalendario: "recursos/icono-calendario.webp",
    iconoReloj: "recursos/icono-reloj.webp",
    iconoUbicacion: "recursos/icono-ubicacion.webp",
    iconoVestimenta: "recursos/icono-vestimenta.webp",
    iconoRopa: "recursos/icono-ropa.webp",
    iconoCalzado: "recursos/icono-calzado.webp",
    iconoJuguetes: "recursos/icono-juguetes.webp",
    teEsperamos: "recursos/see-you-there-oro.webp" // "See You There!" en dorado 3D
  },

  destellosCayendo: true,    // destellos dorados cayendo

  // ---------- Música ----------
  // Archivo mp3 dentro de "recursos". Vacío ("") = sin música y sin botón.
  musica: "recursos/musica.mp3"     // "Happy 1st Birthday" (One Year Old Song), 2:22, con fundidos
};
</script>

<style>
/* ============================================================
   ESTILOS
   ============================================================ */
@font-face { font-family: 'Great Vibes'; font-weight: 400; font-display: swap; src: url('recursos/fuente-great-vibes.woff2') format('woff2'); }
@font-face { font-family: 'Cinzel'; font-weight: 600; font-display: swap; src: url('recursos/fuente-cinzel-600.woff2') format('woff2'); }
@font-face { font-family: 'Cinzel'; font-weight: 700; font-display: swap; src: url('recursos/fuente-cinzel-700.woff2') format('woff2'); }
@font-face { font-family: 'Cormorant'; font-weight: 500; font-display: swap; src: url('recursos/fuente-cormorant-500.woff2') format('woff2'); }
@font-face { font-family: 'Cormorant'; font-weight: 600; font-display: swap; src: url('recursos/fuente-cormorant-600.woff2') format('woff2'); }

:root {
  --marino: #1c2b5e;          /* azul marino real */
  --marino-osc: #0f1a3d;
  --texto: #26315c;           /* textos sobre pergamino */
  --oro: #b98a2e;
  --oro-claro: #e8c977;
  --marfil: #fbf6ea;
  --dorado: linear-gradient(180deg, #fff3c4 0%, #f2d17a 28%, #c99a3a 55%, #f5dc92 76%, #b8862c 100%);
  --script: 'Great Vibes', cursive;
  --real: 'Cinzel', Georgia, serif;
  --serif: 'Cormorant', Georgia, serif;
  --ancho: 440px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: hidden; }
body { background: var(--marino-osc); color: var(--texto); font-family: var(--serif); font-weight: 600; font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
body.bloqueado { overflow: hidden; height: 100vh; }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }

/* Columna central (formato celular). "cqw" = 1 % del ancho de la columna */
.invitacion { position: relative; z-index: 1; width: 100%; max-width: var(--ancho); margin: 0 auto; container-type: inline-size; overflow: hidden; box-shadow: 0 0 70px rgba(0, 0, 0, .45); }
section { position: relative; overflow: hidden; text-align: center; }
section > * { position: relative; z-index: 2; }
.pantalla { min-height: max(100svh, 178cqw); }

/* Fondo fijo del salón del trono (queda quieto mientras las tarjetas suben) */
#fondo-fijo { position: fixed; top: 0; left: 50%; z-index: 0; width: min(100%, var(--ancho)); height: 100lvh; translate: -50% 0; pointer-events: none;
  background: radial-gradient(ellipse 70% 40% at 50% 12%, rgba(232, 201, 119, .28), transparent 70%), radial-gradient(ellipse 60% 50% at 50% 100%, rgba(232, 201, 119, .16), transparent 70%), linear-gradient(180deg, #24376f 0%, #172456 50%, #0f1a3d 100%); }
#fondo-fijo.con-imagen { background: var(--img) 50% 50% / cover no-repeat, #1a2753; }
#fondo-fijo::after { content: ""; position: absolute; inset: 0; background: rgba(12, 20, 50, .28); }
body.esperando #fondo-fijo, body.esperando .invitacion { display: none; }   /* primero carga el sobre; el resto, después */

/* Destellos que titilan */
.destellos { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.destellos i, .estrella {
  position: absolute; width: var(--t, 10px); aspect-ratio: 1; opacity: 0;
  background: radial-gradient(circle, #fff 0 16%, rgba(255, 228, 160, .95) 30%, transparent 68%);
  clip-path: polygon(50% 0, 59% 41%, 100% 50%, 59% 59%, 50% 100%, 41% 59%, 0 50%, 41% 41%);
  animation: titila var(--d, 3s) var(--r, 0s) ease-in-out infinite;
}
@keyframes titila { 0%, 100% { opacity: 0; transform: scale(.4) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }

/* Corona dibujada con código (si no hay imagen) */
.corona-css { position: relative; width: 100%; aspect-ratio: 1.5; background: var(--dorado);
  clip-path: polygon(0 100%, 4% 22%, 26% 52%, 50% 0, 74% 52%, 96% 22%, 100% 100%); filter: drop-shadow(0 2px 2px rgba(80, 50, 10, .4)); }
.corona-css::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 24%; background: linear-gradient(90deg, transparent 0 18%, #2a3f86 18% 26%, transparent 26% 46%, #2a3f86 46% 54%, transparent 54% 74%, #2a3f86 74% 82%, transparent 82%); opacity: .85; }

/* Textos */
.titulo-script { font: 400 var(--tam, 12cqw)/1.15 var(--script); color: var(--marino); padding: 0 .1em; }
.titulo-script.claro { color: transparent; background: var(--dorado); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 2px 3px rgba(5, 10, 30, .7)); }
.subtitulo { font: 600 3.4cqw/1.4 var(--real); letter-spacing: .18em; text-transform: uppercase; color: var(--oro); }
.parrafo { font: 600 4.8cqw/1.45 var(--serif); font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1; color: var(--texto); }
.frase-clara { font: 600 5.2cqw/1.45 var(--serif); color: var(--marfil); text-shadow: 0 2px 8px rgba(5, 10, 30, .85), 0 0 2px rgba(5, 10, 30, .9); }

/* Aparecer al bajar */
.revela { opacity: 0; transform: translateY(8cqw); transition: opacity .9s ease, transform .9s ease; }
.revela.visible { opacity: 1; transform: none; }

/* ------------------------------------------------------------
   1. SOBRE (pantalla inicial)
   ------------------------------------------------------------ */
#sobre { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  background: #16224b; transition: opacity 1s ease; }
#sobre.sale { opacity: 0; pointer-events: none; }
#sobre .sobre-fondo { position: absolute; inset: -40px; background: center / cover no-repeat; filter: blur(22px); opacity: .8; }
#sobre .sobre-caja { position: relative; width: min(100vw, 100svh * 9 / 16); aspect-ratio: 9 / 16; overflow: hidden; container-type: inline-size; }
#sobre .sobre-caja video { width: 100%; height: 100%; display: block; object-fit: cover; background: center / cover no-repeat; }
#sobre .sello { position: absolute; z-index: 2; width: 15%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; transition: opacity .5s ease; }
#sobre .sello::before, #sobre .sello::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid rgba(255, 236, 190, .95); box-shadow: 0 0 16px rgba(255, 215, 140, .9); animation: sello-onda 2.2s ease-out infinite; }
#sobre .sello::after { animation-delay: 1.1s; }
@keyframes sello-onda { 0% { transform: scale(.85); opacity: 0; } 20% { opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
#sobre .toca { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); z-index: 3; padding: .65em 1.5em; border-radius: 99px; white-space: nowrap; background: rgba(251, 246, 234, .94); box-shadow: 0 4px 16px rgba(5, 10, 30, .4), inset 0 0 0 1px rgba(185, 138, 46, .5);
  font: 600 clamp(11px, 3.2vw, 14px) var(--real); letter-spacing: .14em; text-transform: uppercase; color: var(--marino); animation: toca-pulso 2.2s 1s ease-in-out infinite; transition: opacity .4s ease; }
@keyframes toca-pulso { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
#sobre.abierto .sello { opacity: 0; }
#sobre.abierto .toca { animation: none; opacity: 0; }
/* Sin video: al tocar, se acerca al sello y se llena de luz dorada */
#sobre .destello-oro { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0; background: radial-gradient(circle at var(--sx) var(--sy), rgba(255, 248, 228, .99) 0, rgba(255, 226, 160, .8) 18%, rgba(255, 205, 120, .3) 42%, transparent 66%); transition: opacity 1.1s ease .35s; }
#sobre.sin-video .sobre-caja video, #sobre .sobre-css { transform-origin: var(--sx) var(--sy); transition: transform 1.7s cubic-bezier(.5, 0, .3, 1); }
#sobre.sin-video.abierto .sobre-caja video, #sobre.abierto .sobre-css { transform: scale(1.25); }
#sobre.sin-video.abierto .destello-oro { opacity: 1; }

/* Sobre dibujado con código (mientras no hay imagen de Gemini) */
.sobre-css { position: absolute; inset: 0; overflow: hidden; text-align: center; background: radial-gradient(ellipse 80% 45% at 50% 30%, rgba(232, 201, 119, .35), transparent 70%), linear-gradient(180deg, #2b3f80 0%, #1a2a5e 55%, #0f1a3d 100%); }
.sobre-css .titulo-sobre { position: absolute; left: 0; right: 0; top: 13%; font: 600 4.2cqw/1.5 var(--real); letter-spacing: .3em; padding-left: .3em; text-transform: uppercase; color: var(--oro-claro); }
.sobre-css .titulo-sobre b { display: block; font: 400 15cqw/1.1 var(--script); letter-spacing: 0; text-transform: none; color: transparent; background: var(--dorado); -webkit-background-clip: text; background-clip: text; padding: 0 .1em; }
.sobre-css .carta { position: absolute; left: 50%; top: 54%; width: 76%; aspect-ratio: 1.42; transform: translate(-50%, -50%); border-radius: 1.6cqw; background: linear-gradient(160deg, #2a3f86, #182862); box-shadow: 0 6cqw 10cqw rgba(0, 0, 0, .5), inset 0 0 0 1.2cqw #1a2a5e, inset 0 0 0 1.6cqw #d9b45a; }
.sobre-css .carta::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, #fbf3df, #e9d6a8); clip-path: polygon(0 0, 100% 0, 50% 58%); filter: drop-shadow(0 1px 0 #b98a2e); }
.sobre-css .lazo { position: absolute; left: 0; right: 0; top: 50%; height: 9%; translate: 0 -50%; background: linear-gradient(180deg, #2f4796, #1c2b6a 60%, #2f4796); box-shadow: 0 0 0 .5cqw #d9b45a; }
.sobre-css .sello-css { position: absolute; left: 50%; top: 58%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff0c0, #e2b85a 40%, #a8781f 100%); box-shadow: 0 1cqw 2cqw rgba(0, 0, 0, .45), inset 0 0 0 .8cqw rgba(140, 95, 20, .5); display: flex; align-items: center; justify-content: center; }
.sobre-css .sello-css .corona-css { width: 56%; background: linear-gradient(180deg, #8a5f14, #6d4a0c); filter: none; }
.sobre-css .sello-css .corona-css::after { display: none; }

/* ------------------------------------------------------------
   2. PORTADA
   ------------------------------------------------------------ */
#portada { background: linear-gradient(180deg, #f2c7b0 0%, #c9a2c2 26%, #4a4f8f 55%, #1c2b5e 80%, #0f1a3d 100%); }
#portada .portada-img { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; transform: scale(1.08); transform-origin: 50% 100%; }
#portada.visible .portada-img { animation: acerca 9s ease-out forwards; }
@keyframes acerca { to { transform: scale(1); } }
#portada .velo { position: absolute; inset: 0 0 auto; z-index: 1; height: 95cqw; background: radial-gradient(ellipse 80% 42% at 50% 34%, rgba(12, 20, 52, .55), transparent 72%), linear-gradient(rgba(16, 24, 60, .6), rgba(16, 24, 60, .25) 55%, transparent); }
#portada .encabezado { position: absolute; left: 0; right: 0; top: 11cqw; z-index: 3; }

.bloque { padding: 22cqw 0 0; }
.tarjeta { position: relative; width: 84cqw; margin: 0 auto; padding: 16cqw 7cqw 12cqw; border-radius: 5cqw; background: radial-gradient(ellipse at 50% 30%, #fffaf0, #f3e6c8 100%);
  box-shadow: 0 0 0 1.8cqw var(--marino), 0 0 0 2.3cqw #d9b45a, 0 16px 34px rgba(0, 0, 0, .5), inset 0 0 0 1.4cqw #fffaf0, inset 0 0 0 1.7cqw rgba(185, 138, 46, .55); }
.tarjeta::before, .tarjeta::after { content: ""; position: absolute; width: 4cqw; aspect-ratio: 1; background: #c99a3a; transform: rotate(45deg); opacity: .8; }

/* ¿Cuándo y dónde? */

.dato .valor { margin-top: 1cqw; font: 600 5.6cqw/1.3 var(--serif); color: var(--texto); }
.dato .valor small { display: block; margin-top: 1cqw; font: 500 4.5cqw/1.35 var(--serif); }
.separador { width: 40cqw; height: 1px; margin: 6cqw auto 0; background: linear-gradient(90deg, transparent, #c99a3a, transparent); }
.mapa { width: 100%; aspect-ratio: 4 / 3; margin-top: 6cqw; border: 0; border-radius: 3cqw; box-shadow: 0 0 0 1cqw #d9b45a; }
.boton-linea { display: inline-block; margin-top: 6cqw; padding: 3cqw 8cqw; border: 1.5px solid var(--marino); border-radius: 99px; font: 600 3.6cqw/1 var(--real); letter-spacing: .12em; text-transform: uppercase; color: var(--marino); background: rgba(255, 255, 255, .5); transition: transform .2s ease, background .2s; }
.boton-linea:active { transform: scale(.96); background: rgba(185, 138, 46, .15); }

/* Cuenta regresiva */
#cuenta { padding-top: 20cqw; }
#cuenta .titulo-script { --tam: 15cqw; }
#cuenta .subtitulo { margin-top: 1cqw; color: var(--oro-claro); text-shadow: 0 1px 6px rgba(5, 10, 30, .9); }
.contador { display: flex; justify-content: center; gap: 2.6cqw; width: 90cqw; margin: 6cqw auto 0; }
.contador > div { flex: 1; padding: 4cqw 0 3.4cqw; border-radius: 3cqw; background: linear-gradient(180deg, #24376f, #142050); box-shadow: 0 0 0 .7cqw #d9b45a, 0 10px 22px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .15); }
.contador b { display: block; font: 700 9.6cqw/1 var(--real); font-variant-numeric: lining-nums tabular-nums; font-feature-settings: 'lnum' 1, 'tnum' 1; color: transparent; background: var(--dorado); -webkit-background-clip: text; background-clip: text; }

/* Vestimenta */

.tonos i { width: 9cqw; aspect-ratio: 1; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 .6cqw #fffaf0, 0 0 0 1cqw #c99a3a, 0 3px 6px rgba(0, 0, 0, .2); }

/* Despedida */
#despedida { padding: 24cqw 0 12cqw; }

.credito:active { background: #fbf6ea; }
.credito b { display: block; font: 400 8cqw/1.15 var(--script); letter-spacing: 0; text-transform: none; color: var(--oro); }
.credito em { display: inline-block; margin-top: 1.6cqw; padding: 1.2cqw 3.6cqw; border: 1px solid rgba(185, 138, 46, .6); border-radius: 99px; font: 600 2.7cqw/1 var(--real); font-style: normal; letter-spacing: .14em; color: var(--marino); }

/* ------------------------------------------------------------

   ------------------------------------------------------------ */

#aviso { position: fixed; left: 50%; bottom: 88px; z-index: 103; translate: -50% 0; padding: 10px 18px; border-radius: 99px; background: rgba(15, 26, 61, .94); color: #fbf6ea; font: 600 15px/1.2 var(--serif); letter-spacing: .04em; white-space: nowrap; box-shadow: 0 6px 18px rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(217, 180, 90, .6); opacity: 0; transform: translateY(10px); transition: opacity .3s, transform .3s; pointer-events: none; }
#aviso.ver { opacity: 1; transform: none; }

.pausa { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 30px; text-align: center; background: radial-gradient(ellipse at 50% 40%, #2a3f80, #0f1a3d); color: #fbf6ea; font: 600 20px/1.5 var(--serif); }

/* ------------------------------------------------------------
   DESTELLOS DORADOS CAYENDO
   ------------------------------------------------------------ */
#lluvia { position: fixed; inset: 0; z-index: 90; pointer-events: none; overflow: hidden; }
#lluvia i { position: absolute; top: -6vh; left: var(--x); width: var(--t); aspect-ratio: 1; opacity: .85;
  background: radial-gradient(circle, #fffbe8 0 18%, #f1cf73 36%, transparent 70%);
  clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
  animation: cae var(--d) linear var(--r) infinite; will-change: transform; }
@keyframes cae { 0% { transform: translate3d(0, 0, 0) rotate(0deg); } 50% { transform: translate3d(var(--dx), 56vh, 0) rotate(180deg); } 100% { transform: translate3d(0, 112vh, 0) rotate(360deg); } }
body.esperando #lluvia { display: none; }

/* ------------------------------------------------------------
   BOTÓN DE MÚSICA (flotante)
   ------------------------------------------------------------ */
#musica-boton { position: fixed; right: 18px; bottom: 18px; width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(145deg, #f3d58c, #c4923a); box-shadow: 0 4px 12px rgba(0, 0, 0, .4), 0 0 0 2px #1c2b5e; cursor: pointer; z-index: 102; display: none; justify-content: center; align-items: center; }
#musica-boton.visible { display: flex; animation: aparece .6s ease-out both; }
@keyframes aparece { from { opacity: 0; } to { opacity: 1; } }
#musica-boton:active { transform: scale(.92); }
#musica-boton::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(232, 201, 119, .85); animation: onda-musica 2s ease-out infinite; }
#musica-boton.pausado::before { animation: none; opacity: 0; }
@keyframes onda-musica { from { transform: scale(1); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
#musica-boton svg { width: 24px; height: 24px; fill: #1c2b5e; }
#musica-boton .icono-play { display: none; }
#musica-boton.pausado .icono-play { display: block; }
#musica-boton.pausado .icono-pausa { display: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; } #lluvia { display: none; } }
</style>

      <p class="parrafo" id="confirmacion-texto"></p>
      <a class="boton-oro" id="confirmacion-boton" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.4-.9-2.8-1.2-4.6-4.1-4.7-4.3-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.7-.1 1.3z"/></svg><span></span>
      </a>
    </div>
  </section>

  <!-- ============================================================
       10. DESPEDIDA
       ============================================================ -->
  <section id="despedida">
    <div class="destellos"></div>
    <div class="corona-grande revela" data-corona></div>
    <p class="frase-clara revela" id="despedida-frase"></p>
    <div class="revela" id="te-esperamos"></div>
    <a class="credito" id="credito" target="_blank" rel="noopener"></a>
  </section>

</div>

<div id="lluvia" aria-hidden="true"></div>

<audio id="musica" loop preload="metadata"></audio>
<div id="musica-boton" class="pausado" title="Music" aria-label="Music" role="button">
  <svg class="icono-pausa" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  <svg class="icono-play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
</div>

<script>
/* ============================================================
   FUNCIONAMIENTO (no hace falta tocar nada de aquí abajo)
   ============================================================ */
(function () {
  const $ = (id) => document.getElementById(id);
  // Invitación en pausa: solo se ve un aviso
  if (CONFIG.pausada) {
    document.body.className = '';
    document.body.innerHTML = '<div class="pausa"><b></b><p>This invitation is not available at the moment.</p></div>';
    document.querySelector('.pausa b').textContent = CONFIG.nombre;
    return;
  }
  const $$ = (sel, raiz) => [...(raiz || document).querySelectorAll(sel)];
  const IM = CONFIG.imagenes || {};
  const conNombre = (t) => String(t || '').replace(/\{nombre\}/g, CONFIG.nombre);
  const texto = (id, t) => { const el = $(id); if (el) el.textContent = conNombre(t); };
  const url = (ruta) => 'url("' + ruta + '")';
  const imagen = (ruta, clase, alt) => { const i = new Image(); i.loading = 'lazy'; i.decoding = 'async'; i.src = ruta; i.alt = alt || ''; if (clase) i.className = clase; return i; };
  const coronaCSS = () => { const d = document.createElement('div'); d.className = 'corona-css'; return d; };

  /* ---------- Fecha escrita ---------- */
  const fe = CONFIG.fecha;
  const fechaEvento = new Date(fe.anio, fe.mes - 1, fe.dia, fe.hora, fe.minuto, 0);
  const DIAS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MESES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const dos = (n) => String(n).padStart(2, '0');
  const horaTexto = ((fe.hora % 12) || 12) + ':' + dos(fe.minuto) + (fe.hora < 12 ? ' AM' : ' PM');

  /* ---------- Textos ---------- */
  document.title = 'My First Birthday · Prince ' + CONFIG.nombre;
  texto('arriba', CONFIG.arriba);
  texto('edad-texto', CONFIG.edad.texto);
  const rn = CONFIG.reino;
  texto('reino-titulo', rn.titulo);
  texto('reino-texto', rn.texto);
  texto('reino-firma', rn.firma);
  texto('reino-padres', rn.padres);
  texto('foto-titulo', CONFIG.foto.titulo);
  texto('foto-texto', CONFIG.foto.texto);
  const lu = CONFIG.lugar;
  texto('lugar-titulo', lu.titulo);
  texto('fecha-texto', DIAS[fechaEvento.getDay()] + ', ' + MESES[fe.mes - 1] + ' ' + fe.dia + ', ' + fe.anio);
  texto('hora-texto', horaTexto);
  texto('lugar-nombre', lu.nombre);
  texto('lugar-direccion', lu.direccion);
  $('mapa-boton').href = lu.enlace;
  texto('mapa-boton', lu.boton);
  if (lu.mapa) {
    const f = document.createElement('iframe'); f.className = 'mapa'; f.src = lu.mapa; f.loading = 'lazy'; f.title = 'Map'; f.referrerPolicy = 'no-referrer-when-downgrade';
    $('mapa-caja').appendChild(f);
  }
  const cr = CONFIG.cuentaRegresiva;
  texto('cuenta-titulo', cr.titulo);
  texto('cuenta-subtitulo', cr.subtitulo);
  $$('#contador span').forEach((s, i) => s.textContent = cr.etiquetas[i]);
  const ve = CONFIG.vestimenta;
  if (ve.mostrar === false) $('vestimenta').remove();
  else {
    texto('vestimenta-titulo', ve.titulo);
    texto('vestimenta-estilo', ve.estilo);
    texto('vestimenta-texto', ve.texto);
    (ve.tonos || []).forEach(c => { const i = document.createElement('i'); i.style.setProperty('--c', c); $('tonos').appendChild(i); });
  }
  const rg = CONFIG.regalos;
  texto('regalos-titulo', rg.titulo);
  texto('regalos-nota', rg.nota);
  const ICONOS = { ropa: IM.iconoRopa, calzado: IM.iconoCalzado, juguetes: IM.iconoJuguetes };
  (rg.lista || []).forEach(r => {
    const li = document.createElement('li');
    li.innerHTML = '<span class="ic"></span><span><b></b><small></small></span>';
    const ruta = ICONOS[r.icono];
    const ic = li.querySelector('.ic');
    const punto = () => { ic.innerHTML = '<i class="punto"></i>'; };
    if (ruta) { const im = imagen(ruta, '', r.texto); im.onerror = punto; ic.appendChild(im); } else punto();
    li.querySelector('b').textContent = r.texto;
    if (r.detalle) li.querySelector('small').textContent = r.detalle; else li.querySelector('small').remove();
    $('lista-regalos').appendChild(li);
  });
  const co = CONFIG.confirmacion;
  texto('confirmacion-titulo', co.titulo);
  texto('confirmacion-texto', co.texto);
  $('confirmacion-boton').href = co.whatsapp ? 'https://wa.me/' + co.whatsapp + '?text=' + encodeURIComponent(conNombre(co.mensaje)) : '#';
  $('confirmacion-boton').querySelector('span').textContent = co.boton;
  texto('despedida-frase', CONFIG.despedida.frase);
  const cd = CONFIG.credito || {};
  if (cd.marca) {
    $('credito').href = cd.enlace || '#';
    $('credito').innerHTML = '<span></span><b></b><em></em>';
    $('credito').children[0].textContent = cd.texto; $('credito').children[1].textContent = cd.marca; $('credito').children[2].textContent = cd.boton + ' ›';
  } else $('credito').remove();

  /* ---------- Nombre y número (imagen dorada de IA o letras doradas) ---------- */
  $$('[data-nombre]').forEach(caja => {
    const conTexto = () => { caja.innerHTML = '<span class="script-oro"></span>'; caja.firstChild.textContent = CONFIG.nombre; };
    if (IM.nombreOro) { const img = imagen(IM.nombreOro, '', CONFIG.nombre); img.onerror = conTexto; caja.appendChild(img); }
    else conTexto();
    [[8, 20, 0], [62, 2, .9], [92, 58, 1.7], [30, 84, 2.3]].forEach(([x, y, r]) => {
      const e = document.createElement('i'); e.className = 'estrella';
      e.style.cssText = 'left:' + x + '%;top:' + y + '%;--t:14px;--d:2.6s;--r:' + (2 + r) + 's';
      caja.appendChild(e);
    });
  });
  const numCaja = $('numero');
  const numTexto = () => { numCaja.innerHTML = '<span class="numero-css"></span>'; numCaja.firstChild.textContent = CONFIG.edad.numero; };
  if (IM.numeroOro) { const img = imagen(IM.numeroOro, '', CONFIG.edad.numero); img.onerror = numTexto; numCaja.appendChild(img); }
  else numTexto();

  /* ---------- Coronas (imagen dorada de IA o corona dibujada) ---------- */
  $$('[data-corona]').concat($('corona-pie') && !IM.portada ? [$('corona-pie')] : []).forEach(caja => {
    if (IM.corona) { const img = imagen(IM.corona, '', ''); img.onerror = () => { img.replaceWith(coronaCSS()); }; caja.appendChild(img); }
    else caja.appendChild(coronaCSS());
  });
  if (IM.portada) $('corona-pie').remove();   // la portada de Gemini ya trae su corona

  /* ---------- "Te Esperamos" (imagen dorada o letras) ---------- */
  const teCaja = $('te-esperamos');
  const teTexto = () => { teCaja.innerHTML = '<p class="te-esperamos-texto"></p>'; teCaja.firstChild.textContent = CONFIG.despedida.cierre; };
  if (IM.teEsperamos) { const img = imagen(IM.teEsperamos, 'te-esperamos', CONFIG.despedida.cierre); img.onerror = teTexto; teCaja.appendChild(img); }
  else teTexto();

  /* ---------- Imágenes de IA: si no están, se quitan ---------- */
  $$('img[data-img]').forEach(img => {
    const ruta = IM[img.dataset.img];
    if (ruta) { img.src = ruta; img.onerror = () => img.remove(); } else img.remove();
  });
  if (IM.fondoSalon) { $('fondo-fijo').classList.add('con-imagen'); $('fondo-fijo').style.setProperty('--img', url(IM.fondoSalon)); }
  if (IM.fondoBalcon) $('fondo-balcon').style.setProperty('--img', url(IM.fondoBalcon));

  // Marco de pergamino: el texto va justo dentro del pergamino
  const marco = $('marco'), vm = IM.ventanaMarco || {};
  const marcoSinImagen = () => {
    marco.classList.add('sin-marco');
    marco.querySelector('.marco-texto').removeAttribute('style');
    if (!marco.querySelector('.corona-top')) { const c = document.createElement('div'); c.className = 'corona-top'; c.appendChild(IM.corona ? imagen(IM.corona) : coronaCSS()); marco.prepend(c); }
  };
  if (IM.marcoReal && vm.w) {
    const t = marco.querySelector('.marco-texto');
    t.style.left = vm.x + '%'; t.style.top = vm.y + '%'; t.style.width = vm.w + '%'; t.style.height = vm.h + '%';
    const mi = marco.querySelector('.marco-img'); if (mi) mi.addEventListener('error', marcoSinImagen);
  } else marcoSinImagen();

  // Foto del príncipe dentro del marco redondo
  const mf = $('marco-foto'), circulo = $('foto-circulo'), hf = IM.huecoFoto || {};
  if (CONFIG.foto.imagen) { const f = imagen(CONFIG.foto.imagen, '', CONFIG.nombre); f.onerror = () => f.replaceWith(coronaCSS()); circulo.appendChild(f); }
  else circulo.appendChild(coronaCSS());
  const fotoSinMarco = () => {
    mf.classList.add('sin-marco'); circulo.removeAttribute('style');
    if (!mf.querySelector('.corona-top')) { const c = document.createElement('div'); c.className = 'corona-top'; c.appendChild(IM.corona ? imagen(IM.corona) : coronaCSS()); mf.appendChild(c); }
  };
  if (IM.marcoFoto && hf.d) {
    circulo.style.left = hf.x + '%'; circulo.style.top = hf.y + '%'; circulo.style.width = hf.d + '%';
    const mfi = mf.querySelector('.marco-foto-img'); if (mfi) mfi.addEventListener('error', fotoSinMarco);
  } else fotoSinMarco();

  // Galería deslizable
  const gal = CONFIG.galeria || [];
  if (gal.length) {
    gal.forEach(r => $('galeria').appendChild(imagen(r, '', CONFIG.nombre)));
    if (gal.length > 1) { const d = document.createElement('p'); d.className = 'desliza'; d.textContent = 'Swipe ›'; $('galeria').after(d); }
  } else $('galeria').remove();

  /* ---------- Destellos ---------- */
  $$('.destellos').forEach(capa => {
    for (let i = 0; i < 8; i++) {
      const d = document.createElement('i');
      d.style.cssText = 'left:' + (Math.random() * 94) + '%;top:' + (4 + Math.random() * 90) + '%;--t:' + (7 + Math.random() * 11).toFixed(0) + 'px;--d:' + (2.4 + Math.random() * 3).toFixed(1) + 's;--r:' + (Math.random() * 4).toFixed(1) + 's';
      capa.appendChild(d);
    }
  });

  /* ---------- Destellos dorados cayendo ---------- */
  if (CONFIG.destellosCayendo) {
    const capa = $('lluvia');
    for (let i = 0; i < 9; i++) {
      const p = document.createElement('i');
      p.style.cssText = '--x:' + (Math.random() * 100).toFixed(1) + '%;--t:' + (8 + Math.random() * 8).toFixed(0) + 'px;--d:' + (11 + Math.random() * 8).toFixed(1) + 's;--r:' + (-Math.random() * 16).toFixed(1) + 's;--dx:' + ((Math.random() - .5) * 110).toFixed(0) + 'px';
      capa.appendChild(p);
    }
  }

  /* ---------- Animaciones al aparecer en pantalla ---------- */
  const observador = new IntersectionObserver((entradas) => {
    entradas.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observador.unobserve(e.target); } });
  }, { threshold: .15 });
  function observar() { $$('.revela').forEach(el => observador.observe(el)); }

  /* ---------- Cuenta regresiva ---------- */
  let reloj;
  function actualizarCuenta() {
    const resta = fechaEvento - new Date();
    if (resta <= 0) { $('contador').innerHTML = '<div class="terminado"></div>'; $('contador').firstChild.textContent = cr.terminado; clearInterval(reloj); return; }
    $('dias').textContent = String(Math.floor(resta / 86400000));
    $('horas').textContent = dos(Math.floor(resta % 86400000 / 3600000));
    $('minutos').textContent = dos(Math.floor(resta % 3600000 / 60000));
    $('segundos').textContent = dos(Math.floor(resta % 60000 / 1000));
  }
  reloj = setInterval(actualizarCuenta, 1000); actualizarCuenta();

  /* ---------- Aviso flotante (modo muestra o WhatsApp sin número) ---------- */
  const MU = CONFIG.muestra || {};
  const aviso = document.createElement('div'); aviso.id = 'aviso'; aviso.textContent = MU.aviso || ''; document.body.appendChild(aviso);
  let tAviso;
  const mostrarAviso = (e) => { e.preventDefault(); aviso.classList.add('ver'); clearTimeout(tAviso); tAviso = setTimeout(() => aviso.classList.remove('ver'), 2200); };
  if (!co.whatsapp) $('confirmacion-boton').addEventListener('click', mostrarAviso);

  /* ---------- Vista previa para el cliente: marca de agua y protección ---------- */
  if (MU.activa) {
    document.body.classList.add('muestra');
    const t = (MU.texto || 'MUESTRA').replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const tinta = { negro: ["rgba(15,8,8,.45)", "rgba(255,255,255,.3)"], blanco: ["rgba(255,255,255,.5)", "rgba(0,0,0,.2)"] }[MU.color] || ["rgba(214,170,80,.5)", "rgba(15,26,61,.35)"];
    const fila = (x, y) => "<text x='" + x + "' y='" + y + "' text-anchor='middle' font-family='Georgia,serif' font-size='14' font-weight='700' letter-spacing='2.5' fill='" + tinta[0] + "' stroke='" + tinta[1] + "' stroke-width='.5'>" + t + "</text>";
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='260' height='200'><g transform='rotate(-28 130 100)'>" + fila(130, 70) + fila(0, 160) + fila(260, 160) + "</g></svg>";
    const capa = document.createElement('div'); capa.id = 'marca-agua'; capa.setAttribute('aria-hidden', 'true');
    capa.style.setProperty('--marca', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
    document.body.appendChild(capa);
    // sin menú de clic derecho, sin arrastrar ni seleccionar, sin atajos de guardar/copiar/imprimir/ver código
    ['contextmenu', 'dragstart', 'selectstart', 'copy', 'cut'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
    document.addEventListener('keydown', e => {
      const k = (e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey;
      if (e.key === 'F12' || (mod && ['s', 'u', 'p', 'c', 'a'].includes(k)) || (mod && e.shiftKey && ['i', 'j', 'c'].includes(k))) e.preventDefault();
    });
    // mapa y WhatsApp: avisan que se activan en la versión final
    ['mapa-boton', 'confirmacion-boton'].forEach(id => $(id).addEventListener('click', mostrarAviso));
  }

  /* ---------- Música ---------- */
  const sobre = $('sobre'), musica = $('musica'), musicaBoton = $('musica-boton');
  if (CONFIG.musica) musica.src = CONFIG.musica;
  function reproducirMusica() {
    if (!CONFIG.musica) return;
    const intento = musica.play();
    if (intento && intento.then) intento.then(() => musicaBoton.classList.remove('pausado')).catch(() => musicaBoton.classList.add('pausado'));
  }
  document.addEventListener('touchend', () => { if (termino && musica.paused && !musica.dataset.pausadoPorUsuario) reproducirMusica(); }, { passive: true });
  musicaBoton.addEventListener('click', (e) => {
    e.stopPropagation();
    if (musica.paused) { delete musica.dataset.pausadoPorUsuario; reproducirMusica(); }
    else { musica.pause(); musica.dataset.pausadoPorUsuario = '1'; musicaBoton.classList.add('pausado'); }
  });

  /* ---------- Sobre: tocar → se abre → portada ---------- */
  let empezo = false, termino = false, video = null;
  function terminarSobre() {
    if (termino) return; termino = true;
    soltar();
    document.body.classList.remove('bloqueado');
    $('portada').classList.add('visible');
    sobre.classList.add('sale');
    setTimeout(() => sobre.remove(), 1000);
    observar();
    if (CONFIG.musica) {
      musicaBoton.classList.add('visible');
      if (musica.paused && !musica.dataset.pausadoPorUsuario) reproducirMusica();
    }
  }
  const SB = CONFIG.sobre;
  const conVideo = !!(SB.imagen && SB.video);
  sobre.innerHTML = '<div class="sobre-fondo"></div><div class="sobre-caja"><video playsinline webkit-playsinline preload="auto" muted></video><div class="sello"></div><div class="destello-oro"></div></div><div class="toca"></div>';
  const caja = sobre.querySelector('.sobre-caja');
  let sx = SB.selloX, sy = SB.selloY;
  if (!SB.imagen) {
    // Sobre dibujado con código (mientras no hay imagen de Gemini)
    caja.querySelector('video').remove(); video = null;
    const s = document.createElement('div'); s.className = 'sobre-css';
    s.innerHTML = '<p class="titulo-sobre"><span></span><b></b></p><div class="carta"><div class="lazo"></div><div class="sello-css"></div></div>';
    s.querySelector('.titulo-sobre span').textContent = 'Prince'; s.querySelector('.titulo-sobre b').textContent = CONFIG.nombre;
    s.querySelector('.sello-css').appendChild(coronaCSS());
    caja.prepend(s);
    sobre.querySelector('.sobre-fondo').style.background = 'radial-gradient(ellipse at 50% 30%, #2b3f80, #0f1a3d)';
    sx = 50; sy = 54.4;
  } else {
    sobre.querySelector('.sobre-fondo').style.backgroundImage = url(SB.imagen);
    video = caja.querySelector('video');
    video.poster = SB.imagen; video.style.backgroundImage = url(SB.imagen);
  }
  if (!conVideo) sobre.classList.add('sin-video');
  sobre.style.setProperty('--sx', sx + '%'); sobre.style.setProperty('--sy', sy + '%');
  sobre.querySelector('.toca').textContent = SB.textoAbrir;
  const sello = sobre.querySelector('.sello'); sello.style.left = sx + '%'; sello.style.top = sy + '%';
  // El video empieza a bajar cuando ya se ve la portada del sobre (así la portada sale primero)
  const cargarVideo = () => { if (conVideo && video && !video.getAttribute('src')) video.src = SB.video; };
  if (video) {
    video.addEventListener('timeupdate', () => { if (video.duration && video.currentTime >= video.duration - .45) terminarSobre(); });
    video.addEventListener('ended', terminarSobre);
    video.addEventListener('error', () => { if (empezo) terminarSobre(); });
  }

  function abrirSobre() {
    if (empezo) return; empezo = true;
    soltar();
    sobre.classList.add('abierto');
    if (conVideo) {
      cargarVideo();
      if (CONFIG.musica) { reproducirMusica(); video.muted = true; } else video.muted = false;
      video.play().catch(() => { video.muted = true; video.play().catch(terminarSobre); });
      setTimeout(() => { if (video.currentTime < .1) terminarSobre(); }, 6000);
    } else {
      reproducirMusica();
      setTimeout(terminarSobre, 1700);      // se acerca al sello con luz dorada y se pasa a la portada
    }
  }
  sobre.addEventListener('click', abrirSobre);

  /* ---------- Velocidad: primero la portada del sobre y su video; el resto empieza a bajar después ---------- */
  function soltar() { document.body.classList.remove('esperando'); }
  if (SB.imagen) { const pre = new Image(); pre.onload = pre.onerror = () => { cargarVideo(); setTimeout(soltar, 1200); }; pre.src = SB.imagen; }
  else setTimeout(soltar, 1200);
  setTimeout(() => { cargarVideo(); soltar(); }, 5000);   // por si acaso

  // Para revisar sin ver el sobre: abre la página con ?directo al final de la dirección
  if (location.search.includes('directo')) { empezo = true; soltar(); terminarSobre(); }
})();
</script>
</body>
</html>
