    <div class="contador aparece-lento" id="contador">
      <div class="bloque"><div class="numero" id="dias">00</div><div class="etiqueta" id="etq-dias"></div></div>
      <div class="sep">:</div>
      <div class="bloque"><div class="numero" id="horas">00</div><div class="etiqueta" id="etq-horas"></div></div>
      <div class="sep">:</div>
      <div class="bloque"><div class="numero" id="minutos">00</div><div class="etiqueta" id="etq-minutos"></div></div>
      <div class="sep">:</div>
      <div class="bloque"><div class="numero" id="segundos">00</div><div class="etiqueta" id="etq-segundos"></div></div>
    </div>
    <img class="rasgado abajo" src="recursos/papel-rasgado.svg" alt="">

  <!-- ============================================================
       5. CRONOGRAMA
       ============================================================ -->
  <section id="cronograma">
    <h2 class="titulo" id="cronograma-titulo"></h2>
    <div class="linea-tiempo"></div>
    <img class="flor" id="cronograma-flor" src="recursos/cronograma-flor.png" alt="">
    <div id="cronograma-eventos"></div>
  </section>

  <!-- ============================================================
       6. LUGAR (panel crema)

  <section id="lugar" class="panel">
    <img class="rasgado arriba" src="recursos/papel-rasgado.svg" alt="">
    <h2 class="titulo" id="lugar-titulo"></h2>
    <a id="lugar-enlace"><img class="ilustracion" id="lugar-ilustracion" src="" alt="Lugar de la boda"></a>
    <div class="datos aparece">
      <div class="nombre" id="lugar-nombre"></div>
      <div class="direccion" id="lugar-direccion"></div>
    </div>
    <img class="rasgado abajo" src="recursos/papel-rasgado.svg" alt="">
  </section>

  <!-- ============================================================
       7. VESTIMENTA
       ============================================================ -->
  <section id="vestimenta">
    <h2 class="titulo" id="vestimenta-titulo"></h2>
    <p class="texto aparece" id="vestimenta-texto"></p>
    <div class="circulos" id="circulos"></div>
    <img class="marco marco-1" id="vestimenta-foto-1" src="" alt="">
    <div class="caballeros aparece-izq" id="vestimenta-caballeros"></div>

    <div class="damas aparece-der" id="vestimenta-damas"></div>

  <!-- ============================================================
       8. DETALLES (panel crema)
       ============================================================ -->
  <section id="detalles" class="panel">
    <img class="rasgado arriba" src="recursos/papel-rasgado.svg" alt="">
    <h2 class="titulo" id="detalles-titulo"></h2>
    <p class="texto-detalles aparece" id="detalles-texto"></p>
    <div class="contacto-nombre aparece" id="detalles-nombre"></div>
    <div class="contacto-telefono aparece" id="detalles-telefono"></div>
    <p class="regalos aparece" id="detalles-regalos"></p>
    <div class="franja"></div>
    <!-- Peonías del pie (posición: izquierda / arriba / ancho, dentro de una caja de 620px centrada) -->
    <div class="flores">
    <img class="flor crece" src="recursos/detalles-flor-12.png" style="left:3px;top:432px;width:203px" alt="">
    <img class="flor crece" src="recursos/detalles-flor-11.png" style="left:134px;top:466px;width:83px" alt="">
    <img class="flor crece" src="recursos/detalles-flor-10.png" style="left:134px;top:499px;width:118px" alt="">
    <img class="flor crece" src="recursos/detalles-flor-8.png"  style="left:213px;top:470px;width:83px" alt="">
    <img class="flor crece" src="recursos/detalles-flor-9.png"  style="left:205px;top:517px;width:118px" alt="">
    <img class="flor crece" src="recursos/detalles-flor-6.png"  style="left:262px;top:490px;width:129px" alt="">
    <img class="flor crece" src="recursos/detalles-flor-4.png"  style="left:324px;top:469px;width:164px" alt="">
    <img class="flor crece" src="recursos/detalles-flor-5.png"  style="left:339px;top:471px;width:42px" alt="">
    <img class="flor crece" src="recursos/detalles-flor-7.png"  style="left:334px;top:574px;width:50px" alt="">
    <img class="flor crece" src="recursos/detalles-flor-3.png"  style="left:403px;top:524px;width:130px" alt="">
    <img class="flor crece" src="recursos/detalles-flor-2.png"  style="left:430px;top:448px;width:55px" alt="">
    <img class="flor crece" src="recursos/detalles-flor-1.png"  style="left:430px;top:430px;width:181px" alt="">
    </div>
  </section>

  <!-- ============================================================
       9. CONFIRMACIÓN
       ============================================================ -->
  <section id="confirmacion">
    <h2 class="titulo" id="confirmacion-titulo"></h2>
    <p class="texto aparece" id="confirmacion-texto"></p>
    <button class="boton" id="abrir-formulario"></button>
  </section>

  <!-- ============================================================
       10. DESPEDIDA
       ============================================================ -->
  <section id="despedida">
    <h2 class="titulo" id="despedida-titulo"></h2>
    <div class="nombres aparece" id="despedida-nombres"></div>
    <div class="foto-caja">
      <img class="foto" id="despedida-foto" src="" alt="">
      <img class="marco" src="recursos/despedida-marco.png" alt="">
    </div>
  </section>

</div><!-- /.invitacion -->
</div><!-- /.pagina -->

<!-- Ventana emergente del formulario -->
<div id="ventana">
  <div class="contenido">
    <button class="cerrar" id="cerrar-formulario" aria-label="Cerrar">✕</button>
    <img class="foto" id="formulario-foto" src="" alt="">
    <div class="cuerpo">
      <h3 id="formulario-titulo"></h3>
      <p class="sub" id="formulario-subtitulo"></p>
      <form id="formulario">
        <label for="campo-nombre" id="etiqueta-nombre"></label>
        <input type="text" id="campo-nombre" required>
        <div class="grupo-titulo" id="etiqueta-asistencia"></div>
        <div id="opciones-asistencia"></div>
        <label for="campo-alergias" id="etiqueta-alergias"></label>
        <input type="text" id="campo-alergias">
        <button type="submit" class="enviar" id="boton-enviar"></button>
      </form>
      <div class="gracias" id="gracias"></div>
    </div>
  </div>
</div>

<!-- Música -->
<audio id="musica" loop></audio>
<div id="musica-boton" class="pausado">
  <svg class="pausa" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  <svg class="play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
</div>

<script>
/* ============================================================
   FUNCIONAMIENTO (no hace falta tocar nada de aquí abajo)
   ============================================================ */
(function () {
  const $ = (id) => document.getElementById(id);

  /* ---------- Rellenar textos desde CONFIG ---------- */
  $('sello').src = CONFIG.sobre.sello;
  $('sobre-texto').textContent = CONFIG.sobre.textoAbrir;

  $('video-portada').src = CONFIG.portada.video;
  $('video-portada').poster = CONFIG.portada.foto;
  $('portada-foto').src = CONFIG.portada.foto;
  $('portada-subtitulo').textContent = CONFIG.portada.subtitulo;
  $('portada-fecha').textContent = CONFIG.fechaTexto;
  $('portada-novio').textContent = CONFIG.novio;
  $('portada-novia').textContent = CONFIG.novia;

  $('mensaje-titulo').textContent = CONFIG.mensaje.titulo;
  $('mensaje-texto').innerHTML = CONFIG.mensaje.texto;

  $('cuenta-titulo').textContent = CONFIG.cuentaRegresiva.titulo;
  ['dias', 'horas', 'minutos', 'segundos'].forEach((k, i) => { $('etq-' + k).textContent = CONFIG.cuentaRegresiva.etiquetas[i]; });

  $('cronograma-titulo').textContent = CONFIG.cronograma.titulo;
  // Eventos: cada 82 px sobre la línea, hora a la izquierda y nombre a la derecha
  const cont = $('cronograma-eventos');
  CONFIG.cronograma.eventos.forEach((ev, i) => {
    const top = 116 + i * 82;
    const rombo = document.createElement('div'); rombo.className = 'rombo'; rombo.style.top = top + 'px';
    const hora = document.createElement('div'); hora.className = 'evento-hora'; hora.style.top = (top - 20) + 'px'; hora.textContent = ev.hora;
    const nombre = document.createElement('div'); nombre.className = 'evento-nombre'; nombre.style.top = (top - 6) + 'px'; nombre.textContent = ev.nombre;
    cont.append(rombo, hora, nombre);
  });

  $('lugar-titulo').textContent = CONFIG.lugar.titulo;
  $('lugar-ilustracion').src = CONFIG.lugar.ilustracion;
  $('lugar-nombre').textContent = CONFIG.lugar.nombre;
  $('lugar-direccion').textContent = CONFIG.lugar.direccion;
  if (CONFIG.lugar.mapa) { $('lugar-enlace').href = CONFIG.lugar.mapa; $('lugar-enlace').target = '_blank'; }

  $('vestimenta-titulo').textContent = CONFIG.vestimenta.titulo;
  $('vestimenta-texto').textContent = CONFIG.vestimenta.texto;
  CONFIG.vestimenta.colores.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'circulo aparece'; d.style.transitionDelay = (i * .1) + 's';
    d.innerHTML = '<span style="background:' + c + '"></span>';
    $('circulos').appendChild(d);
  });
  $('vestimenta-foto-1').src = CONFIG.vestimenta.foto1;
  $('vestimenta-foto-2').src = CONFIG.vestimenta.foto2;
  $('vestimenta-caballeros').innerHTML = CONFIG.vestimenta.caballeros;
  $('vestimenta-damas').innerHTML = CONFIG.vestimenta.damas;

  $('detalles-titulo').textContent = CONFIG.detalles.titulo;
  $('detalles-texto').textContent = CONFIG.detalles.texto;
  $('detalles-nombre').textContent = CONFIG.detalles.contactoNombre;
  $('detalles-telefono').textContent = CONFIG.detalles.contactoTelefono;
  $('detalles-regalos').textContent = CONFIG.detalles.regalos;

  $('confirmacion-titulo').textContent = CONFIG.confirmacion.titulo;
  $('confirmacion-texto').textContent = CONFIG.confirmacion.texto;
  $('abrir-formulario').textContent = CONFIG.confirmacion.boton;
  const f = CONFIG.confirmacion.formulario;
  $('formulario-foto').src = CONFIG.despedida.foto;
  $('formulario-titulo').textContent = f.titulo;
  $('formulario-subtitulo').textContent = f.subtitulo;
  $('etiqueta-nombre').textContent = f.campoNombre;
  $('etiqueta-asistencia').textContent = f.campoAsistencia;
  f.opciones.forEach((op, i) => {
    const l = document.createElement('label'); l.className = 'opcion';
    l.innerHTML = '<input type="radio" name="asistencia" value="' + op + '"' + (i === 0 ? ' required' : '') + '><span>' + op + '</span>';
    $('opciones-asistencia').appendChild(l);
  });
  $('etiqueta-alergias').textContent = f.campoAlergias;
  $('boton-enviar').textContent = f.botonEnviar;
  $('gracias').textContent = f.gracias;

  $('despedida-titulo').textContent = CONFIG.despedida.titulo;
  $('despedida-nombres').textContent = CONFIG.noviosTexto;
  $('despedida-foto').src = CONFIG.despedida.foto;

  $('musica').src = CONFIG.musica;

  /* ---------- Sobre: abrir con un toque ---------- */
  const sobre = $('sobre'), video = $('video-portada'), musica = $('musica'), musicaBoton = $('musica-boton');
  let abierto = false;
  sobre.addEventListener('click', () => {
    if (abierto) return; abierto = true;
    sobre.classList.add('abriendo');                                  // el sello se agranda y desaparece
    setTimeout(() => sobre.classList.add('solapas'), 1500);            // las solapas se abren
    setTimeout(() => {                                                 // el sobre desaparece
      sobre.classList.add('abierto');
      document.body.classList.remove('bloqueado');
      video.play().catch(() => {});
      musica.play().then(() => musicaBoton.classList.remove('pausado')).catch(() => {});
      musicaBoton.classList.add('visible');
      setTimeout(() => sobre.remove(), 800);
      setTimeout(() => document.querySelectorAll('#portada .aparece-tarde, #portada .flor').forEach(e => e.classList.add('visible')), 1200);
    }, 3300);
  });

  /* ---------- Música: pausar / reanudar ---------- */
  musicaBoton.addEventListener('click', () => {
    if (musica.paused) { musica.play(); musicaBoton.classList.remove('pausado'); }
    else { musica.pause(); musicaBoton.classList.add('pausado'); }
  });

  /* ---------- Animaciones al entrar en pantalla ---------- */
  const observador = new IntersectionObserver((entradas) => {
    entradas.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observador.unobserve(e.target); } });
  }, { threshold: .15 });
  document.querySelectorAll('.aparece, .aparece-izq, .aparece-der, .aparece-lento, .crece, #vestimenta').forEach(el => observador.observe(el));

  /* ---------- Cuenta regresiva ---------- */
  const fe = CONFIG.fecha;
  const fechaEvento = new Date(fe.anio, fe.mes - 1, fe.dia, fe.hora, fe.minuto, 0);
  function actualizarCuenta() {
    const resta = fechaEvento - new Date();
    if (resta <= 0) { $('contador').innerHTML = '<div class="terminado">' + CONFIG.cuentaRegresiva.terminado + '</div>'; clearInterval(reloj); return; }
    const p = (n) => String(n).padStart(2, '0');
    $('dias').textContent = p(Math.floor(resta / 86400000));
    $('horas').textContent = p(Math.floor(resta % 86400000 / 3600000));
    $('minutos').textContent = p(Math.floor(resta % 3600000 / 60000));
    $('segundos').textContent = p(Math.floor(resta % 60000 / 1000));
  }
  const reloj = setInterval(actualizarCuenta, 1000); actualizarCuenta();

  /* ---------- Cronograma: la peonía baja por la línea con el scroll ---------- */
  const cronograma = $('cronograma'), flor = $('cronograma-flor');
  function moverFlor() {
    const r = cronograma.getBoundingClientRect();
    let p = (window.innerHeight * .75 - r.top - 115) / 258;   // 0 = flor arriba, 1 = flor abajo
    p = Math.max(0, Math.min(1, p));
    flor.style.transform = 'translateY(' + (p * 247) + 'px)';
  }
  window.addEventListener('scroll', moverFlor, { passive: true });
  window.addEventListener('resize', moverFlor);
  moverFlor();

  /* ---------- Formulario (solo visual por ahora) ---------- */
  const ventana = $('ventana');
  $('abrir-formulario').addEventListener('click', () => ventana.classList.add('abierta'));
  $('cerrar-formulario').addEventListener('click', () => ventana.classList.remove('abierta'));
  ventana.addEventListener('click', (e) => { if (e.target === ventana) ventana.classList.remove('abierta'); });
  $('formulario').addEventListener('submit', (e) => {
    e.preventDefault();
    $('formulario').style.display = 'none';
    $('gracias').style.display = 'block';
  });
})();
</script>
</body>
</html>
