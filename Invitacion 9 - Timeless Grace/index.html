<script>
/* ============================================================
   FUNCIONAMIENTO (no hace falta tocar nada de aquí abajo)
   ============================================================ */
(function () {
  const $ = (id) => document.getElementById(id);

  /* ---------- Rellenar textos desde CONFIG ---------- */
  $('sobre-imagen').src = CONFIG.sobre.imagen;
  $('sobre-texto').textContent = CONFIG.sobre.textoAbrir;
  $('sobre-video').src = CONFIG.sobre.video;

  $('video-portada').src = CONFIG.portada.video;
  $('video-portada').poster = CONFIG.portada.foto;
  $('portada-arriba').textContent = CONFIG.portada.lineaArriba;
  $('portada-ceremonia').textContent = CONFIG.portada.lineaTitulo;
  $('portada-de').textContent = CONFIG.portada.lineaDe;
  $('portada-nombres').textContent = CONFIG.noviosTexto;
  $('portada-desliza').textContent = CONFIG.portada.desliza;

  const fc = CONFIG.fechaTarjetas;
  $('fecha-dia').textContent = fc.dia; $('fecha-mes').textContent = fc.mes; $('fecha-anio').textContent = fc.anio;
  $('fecha-etiqueta-dia').textContent = fc.etiquetas[0]; $('fecha-etiqueta-mes').textContent = fc.etiquetas[1]; $('fecha-etiqueta-anio').textContent = fc.etiquetas[2];

  const t = CONFIG.tarjeta;
  if (t.adorno) $('tarjeta-adorno').src = t.adorno; else $('tarjeta-adorno').remove();
  $('tarjeta-invitacion').textContent = t.invitacion;
  $('tarjeta-novio').textContent = CONFIG.novio;
  $('tarjeta-hijo-de').textContent = t.hijoDe;
  $('tarjeta-padres-novio').textContent = t.padresNovio;
  $('tarjeta-con').textContent = t.con;
  $('tarjeta-novia').textContent = CONFIG.novia;
  $('tarjeta-hija-de').textContent = t.hijaDe;
  $('tarjeta-padres-novia').textContent = t.padresNovia;
  $('tarjeta-saludo').textContent = t.saludo;
  $('tarjeta-texto').textContent = t.texto;

  if (CONFIG.cita.adorno) $('cita-adorno').src = CONFIG.cita.adorno; else $('cita-adorno').remove();
  $('cita-texto').textContent = CONFIG.cita.texto;
  $('cita-fuente').textContent = CONFIG.cita.fuente;

  $('cronograma-titulo').textContent = CONFIG.cronograma.titulo;
  // Posiciones de los 5 eventos (icono, hora y nombre), alternando lado izquierdo y derecho
  const posiciones = [
    { icono: [35, 195, 150],  hora: [276, 214], nombre: [252, 270] },
    { icono: [251, 352, 156], hora: [57, 391],  nombre: [33, 447] },
    { icono: [35, 534, 150],  hora: [276, 564], nombre: [252, 620] },
    { icono: [251, 686, 155], hora: [57, 731],  nombre: [33, 787] },
    { icono: [32, 859, 155],  hora: [252, 900], nombre: [252, 956] }
  ];
  const cont = $('cronograma-eventos');
  CONFIG.cronograma.eventos.slice(0, 5).forEach((ev, i) => {
    const p = posiciones[i];
    const grupo = document.createElement('div'); grupo.className = 'grupo aparece'; grupo.style.transitionDelay = (i * .15) + 's';
    const icono = document.createElement('img'); icono.className = 'pos icono'; icono.src = ev.icono; icono.style.cssText = '--x:' + p.icono[0] + 'px;top:' + p.icono[1] + 'px;width:' + p.icono[2] + 'px';
    const hora = document.createElement('div'); hora.className = 'pos hora'; hora.textContent = ev.hora; hora.style.cssText = '--x:' + p.hora[0] + 'px;top:' + p.hora[1] + 'px' + (i === 4 ? ';width:154px' : '');
    const nombre = document.createElement('div'); nombre.className = 'pos nombre'; nombre.textContent = ev.nombre; nombre.style.cssText = '--x:' + p.nombre[0] + 'px;top:' + p.nombre[1] + 'px';
    grupo.append(icono, hora, nombre); cont.appendChild(grupo);
  });

  $('cuenta-titulo').textContent = CONFIG.cuentaRegresiva.titulo;
  ['dias', 'horas', 'minutos', 'segundos'].forEach((k, i) => { $('etq-' + k).textContent = CONFIG.cuentaRegresiva.etiquetas[i]; });

  $('lugar-titulo').textContent = CONFIG.lugar.titulo;
  $('lugar-ciudad').textContent = CONFIG.lugar.ciudad;
  $('lugar-nombre').textContent = CONFIG.lugar.nombre;
  $('lugar-foto').src = CONFIG.lugar.foto;
  $('mapa-iframe').src = CONFIG.lugar.mapa;

  const v = CONFIG.vestimenta;
  $('vestimenta-titulo').textContent = v.titulo;
  $('vestimenta-ilustracion').src = v.ilustracion;
  $('vestimenta-texto-1').textContent = v.texto1;
  $('vestimenta-destacado').textContent = v.destacado;
  $('vestimenta-texto-2').textContent = v.texto2;
  $('vestimenta-tonos-titulo').textContent = v.tonosTitulo;
  v.tonos.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'tono sube'; d.style.transitionDelay = (i * .1) + 's';
    d.innerHTML = '<span style="background:' + c + '"></span>';
    $('vestimenta-tonos').appendChild(d);
  });
  $('vestimenta-aviso').textContent = v.aviso;

  const r = CONFIG.regalos;
  $('regalos-titulo').textContent = r.titulo;
  $('regalos-texto-1').textContent = r.texto1;
  $('regalos-texto-2').textContent = r.texto2;
  $('regalos-enlace').textContent = r.enlaceTexto;
  if (r.enlace) { $('regalos-enlace').href = r.enlace; $('regalos-enlace').target = '_blank'; }

  $('confirmacion-titulo').textContent = CONFIG.confirmacion.titulo;
  $('confirmacion-texto').textContent = CONFIG.confirmacion.texto;
  $('abrir-formulario').textContent = CONFIG.confirmacion.boton;
  const f = CONFIG.confirmacion.formulario;
  $('formulario-titulo').textContent = f.titulo;
  $('formulario-subtitulo').textContent = f.subtitulo;
  $('etiqueta-nombre').textContent = f.campoNombre;
  $('etiqueta-asistencia').textContent = f.campoAsistencia;
  f.opciones.forEach((op) => {
    const l = document.createElement('label'); l.className = 'opcion';
    l.innerHTML = '<input type="checkbox" name="asistencia" value="' + op + '"><span>' + op + '</span>';
    $('opciones-asistencia').appendChild(l);
  });
  $('etiqueta-invitados').textContent = f.campoInvitados;
  $('boton-enviar').textContent = f.botonEnviar;
  $('gracias').textContent = f.gracias;

  $('despedida-titulo').textContent = CONFIG.despedida.titulo;

  $('musica').src = CONFIG.musica;

  /* ---------- Sobre: tocar, video de apertura, música ---------- */
  const sobre = $('sobre'), sobreCaja = $('sobre-video-caja'), sobreVideo = $('sobre-video');
  const videoPortada = $('video-portada'), musica = $('musica'), musicaBoton = $('musica-boton');
  let abierto = false, introLista = false;
  function abrirSobre() {
    if (abierto) return; abierto = true;
    sobre.classList.add('abierto');
    setTimeout(() => sobre.remove(), 1400);
    musica.play().then(() => musicaBoton.classList.remove('pausado')).catch(() => {});
    musicaBoton.classList.add('visible');
    const reproducir = () => { sobreCaja.classList.add('entra'); sobreVideo.play().catch(() => terminarIntro()); };
    if (sobreVideo.readyState >= 2) reproducir(); else { sobreVideo.addEventListener('loadeddata', reproducir, { once: true }); sobreVideo.load(); setTimeout(() => { if (!introLista && sobreVideo.readyState < 2) terminarIntro(); }, 6000); }
  }
  function terminarIntro() {
    if (introLista) return; introLista = true;
    document.body.classList.remove('bloqueado');
    sobreCaja.classList.remove('entra'); sobreCaja.classList.add('sale');
    setTimeout(() => sobreCaja.remove(), 1400);
    videoPortada.play().catch(() => {});
  }
  sobreVideo.addEventListener('timeupdate', () => { if (sobreVideo.duration && sobreVideo.currentTime >= sobreVideo.duration - .8) terminarIntro(); });
  sobreVideo.addEventListener('ended', terminarIntro);
  sobreVideo.addEventListener('error', terminarIntro);
  sobre.addEventListener('click', abrirSobre);

  /* ---------- Música: pausar / reanudar ---------- */
  musicaBoton.addEventListener('click', () => {
    if (musica.paused) { musica.play(); musicaBoton.classList.remove('pausado'); }
    else { musica.pause(); musicaBoton.classList.add('pausado'); }
  });

  /* ---------- Animaciones al entrar en pantalla ---------- */
  const observador = new IntersectionObserver((entradas) => {
    entradas.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observador.unobserve(e.target); } });
  }, { threshold: .15 });
  document.querySelectorAll('.aparece, .sube, #cuenta').forEach(el => observador.observe(el));

  /* ---------- Textos que se desplazan un poco con el scroll ---------- */
  const parallax = document.querySelectorAll('.parallax');
  function moverParallax() {
    const alto = window.innerHeight;
    parallax.forEach(el => {
      const r = el.getBoundingClientRect();
      let p = (alto - r.top) / (alto + r.height);     // 0 = entrando por abajo, 1 = saliendo por arriba
      p = Math.max(0, Math.min(1, p));
      el.style.transform = 'translateY(' + (-20 * p) + 'px)';
    });
  }

  /* ---------- Cronograma: la flor baja por la línea con el scroll ---------- */
  const cronograma = $('cronograma'), flor = $('cronograma-flor');
  function moverFlor() {
    const r = cronograma.getBoundingClientRect();
    let p = (window.innerHeight * .5 - r.top - 246) / 700;   // 0 = flor en el primer rombo, 1 = en el último
    p = Math.max(0, Math.min(1, p));
    flor.style.transform = 'translateY(' + (p * 700) + 'px)';
  }
  window.addEventListener('scroll', () => { moverFlor(); moverParallax(); }, { passive: true });
  window.addEventListener('resize', () => { moverFlor(); moverParallax(); });
  moverFlor(); moverParallax();

  /* ---------- Cuenta regresiva ---------- */
  const fe = CONFIG.fecha;
  const fechaEvento = new Date(fe.anio, fe.mes - 1, fe.dia, fe.hora, fe.minuto, 0);
  function actualizarCuenta() {
    const resta = fechaEvento - new Date();
    if (resta <= 0) { $('contador').innerHTML = '<div class="terminado">' + CONFIG.cuentaRegresiva.terminado + '</div>'; clearInterval(reloj); return; }
    const p = (n) => String(n).padStart(2, '0');
    $('dias').textContent = String(Math.floor(resta / 86400000));
    $('horas').textContent = p(Math.floor(resta % 86400000 / 3600000));
    $('minutos').textContent = p(Math.floor(resta % 3600000 / 60000));
    $('segundos').textContent = p(Math.floor(resta % 60000 / 1000));
  }
  const reloj = setInterval(actualizarCuenta, 1000); actualizarCuenta();

  /* ---------- Formulario (solo visual por ahora) ---------- */
  const ventana = $('ventana');
  $('abrir-formulario').addEventListener('click', () => ventana.classList.add('abierta'));
  $('cerrar-formulario').addEventListener('click', () => ventana.classList.remove('abierta'));
  ventana.addEventListener('click', (e) => { if (e.target === ventana) ventana.classList.remove('abierta'); });
  $('formulario').addEventListener('submit', (e) => {
    e.preventDefault();
    $('formulario').style.display = 'none';
    $('gracias').style.display = 'block';
  });

  /* ---------- Rasca y descubre la fecha ---------- */
  const tarjetas = document.querySelectorAll('.rasca-tarjeta');
  let listas = 0;

  function pintarCapa(ctx, w, h) {              // capa dorada que se rasca
    const base = ctx.createLinearGradient(0, 0, w, h);
    base.addColorStop(0, '#fffdf7'); base.addColorStop(.24, '#f9eedc'); base.addColorStop(.52, '#eed8b8');
    base.addColorStop(.78, '#d7b67f'); base.addColorStop(1, '#b98238');
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
    const brillo = ctx.createRadialGradient(w * .42, h * .25, 0, w * .42, h * .25, w * .82);
    brillo.addColorStop(0, 'rgba(255,255,252,.98)'); brillo.addColorStop(.3, 'rgba(255,247,229,.58)'); brillo.addColorStop(.67, 'rgba(245,222,185,.12)'); brillo.addColorStop(1, 'rgba(245,222,185,0)');
    ctx.fillStyle = brillo; ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = .085;
    for (let i = -h; i < w + h; i += 22) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + h * .72, h); ctx.strokeStyle = '#fff9ec'; ctx.lineWidth = 8; ctx.stroke(); }
    ctx.globalAlpha = .045;
    for (let i = 11 - h; i < w + h; i += 22) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + h * .72, h); ctx.strokeStyle = '#a66c20'; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.globalAlpha = 1;
    [[.14,.18],[.5,.1],[.84,.22],[.22,.78],[.72,.82],[.88,.58],[.08,.52],[.62,.42],[.38,.62]].forEach(([x, y], i) => {
      const rad = i % 3 === 0 ? 7 : 5;
      const g = ctx.createRadialGradient(w * x, h * y, 0, w * x, h * y, rad);
      g.addColorStop(0, 'rgba(255,255,250,1)'); g.addColorStop(.4, 'rgba(255,239,206,.42)'); g.addColorStop(1, 'rgba(255,230,183,0)');
      ctx.fillStyle = g; ctx.globalAlpha = .34; ctx.beginPath(); ctx.arc(w * x, h * y, rad, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(255,253,246,.88)'; ctx.lineWidth = 1.5; ctx.strokeRect(.75, .75, w - 1.5, h - 1.5);
    ctx.strokeStyle = 'rgba(171,108,29,.22)'; ctx.lineWidth = 1; ctx.strokeRect(2.25, 2.25, w - 4.5, h - 4.5);
  }

  tarjetas.forEach(tarjeta => {
    const cvs = tarjeta.querySelector('canvas');
    const ctx = cvs.getContext('2d', { willReadFrequently: true });
    let presionado = false, lista = false;
    function ajustar() {
      const r = tarjeta.getBoundingClientRect();
      cvs.width = Math.round(r.width); cvs.height = Math.round(r.height);
      if (!lista) pintarCapa(ctx, cvs.width, cvs.height);
    }
    ajustar(); window.addEventListener('resize', ajustar);
    setTimeout(ajustar, 300); setTimeout(ajustar, 1000);
    function xy(cx, cy) { const r = cvs.getBoundingClientRect(); return { x: (cx - r.left) * (cvs.width / r.width), y: (cy - r.top) * (cvs.height / r.height) }; }
    function rascar(x, y) {
      if (lista) return;
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(x, y, 36, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      if (Math.random() > .12) return;
      const d = ctx.getImageData(0, 0, cvs.width, cvs.height).data;
      let vis = 0, tot = 0;
      for (let i = 3; i < d.length; i += 12) { tot++; if (d[i] > 10) vis++; }
      if ((tot - vis) / tot > .4) terminar();
    }
    function terminar() {
      if (lista) return; lista = true;
      let a = 1;
      const fundido = setInterval(() => {
        a -= .055;
        if (a <= 0) { clearInterval(fundido); cvs.style.display = 'none'; }
        else { ctx.clearRect(0, 0, cvs.width, cvs.height); ctx.globalAlpha = a; pintarCapa(ctx, cvs.width, cvs.height); ctx.globalAlpha = 1; }
      }, 22);
      listas++;
      if (listas === tarjetas.length) setTimeout(todasListas, 550);
    }
    cvs.addEventListener('mousedown', e => { presionado = true; const p = xy(e.clientX, e.clientY); rascar(p.x, p.y); });
    cvs.addEventListener('mousemove', e => { if (presionado) { const p = xy(e.clientX, e.clientY); rascar(p.x, p.y); } });
    window.addEventListener('mouseup', () => presionado = false);
    cvs.addEventListener('touchstart', e => { e.preventDefault(); presionado = true; const t = e.touches[0]; const p = xy(t.clientX, t.clientY); rascar(p.x, p.y); }, { passive: false });
    cvs.addEventListener('touchmove', e => { e.preventDefault(); if (presionado) { const t = e.touches[0]; const p = xy(t.clientX, t.clientY); rascar(p.x, p.y); } }, { passive: false });
    cvs.addEventListener('touchend', () => presionado = false);
  });

  function todasListas() {
    $('destello').classList.add('brilla');
    confeti();
  }

  function confeti() {                          // lluvia de confeti dorado
    const cc = $('confeti'), cx = cc.getContext('2d');
    cc.width = window.innerWidth; cc.height = window.innerHeight;
    const colores = ['#b97820', '#d5a54d', '#e5c98f', '#f4e8d3', '#fff9ef', '#c38a35', 'rgba(183,120,32,.58)', 'rgba(255,243,221,.78)', '#93601b', '#ead8b8'];
    const piezas = Array.from({ length: 80 }, () => ({
      x: Math.random() * cc.width, y: -15 - Math.random() * 160, vy: Math.random() * 1.1 + .5, vx: (Math.random() - .5) * .9,
      w: Math.random() * 10 + 2.5, h: Math.random() * 3.5 + 1.2, rot: Math.random() * Math.PI * 2, rv: (Math.random() - .5) * .055,
      color: colores[Math.floor(Math.random() * colores.length)], alpha: Math.random() * .6 + .38,
      drift: Math.random() * Math.PI * 2, ds: Math.random() * .016 + .007, forma: Math.random() > .45 ? 0 : 1
    }));
    let fr = 0, max = 320;
    (function dibujar() {
      cx.clearRect(0, 0, cc.width, cc.height);
      const fade = Math.max(0, 1 - fr / max);
      piezas.forEach(p => {
        cx.save(); cx.globalAlpha = p.alpha * fade; cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.color;
        if (p.forma === 0) cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); else { cx.beginPath(); cx.arc(0, 0, p.h, 0, Math.PI * 2); cx.fill(); }
        cx.restore();
        p.y += p.vy; p.x += p.vx + Math.sin(p.drift) * .4; p.rot += p.rv; p.drift += p.ds;
        if (p.y > cc.height + 20) { p.y = -15; p.x = Math.random() * cc.width; }
      });
      fr++;
      if (fr < max) requestAnimationFrame(dibujar); else cx.clearRect(0, 0, cc.width, cc.height);
    })();
  }
})();
</script>
</body>
</html>
