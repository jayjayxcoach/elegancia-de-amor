    <div class="pos tarjeta">
      <h2 id="lugar-titulo"></h2>
      <div id="lugar-dias"></div>
    </div>
  </section>

  <!-- ============================================================
       6. VESTIMENTA + DETALLES
       ============================================================ -->
  <section id="vestimenta">
    <div class="pos titulo" id="vestimenta-titulo"></div>
    <div class="pos texto" id="vestimenta-texto"></div>
    <div class="pos colores" id="vestimenta-colores"></div>
    <div class="pos foto foto-1" id="vestimenta-foto-1"></div>
    <div class="pos foto foto-2 aparece-izq" id="vestimenta-foto-2"></div>
    <div class="pos foto foto-3 aparece-izq" id="vestimenta-foto-3" style="transition-delay:.1s"></div>
    <div class="pos foto foto-4 aparece-der" id="vestimenta-foto-4" style="transition-delay:.1s"></div>
    <div class="pos foto foto-5 aparece-der" id="vestimenta-foto-5"></div>
    <div class="pos foto foto-6 aparece-sub" id="vestimenta-foto-6"></div>
    <div class="pos foto foto-7 aparece-sub" id="vestimenta-foto-7"></div>
    <div class="pos celebremos script" id="vestimenta-celebremos"></div>
    <img class="pos celebrar-adorno aparece-izq" id="vestimenta-adorno" alt="">
    <div class="pos tarjeta aparece">
      <h2 id="detalles-titulo"></h2>
      <p id="detalles-texto"></p>
      <div class="telefono" id="detalles-telefono"></div>
      <p id="detalles-texto-2"></p>
    </div>
    <img class="pos detalles-adorno aparece-der" id="detalles-adorno" alt="">
  </section>

  <!-- ============================================================
       7. CONFIRMACIÓN
       ============================================================ -->
  <section id="confirmacion">
    <div class="pos foto" id="confirmacion-foto"></div>
    <div class="pos tarjeta">
      <h2 id="confirmacion-titulo"></h2>
      <form id="formulario" autocomplete="off">
        <label class="campo" for="campo-nombre" id="etiqueta-nombre"></label>
        <input type="text" id="campo-nombre" name="nombre" required>
        <div class="campo" id="etiqueta-asistencia"></div>
        <div class="opciones" id="opciones-asistencia"></div>
        <div class="campo" id="etiqueta-bebida"></div>
        <div class="opciones" id="opciones-bebida"></div>
        <button class="boton" type="submit" id="boton-enviar"></button>
      </form>
      <div class="gracias" id="gracias"></div>
    </div>
  </section>

  <!-- ============================================================
       8. MAPA
       ============================================================ -->
  <section id="mapa-titulo">
    <div class="pos centrado titulo script" id="mapa-titulo-texto"></div>
  </section>
  <section id="mapa">
    <iframe id="mapa-iframe" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade" title="Mapa"></iframe>
  </section>

  <!-- ============================================================
       9. DESPEDIDA
       ============================================================ -->
  <section id="despedida">
    <div class="pos centrado titulo script aparece" id="despedida-titulo"></div>
    <div class="pos centrado nombres aparece" id="despedida-nombres" style="transition-delay:.2s"></div>
    <img class="pos corazon aparece" id="despedida-corazon" alt="" style="transition-delay:.4s">
  </section>

</div><!-- /.invitacion -->
</div><!-- /.pagina -->

<!-- Música -->
<audio id="musica" loop preload="auto"></audio>
<div id="musica-boton" class="pausado" aria-label="Música">
  <svg class="pausa" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  <svg class="play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
</div>

<script>
/* ============================================================
   FUNCIONAMIENTO (no hace falta tocar nada de aquí abajo)
   ============================================================ */
(function () {
  const $ = (id) => document.getElementById(id);

  /* ---------- Rellenar textos desde CONFIG ---------- */
  $('carga-logo').style.backgroundImage = 'url("' + CONFIG.carga.logo + '")';
  $('carga-texto').textContent = CONFIG.carga.texto;

  $('video-portada').src = CONFIG.portada.video;
  $('video-portada').poster = CONFIG.portada.foto;
  $('portada-nombres').textContent = CONFIG.noviosTexto;
  $('portada-fecha').textContent = CONFIG.fechaTexto;
  $('portada-desliza').textContent = CONFIG.portada.desliza;

  $('mensaje-titulo').textContent = CONFIG.mensaje.titulo;
  $('mensaje-texto-1').textContent = CONFIG.mensaje.texto1;
  $('mensaje-texto-2').textContent = CONFIG.mensaje.texto2;
  $('mensaje-adorno').src = CONFIG.mensaje.adorno;

  $('cuenta-titulo').textContent = CONFIG.cuentaRegresiva.titulo;
  ['dias', 'horas', 'minutos', 'segundos'].forEach((k, i) => { $('etq-' + k).textContent = CONFIG.cuentaRegresiva.etiquetas[i]; });

  $('lugar-adorno').src = CONFIG.lugar.adorno;
  $('lugar-foto').style.backgroundImage = 'url("' + CONFIG.lugar.foto + '")';
  $('lugar-titulo').textContent = CONFIG.lugar.titulo;
  CONFIG.lugar.dias.forEach((dia) => {
    const d = document.createElement('div'); d.className = 'dia';
    const f = document.createElement('div'); f.className = 'fechadia'; f.textContent = dia.fecha; d.appendChild(f);
    dia.eventos.forEach((ev, i) => {
      const e = document.createElement('div'); e.className = 'evento aparece'; e.style.transitionDelay = (i * .08) + 's';
      e.textContent = ev.hora + ' - ' + ev.nombre;
      if (ev.lugar) { const l = document.createElement('span'); l.className = 'lugar-evento'; l.textContent = ev.lugar; e.appendChild(l); }
      d.appendChild(e);
    });
    $('lugar-dias').appendChild(d);
  });

  const v = CONFIG.vestimenta;
  $('vestimenta-titulo').textContent = v.titulo;
  $('vestimenta-texto').textContent = v.texto;
  v.colores.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'color aparece'; d.style.background = c; d.style.transitionDelay = (i * .1) + 's';
    $('vestimenta-colores').appendChild(d);
  });
  v.fotos.forEach((src, i) => { const el = $('vestimenta-foto-' + (i + 1)); if (el) el.style.backgroundImage = 'url("' + src + '")'; });
  $('vestimenta-celebremos').textContent = v.celebremos;
  $('vestimenta-adorno').src = v.adorno;

  $('detalles-titulo').textContent = CONFIG.detalles.titulo;
  $('detalles-texto').textContent = CONFIG.detalles.texto;
  $('detalles-telefono').textContent = CONFIG.detalles.telefono;
  $('detalles-texto-2').textContent = CONFIG.detalles.texto2;
  $('detalles-adorno').src = CONFIG.detalles.adorno;

  $('confirmacion-foto').style.backgroundImage = 'url("' + CONFIG.confirmacion.foto + '")';
  $('confirmacion-titulo').textContent = CONFIG.confirmacion.titulo;
  const f = CONFIG.confirmacion.formulario;
  $('etiqueta-nombre').textContent = f.campoNombre;
  $('etiqueta-asistencia').textContent = f.campoAsistencia;
  $('etiqueta-bebida').textContent = f.campoBebida;
  const opciones = (lista, nombre, cont) => lista.forEach((op) => {
    const l = document.createElement('label'); l.className = 'opcion';
    l.innerHTML = '<input type="checkbox" name="' + nombre + '" value="' + op + '"><span>' + op + '</span>';
    cont.appendChild(l);
  });
  opciones(f.opcionesAsistencia, 'asistencia', $('opciones-asistencia'));
  opciones(f.opcionesBebida, 'bebida', $('opciones-bebida'));
  $('boton-enviar').textContent = f.botonEnviar;
  $('gracias').textContent = f.gracias;

  $('mapa-titulo-texto').textContent = CONFIG.mapa.titulo;
  $('mapa-iframe').src = CONFIG.mapa.enlace;

  $('despedida-titulo').textContent = CONFIG.despedida.titulo;
  $('despedida-nombres').textContent = CONFIG.noviosDespedida;
  $('despedida-corazon').src = CONFIG.despedida.corazon;

  /* ---------- Música ---------- */
  const musica = $('musica');
  const musicaBoton = $('musica-boton');
  if (CONFIG.musica) musica.src = CONFIG.musica;
  function reproducirMusica() {
    if (!CONFIG.musica) return;
    const intento = musica.play();
    if (intento && intento.then) intento.then(() => musicaBoton.classList.remove('pausado')).catch(() => musicaBoton.classList.add('pausado'));
  }
  // Los navegadores solo dejan iniciar audio tras un toque del usuario: se intenta al abrir las cortinas
  // y, si quedó bloqueado, arranca con el primer toque o clic en cualquier parte
  function arranqueConToque() { if (musica.paused && !musica.dataset.pausadoPorUsuario) reproducirMusica(); }
  document.addEventListener('touchend', arranqueConToque, { passive: true });
  document.addEventListener('click', arranqueConToque);
  musicaBoton.addEventListener('click', (e) => {
    e.stopPropagation();
    if (musica.paused) { delete musica.dataset.pausadoPorUsuario; reproducirMusica(); }
    else { musica.pause(); musica.dataset.pausadoPorUsuario = '1'; musicaBoton.classList.add('pausado'); }
  });

  /* ---------- Pantalla de carga (2,2 s) → toque → cortinas que se abren ---------- */
  let comenzado = false;
  function comenzar() {
    if (comenzado) return; comenzado = true;
    reproducirMusica();                                                   // dentro del toque: así el celular sí deja sonar la música
    $('carga').classList.add('fuera');
    setTimeout(() => { $('carga').remove(); document.body.classList.remove('bloqueado'); }, 500);
    setTimeout(() => { $('cortinas').classList.add('abiertas'); if (musica.paused) reproducirMusica(); }, 1000);   // las cortinas se abren
    setTimeout(() => { $('cortinas').remove(); if (CONFIG.musica) musicaBoton.classList.add('visible'); }, 4200);
    setTimeout(() => document.querySelectorAll('#portada .aparece').forEach(e => e.classList.add('visible')), 1200);
  }
  window.addEventListener('load', () => {
    setTimeout(() => {
      if (CONFIG.carga.esperarToque && CONFIG.musica) {
        $('carga-texto').textContent = CONFIG.carga.textoToque;             // "Toca para comenzar"
        $('carga').classList.add('listo');
        $('carga').addEventListener('click', comenzar);
        $('carga').addEventListener('touchend', (e) => { e.preventDefault(); comenzar(); }, { passive: false });
      } else {
        comenzar();
      }
    }, 2200);
  });
  $('video-portada').play().catch(() => {});

  /* ---------- Animaciones al entrar en pantalla ---------- */
  const observador = new IntersectionObserver((entradas) => {
    entradas.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observador.unobserve(e.target); } });
  }, { threshold: .1 });
  document.querySelectorAll('.aparece, .aparece-izq, .aparece-der, .aparece-sub').forEach(el => { if (!el.closest('#portada')) observador.observe(el); });

  /* ---------- Cuenta regresiva ---------- */
  const fe = CONFIG.fecha;
  const fechaEvento = new Date(fe.anio, fe.mes - 1, fe.dia, fe.hora, fe.minuto, 0);
  function actualizarCuenta() {
    const resta = fechaEvento - new Date();
    if (resta <= 0) { $('contador').innerHTML = '<div class="terminado">' + CONFIG.cuentaRegresiva.terminado + '</div>'; clearInterval(reloj); return; }
    const p = (n) => String(n).padStart(2, '0');
    $('dias').textContent = p(Math.floor(resta / 86400000));
    $('horas').textContent = p(Math.floor(resta % 86400000 / 3600000));
    $('minutos').textContent = p(Math.floor(resta % 3600000 / 60000));
    $('segundos').textContent = p(Math.floor(resta % 60000 / 1000));
  }
  const reloj = setInterval(actualizarCuenta, 1000); actualizarCuenta();

  /* ---------- Formulario (solo visual por ahora) ---------- */
  $('formulario').addEventListener('submit', (e) => {
    e.preventDefault();
    $('formulario').style.display = 'none';
    $('gracias').style.display = 'block';
  });
})();
</script>
</body>
</html>
