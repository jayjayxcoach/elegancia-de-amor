<style>
/* ============================================================
   ESTILOS
   ============================================================ */

/* Tipografías (guardadas en la carpeta recursos, no dependen de internet) */
@font-face { font-family: 'Imperial Script'; font-weight: 400; font-display: swap; src: url('recursos/fuente-imperial-script.woff2') format('woff2'); }
@font-face { font-family: 'Rufina'; font-weight: 400; font-display: swap; src: url('recursos/fuente-rufina-regular.woff2') format('woff2'); }
@font-face { font-family: 'Rufina'; font-weight: 700; font-display: swap; src: url('recursos/fuente-rufina-bold.woff2') format('woff2'); }

:root {
  --fondo: #fffdfb;          /* fondo general */
  --texto: #3a3a3a;          /* texto principal */

body {

img { display: block; max-width: 100%; }

.invitacion { width: 100%; max-width: var(--ancho); margin: 0 auto; position: relative; }

.titulo { font-family: var(--script); font-weight: 400; font-size: 41px; line-height: 1.3; text-align: center; color: var(--texto); }

/* ------------------------------------------------------------

   ------------------------------------------------------------ */

  position: fixed; inset: 0; z-index: 100;
  background: var(--fondo);
  overflow: hidden;
  cursor: pointer;
  transition: opacity .6s ease;
}
#sobre.abierto { opacity: 0; pointer-events: none; }

.sobre-caja img { position: absolute; width: auto; }

.solapa-der  { left: 541px; top: -7px;  width: 467px !important; }
.solapa-arr  { left: 0;     top: 0;     width: 1012px !important; }
.solapa-aba  { left: 1px;   top: 277px; width: 1011px !important; }
.sello       { left: 386px; top: 289px; width: 241px !important; z-index: 2; }
.sobre-texto {
  position: absolute; left: 0; right: 0; top: 484px; text-align: center;
  font-family: var(--serif); font-weight: 700; font-size: 20px; color: var(--azul-texto);

#sobre.solapas .solapa-der   { transform: translateX(559px);  transition-duration: 2s; }

#mensaje { position: relative; height: 640px; overflow: hidden; }

#mensaje .sobre-fondo, #mensaje .sobre-frente { position: absolute; left: 50%; top: 120px; width: min(490px, 112%); max-width: none; transform: translateX(-50%); }
#mensaje .sobre-frente { z-index: 3; pointer-events: none; }

#mensaje .corazon-1 { left: 50%; top: 22px; width: 90px; margin-left: -58px; }

/* ------------------------------------------------------------
   5. CRONOGRAMA
   ------------------------------------------------------------ */
#cronograma { position: relative; height: 653px; padding-top: 45px; overflow: visible; }

  transition: transform 1.6s cubic-bezier(.5,.05,.4,1); }

#cronograma .nube-2 { top: 60px; transform: translate(-40px, 90px); }

#cronograma.revelado .nube-1 { transform: translate(760px, 150px); }
#cronograma.revelado .nube-2 { transform: translate(-760px, 180px); }
.linea-tiempo { position: absolute; left: 50%; top: 178px; width: 4px; height: 409px; margin-left: -2px; background: var(--azul); opacity: .7; border-radius: 2px; z-index: 2; }

    <div class="sobre-texto" id="sobre-texto"></div>
  </div>
</div>

<div class="invitacion">

  <!-- ============================================================
       2. PORTADA
       ============================================================ -->
  <section id="portada">
    <img class="foto-respaldo" id="portada-foto" src="" alt="">
    <video id="video-portada" loop muted playsinline preload="auto"></video>
    <div class="velo"></div>
    <div class="nombres" id="portada-nombres"></div>
    <div class="subtitulo aparece" id="portada-subtitulo"></div>
    <div class="degradado"></div>
  </section>

  <!-- ============================================================
       3. LA FECHA (rasca y descubre)
       ============================================================ -->
  <section id="fecha">
    <h2 class="titulo" id="fecha-titulo"></h2>
    <p class="instruccion" id="fecha-instruccion"></p>
    <div class="rasca">
      <div class="rasca-paneles">
        <div class="rasca-panel">
          <div class="rasca-tarjeta"><span class="rasca-valor" id="fecha-dia"></span><canvas></canvas></div>
          <div class="rasca-etiqueta" id="fecha-etiqueta-dia"></div>
        </div>
        <div class="rasca-panel">
          <div class="rasca-tarjeta"><span class="rasca-valor mes" id="fecha-mes"></span><canvas></canvas></div>
          <div class="rasca-etiqueta" id="fecha-etiqueta-mes"></div>
        </div>
        <div class="rasca-panel">
          <div class="rasca-tarjeta"><span class="rasca-valor" id="fecha-anio"></span><canvas></canvas></div>
          <div class="rasca-etiqueta" id="fecha-etiqueta-anio"></div>
        </div>
      </div>
      <div class="rasca-final" id="fecha-final"></div>
    </div>
  </section>
  <canvas id="confeti"></canvas>

  <!-- ============================================================
       4. MENSAJE
       ============================================================ -->
  <section id="mensaje">
    <img class="corazon corazon-1" src="recursos/deco-2.png" alt="">
    <img class="corazon corazon-2" src="recursos/deco-3.png" alt="">
    <img class="sobre-fondo" src="recursos/mensaje-marco.png" alt="">
    <div class="carta" id="carta">
      <div class="saludo" id="mensaje-saludo"></div>
      <div class="cuerpo" id="mensaje-texto"></div>
    </div>
    <img class="sobre-frente" src="recursos/mensaje-marco-flores.png" alt="">
  </section>

  <!-- ============================================================
       5. CRONOGRAMA
       ============================================================ -->
  <section id="cronograma">
    <img class="nube nube-1" id="nube-1" src="recursos/cronograma-deco-1.png" alt="">
    <img class="nube nube-2" id="nube-2" src="recursos/cronograma-deco-2.png" alt="">
    <h2 class="titulo" id="cronograma-titulo"></h2>

  <!-- ============================================================
       6. LUGAR

  <section id="lugar">

    <div class="foto-caja">
      <a id="lugar-enlace"><img class="foto" id="lugar-foto" src="" alt="Lugar de la boda"></a>

      <div class="datos aparece-lento">
        <img class="pin" src="recursos/lugar-pin.png" alt="">
        <div>
          <div class="nombre" id="lugar-nombre"></div>

  <!-- ============================================================
       7. VESTIMENTA

  <section id="vestimenta">

    <div class="deslizar"><span id="vestimenta-deslizar"></span>
      <svg viewBox="0 0 60 12" fill="none" stroke="#9a9a9a" stroke-width="1"><path d="M0 6h56M50 1l6 5-6 5"/></svg>
    </div>
    <div class="galeria" id="galeria"></div>
    <div id="colores">
      <div class="fila">
        <span class="etiqueta" id="colores-etiqueta"></span>

      <p class="detalle" id="vestimenta-detalle"></p>

  <!-- ============================================================
       8. CONFIRMACIÓN
       ============================================================ -->
  <section id="confirmacion">
    <h2 class="titulo" id="confirmacion-titulo"></h2>
    <p class="texto aparece" id="confirmacion-texto"></p>
    <button class="boton" id="abrir-formulario"></button>
  </section>

  <!-- ============================================================
       9. DESPEDIDA
       ============================================================ -->
  <section id="despedida">
    <h2 class="titulo-md aparece-lento" id="despedida-titulo"></h2>
    <div class="nombres aparece-lento" id="despedida-nombres"></div>
    <img class="icono aparece-lento" src="recursos/despedida-icono.png" alt="">

<!-- Ventana emergente del formulario -->
<div id="ventana">
  <div class="contenido">
    <button class="cerrar" id="cerrar-formulario" aria-label="Cerrar">✕</button>
    <img class="foto" id="formulario-foto" src="" alt="">
    <div class="cuerpo">
      <h3 id="formulario-titulo"></h3>
      <p class="sub" id="formulario-subtitulo"></p>

        <label for="campo-nombre" id="etiqueta-nombre"></label>
        <input type="text" id="campo-nombre" required>

        <div id="opciones-asistencia"></div>
        <label for="campo-alergias" id="etiqueta-alergias"></label>
        <input type="text" id="campo-alergias">

<!-- Música -->
<audio id="musica" loop preload="auto"></audio>
<div id="musica-boton" class="pausado">
  <svg class="pausa" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  <svg class="play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
</div>

<script>
/* ============================================================
   FUNCIONAMIENTO (no hace falta tocar nada de aquí abajo)
   ============================================================ */
(function () {
  const $ = (id) => document.getElementById(id);

  /* ---------- Rellenar textos desde CONFIG ---------- */
  $('sello').src = CONFIG.sobre.sello;
  $('sobre-texto').textContent = CONFIG.sobre.textoAbrir;

  $('video-portada').src = CONFIG.portada.video;
  $('video-portada').poster = CONFIG.portada.foto;
  $('portada-foto').src = CONFIG.portada.foto;
  $('portada-nombres').textContent = CONFIG.novios;
  $('portada-subtitulo').textContent = CONFIG.portada.subtitulo;

  $('fecha-titulo').textContent = CONFIG.fecha.titulo;
  $('fecha-instruccion').textContent = CONFIG.fecha.instruccion;
  $('fecha-dia').textContent = CONFIG.fecha.dia;
  $('fecha-mes').textContent = CONFIG.fecha.mes;
  $('fecha-anio').textContent = CONFIG.fecha.anio;
  $('fecha-etiqueta-dia').textContent = CONFIG.fecha.etiquetaDia;
  $('fecha-etiqueta-mes').textContent = CONFIG.fecha.etiquetaMes;
  $('fecha-etiqueta-anio').textContent = CONFIG.fecha.etiquetaAnio;
  $('fecha-final').textContent = CONFIG.fecha.mensajeFinal;

  $('mensaje-saludo').textContent = CONFIG.mensaje.saludo;
  $('mensaje-texto').innerHTML = CONFIG.mensaje.texto;

  $('cronograma-titulo').textContent = CONFIG.cronograma.titulo;
  // Eventos: se alternan derecha / izquierda cada 80 px sobre la línea
  const cont = $('cronograma-eventos');
  CONFIG.cronograma.eventos.forEach((ev, i) => {
    const top = 178 + i * 80;
    const punto = document.createElement('div');
    punto.className = 'punto'; punto.style.top = top + 'px';
    cont.appendChild(punto);
    const caja = document.createElement('div');
    caja.className = 'evento ' + (i % 2 === 0 ? 'der' : 'izq');
    caja.style.top = (top - 30) + 'px';
    caja.innerHTML = '<div class="hora">' + ev.hora + '</div><div class="nombre">' + ev.nombre + '</div>';
    cont.appendChild(caja);
  });

  $('lugar-titulo').textContent = CONFIG.lugar.titulo;
  $('lugar-foto').src = CONFIG.lugar.foto;
  $('lugar-nombre').textContent = CONFIG.lugar.nombre;
  $('lugar-direccion').textContent = CONFIG.lugar.direccion;
  if (CONFIG.lugar.mapa) { $('lugar-enlace').href = CONFIG.lugar.mapa; $('lugar-enlace').target = '_blank'; }

  $('vestimenta-titulo').textContent = CONFIG.vestimenta.titulo;
  $('vestimenta-texto').textContent = CONFIG.vestimenta.texto;
  $('vestimenta-deslizar').textContent = CONFIG.vestimenta.textoDeslizar;
  CONFIG.vestimenta.galeria.forEach(src => { const im = new Image(); im.src = src; im.alt = ''; $('galeria').appendChild(im); });
  $('colores-etiqueta').textContent = CONFIG.vestimenta.etiquetaColores;
  CONFIG.vestimenta.colores.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'circulo'; d.style.background = c; d.style.transitionDelay = (i * .1) + 's';
    $('colores-circulos').appendChild(d);
  });
  $('vestimenta-detalle').innerHTML = CONFIG.vestimenta.detalle;

  $('confirmacion-titulo').textContent = CONFIG.confirmacion.titulo;
  $('confirmacion-texto').textContent = CONFIG.confirmacion.texto;
  $('abrir-formulario').textContent = CONFIG.confirmacion.boton;
  const f = CONFIG.confirmacion.formulario;
  $('formulario-foto').src = f.foto;
  $('formulario-titulo').textContent = f.titulo;
  $('formulario-subtitulo').textContent = f.subtitulo;
  $('etiqueta-nombre').textContent = f.campoNombre;
  $('etiqueta-asistencia').textContent = f.campoAsistencia;
  f.opciones.forEach((op, i) => {
    const l = document.createElement('label');
    l.className = 'opcion';
    l.innerHTML = '<input type="radio" name="asistencia" value="' + op + '"' + (i === 0 ? ' required' : '') + '><span>' + op + '</span>';
    $('opciones-asistencia').appendChild(l);
  });
  $('etiqueta-alergias').textContent = f.campoAlergias;
  $('boton-enviar').textContent = f.botonEnviar;
  $('gracias').textContent = f.gracias;

  $('despedida-titulo').textContent = CONFIG.despedida.titulo;
  $('despedida-nombres').textContent = CONFIG.noviosDespedida;
  $('despedida-foto').src = CONFIG.despedida.foto;

  $('musica').src = CONFIG.musica;

  /* ---------- Sobre: abrir con un toque ---------- */
  const sobre = $('sobre');
  const video = $('video-portada');
  const musica = $('musica');
  const musicaBoton = $('musica-boton');
  let abierto = false;
  function reproducirMusica() {
    musica.volume = 1;
    const intento = musica.play();
    if (intento && intento.then) intento.then(() => musicaBoton.classList.remove('pausado')).catch(() => musicaBoton.classList.add('pausado'));
  }
  sobre.addEventListener('click', () => {
    if (abierto) return; abierto = true;
    // La música arranca en el mismo toque (los celulares solo permiten reproducir audio dentro del toque del usuario,
    // no varios segundos después) y el video se prepara también aquí
    reproducirMusica();
    video.play().catch(() => {});
    sobre.classList.add('abriendo');                                  // el sello se agranda y desaparece
    setTimeout(() => sobre.classList.add('solapas'), 1500);            // las solapas se abren
    setTimeout(() => {                                                 // el sobre desaparece
      sobre.classList.add('abierto');
      document.body.classList.remove('bloqueado');
      video.play().catch(() => {});
      if (musica.paused) reproducirMusica();
      musicaBoton.classList.add('visible');
      setTimeout(() => sobre.remove(), 800);
    }, 3300);
  });
  // Si el navegador bloqueó el audio, se reintenta con el siguiente toque en cualquier parte
  document.addEventListener('touchend', () => { if (abierto && musica.paused && !musica.dataset.pausadoPorUsuario) reproducirMusica(); }, { passive: true });

  /* ---------- Música: pausar / reanudar ---------- */
  musicaBoton.addEventListener('click', (e) => {
    e.stopPropagation();
    if (musica.paused) { delete musica.dataset.pausadoPorUsuario; reproducirMusica(); }
    else { musica.pause(); musica.dataset.pausadoPorUsuario = '1'; musicaBoton.classList.add('pausado'); }
  });

  /* ---------- Animaciones al entrar en pantalla ---------- */
  const observador = new IntersectionObserver((entradas) => {
    entradas.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observador.unobserve(e.target); } });
  }, { threshold: .2 });
  document.querySelectorAll('.aparece, .aparece-lento, #colores').forEach(el => observador.observe(el));

  /* ---------- Mensaje: la carta sale del sobre al bajar y vuelve a entrar al subir ---------- */
  const mensaje = $('mensaje'), carta = $('carta');
  const corazones = mensaje.querySelectorAll('.corazon');
  function moverCarta() {
    const r = mensaje.getBoundingClientRect();
    const alto = window.innerHeight;
    // 0 = la sección acaba de asomar por abajo; 1 = la sección ya está en la mitad superior de la pantalla
    let p = (alto - r.top - 120) / (alto * .55);
    p = Math.max(0, Math.min(1, p));
    const suave = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;   // aceleración suave
    carta.style.transform = 'translateY(' + (150 - suave * 150) + 'px)';
    corazones.forEach(c => c.style.opacity = Math.max(0, (suave - .5) * 2));
  }
  window.addEventListener('scroll', moverCarta, { passive: true });
  window.addEventListener('resize', moverCarta);
  moverCarta();

  /* ---------- Cronograma: las nubes se abren al entrar en pantalla y se cierran al salir ---------- */
  const cronograma = $('cronograma');
  const obsNubes = new IntersectionObserver((entradas) => {
    entradas.forEach(e => cronograma.classList.toggle('revelado', e.isIntersecting));
  }, { threshold: .35 });
  obsNubes.observe(cronograma);
  setTimeout(moverCarta, 400);

  /* ---------- Galería de vestimenta: arrastrar con el mouse ---------- */
  const galeria = $('galeria');
  let arrastrando = false, inicioX = 0, inicioScroll = 0;
  galeria.addEventListener('mousedown', (e) => {
    arrastrando = true; inicioX = e.pageX; inicioScroll = galeria.scrollLeft;
    galeria.classList.add('arrastrando'); e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!arrastrando) return;
    galeria.scrollLeft = inicioScroll - (e.pageX - inicioX);
  });
  window.addEventListener('mouseup', () => {
    if (!arrastrando) return;
    arrastrando = false; galeria.classList.remove('arrastrando');
  });

  /* ---------- Formulario (solo visual por ahora) ---------- */
  const ventana = $('ventana');
  $('abrir-formulario').addEventListener('click', () => ventana.classList.add('abierta'));
  $('cerrar-formulario').addEventListener('click', () => ventana.classList.remove('abierta'));
  ventana.addEventListener('click', (e) => { if (e.target === ventana) ventana.classList.remove('abierta'); });
  $('formulario').addEventListener('submit', (e) => {
    e.preventDefault();
    $('formulario').style.display = 'none';
    $('gracias').style.display = 'block';
  });

  /* ---------- Rasca y descubre la fecha ---------- */
  const tarjetas = document.querySelectorAll('.rasca-tarjeta');
  let listas = 0;

  function pintarCapa(ctx, w, h) {              // capa azul "champán" que se rasca
    const base = ctx.createLinearGradient(0, 0, w, h);
    base.addColorStop(0, '#dce8ee'); base.addColorStop(.25, '#d2dfe6'); base.addColorStop(.55, '#c8d7df');
    base.addColorStop(.8, '#d0dde5'); base.addColorStop(1, '#c4d3dc');
    ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
    const brillo = ctx.createRadialGradient(w * .28, h * .24, 0, w * .28, h * .24, w * .65);
    brillo.addColorStop(0, 'rgba(240,248,252,.65)'); brillo.addColorStop(.45, 'rgba(230,242,248,.22)'); brillo.addColorStop(1, 'rgba(230,242,248,0)');
    ctx.fillStyle = brillo; ctx.fillRect(0, 0, w, h);
    ctx.globalAlpha = .10;
    for (let i = -h; i < w + h; i += 20) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + h * .75, h); ctx.strokeStyle = '#eef4f8'; ctx.lineWidth = 9; ctx.stroke(); }
    ctx.globalAlpha = 1;
    [[.14,.18],[.5,.1],[.84,.22],[.22,.78],[.72,.82],[.88,.58],[.08,.52],[.62,.42],[.38,.62]].forEach(([x, y]) => {
      const g = ctx.createRadialGradient(w * x, h * y, 0, w * x, h * y, 6);
      g.addColorStop(0, 'rgba(220,238,248,.95)'); g.addColorStop(.5, 'rgba(180,210,228,.45)'); g.addColorStop(1, 'rgba(180,210,228,0)');
      ctx.fillStyle = g; ctx.globalAlpha = .3; ctx.beginPath(); ctx.arc(w * x, h * y, 6, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(220,238,248,.45)'; ctx.lineWidth = 1.5; ctx.strokeRect(.75, .75, w - 1.5, h - 1.5);
  }

  tarjetas.forEach(tarjeta => {
    const cvs = tarjeta.querySelector('canvas');
    const ctx = cvs.getContext('2d', { willReadFrequently: true });
    let presionado = false, lista = false;
    function ajustar() {
      const r = tarjeta.getBoundingClientRect();
      cvs.width = Math.round(r.width); cvs.height = Math.round(r.height);
      if (!lista) pintarCapa(ctx, cvs.width, cvs.height);
    }
    ajustar(); window.addEventListener('resize', ajustar);
    setTimeout(ajustar, 300); setTimeout(ajustar, 1000);
    function xy(cx, cy) { const r = cvs.getBoundingClientRect(); return { x: (cx - r.left) * (cvs.width / r.width), y: (cy - r.top) * (cvs.height / r.height) }; }
    function rascar(x, y) {
      if (lista) return;
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(x, y, 36, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      if (Math.random() > .12) return;
      const d = ctx.getImageData(0, 0, cvs.width, cvs.height).data;
      let vis = 0, tot = 0;
      for (let i = 3; i < d.length; i += 12) { tot++; if (d[i] > 10) vis++; }
      if ((tot - vis) / tot > .4) terminar();
    }
    function terminar() {
      if (lista) return; lista = true;
      let a = 1;
      const fundido = setInterval(() => {
        a -= .055;
        if (a <= 0) { clearInterval(fundido); cvs.style.display = 'none'; }
        else { ctx.clearRect(0, 0, cvs.width, cvs.height); ctx.globalAlpha = a; pintarCapa(ctx, cvs.width, cvs.height); ctx.globalAlpha = 1; }
      }, 22);
      listas++;
      if (listas === tarjetas.length) setTimeout(todasListas, 550);
    }
    cvs.addEventListener('mousedown', e => { presionado = true; const p = xy(e.clientX, e.clientY); rascar(p.x, p.y); });
    cvs.addEventListener('mousemove', e => { if (presionado) { const p = xy(e.clientX, e.clientY); rascar(p.x, p.y); } });
    window.addEventListener('mouseup', () => presionado = false);
    cvs.addEventListener('touchstart', e => { e.preventDefault(); presionado = true; const t = e.touches[0]; const p = xy(t.clientX, t.clientY); rascar(p.x, p.y); }, { passive: false });
    cvs.addEventListener('touchmove', e => { e.preventDefault(); if (presionado) { const t = e.touches[0]; const p = xy(t.clientX, t.clientY); rascar(p.x, p.y); } }, { passive: false });
    cvs.addEventListener('touchend', () => presionado = false);
  });

  function todasListas() {
    $('fecha-final').classList.add('mostrar');
    confeti();
  }

  function confeti() {                          // lluvia de confeti dorado
    const cc = $('confeti'), cx = cc.getContext('2d');
    cc.width = window.innerWidth; cc.height = window.innerHeight;
    const colores = ['#c8aa78', '#dfc48e', '#ede5cc', '#f5ede0', '#1a1916', '#d4c090', 'rgba(200,170,120,.55)', 'rgba(245,237,220,.65)', '#b89050', '#e8d8a8'];
    const piezas = Array.from({ length: 80 }, () => ({
      x: Math.random() * cc.width, y: -15 - Math.random() * 160, vy: Math.random() * 1.1 + .5, vx: (Math.random() - .5) * .9,
      w: Math.random() * 10 + 2.5, h: Math.random() * 3.5 + 1.2, rot: Math.random() * Math.PI * 2, rv: (Math.random() - .5) * .055,
      color: colores[Math.floor(Math.random() * colores.length)], alpha: Math.random() * .6 + .38,
      drift: Math.random() * Math.PI * 2, ds: Math.random() * .016 + .007, forma: Math.random() > .45 ? 0 : 1
    }));
    let f = 0, max = 320;
    (function dibujar() {
      cx.clearRect(0, 0, cc.width, cc.height);
      const fade = Math.max(0, 1 - f / max);
      piezas.forEach(p => {
        cx.save(); cx.globalAlpha = p.alpha * fade; cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.color;
        if (p.forma === 0) cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); else { cx.beginPath(); cx.arc(0, 0, p.h, 0, Math.PI * 2); cx.fill(); }
        cx.restore();
        p.y += p.vy; p.x += p.vx + Math.sin(p.drift) * .4; p.rot += p.rv; p.drift += p.ds;
        if (p.y > cc.height + 20) { p.y = -15; p.x = Math.random() * cc.width; }
      });
      f++;
      if (f < max) requestAnimationFrame(dibujar); else cx.clearRect(0, 0, cc.width, cc.height);
    })();
  }
})();
</script>
