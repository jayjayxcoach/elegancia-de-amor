  // ---------- Princesa ----------
  nombre: "Isabella",
  cinta: "My First Birthday",                // texto de la cinta celeste de la portada

  // ---------- Fecha y hora de la fiesta ----------
  // La fecha escrita, la hora y la cuenta regresiva salen solas de aquí.
  fecha: { anio: 2027, mes: 3, dia: 27, hora: 15, minuto: 30 },   // mes: 1 = enero … 12 = diciembre · hora en formato 24 h

    textoAbrir: "Tap the seal to open",
    imagen: "recursos/sobre-cerrado.webp",   // portada del sobre (primer cuadro del video de Gemini). Vacío = sobre dibujado con código

    selloX: 49.9, selloY: 52.2               // dónde está el sello en la imagen (%), para el brillo que late
  },

  // ---------- Había una vez (se escribe letra por letra) ----------

    inicio: "Once upon\na time",                                        // \n = salto de línea
    texto: "In a faraway kingdom there lived a beautiful little princess named"  // después sale el nombre en dorado
  },

  // ---------- Mensaje de los papitos (se escribe letra por letra) ----------
  papitos: {
    texto: "With hearts full of joy and thankful to God for blessing them with such a beautiful daughter, her mommy and daddy invited every kingdom to celebrate their little princess's first birthday.",
    firma: "With love,",
    padres: "Daniel & Mariana"
  },

  // ---------- Fotos en los círculos dorados (de 1 a 3, cuadradas con la cara al centro) ----------
  fotos: {
    titulo: "A Year of Magic",
    lista: [               // cuadradas con la cara al centro (vacío [] = coronas en su lugar)
      "recursos/foto-1.webp",
      "recursos/foto-2.webp",
      "recursos/foto-3.webp"
    ]
  },

  // ---------- Acompáñanos a celebrar 365 días de mucho amor ----------
  acompanos: { cinta: "Join Us", arriba: "in celebrating", numero: 365, abajo: "days filled with", final: "love" },

  // ---------- ¿Cuándo y dónde? ----------
  lugar: {
    intro: "We would love for you to join us on this very special day",
    nombre: "Enchanted Garden Event Hall",
    direccion: "123 Rose Garden Ave, Miami, FL",
    boton: "View location",
    enlace: "https://maps.google.com/?q=Miami+FL",   // Google Maps → Compartir → Copiar enlace
    mapa: ""      // opcional: enlace "embed" de Google Maps (Compartir → Insertar un mapa). Vacío = sin mapa
  },

  // ---------- Cuenta regresiva ----------
  cuentaRegresiva: {
    titulo: "Almost Time",
    subtitulo: "until the princess's big party",
    etiquetas: ["Days", "Hours", "Min", "Sec"],
    terminado: "The big day is here!"
  },

  // ---------- Código de vestimenta (mostrar: false = no aparece) ----------

    mostrar: true,
    titulo: "Dress Code",
    estilo: "Smart casual",
    texto: "Suggested colors: light blue, white and gold",
    tonos: ["#9cc7ea", "#ffffff", "#d9b45a"]      // puntos de color
  },

  // ---------- Sugerencia de regalo ----------
  // icono: "ropa", "calzado" o "juguetes" (usa las imágenes de abajo)
  regalos: {
    titulo: "Gift Ideas",
    lista: [
      { icono: "ropa",     texto: "Clothes",  detalle: "size 18 – 24 months" },
      { icono: "calzado",  texto: "Shoes",    detalle: "toddler size 5" },
      { icono: "juguetes", texto: "Toys",     detalle: "" }
    ],
    nota: "Every gift from the heart is warmly welcome!"
  },

  // ---------- Confirmación (por WhatsApp) ----------
  confirmacion: {
    titulo: "Please RSVP",
    texto: "Having you there means the world to us. Please let us know by March 15.",
    boton: "RSVP on WhatsApp",
    whatsapp: "",                     // número con código de país, sin + ni espacios (ej. 593991234567)
    mensaje: "Hi! I'm confirming my attendance at Princess {nombre}'s first birthday 👑"
  },

  // ---------- Despedida ----------
  despedida: {
    frase: "Thank you for being part of our little princess's fairy tale",
    cierre: "See You There!"          // se usa si no hay imagen dorada
  },

  // Pie de página: enlace a nuestros trabajos en la web (vacío marca = no aparece)
  credito: {
    texto: "Made with love by",
    marca: "Elegancia de Amor",
    boton: "See our work",
    enlace: "https://eleganciadeamor.com/#nuestros-trabajos"

  // ---------- Vista previa para el cliente (antes del pago final) ----------

  // Al entregar la invitación pagada: activa: false

    activa: false,
    texto: "SAMPLE · ELEGANCIA DE AMOR",
    color: "dorado",         // color de la marca de agua: "negro", "blanco" o "dorado"
    aviso: "Available in the final version ✨"
  },
  pausada: false,            // true = la invitación no se muestra (ej. si no se completa el pago)

  // ---------- Imágenes hechas con Gemini ----------
  // Vacío ("") = no se muestra o se usa la versión dibujada con código.
  imagenes: {
    portada: "recursos/portada.webp",            // cielo con el castillo, la carroza y las rosas (9:16)
    princesa1: "recursos/princesa-1.webp",       // princesita de pie saludando (sin fondo)
    princesa2: "recursos/princesa-2.webp",       // princesita sentada (sin fondo)
    nombreOro: "recursos/nombre-oro.webp",       // "Isabella" en dorado (si cambias el nombre, cambia o borra esta imagen)
    cinta: "recursos/cinta.webp",                // cinta celeste sin texto
    textoCinta: { y: 50, ancho: 58 },            // dónde va el texto sobre la cinta (%): alto del centro y ancho
    libro: "recursos/libro-castillo.webp",       // libro abierto con el castillo
    guirnalda: "recursos/guirnalda.webp",        // flores colgando arriba
    rosasAbajo: "recursos/rosas-abajo.webp",     // flores abajo
    fondoCielo: "recursos/fondo-cielo.webp",     // cielo con nubes (fondo fijo de toda la página)
    fondoAcuarela: "recursos/fondo-acuarela.webp", // hoja blanca con acuarela y castillo (mensaje de los papitos)
    pajarito: "recursos/pajarito.webp",          // pajarito celeste volando (mira a la derecha)
    corona: "recursos/corona.webp",              // corona dorada (tarjetas, cuento y despedida)
    marcoFoto: "recursos/marco-foto.webp",       // marco redondo dorado con corona
    huecoFoto: { x: 49.9, y: 51, d: 59.5 },      // centro (%) y diámetro (% del ancho) del hueco del marco redondo
    iconoCalendario: "recursos/icono-calendario.webp",
    iconoReloj: "recursos/icono-reloj.webp",
    iconoUbicacion: "recursos/icono-ubicacion.webp",
    iconoVestimenta: "recursos/icono-vestimenta.webp",   // vestido celeste en gancho dorado
    iconoRopa: "recursos/icono-vestimenta.webp",         // ropa (el mismo vestido; se puede cambiar por un vestidito de bebé)
    iconoCalzado: "recursos/icono-calzado.webp",         // zapatitos
    iconoJuguetes: "recursos/icono-juguetes.webp",
    teEsperamos: "recursos/see-you-there-oro.webp" // "See You There!" en dorado 3D. Vacío = letras doradas con código
  },

  destellosCayendo: true,    // destellos dorados cayendo

  // ---------- Música ----------
  // Archivo mp3 dentro de "recursos". Vacío ("") = sin música y sin botón.
  musica: "recursos/musica.mp3"     // "Happy 1st Birthday" (One Year Old Song), 2:22, con fundidos
};
</script>

:root {

* { box-sizing: border-box; margin: 0; padding: 0; }

body.bloqueado { overflow: hidden; height: 100vh; }

a { color: inherit; text-decoration: none; }

/* Columna central (formato celular). "cqw" = 1 % del ancho de la columna */
.invitacion { position: relative; z-index: 1; width: 100%; max-width: var(--ancho); margin: 0 auto; container-type: inline-size; overflow: hidden; box-shadow: 0 0 60px rgba(40, 80, 130, .25); }

  background: radial-gradient(ellipse 70% 30% at 20% 18%, rgba(255, 255, 255, .9), transparent 70%), radial-gradient(ellipse 60% 26% at 85% 55%, rgba(255, 255, 255, .75), transparent 70%), radial-gradient(ellipse 80% 30% at 30% 92%, rgba(255, 255, 255, .85), transparent 70%), linear-gradient(180deg, #c9e0f5 0%, #e3effa 50%, #d3e6f7 100%); }

/* Destellos que titilan */
.destellos { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.destellos i, .estrella {
  position: absolute; width: var(--t, 10px); aspect-ratio: 1; opacity: 0;
  background: radial-gradient(circle, #fff 0 14%, #f3d27a 34%, rgba(226, 185, 85, .5) 50%, transparent 70%);
  clip-path: polygon(50% 0, 59% 41%, 100% 50%, 59% 59%, 50% 100%, 41% 59%, 0 50%, 41% 41%);
  animation: titila var(--d, 3s) var(--r, 0s) ease-in-out infinite;
}
@keyframes titila { 0%, 100% { opacity: 0; transform: scale(.4) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }

/* Corona dibujada con código (si no hay imagen) */
.corona-css { position: relative; width: 100%; aspect-ratio: 1.5; background: var(--dorado);

/* Nubes hechas con código (abajo del libro y de la portada sin imagen) */
.nubes { position: absolute; left: -10%; right: -10%; bottom: 0; height: 34cqw; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse 22% 42% at 10% 62%, #fff 60%, transparent 62%), radial-gradient(ellipse 20% 46% at 30% 54%, #fff 60%, transparent 62%), radial-gradient(ellipse 24% 50% at 52% 58%, #fff 60%, transparent 62%), radial-gradient(ellipse 20% 44% at 74% 56%, #fff 60%, transparent 62%), radial-gradient(ellipse 22% 42% at 92% 62%, #fff 60%, transparent 62%);
  filter: blur(2px);
  -webkit-mask-image: linear-gradient(#000 55%, transparent 96%);
          mask-image: linear-gradient(#000 55%, transparent 96%); }

/* Textos */
.titulo-script { font: 400 var(--tam, 12cqw)/1.15 var(--script); color: var(--azul); padding: 0 .1em; }
.subtitulo { font: 600 3.4cqw/1.4 var(--real); letter-spacing: .18em; text-transform: uppercase; color: var(--oro); }

.sobre-css .carta { position: absolute; left: 50%; top: 56%; width: 76%; aspect-ratio: 1.42; transform: translate(-50%, -50%); border-radius: 1.6cqw; background: linear-gradient(160deg, #cfe4f7, #9fc8ec); box-shadow: 0 6cqw 10cqw rgba(40, 80, 130, .35), inset 0 0 0 1.2cqw #b6d6f2, inset 0 0 0 1.6cqw #d9b45a; }
.sobre-css .carta::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, #ffffff, #e5f0fa); clip-path: polygon(0 0, 100% 0, 50% 58%); filter: drop-shadow(0 1px 0 #b98a2e); }
.sobre-css .lazo { position: absolute; left: 0; right: 0; top: 50%; height: 9%; translate: 0 -50%; background: linear-gradient(180deg, #a9d0f1, #7fb2df 60%, #a9d0f1); box-shadow: 0 0 0 .5cqw #d9b45a; }
.sobre-css .sello-css { position: absolute; left: 50%; top: 58%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff0c0, #e2b85a 40%, #a8781f 100%); box-shadow: 0 1cqw 2cqw rgba(40, 60, 90, .4), inset 0 0 0 .8cqw rgba(140, 95, 20, .5); display: flex; align-items: center; justify-content: center; }
.sobre-css .sello-css .corona-css { width: 56%; background: linear-gradient(180deg, #8a5f14, #6d4a0c); filter: none; }
.sobre-css .nubes { height: 30%; }

/* ------------------------------------------------------------
   2. PORTADA
   ------------------------------------------------------------ */
#portada { background: linear-gradient(180deg, #b7d6f2 0%, #d6e8f8 38%, #eef6fd 70%, #dcebf8 100%); }
#portada .portada-img { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; transform: scale(1.08); transform-origin: 50% 100%; }
#portada.visible .portada-img { animation: acerca 9s ease-out forwards; }
@keyframes acerca { to { transform: scale(1); } }
#portada .encabezado { position: absolute; left: 0; right: 0; top: 6cqw; z-index: 3; display: flex; flex-direction: column; align-items: center; }
#portada .princesa-portada { width: 46cqw; opacity: 0; transform: translateY(-4cqw) scale(.92); }
#portada .princesa-portada img { width: 100%; height: auto; filter: drop-shadow(0 8px 12px rgba(40, 80, 130, .3)); }
#portada .princesa-portada.sin-imagen { width: 34cqw; margin: 14cqw 0 4cqw; }
#portada .nombre { width: 86cqw; min-height: 24cqw; margin-top: -13cqw; opacity: 0; transform: scale(.9); }
#portada .princesa-portada.sin-imagen + .nombre { margin-top: 0; }
#portada .cinta { margin-top: -2cqw; opacity: 0; transform: translateY(3cqw); }
#portada.visible .princesa-portada { animation: nombre 1.2s .2s cubic-bezier(.2, .8, .3, 1) forwards; }
#portada.visible .nombre { animation: nombre 1.3s .8s cubic-bezier(.2, .8, .3, 1) forwards; }
#portada.visible .cinta { animation: sube .9s 1.5s ease-out forwards; }
@keyframes nombre { to { opacity: 1; transform: none; } }
@keyframes sube { to { opacity: 1; transform: none; } }
.estrella { z-index: 3; }
/* Estallido de destellos dorados al aparecer el nombre */
.estallido { position: absolute; left: 50%; top: 50%; z-index: 4; width: 0; height: 0; pointer-events: none; }
.estallido i { position: absolute; left: 0; top: 0; width: var(--t); aspect-ratio: 1; margin: calc(var(--t) / -2); opacity: 0;
  background: radial-gradient(circle, #fff 0 16%, #f3d27a 36%, transparent 70%); clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); }
#portada.visible .estallido i { animation: estalla 1.6s var(--r) cubic-bezier(.15, .7, .3, 1) forwards; }
@keyframes estalla { 0% { opacity: 0; transform: translate(0, 0) scale(.3); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1) rotate(160deg); } }
#portada .baja { position: absolute; left: 50%; bottom: 5cqw; z-index: 4; translate: -50% 0; font: 600 3cqw/1 var(--real); letter-spacing: .25em; padding-left: .25em; text-transform: uppercase; color: var(--azul-osc); text-shadow: 0 0 6px #fff, 0 0 2px #fff; animation: flota 2s ease-in-out infinite; }
#portada .baja::after { content: ""; display: block; width: 2.6cqw; height: 2.6cqw; margin: 2cqw auto 0; border-right: 2px solid var(--oro); border-bottom: 2px solid var(--oro); transform: rotate(45deg); }
@keyframes flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.6cqw); } }

/* ------------------------------------------------------------
   3. HABÍA UNA VEZ
   ------------------------------------------------------------ */
#cuento { display: flex; flex-direction: column; justify-content: center; padding: 30cqw 0 18cqw; }
#cuento .inicio { font: 400 19cqw/1.05 var(--script); color: var(--azul); text-shadow: 0 0 10px rgba(255, 255, 255, .9); padding: 0 .1em; }
#cuento .libro { position: relative; z-index: 2; width: 84cqw; margin: 4cqw auto 0; }
#cuento .libro img { width: 100%; height: auto; filter: drop-shadow(0 10px 14px rgba(40, 80, 130, .25)); }
#cuento .libro.sin-imagen { width: 44cqw; margin-top: 10cqw; }
#cuento .libro .flota { animation-delay: 2s; }
#cuento .nubes { height: 40cqw; }

/* ------------------------------------------------------------
   4. EN UN REINO MUY LEJANO
   ------------------------------------------------------------ */
#reino { display: flex; flex-direction: column; justify-content: center; padding: 32cqw 0 40cqw; background: linear-gradient(transparent, rgba(255, 255, 255, .55) 30%, rgba(255, 255, 255, .55) 70%, transparent); }
#reino .corona-grande { width: 38cqw; margin: 0 auto; filter: drop-shadow(0 6px 8px rgba(90, 60, 10, .25)); }
#reino .relato-texto { width: 82cqw; margin: 6cqw auto 0; --tam: 7.4cqw; }
#reino .nombre { width: 84cqw; min-height: 22cqw; margin: 3cqw auto 0; }

/* ------------------------------------------------------------
   5. MENSAJE DE LOS PAPITOS
   ------------------------------------------------------------ */
#papitos { padding: 30cqw 0 66cqw; }
#papitos .fondo-hoja { position: absolute; inset: 0; z-index: 0;
  background: var(--img, radial-gradient(ellipse 60% 34% at 12% 8%, rgba(140, 195, 240, .55), transparent 70%) 0 0 / 100% 100%, radial-gradient(ellipse 40% 26% at 92% 30%, rgba(160, 205, 242, .35), transparent 70%) 0 0 / 100% 100%, #fffefb) 50% 50% / cover no-repeat;
  -webkit-mask-image: linear-gradient(transparent 0, #000 14cqw, #000 calc(100% - 10cqw), transparent);
          mask-image: linear-gradient(transparent 0, #000 14cqw, #000 calc(100% - 10cqw), transparent); }
#papitos .relato-texto { width: 82cqw; margin: 0 auto; --tam: 6.9cqw; }
#papitos .firma { margin-top: 6cqw; font: 600 3.4cqw/1.3 var(--real); letter-spacing: .16em; text-transform: uppercase; color: var(--oro); }
#papitos .padres { margin-top: 1cqw; font: 400 11cqw/1.1 var(--script); color: var(--azul); }
#papitos .princesa-esquina { position: absolute; z-index: 4; left: 2cqw; bottom: 6cqw; width: 44cqw; }
#papitos .princesa-esquina img { width: 100%; height: auto; filter: drop-shadow(0 6px 10px rgba(40, 80, 130, .25)); }

/* ------------------------------------------------------------
   6. FOTOS EN CÍRCULOS
   ------------------------------------------------------------ */
#fotos { padding: 26cqw 0 30cqw; }
#fotos .titulo-script { --tam: 14cqw; text-shadow: 0 0 10px rgba(255, 255, 255, .9); }
.fotos { position: relative; width: 100%; margin-top: 4cqw; }
.foto-item { position: relative; width: 60cqw; aspect-ratio: 680 / 695; opacity: 0; transform: scale(.6) rotate(-8deg); transition: opacity .8s ease, transform 1s cubic-bezier(.2, .9, .3, 1.2); }
.foto-item:nth-child(1) { margin-left: 5cqw; }
.foto-item:nth-child(2) { margin: -18cqw 0 0 35cqw; transform: scale(.6) rotate(8deg); transition-delay: .45s; }
.foto-item:nth-child(3) { margin: -18cqw 0 0 5cqw; transition-delay: .9s; }
.fotos.visible .foto-item { opacity: 1; transform: none; }
.foto-item .circulo { position: absolute; z-index: 1; aspect-ratio: 1; border-radius: 50%; overflow: hidden; translate: -50% -50%; background: radial-gradient(circle at 50% 40%, #f3f8fd, #bcd8f1); display: flex; align-items: center; justify-content: center; }
.foto-item .circulo img { width: 100%; height: 100%; object-fit: cover; }
.foto-item .circulo .corona-img { width: 56%; height: auto; object-fit: contain; }
.foto-item .marco-foto-img { position: relative; z-index: 2; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 12px rgba(40, 80, 130, .3)); }
/* Sin imagen del marco: aro dorado con código */
.foto-item.sin-marco { aspect-ratio: 1; width: 54cqw; }
.foto-item.sin-marco .circulo { left: 50%; top: 50%; width: 100%; height: 100%; box-shadow: 0 0 0 1.4cqw #cfe3f6, 0 0 0 3cqw #d9b45a, 0 0 0 3.6cqw #a8781f, 0 12px 26px rgba(40, 80, 130, .35); }
#fotos .pajarito { right: 4cqw; top: 40cqw; --w: 22cqw; }
#fotos .princesa-esquina { position: absolute; z-index: 4; right: 0; bottom: 4cqw; width: 40cqw; }
#fotos .princesa-esquina img { width: 100%; height: auto; filter: drop-shadow(0 6px 10px rgba(40, 80, 130, .25)); }

/* ------------------------------------------------------------
   7. ACOMPÁÑANOS A CELEBRAR 365 DÍAS
   ------------------------------------------------------------ */
#acompanos { padding: 22cqw 0 0; display: flex; flex-direction: column; align-items: center; }
#acompanos .cinta { width: 86cqw; }
#acompanos .cinta span { font-size: 5cqw; }
#acompanos .arriba { margin-top: 5cqw; font: italic 500 8cqw/1.2 var(--serif); color: var(--azul); }
#acompanos .numero-grande { font: 700 27cqw/1 var(--real); font-variant-numeric: lining-nums tabular-nums; font-feature-settings: 'lnum' 1, 'tnum' 1; margin-top: 1cqw; }
#acompanos .abajo { margin-top: 1cqw; font: italic 500 8cqw/1.2 var(--serif); color: var(--azul); }
#acompanos .final { font: 400 24cqw/1.1 var(--script); color: var(--azul); padding: 0 .12em; }
#acompanos .princesa-centro { width: 52cqw; margin-top: 4cqw; }
#acompanos .princesa-centro img { width: 100%; height: auto; filter: drop-shadow(0 8px 12px rgba(40, 80, 130, .3)); }
#acompanos .espacio-rosas { height: 14cqw; }

/* ------------------------------------------------------------
   TARJETAS (blancas con borde celeste y dorado)
   ------------------------------------------------------------ */
.bloque { padding: 24cqw 0 0; }
.tarjeta { position: relative; width: 84cqw; margin: 0 auto; padding: 16cqw 7cqw 12cqw; border-radius: 5cqw; background: radial-gradient(ellipse at 50% 25%, #ffffff, #f4f9fe 100%);
  box-shadow: 0 0 0 1.8cqw #cfe3f6, 0 0 0 2.3cqw #d9b45a, 0 16px 34px rgba(40, 80, 130, .25), inset 0 0 0 1.4cqw #fff, inset 0 0 0 1.7cqw rgba(185, 138, 46, .45); }
.tarjeta::before, .tarjeta::after { content: ""; position: absolute; width: 3.6cqw; aspect-ratio: 1; background: #9cc7ea; transform: rotate(45deg); box-shadow: 0 0 0 .5cqw #e2c06a; }
.tarjeta::before { left: 4.6cqw; bottom: 4.6cqw; }
.tarjeta::after { right: 4.6cqw; bottom: 4.6cqw; }
.tarjeta > * { position: relative; z-index: 1; }
.tarjeta .corona-top { position: absolute; z-index: 3; left: 50%; top: -12cqw; width: 26cqw; translate: -50% 0; filter: drop-shadow(0 4px 6px rgba(90, 60, 10, .2)); }
.tarjeta .pajarito { position: absolute; top: -14cqw; --w: 18cqw; }
.tarjeta .pajarito.izq { left: 3cqw; }
.tarjeta .pajarito.der { right: 3cqw; }
.tarjeta .titulo-script { --tam: 10.5cqw; white-space: nowrap; }
.tarjeta .titulo-script + .parrafo { margin-top: 3cqw; }
.icono { height: auto; margin: 0 auto; filter: drop-shadow(0 4px 6px rgba(80, 50, 10, .2)); }

/* ¿Cuándo y dónde? */
#cuando .intro { font: italic 500 6.4cqw/1.35 var(--serif); color: var(--azul); }
.fecha-fila { display: flex; flex-direction: column; align-items: center; margin-top: 4cqw; padding: 4cqw 0 3cqw; border-top: 2px dotted #d4ad55; border-bottom: 2px dotted #d4ad55; }
.fecha-fila .dia-semana { font: 600 4.4cqw/1 var(--real); letter-spacing: .24em; padding-left: .24em; text-transform: uppercase; color: var(--azul-osc); }
.fecha-fila .dia-numero { margin-top: 1.5cqw; font: 700 17cqw/1 var(--real); font-variant-numeric: lining-nums; font-feature-settings: 'lnum' 1; color: var(--azul); }
.fecha-fila .mes { font: 400 10cqw/1.15 var(--script); color: var(--oro); white-space: nowrap; padding: 0 .1em; }
.dato { margin-top: 6cqw; }
.dato .icono { width: auto; height: 17cqw; margin-bottom: 1.5cqw; }
.dato .etiqueta { font: 600 3.2cqw/1.3 var(--real); letter-spacing: .18em; text-transform: uppercase; color: var(--oro); }
.dato .valor { margin-top: 1cqw; font: 600 5.6cqw/1.3 var(--serif); color: var(--texto); }
.dato .valor small { display: block; margin-top: 1cqw; font: 500 4.5cqw/1.35 var(--serif); }
#cuando .icono-fecha { width: auto; height: 16cqw; margin: 6cqw auto 0; }
.separador { width: 40cqw; height: 1px; margin: 6cqw auto 0; background: linear-gradient(90deg, transparent, #c99a3a, transparent); }
.mapa { width: 100%; aspect-ratio: 4 / 3; margin-top: 6cqw; border: 0; border-radius: 3cqw; box-shadow: 0 0 0 1cqw #d9b45a; }
.boton-linea { display: inline-block; margin-top: 6cqw; padding: 3cqw 8cqw; border: 1.5px solid var(--azul); border-radius: 99px; font: 600 3.6cqw/1 var(--real); letter-spacing: .12em; text-transform: uppercase; color: var(--azul-osc); background: rgba(255, 255, 255, .7); transition: transform .2s ease, background .2s; }
.boton-linea:active { transform: scale(.96); background: rgba(156, 199, 234, .25); }

/* Cuenta regresiva */
#cuenta { padding-top: 22cqw; }
#cuenta .titulo-script { --tam: 15cqw; text-shadow: 0 0 10px rgba(255, 255, 255, .9); }
#cuenta .subtitulo { margin-top: 1cqw; color: var(--azul-osc); text-shadow: 0 0 6px #fff; }
.contador { display: flex; justify-content: center; gap: 2.6cqw; width: 90cqw; margin: 6cqw auto 0; }
.contador > div { flex: 1; padding: 4cqw 0 3.4cqw; border-radius: 3cqw; background: linear-gradient(180deg, #ffffff, #e9f3fc); box-shadow: 0 0 0 .7cqw #d9b45a, 0 0 0 1.4cqw #cfe3f6, 0 10px 22px rgba(40, 80, 130, .25); }
.contador b { display: block; font: 700 9.6cqw/1 var(--real); font-variant-numeric: lining-nums tabular-nums; font-feature-settings: 'lnum' 1, 'tnum' 1; color: transparent; background: var(--dorado); -webkit-background-clip: text; background-clip: text; }
.contador span { display: block; margin-top: 2cqw; font: 600 2.5cqw/1 var(--real); letter-spacing: .14em; text-transform: uppercase; color: var(--azul-osc); }
.contador .terminado { padding: 4cqw; font: 400 11cqw/1 var(--script); color: transparent; background: var(--dorado); -webkit-background-clip: text; background-clip: text; }

/* Vestimenta */
#vestimenta .icono { width: 34cqw; margin-top: 5cqw; }
#vestimenta .estilo { margin-top: 4cqw; font: 600 6cqw/1.3 var(--serif); color: var(--texto); }
.tonos { display: flex; justify-content: center; gap: 3cqw; margin-top: 4cqw; }
.tonos i { width: 9cqw; aspect-ratio: 1; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 .6cqw #fff, 0 0 0 1cqw #c99a3a, 0 3px 6px rgba(40, 80, 130, .25); }

/* Sugerencia de regalo */
.lista-regalos { margin-top: 5cqw; text-align: left; }
.lista-regalos li { list-style: none; display: flex; align-items: center; gap: 4cqw; padding: 3cqw 2cqw; border-bottom: 1px solid rgba(185, 138, 46, .35); }
.lista-regalos li:last-child { border-bottom: 0; }
.lista-regalos .ic { flex: 0 0 18cqw; height: 18cqw; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: radial-gradient(circle, #ffffff, #e4f0fb); box-shadow: 0 0 0 .6cqw #d9b45a; }
.lista-regalos .ic img { width: 82%; height: 82%; object-fit: contain; }
.lista-regalos .ic .punto { width: 4cqw; aspect-ratio: 1; background: var(--celeste); transform: rotate(45deg); box-shadow: 0 0 0 .6cqw #d9b45a; }
.lista-regalos b { display: block; font: 600 5.4cqw/1.2 var(--real); color: var(--azul-osc); }
.lista-regalos small { display: block; margin-top: .8cqw; font: 600 4.4cqw/1.2 var(--serif); color: var(--oro); }
#regalos .nota { margin-top: 5cqw; font: 400 7.6cqw/1.2 var(--script); color: var(--azul); }

/* Confirmación */
.boton-oro { display: inline-flex; align-items: center; gap: 2cqw; max-width: 100%; margin-top: 7cqw; padding: 4cqw 5cqw; border-radius: 99px; background: linear-gradient(180deg, #fbe7a6 0%, #e8c068 38%, #c9952f 70%, #e9c46c 100%); color: #3a2a08; font: 700 3.1cqw/1 var(--real); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 6px 18px rgba(80, 50, 10, .3), inset 0 2px 0 rgba(255, 255, 255, .65), inset 0 -2px 3px rgba(130, 80, 10, .35); transition: transform .2s ease; }
.boton-oro:active { transform: scale(.96); }
.boton-oro svg { width: 5.4cqw; height: 5.4cqw; fill: currentColor; }

/* Despedida */
#despedida { padding: 26cqw 0 44cqw; }
#despedida .corona-grande { width: 34cqw; margin: 0 auto; filter: drop-shadow(0 6px 8px rgba(90, 60, 10, .25)); }
#despedida .frase { width: 80cqw; margin: 6cqw auto 0; font: italic 500 6.6cqw/1.4 var(--serif); color: var(--azul); text-shadow: 0 0 8px #fff, 0 0 3px #fff; }
#despedida .te-esperamos { width: 86cqw; height: auto; margin: 5cqw auto 0; filter: drop-shadow(0 2px 3px rgba(60, 40, 10, .35)); }
#despedida .te-esperamos-texto { margin-top: 5cqw; font: 400 18cqw/1.05 var(--script); color: transparent; background: var(--dorado); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 1px 1px rgba(60, 40, 10, .35)); padding: 0 .1em; }
#despedida .princesa-centro { position: relative; width: 50cqw; margin: 4cqw auto 0; }
#despedida .princesa-centro img { width: 100%; height: auto; filter: drop-shadow(0 8px 12px rgba(40, 80, 130, .3)); }
#despedida .escena-final { position: relative; }
#despedida .pajarito.izq { left: 6cqw; top: 8cqw; --w: 19cqw; }
#despedida .pajarito.der { right: 6cqw; top: 22cqw; --w: 17cqw; }
.credito { position: relative; z-index: 5; display: block; width: fit-content; margin: 16cqw auto 0; padding: 3.4cqw 7cqw 3.6cqw; border-radius: 4cqw; background: rgba(255, 253, 248, .94); box-shadow: 0 6px 18px rgba(40, 80, 130, .25); font: 600 2.8cqw/1.6 var(--real); letter-spacing: .2em; text-transform: uppercase; color: rgba(36, 70, 122, .75); transition: background .3s; }
.credito:active { background: #fffdf8; }
.credito b { display: block; font: 400 8cqw/1.15 var(--script); letter-spacing: 0; text-transform: none; color: var(--oro); }
.credito em { display: inline-block; margin-top: 1.6cqw; padding: 1.2cqw 3.6cqw; border: 1px solid rgba(185, 138, 46, .6); border-radius: 99px; font: 600 2.7cqw/1 var(--real); font-style: normal; letter-spacing: .14em; color: var(--azul-osc); }

/* ------------------------------------------------------------
   VISTA PREVIA (modo muestra): marca de agua y protección
   ------------------------------------------------------------ */
#marca-agua { position: fixed; inset: 0; z-index: 101; pointer-events: none; background: var(--marca) 0 0 / 260px 200px repeat; }
body.muestra { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body.muestra img, body.muestra video { pointer-events: none; -webkit-user-drag: none; }
#aviso { position: fixed; left: 50%; bottom: 88px; z-index: 103; translate: -50% 0; padding: 10px 18px; border-radius: 99px; background: rgba(36, 70, 122, .95); color: #fffdf8; font: 600 15px/1.2 var(--serif); letter-spacing: .04em; white-space: nowrap; box-shadow: 0 6px 18px rgba(0, 0, 0, .25), inset 0 0 0 1px rgba(217, 180, 90, .6); opacity: 0; transform: translateY(10px); transition: opacity .3s, transform .3s; pointer-events: none; }
#aviso.ver { opacity: 1; transform: none; }
@media print { body.muestra > * { display: none !important; } }
.pausa { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 30px; text-align: center; background: radial-gradient(ellipse at 50% 40%, #f4f9fe, #cfe3f6); color: #24467a; font: 600 20px/1.5 var(--serif); }
.pausa b { font: 400 54px/1 var(--script); color: #ad7f1e; }

/* ------------------------------------------------------------
   DESTELLOS DORADOS CAYENDO
   ------------------------------------------------------------ */
#lluvia { position: fixed; inset: 0; z-index: 90; pointer-events: none; overflow: hidden; }
#lluvia i { position: absolute; top: -6vh; left: var(--x); width: var(--t); aspect-ratio: 1; opacity: .9;
  background: radial-gradient(circle, #fffbe8 0 16%, #e9c25e 36%, rgba(200, 150, 50, .4) 52%, transparent 70%);
  clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
  animation: cae var(--d) linear var(--r) infinite; will-change: transform; }
@keyframes cae { 0% { transform: translate3d(0, 0, 0) rotate(0deg); } 50% { transform: translate3d(var(--dx), 56vh, 0) rotate(180deg); } 100% { transform: translate3d(0, 112vh, 0) rotate(360deg); } }
body.esperando #lluvia { display: none; }

/* ------------------------------------------------------------
   BOTÓN DE MÚSICA (flotante)
   ------------------------------------------------------------ */
#musica-boton { position: fixed; right: 18px; bottom: 18px; width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(145deg, #f3d58c, #c4923a); box-shadow: 0 4px 12px rgba(40, 80, 130, .35), 0 0 0 2px #fff, 0 0 0 4px #9cc7ea; cursor: pointer; z-index: 102; display: none; justify-content: center; align-items: center; }
#musica-boton.visible { display: flex; animation: aparece .6s ease-out both; }
@keyframes aparece { from { opacity: 0; } to { opacity: 1; } }
#musica-boton:active { transform: scale(.92); }
#musica-boton::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(226, 192, 106, .9); animation: onda-musica 2s ease-out infinite; }
#musica-boton.pausado::before { animation: none; opacity: 0; }
@keyframes onda-musica { from { transform: scale(1); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
#musica-boton svg { width: 24px; height: 24px; fill: #24467a; }
#musica-boton .icono-play { display: none; }
#musica-boton.pausado .icono-play { display: block; }
#musica-boton.pausado .icono-pausa { display: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; transition-delay: 0s !important; } #lluvia { display: none; } }
</style>
</head>

<body class="bloqueado esperando">

<!-- ============================================================
     1. SOBRE (se llena desde el CONFIG)
     ============================================================ -->
<div id="sobre"></div>

<!-- Fondo fijo del cielo -->
<div id="fondo-fijo" aria-hidden="true"></div>

<div class="invitacion">

  <!-- ============================================================
       2. PORTADA
       ============================================================ -->
  <section id="portada" class="pantalla">
    <img class="portada-img" data-img="portada" alt="" loading="lazy" decoding="async" width="720" height="1280">
    <div class="nubes" id="portada-nubes"></div>
    <div class="destellos"></div>
    <div class="encabezado">
      <div class="princesa-portada" data-princesa="princesa1" data-respaldo="corona"></div>
      <div class="nombre" data-nombre><div class="estallido"></div></div>
      <div class="cinta" data-cinta="cinta"></div>

  <!-- ============================================================
       3. HABÍA UNA VEZ
       ============================================================ -->

    <img class="guirnalda" data-img="guirnalda" alt="" loading="lazy" decoding="async">
    <div class="destellos"></div>
    <div class="relato revela">
      <h2 class="inicio" id="cuento-inicio"></h2>
      <div class="libro despues" id="libro"></div>
    </div>
    <div class="nubes"></div>
  </section>

  <!-- ============================================================
       4. EN UN REINO MUY LEJANO…
       ============================================================ -->
  <section id="reino" class="pantalla">
    <img class="guirnalda" data-img="guirnalda" alt="" loading="lazy" decoding="async">
    <div class="destellos"></div>
    <div class="relato revela">
      <div class="corona-grande" data-corona></div>
      <p class="relato-texto" id="cuento-texto"></p>
      <div class="nombre despues" data-nombre></div>
    </div>
    <img class="rosas-abajo" data-img="rosasAbajo" alt="" loading="lazy" decoding="async">
  </section>

  <!-- ============================================================
       5. MENSAJE DE LOS PAPITOS
       ============================================================ -->
  <section id="papitos">
    <div class="fondo-hoja" id="fondo-hoja"></div>
    <div class="destellos"></div>
    <div class="relato revela">
      <p class="relato-texto" id="papitos-texto"></p>
      <p class="firma despues" id="papitos-firma"></p>
      <p class="padres despues" id="papitos-padres"></p>
    </div>
    <div class="princesa-esquina revela" data-princesa="princesa2"></div>
    <img class="rosas-abajo" data-img="rosasAbajo" alt="" loading="lazy" decoding="async">
  </section>

  <!-- ============================================================
       6. FOTOS EN CÍRCULOS DORADOS
       ============================================================ -->

    <div class="destellos"></div>
    <h2 class="titulo-script revela" id="fotos-titulo"></h2>
    <div class="fotos revela" id="fotos-lista"></div>
    <div class="pajarito der" data-pajarito></div>
    <div class="princesa-esquina revela" data-princesa="princesa2"></div>
  </section>

  <!-- ============================================================
       7. ACOMPÁÑANOS A CELEBRAR 365 DÍAS DE MUCHO AMOR
       ============================================================ -->
  <section id="acompanos">
    <div class="destellos"></div>
    <div class="cinta revela" data-cinta="acompanos"></div>
    <p class="arriba revela" id="acompanos-arriba"></p>
    <p class="numero-grande oro-texto revela" id="acompanos-numero" data-contar></p>
    <p class="abajo revela" id="acompanos-abajo"></p>
    <p class="final revela" id="acompanos-final"></p>
    <div class="princesa-centro revela" data-princesa="princesa1"></div>
    <div class="espacio-rosas"></div>
    <img class="rosas-abajo" data-img="rosasAbajo" alt="" loading="lazy" decoding="async">
  </section>

  <!-- ============================================================
       8. ¿CUÁNDO Y DÓNDE?
       ============================================================ -->
  <section class="bloque" id="cuando">
    <div class="tarjeta revela">
      <div class="corona-top" data-corona></div>
      <div class="pajarito izq" data-pajarito></div>
      <div class="pajarito der" data-pajarito></div>
      <p class="intro" id="lugar-intro"></p>
      <img class="icono icono-fecha" data-img="iconoCalendario" alt="" loading="lazy">
      <div class="fecha-fila">
        <span class="dia-semana" id="dia-semana"></span>
        <span class="dia-numero" id="dia-numero"></span>
        <span class="mes" id="mes-texto"></span>
      </div>
      <div class="dato">
        <img class="icono" data-img="iconoReloj" alt="" loading="lazy">
        <p class="etiqueta">Time</p>
        <p class="valor" id="hora-texto"></p>
      </div>
      <div class="separador"></div>
      <div class="dato">
        <img class="icono" data-img="iconoUbicacion" alt="" loading="lazy">
        <p class="etiqueta">Location</p>
        <p class="valor"><span id="lugar-nombre"></span><small id="lugar-direccion"></small></p>
      </div>
      <div id="mapa-caja"></div>
      <a class="boton-linea" id="mapa-boton" target="_blank" rel="noopener"></a>

  </section>

  <!-- ============================================================
       9. CUENTA REGRESIVA
       ============================================================ -->
  <section class="bloque" id="cuenta">
    <div class="destellos"></div>
    <h2 class="titulo-script revela" id="cuenta-titulo"></h2>
    <p class="subtitulo revela" id="cuenta-subtitulo"></p>
    <div class="contador revela" id="contador">
      <div><b id="dias">0</b><span></span></div>
      <div><b id="horas">00</b><span></span></div>
      <div><b id="minutos">00</b><span></span></div>
      <div><b id="segundos">00</b><span></span></div>

  <!-- ============================================================
       10. CÓDIGO DE VESTIMENTA
       ============================================================ -->
  <section class="bloque" id="vestimenta">
    <div class="tarjeta revela">
      <div class="corona-top" data-corona></div>
      <h2 class="titulo-script" id="vestimenta-titulo" style="--tam:9.4cqw"></h2>
      <img class="icono" data-img="iconoVestimenta" alt="" loading="lazy">
      <p class="estilo" id="vestimenta-estilo"></p>
      <p class="parrafo" id="vestimenta-texto"></p>
      <div class="tonos" id="tonos"></div>
    </div>
  </section>

  <!-- ============================================================
       11. SUGERENCIA DE REGALO
       ============================================================ -->
  <section class="bloque" id="regalos">
    <div class="tarjeta revela">
      <div class="corona-top" data-corona></div>
      <h2 class="titulo-script" id="regalos-titulo" style="--tam:9.6cqw"></h2>
      <ul class="lista-regalos" id="lista-regalos"></ul>

  </section>

  <!-- ============================================================
       12. CONFIRMACIÓN
       ============================================================ -->
  <section class="bloque" id="confirmacion">
    <div class="tarjeta revela">
      <div class="corona-top" data-corona></div>
      <h2 class="titulo-script" id="confirmacion-titulo" style="--tam:9.6cqw"></h2>
      <p class="parrafo" id="confirmacion-texto"></p>
      <a class="boton-oro" id="confirmacion-boton" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.4-.9-2.8-1.2-4.6-4.1-4.7-4.3-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.7-.1 1.3z"/></svg><span></span>
      </a>
    </div>
  </section>

  <!-- ============================================================
       13. ¡TE ESPERAMOS!
       ============================================================ -->
  <section id="despedida">
    <div class="destellos"></div>
    <div class="corona-grande revela" data-corona></div>
    <div class="revela" id="te-esperamos"></div>
    <p class="frase revela" id="despedida-frase"></p>
    <div class="escena-final">
      <div class="princesa-centro revela" data-princesa="princesa1"></div>
      <div class="pajarito izq" data-pajarito></div>
      <div class="pajarito der" data-pajarito></div>
    </div>
    <a class="credito" id="credito" target="_blank" rel="noopener"></a>
    <img class="rosas-abajo" data-img="rosasAbajo" alt="" loading="lazy" decoding="async">
  </section>

</div>

<div id="lluvia" aria-hidden="true"></div>

<audio id="musica" loop preload="metadata"></audio>
<div id="musica-boton" class="pausado" title="Music" aria-label="Music" role="button">
  <svg class="icono-pausa" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  <svg class="icono-play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
</div>

<script>
/* ============================================================
   FUNCIONAMIENTO (no hace falta tocar nada de aquí abajo)
   ============================================================ */
(function () {
  const $ = (id) => document.getElementById(id);
  // Invitación en pausa: solo se ve un aviso
  if (CONFIG.pausada) {
    document.body.className = '';
    document.body.innerHTML = '<div class="pausa"><b></b><p>This invitation is not available at the moment.</p></div>';
    document.querySelector('.pausa b').textContent = CONFIG.nombre;
    return;
  }
  const $$ = (sel, raiz) => [...(raiz || document).querySelectorAll(sel)];
  const IM = CONFIG.imagenes || {};
  const conNombre = (t) => String(t || '').replace(/\{nombre\}/g, CONFIG.nombre);
  const texto = (id, t) => { const el = $(id); if (el) el.textContent = conNombre(t); };
  const url = (ruta) => 'url("' + ruta + '")';
  const imagen = (ruta, clase, alt) => { const i = new Image(); i.loading = 'lazy'; i.decoding = 'async'; i.src = ruta; i.alt = alt || ''; if (clase) i.className = clase; return i; };
  const coronaCSS = () => { const d = document.createElement('div'); d.className = 'corona-css'; return d; };
  const corona = (clase) => { if (!IM.corona) return coronaCSS(); const i = imagen(IM.corona, clase || ''); i.onerror = () => i.replaceWith(coronaCSS()); return i; };

  /* ---------- Escribir letra por letra (devuelve cuánto dura, en ms) ---------- */
  const PASO = 32;   // milisegundos entre letra y letra
  function escribir(el, t, inicio) {
    el.textContent = '';
    let n = 0;
    conNombre(t).split('\n').forEach((linea, li) => {
      if (li) el.appendChild(document.createElement('br'));
      linea.split(' ').forEach((pal, pi) => {
        if (pi) el.appendChild(document.createTextNode(' '));
        const p = document.createElement('span'); p.className = 'palabra';
        [...pal].forEach(ch => {
          const s = document.createElement('span'); s.className = 'letra'; s.textContent = ch;
          s.style.transitionDelay = ((inicio || 0) + n++ * PASO) + 'ms';
          p.appendChild(s);
        });
        el.appendChild(p);
      });
    });
    return (inicio || 0) + n * PASO + 450;
  }
  const despues = (el, ms) => { if (el) el.style.setProperty('--tras', ms + 'ms'); };

  /* ---------- Fecha escrita ---------- */
  const fe = CONFIG.fecha;
  const fechaEvento = new Date(fe.anio, fe.mes - 1, fe.dia, fe.hora, fe.minuto, 0);
  const DIAS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MESES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const dos = (n) => String(n).padStart(2, '0');
  const horaTexto = ((fe.hora % 12) || 12) + ':' + dos(fe.minuto) + (fe.hora < 12 ? ' AM' : ' PM');

  /* ---------- Textos ---------- */
  document.title = 'My First Birthday · Princess ' + CONFIG.nombre;
  // Había una vez / En un reino muy lejano
  const tCuento = escribir($('cuento-inicio'), CONFIG.cuento.inicio, 300);
  despues($('libro'), tCuento - 200);
  const tReino = escribir($('cuento-texto'), CONFIG.cuento.texto, 900);
  despues(document.querySelector('#reino .nombre'), tReino);
  // Papitos
  const pa = CONFIG.papitos;
  const tPapitos = escribir($('papitos-texto'), pa.texto, 300);
  texto('papitos-firma', pa.firma); texto('papitos-padres', pa.padres);
  despues($('papitos-firma'), tPapitos); despues($('papitos-padres'), tPapitos + 400);
  // Fotos y Acompáñanos
  texto('fotos-titulo', CONFIG.fotos.titulo);
  if (!CONFIG.fotos.titulo) $('fotos-titulo').remove();
  const ac = CONFIG.acompanos;
  texto('acompanos-arriba', ac.arriba);
  $('acompanos-numero').textContent = ac.numero; $('acompanos-numero').dataset.contar = ac.numero;
  texto('acompanos-abajo', ac.abajo);
  texto('acompanos-final', ac.final);
  // ¿Cuándo y dónde?
  const lu = CONFIG.lugar;
  texto('lugar-intro', lu.intro);
  texto('dia-semana', DIAS[fechaEvento.getDay()]);
  texto('dia-numero', String(fe.dia));
  texto('mes-texto', MESES[fe.mes - 1]);
  texto('hora-texto', horaTexto);
  texto('lugar-nombre', lu.nombre);
  texto('lugar-direccion', lu.direccion);
  $('mapa-boton').href = lu.enlace;
  texto('mapa-boton', lu.boton);
  if (lu.mapa) {
    const f = document.createElement('iframe'); f.className = 'mapa'; f.src = lu.mapa; f.loading = 'lazy'; f.title = 'Map'; f.referrerPolicy = 'no-referrer-when-downgrade';
    $('mapa-caja').appendChild(f);
  }
  const cr = CONFIG.cuentaRegresiva;
  texto('cuenta-titulo', cr.titulo);
  texto('cuenta-subtitulo', cr.subtitulo);
  $$('#contador span').forEach((s, i) => s.textContent = cr.etiquetas[i]);
  const ve = CONFIG.vestimenta;
  if (ve.mostrar === false) $('vestimenta').remove();
  else {
    texto('vestimenta-titulo', ve.titulo);
    texto('vestimenta-estilo', ve.estilo);
    texto('vestimenta-texto', ve.texto);
    (ve.tonos || []).forEach(c => { const i = document.createElement('i'); i.style.setProperty('--c', c); $('tonos').appendChild(i); });
  }
  const rg = CONFIG.regalos;
  texto('regalos-titulo', rg.titulo);
  texto('regalos-nota', rg.nota);
  const ICONOS = { ropa: IM.iconoRopa, calzado: IM.iconoCalzado, juguetes: IM.iconoJuguetes };
  (rg.lista || []).forEach(r => {
    const li = document.createElement('li');
    li.innerHTML = '<span class="ic"></span><span><b></b><small></small></span>';
    const ruta = ICONOS[r.icono];
    const ic = li.querySelector('.ic');
    const punto = () => { ic.innerHTML = '<i class="punto"></i>'; };
    if (ruta) { const im = imagen(ruta, '', r.texto); im.onerror = punto; ic.appendChild(im); } else punto();
    li.querySelector('b').textContent = r.texto;
    if (r.detalle) li.querySelector('small').textContent = r.detalle; else li.querySelector('small').remove();
    $('lista-regalos').appendChild(li);
  });
  const co = CONFIG.confirmacion;
  texto('confirmacion-titulo', co.titulo);
  texto('confirmacion-texto', co.texto);
  $('confirmacion-boton').href = co.whatsapp ? 'https://wa.me/' + co.whatsapp + '?text=' + encodeURIComponent(conNombre(co.mensaje)) : '#';
  $('confirmacion-boton').querySelector('span').textContent = co.boton;
  texto('despedida-frase', CONFIG.despedida.frase);
  const cd = CONFIG.credito || {};
  if (cd.marca) {
    $('credito').href = cd.enlace || '#';
    $('credito').innerHTML = '<span></span><b></b><em></em>';
    $('credito').children[0].textContent = cd.texto; $('credito').children[1].textContent = cd.marca; $('credito').children[2].textContent = cd.boton + ' ›';
  } else $('credito').remove();

  /* ---------- Nombre (imagen dorada de IA o letras doradas) ---------- */
  $$('[data-nombre]').forEach(caja => {
    const conTexto = () => { const s = document.createElement('span'); s.className = 'script-oro'; s.textContent = CONFIG.nombre; caja.querySelector('img') ? caja.querySelector('img').replaceWith(s) : caja.prepend(s); };
    if (IM.nombreOro) { const img = imagen(IM.nombreOro, '', CONFIG.nombre); img.onerror = conTexto; caja.prepend(img); }
    else conTexto();
    [[8, 20, 0], [62, 2, .9], [92, 58, 1.7], [30, 84, 2.3]].forEach(([x, y, r]) => {
      const e = document.createElement('i'); e.className = 'estrella';
      e.style.cssText = 'left:' + x + '%;top:' + y + '%;--t:14px;--d:2.6s;--r:' + (2 + r) + 's';
      caja.appendChild(e);
    });
  });
  // Estallido de destellos dorados detrás del nombre de la portada
  const est = document.querySelector('.estallido');
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2 + Math.random() * .3, d = 20 + Math.random() * 22;
    const e = document.createElement('i');
    e.style.cssText = '--t:' + (8 + Math.random() * 12).toFixed(0) + 'px;--dx:' + (Math.cos(a) * d).toFixed(1) + 'cqw;--dy:' + (Math.sin(a) * d * .7).toFixed(1) + 'cqw;--r:' + (1 + Math.random() * .4).toFixed(2) + 's';
    est.appendChild(e);
  }

  /* ---------- Cintas celestes (imagen de IA con texto encima, o hechas con código) ---------- */
  const tc = IM.textoCinta || {};
  $$('[data-cinta]').forEach(caja => {
    const s = document.createElement('span'); s.textContent = conNombre(caja.dataset.cinta === 'acompanos' ? CONFIG.acompanos.cinta : CONFIG.cinta);
    const sinImagen = () => { caja.classList.add('sin-imagen'); const im = caja.querySelector('img'); if (im) im.remove(); };
    if (IM.cinta) {
      const img = imagen(IM.cinta); img.onerror = sinImagen; caja.appendChild(img);
      if (tc.y) caja.style.setProperty('--ty', tc.y + '%');
      if (tc.ancho) caja.style.setProperty('--tw', tc.ancho + '%');
    } else sinImagen();
    caja.appendChild(s);
  });

  /* ---------- Princesita (imagen de IA; sin imagen, corona en la portada y nada en lo demás) ---------- */
  $$('[data-princesa]').forEach(caja => {
    const ruta = IM[caja.dataset.princesa];
    const respaldo = () => { if (caja.dataset.respaldo) { caja.innerHTML = ''; caja.classList.add('sin-imagen'); caja.appendChild(corona()); } else caja.remove(); };
    if (ruta) { const img = imagen(ruta, 'flota', CONFIG.nombre); img.onerror = respaldo; caja.appendChild(img); }
    else respaldo();
  });

  /* ---------- Pajaritos ---------- */
  $$('[data-pajarito]').forEach((caja, i) => {
    if (!IM.pajarito) { caja.remove(); return; }
    const img = imagen(IM.pajarito); img.style.animationDelay = (-i * .9) + 's'; img.onerror = () => caja.remove(); caja.appendChild(img);
  });

  /* ---------- Libro con el castillo (sin imagen: corona) ---------- */
  const libro = $('libro');
  const libroSin = () => { libro.innerHTML = ''; libro.classList.add('sin-imagen'); libro.appendChild(corona('flota')); };
  if (IM.libro) { const img = imagen(IM.libro, 'flota', ''); img.onerror = libroSin; libro.appendChild(img); } else libroSin();

  /* ---------- Coronas ---------- */
  $$('[data-corona]').forEach(caja => caja.appendChild(corona()));

  /* ---------- "Te Esperamos" (imagen dorada o letras) ---------- */
  const teCaja = $('te-esperamos');
  const teTexto = () => { teCaja.innerHTML = '<p class="te-esperamos-texto"></p>'; teCaja.firstChild.textContent = CONFIG.despedida.cierre; };
  if (IM.teEsperamos) { const img = imagen(IM.teEsperamos, 'te-esperamos', CONFIG.despedida.cierre); img.onerror = teTexto; teCaja.appendChild(img); }
  else teTexto();

  /* ---------- Imágenes de IA: si no están, se quitan ---------- */
  $$('img[data-img]').forEach(img => {
    const ruta = IM[img.dataset.img];
    if (ruta) { img.src = ruta; img.onerror = () => img.remove(); } else img.remove();
  });
  if (IM.portada) $('portada-nubes').remove();   // la portada de Gemini ya trae su cielo y sus flores
  if (IM.fondoCielo) { $('fondo-fijo').classList.add('con-imagen'); $('fondo-fijo').style.setProperty('--img', url(IM.fondoCielo)); }
  if (IM.fondoAcuarela) $('fondo-hoja').style.setProperty('--img', url(IM.fondoAcuarela));

  /* ---------- Fotos en círculos dorados ---------- */
  const hf = IM.huecoFoto || {};
  const fotos = (CONFIG.fotos.lista || []).slice(0, 3);
  const cuantas = fotos.length || 3;
  for (let i = 0; i < cuantas; i++) {
    const it = document.createElement('figure'); it.className = 'foto-item';
    const c = document.createElement('div'); c.className = 'circulo';
    it.appendChild(c);
    const conCorona = () => { c.innerHTML = ''; c.appendChild(corona('corona-img')); };
    if (fotos[i]) { const f = imagen(fotos[i], '', CONFIG.nombre); f.onerror = conCorona; c.appendChild(f); } else conCorona();
    const sinMarco = () => { it.classList.add('sin-marco'); c.removeAttribute('style'); const m = it.querySelector('.marco-foto-img'); if (m) m.remove(); };
    if (IM.marcoFoto && hf.d) {
      c.style.left = hf.x + '%'; c.style.top = hf.y + '%'; c.style.width = hf.d + '%';
      const m = imagen(IM.marcoFoto, 'marco-foto-img'); m.onerror = sinMarco; it.appendChild(m);
    } else sinMarco();
    $('fotos-lista').appendChild(it);
  }

  /* ---------- Destellos ---------- */
  $$('.destellos').forEach(capa => {
    for (let i = 0; i < 8; i++) {
      const d = document.createElement('i');
      d.style.cssText = 'left:' + (Math.random() * 94) + '%;top:' + (4 + Math.random() * 90) + '%;--t:' + (8 + Math.random() * 11).toFixed(0) + 'px;--d:' + (2.4 + Math.random() * 3).toFixed(1) + 's;--r:' + (Math.random() * 4).toFixed(1) + 's';
      capa.appendChild(d);
    }
  });

  /* ---------- Destellos dorados cayendo ---------- */
  if (CONFIG.destellosCayendo) {
    const capa = $('lluvia');
    for (let i = 0; i < 9; i++) {
      const p = document.createElement('i');
      p.style.cssText = '--x:' + (Math.random() * 100).toFixed(1) + '%;--t:' + (8 + Math.random() * 8).toFixed(0) + 'px;--d:' + (11 + Math.random() * 8).toFixed(1) + 's;--r:' + (-Math.random() * 16).toFixed(1) + 's;--dx:' + ((Math.random() - .5) * 110).toFixed(0) + 'px';
      capa.appendChild(p);
    }
  }

  /* ---------- Contar de 0 a 365 ---------- */
  function contar(el) {
    const fin = Number(el.dataset.contar) || 0, dura = 1800, t0 = performance.now();
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fin; return; }
    const paso = (t) => { const k = Math.min(1, (t - t0) / dura); el.textContent = Math.round(fin * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
  }

  /* ---------- Animaciones al aparecer en pantalla ---------- */
  const observador = new IntersectionObserver((entradas) => {
    entradas.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add('visible'); observador.unobserve(e.target);
      if (e.target.dataset.contar) contar(e.target);
    });
  }, { threshold: .15 });
  function observar() { $$('.revela').forEach(el => observador.observe(el)); }

  /* ---------- Cuenta regresiva ---------- */
  let reloj;
  function actualizarCuenta() {
    const resta = fechaEvento - new Date();
    if (resta <= 0) { $('contador').innerHTML = '<div class="terminado"></div>'; $('contador').firstChild.textContent = cr.terminado; clearInterval(reloj); return; }
    $('dias').textContent = String(Math.floor(resta / 86400000));
    $('horas').textContent = dos(Math.floor(resta % 86400000 / 3600000));
    $('minutos').textContent = dos(Math.floor(resta % 3600000 / 60000));
    $('segundos').textContent = dos(Math.floor(resta % 60000 / 1000));
  }
  reloj = setInterval(actualizarCuenta, 1000); actualizarCuenta();

  /* ---------- Aviso flotante (modo muestra o WhatsApp sin número) ---------- */
  const MU = CONFIG.muestra || {};
  const aviso = document.createElement('div'); aviso.id = 'aviso'; aviso.textContent = MU.aviso || ''; document.body.appendChild(aviso);
  let tAviso;
  const mostrarAviso = (e) => { e.preventDefault(); aviso.classList.add('ver'); clearTimeout(tAviso); tAviso = setTimeout(() => aviso.classList.remove('ver'), 2200); };
  if (!co.whatsapp) $('confirmacion-boton').addEventListener('click', mostrarAviso);

  /* ---------- Vista previa para el cliente: marca de agua y protección ---------- */
  if (MU.activa) {
    document.body.classList.add('muestra');
    const t = (MU.texto || 'MUESTRA').replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const tinta = { negro: ["rgba(15,8,8,.45)", "rgba(255,255,255,.3)"], blanco: ["rgba(255,255,255,.5)", "rgba(0,0,0,.2)"] }[MU.color] || ["rgba(190,145,50,.5)", "rgba(36,70,122,.3)"];
    const fila = (x, y) => "<text x='" + x + "' y='" + y + "' text-anchor='middle' font-family='Georgia,serif' font-size='14' font-weight='700' letter-spacing='2.5' fill='" + tinta[0] + "' stroke='" + tinta[1] + "' stroke-width='.5'>" + t + "</text>";
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='260' height='200'><g transform='rotate(-28 130 100)'>" + fila(130, 70) + fila(0, 160) + fila(260, 160) + "</g></svg>";
    const capa = document.createElement('div'); capa.id = 'marca-agua'; capa.setAttribute('aria-hidden', 'true');
    capa.style.setProperty('--marca', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
    document.body.appendChild(capa);
    // sin menú de clic derecho, sin arrastrar ni seleccionar, sin atajos de guardar/copiar/imprimir/ver código
    ['contextmenu', 'dragstart', 'selectstart', 'copy', 'cut'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
    document.addEventListener('keydown', e => {
      const k = (e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey;
      if (e.key === 'F12' || (mod && ['s', 'u', 'p', 'c', 'a'].includes(k)) || (mod && e.shiftKey && ['i', 'j', 'c'].includes(k))) e.preventDefault();
    });
    // mapa y WhatsApp: avisan que se activan en la versión final
    ['mapa-boton', 'confirmacion-boton'].forEach(id => $(id).addEventListener('click', mostrarAviso));
  }

  /* ---------- Música ---------- */
  const sobre = $('sobre'), musica = $('musica'), musicaBoton = $('musica-boton');
  if (CONFIG.musica) musica.src = CONFIG.musica;
  function reproducirMusica() {
    if (!CONFIG.musica) return;
    const intento = musica.play();
    if (intento && intento.then) intento.then(() => musicaBoton.classList.remove('pausado')).catch(() => musicaBoton.classList.add('pausado'));
  }
  document.addEventListener('touchend', () => { if (termino && musica.paused && !musica.dataset.pausadoPorUsuario) reproducirMusica(); }, { passive: true });
  musicaBoton.addEventListener('click', (e) => {
    e.stopPropagation();
    if (musica.paused) { delete musica.dataset.pausadoPorUsuario; reproducirMusica(); }
    else { musica.pause(); musica.dataset.pausadoPorUsuario = '1'; musicaBoton.classList.add('pausado'); }
  });

  /* ---------- Sobre: tocar → se abre → portada ---------- */
  let empezo = false, termino = false, video = null;
  function terminarSobre() {
    if (termino) return; termino = true;
    soltar();
    document.body.classList.remove('bloqueado');
    $('portada').classList.add('visible');
    sobre.classList.add('sale');
    setTimeout(() => sobre.remove(), 1000);
    observar();
    if (CONFIG.musica) {
      musicaBoton.classList.add('visible');
      if (musica.paused && !musica.dataset.pausadoPorUsuario) reproducirMusica();
    }
  }
  const SB = CONFIG.sobre;
  const conVideo = !!(SB.imagen && SB.video);
  sobre.innerHTML = '<div class="sobre-fondo"></div><div class="sobre-caja"><video playsinline webkit-playsinline preload="auto" muted></video><div class="sello"></div><div class="destello-oro"></div></div><div class="toca"></div>';
  const caja = sobre.querySelector('.sobre-caja');
  let sx = SB.selloX, sy = SB.selloY;
  if (!SB.imagen) {
    // Sobre dibujado con código (mientras no hay imagen de Gemini)
    caja.querySelector('video').remove(); video = null;
    const s = document.createElement('div'); s.className = 'sobre-css';
    s.innerHTML = '<p class="titulo-sobre"><span></span><b></b></p><div class="carta"><div class="lazo"></div><div class="sello-css"></div></div><div class="nubes"></div>';
    s.querySelector('.titulo-sobre span').textContent = 'Princess'; s.querySelector('.titulo-sobre b').textContent = CONFIG.nombre;
    s.querySelector('.sello-css').appendChild(coronaCSS());
    caja.prepend(s);
    sobre.querySelector('.sobre-fondo').style.background = 'radial-gradient(ellipse at 50% 30%, #f4f9fe, #bcd9f2)';
    sx = 50; sy = 58.4;
  } else {
    sobre.querySelector('.sobre-fondo').style.backgroundImage = url(SB.imagen);
    video = caja.querySelector('video');
    video.poster = SB.imagen; video.style.backgroundImage = url(SB.imagen);
  }
  if (!conVideo) sobre.classList.add('sin-video');
  sobre.style.setProperty('--sx', sx + '%'); sobre.style.setProperty('--sy', sy + '%');
  sobre.querySelector('.toca').textContent = SB.textoAbrir;
  const sello = sobre.querySelector('.sello'); sello.style.left = sx + '%'; sello.style.top = sy + '%';
  // El video empieza a bajar cuando ya se ve la portada del sobre (así la portada sale primero)
  const cargarVideo = () => { if (conVideo && video && !video.getAttribute('src')) video.src = SB.video; };
  if (video) {
    video.addEventListener('timeupdate', () => { if (video.duration && video.currentTime >= video.duration - .45) terminarSobre(); });
    video.addEventListener('ended', terminarSobre);
    video.addEventListener('error', () => { if (empezo) terminarSobre(); });
  }

  function abrirSobre() {
    if (empezo) return; empezo = true;
    soltar();
    sobre.classList.add('abierto');
    if (conVideo) {
      cargarVideo();
      if (CONFIG.musica) { reproducirMusica(); video.muted = true; } else video.muted = false;
      video.play().catch(() => { video.muted = true; video.play().catch(terminarSobre); });
      setTimeout(() => { if (video.currentTime < .1) terminarSobre(); }, 6000);
    } else {
      reproducirMusica();
      setTimeout(terminarSobre, 1700);      // se acerca al sello con luz dorada y se pasa a la portada
    }
  }
  sobre.addEventListener('click', abrirSobre);

  /* ---------- Velocidad: primero la portada del sobre y su video; el resto empieza a bajar después ---------- */
  function soltar() { document.body.classList.remove('esperando'); }
  if (SB.imagen) { const pre = new Image(); pre.onload = pre.onerror = () => { cargarVideo(); setTimeout(soltar, 1200); }; pre.src = SB.imagen; }
  else setTimeout(soltar, 1200);
  setTimeout(() => { cargarVideo(); soltar(); }, 5000);   // por si acaso

  // Para revisar sin ver el sobre: abre la página con ?directo al final de la dirección
  if (location.search.includes('directo')) { empezo = true; soltar(); terminarSobre(); }
})();
</script>
</body>
</html>
