      <p class="revela"><button class="boton" id="confirmar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.2-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.8-.1 1.4z"/></svg><span></span></button></p></div>

  <!-- 9 · el castillo de noche: te espero -->

    <div class="texto"><p class="parrafo revela" id="frase"></p><h2 class="script revela" style="--tam: 20cqw; margin-top: 2cqw">Te Espero</h2><h3 class="script revela" id="cierre-nombre" style="--tam: 12cqw"></h3><p class="caps revela fecha-corta" id="fecha-corta"></p></div>

<div id="petalos" aria-hidden="true"></div>
<button id="musica-boton" aria-label="Pausar o reanudar la música"><svg class="pausa" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg><svg class="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
<audio id="musica" loop preload="auto"></audio>
<div id="aviso" role="status"></div>

<script>
const C = CONFIG, $ = id => document.getElementById(id);
const pon = (id, t) => { const e = $(id); if (e) e.textContent = t; };
const el = (tag, cls, txt, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (css) e.style.cssText = css; return e; };
const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
const fe = C.fecha, MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DIA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const corta = String(fe.dia).padStart(2, '0') + ' · ' + String(fe.mes).padStart(2, '0') + ' · ' + fe.anio;
pon('pt-nombre', C.nombre); pon('pt-fecha', corta);
pon('m1', C.mensaje[0]); pon('m2', C.mensaje[1] || ''); pon('firma', C.nombre);
(() => {
  const f = $('familia');
  f.appendChild(el('p', 'caps revela', C.familia.titulo));
  const n = el('p', 'revela', null, 'margin-top: 4cqw');
  C.familia.nombres.forEach((x, i) => { if (i) n.appendChild(el('span', 'y', '&')); const s = el('span', 'script', x); s.style.setProperty('--tam', Math.min(11, 150 / Math.max(...C.familia.nombres.map(z => z.length))).toFixed(1) + 'cqw'); n.appendChild(s); n.appendChild(document.createElement('br')); });
  if (!C.familia.nombres.length && C.familia.porConfirmar) n.appendChild(el('span', 'pc', C.familia.porConfirmar, 'display:block'));
  f.appendChild(n);
})();
pon('invito', C.invitacion); pon('reserva', C.reserva); pon('falta', C.faltaPoco);
pon('dia-semana', DIA[new Date(fe.anio, fe.mes - 1, fe.dia).getDay()]); pon('dia', fe.dia); pon('anio', fe.anio); pon('mes', MES[fe.mes - 1]);
function lugar(id, d) {
  const t = $(id);
  t.appendChild(el('h2', 'script revela', d.titulo, '--tam: 15cqw'));
  const l = el('p', 'lugar revela'); l.appendChild(el('b', null, d.lugar)); if (d.direccion) l.appendChild(el('span', 'parrafo', d.direccion, 'font-size: 4.8cqw; display: block')); t.appendChild(l);
  const s = el('div', 'sep revela', null, 'margin: 4cqw auto'); s.innerHTML = '<i></i>'; t.appendChild(s);
  t.appendChild(el('p', 'hora revela', d.hora));
  if (d.mapa) { const p = el('p', 'revela'); const a = el('a', 'boton'); a.href = d.mapa; a.target = '_blank'; a.rel = 'noopener'; a.innerHTML = PIN; a.appendChild(el('span', null, d.boton)); p.appendChild(a); t.appendChild(p); }
}
lugar('recepcion', C.recepcion);
pon('vest-titulo', C.vestimenta.titulo); pon('vest-estilo', C.vestimenta.estilo); pon('vest-nota', C.vestimenta.nota);
if (!C.vestimenta.estilo) $('vest-estilo').remove();
pon('vest-reservado', C.vestimenta.reservado || ''); (C.vestimenta.colores || []).forEach(c => $('vest-colores').appendChild(el('i', null, null, 'background:' + c)));
pon('reg-titulo', C.regalos.titulo); pon('reg-texto', C.regalos.texto);
pon('sesion', C.sesion.titulo);
pon('conf-titulo', C.confirmacion.titulo); pon('conf-texto', C.confirmacion.texto); $('confirmar').querySelector('span').textContent = C.confirmacion.boton;
pon('frase', C.despedida.frase); pon('cierre-nombre', C.nombre); pon('fecha-corta', corta);
// ---- cuenta regresiva (hora de Colombia) ----
const evento = new Date(Date.UTC(fe.anio, fe.mes - 1, fe.dia, fe.hora - C.zonaUTC, fe.minuto));
function contar() {
  let r = Math.max(0, evento - new Date()); const d = Math.floor(r / 864e5); r -= d * 864e5; const h = Math.floor(r / 36e5); r -= h * 36e5; const m = Math.floor(r / 6e4); const s = Math.floor((r - m * 6e4) / 1e3);
  pon('dias', d); pon('horas', String(h).padStart(2, '0')); pon('minutos', String(m).padStart(2, '0')); pon('segundos', String(s).padStart(2, '0'));
}
contar(); setInterval(contar, 1000);
// ---- aparecer al bajar ----
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } }), { threshold: .2 });
const observar = () => document.querySelectorAll('.revela').forEach(x => io.observe(x));
// ---- pétalos de hortensia azul cristal y destellos de plata ----
const PE = $('petalos'), CO = [['#e4eefa', '#9fbbd8'], ['#f4f8fc', '#bcd2ea'], ['#ffffff', '#b9c6d4']];
for (let i = 0; i < 14; i++) { const e = document.createElement('i'), c = CO[i % 3];
  e.style.cssText = `left:${Math.random() * 100}%;--w:${8 + Math.random() * 9}px;--c1:${c[0]};--c2:${c[1]};--d:${9 + Math.random() * 9}s;--r:${-Math.random() * 18}s;--x:${-40 + Math.random() * 80}px`; PE.appendChild(e); }
// ---- música: arranca al tocar el sobre, desde el inicio ----
const mu = $('musica'), mb = $('musica-boton'); mu.src = C.musica;
function sonar() { mu.currentTime = 0; mu.volume = .7; mu.play().then(() => mb.classList.remove('pausado')).catch(() => mb.classList.add('pausado')); }
mb.addEventListener('click', e => { e.stopPropagation(); if (mu.paused) mu.play().then(() => mb.classList.remove('pausado')).catch(() => {}); else { mu.pause(); mb.classList.add('pausado'); } });
// ---- sobre ----
const ap = $('apertura'); ap.querySelector('.toca').textContent = C.textoAbrir;
const sv = $('sobre-video'); if (C.videoSobre) { sv.src = C.videoSobre; sv.poster = 'recursos/sobre.webp?v=4'; }
let pidio = false, termino = false;
function terminar() { if (termino) return; termino = true; ap.remove(); document.body.classList.remove('cerrado'); $('portada').classList.add('visible'); observar(); }
function salir() { ap.classList.add('sale'); $('portada').classList.add('visible'); setTimeout(terminar, 1000); }
function acercar() { if (ap.classList.contains('acerca')) return; ap.classList.add('acerca'); setTimeout(salir, 2200); }
ap.addEventListener('click', () => {
  if (pidio) return; pidio = true; ap.classList.add('abierto');
  sonar(); mb.classList.add('visible');
  if (!C.videoSobre) { acercar(); return; }
  sv.playbackRate = sv.defaultPlaybackRate = C.velocidadSobre || 1;
  sv.addEventListener('playing', () => ap.classList.add('con-video'), { once: true });
  sv.addEventListener('timeupdate', () => { if (sv.duration && sv.currentTime >= sv.duration - .45 && !ap.classList.contains('sale')) salir(); });
  sv.addEventListener('ended', () => { if (!ap.classList.contains('sale')) salir(); }); sv.addEventListener('error', acercar);
  sv.play().catch(acercar);
  setTimeout(() => { if (sv.currentTime < .1) acercar(); }, 3500);
});
if (location.search.includes('directo')) { pidio = true; terminar(); }
// ---- aviso flotante ----
let tAviso; function aviso(t) { const a = $('aviso'); a.textContent = t; a.classList.add('ver'); clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove('ver'), 2600); }
// ---- confirmar por WhatsApp (en la prueba: solo avisa) ----
$('confirmar').addEventListener('click', () => {
  const n = (C.confirmacion.whatsapp || '').replace(/\D/g, '');
  if (C.muestra.activa && !location.search.includes('sinmarca') || !n) { aviso(C.muestra.aviso); return; }
  open('https://wa.me/' + n + '?text=' + encodeURIComponent(C.confirmacion.mensaje), '_blank');
});
// ---- modo prueba: marca de agua desde el sobre y protección ----
if (C.muestra.activa && !location.search.includes('sinmarca')) {
  document.body.classList.add('muestra');
  const t = C.muestra.texto, tinta = ['rgba(10,18,34,.45)', 'rgba(255,255,255,.3)'];
  const fila = (x, y) => "<text x='" + x + "' y='" + y + "' text-anchor='middle' font-family='Georgia,serif' font-size='14' font-weight='700' letter-spacing='2.5' fill='" + tinta[0] + "' stroke='" + tinta[1] + "' stroke-width='.5'>" + t + "</text>";
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='260' height='200'><g transform='rotate(-28 130 100)'>" + fila(130, 70) + fila(0, 160) + fila(260, 160) + "</g></svg>";
  const capa = el('div'); capa.id = 'marca-agua'; capa.setAttribute('aria-hidden', 'true');
  capa.style.setProperty('--marca', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")'); document.body.appendChild(capa);
  ['contextmenu', 'dragstart', 'selectstart', 'copy', 'cut'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener('keydown', e => { const k = (e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey; if (e.key === 'F12' || (mod && ['s', 'u', 'p', 'c', 'a'].includes(k))) e.preventDefault(); });
}
</script>
