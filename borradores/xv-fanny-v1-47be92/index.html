    <div class="contador revela" style="--d:.2s" id="contador">
      <div><b id="dias">--</b><span></span></div>
      <div><b id="horas">--</b><span></span></div>
      <div><b id="minutos">--</b><span></span></div>
      <div><b id="segundos">--</b><span></span></div>
    </div>
    <p class="chico cuando revela" style="--d:.3s" id="cuenta-cuando"></p>
  </section>

  <!-- 5. PAPÁS Y PADRINOS -->
  <section id="familia">
    <div class="tarjeta">
      <img class="marco" src="recursos/marco-tarjeta.webp" alt="" loading="lazy" decoding="async">
      <div class="dentro">
        <h2 class="titulo revela" id="padres-titulo"></h2>
        <div class="nombres dato revela" style="--d:.15s" id="padres-nombres"></div>
        <span class="raya revela" style="--d:.25s"></span>
        <h2 class="titulo revela" style="--d:.3s" id="padrinos-titulo"></h2>
        <div class="nombres dato revela" style="--d:.45s" id="padrinos-nombres"></div>
      </div>
    </div>
  </section>

  <!-- 6. MISA Y FIESTA -->
  <section id="misa" class="evento">
    <div class="tarjeta espejo">
      <img class="marco" src="recursos/marco-tarjeta.webp" alt="" loading="lazy" decoding="async">
      <div class="dentro">
        <img class="icono revela" src="recursos/icono-iglesia.webp" alt="" loading="lazy">
        <h2 class="titulo revela" id="misa-titulo"></h2>
        <p class="hora revela" style="--d:.1s" id="misa-hora"></p>
        <p class="dato lugar revela" style="--d:.2s" id="misa-lugar"></p>
        <p class="chico dir revela" style="--d:.25s" id="misa-dir"></p>
        <a class="boton revela" style="--d:.35s" id="misa-mapa" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>Cómo llegar</a>
      </div>
    </div>
  </section>

  <section id="fiesta" class="evento">
    <div class="tarjeta">
      <img class="marco" src="recursos/marco-tarjeta.webp" alt="" loading="lazy" decoding="async">
      <div class="dentro">
        <img class="icono revela" src="recursos/icono-copas.webp" alt="" loading="lazy">
        <h2 class="titulo revela" id="fiesta-titulo"></h2>
        <p class="hora revela" style="--d:.1s" id="fiesta-hora"></p>
        <p class="dato lugar revela" style="--d:.2s" id="fiesta-lugar"></p>
        <p class="chico dir revela" style="--d:.25s" id="fiesta-dir"></p>
        <a class="boton revela" style="--d:.35s" id="fiesta-mapa" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>Cómo llegar</a>
      </div>
    </div>
  </section>

  <!-- 7. VESTIMENTA -->
  <section id="vestimenta" class="bloque">
    <img class="divisor revela" src="recursos/divisor.webp" alt="" loading="lazy">
    <img class="icono revela" style="margin-top:5cqw" src="recursos/icono-vestido.webp" alt="" loading="lazy">
    <h2 class="titulo revela" id="vestimenta-titulo" style="font-size:12.5cqw"></h2>
    <p class="estilo revela" style="--d:.15s" id="vestimenta-estilo"></p>
    <img class="vestido revela" style="--d:.25s" src="recursos/vestido.webp" alt="" loading="lazy">
    <p class="reservado revela" style="--d:.35s" id="vestimenta-nota"></p>
  </section>

  <!-- 8. CONFIRMACIÓN -->
  <section id="confirmacion">
    <div class="tarjeta">
      <img class="marco" src="recursos/marco-arco.webp" alt="" loading="lazy" decoding="async">
      <div class="dentro">
        <img class="icono revela" src="recursos/icono-sobre.webp" alt="" loading="lazy">
        <h2 class="titulo revela" id="confirmacion-titulo" style="font-size:12cqw"></h2>
        <p class="dato revela" style="--d:.15s;font-weight:500;font-style:italic" id="confirmacion-texto"></p>
        <a class="boton revela" style="--d:.3s" id="confirmacion-boton" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg><span id="confirmacion-boton-texto"></span></a>
      </div>
    </div>
  </section>

  <!-- 9. CIERRE -->
  <section id="cierre" class="bloque">
    <img class="ramo-arriba revela" src="recursos/ramo.webp" alt="" loading="lazy">
    <p class="frase revela" id="cierre-frase"></p>
    <img class="firma revela" style="--d:.2s" src="recursos/nombre-fanny.webp" alt="Fanny" loading="lazy">
    <p class="titulo te-espero revela" style="--d:.35s" id="cierre-firma"></p>
    <p class="caps revela" style="--d:.45s;font-size:3cqw;margin-top:2cqw" id="cierre-fecha"></p>
    <img class="ramo-abajo revela" src="recursos/ramo.webp" alt="" loading="lazy">
    <a class="credito" id="credito" target="_blank" rel="noopener"><span></span><b></b><em></em></a>
  </section>
</main>

<div id="flores" aria-hidden="true"></div>
<audio id="musica" loop preload="auto"></audio>
<div id="musica-boton" class="pausado" role="button" aria-label="Pausar o reproducir la música" tabindex="0">
  <svg class="pausa" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  <svg class="play" viewBox="0 0 24 24"><polygon points="7,4 20,12 7,20"/></svg>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const texto = (id, t) => { const el = $(id); if (el) el.textContent = t || ''; };
  const C = CONFIG;

  /* ---------- Textos ---------- */
  document.title = C.arriba + ' · ' + C.nombre;
  texto('arriba', C.arriba);
  texto('fecha-portada', C.fechaPortada);
  texto('bienvenida-frase', C.bienvenida);
  texto('nombre-completo', C.nombreCompleto);
  texto('cuenta-titulo', C.cuentaRegresiva.titulo);
  document.querySelectorAll('#contador span').forEach((s, i) => s.textContent = C.cuentaRegresiva.etiquetas[i]);
  texto('cuenta-cuando', C.fechaLarga + ' · ' + C.misa.hora);
  const nombres = (id, lista) => {
    const el = $(id); el.textContent = '';
    lista.forEach((n, i) => {
      if (i) { const y = document.createElement('span'); y.className = 'y'; y.textContent = '&'; el.appendChild(y); }
      const s = document.createElement('span'); s.textContent = n; el.appendChild(s);
    });
  };
  texto('padres-titulo', C.padres.titulo); nombres('padres-nombres', C.padres.nombres);
  texto('padrinos-titulo', C.padrinos.titulo); nombres('padrinos-nombres', C.padrinos.nombres);
  ['misa', 'fiesta'].forEach(k => {
    const e = C[k];
    texto(k + '-titulo', e.titulo); texto(k + '-hora', e.hora); texto(k + '-lugar', e.lugar);
    const d = $(k + '-dir'); d.textContent = e.direccion; d.appendChild(document.createElement('br')); d.appendChild(document.createTextNode(e.ciudad));
    $(k + '-mapa').href = e.mapa;
  });
  texto('vestimenta-titulo', C.vestimenta.titulo); texto('vestimenta-estilo', C.vestimenta.estilo); texto('vestimenta-nota', C.vestimenta.nota);
  const co = C.confirmacion;
  texto('confirmacion-titulo', co.titulo); texto('confirmacion-texto', co.texto); texto('confirmacion-boton-texto', co.boton);
  if (co.whatsapp) $('confirmacion-boton').href = 'https://wa.me/' + co.whatsapp.replace(/\D/g, '') + '?text=' + encodeURIComponent(co.mensaje);
  texto('cierre-frase', C.cierre.frase); texto('cierre-firma', C.cierre.firma); texto('cierre-fecha', C.fechaPortada);
  const cr = $('credito'); cr.href = C.credito.enlace;
  cr.children[0].textContent = C.credito.texto; cr.children[1].textContent = C.credito.marca; cr.children[2].textContent = C.credito.boton + ' ›';

  /* ---------- Lienzos que cubren la pantalla (sobre y portada) ---------- */
  const RATIO = 1935 / 1080;
  function cubrir() {
    const ancho = Math.min(window.innerWidth, 440), alto = window.innerHeight;
    let w = ancho, h = w * RATIO;
    if (h < alto) { h = alto; w = h / RATIO; }
    [$('lienzo-sobre'), $('lienzo-portada')].forEach(l => { l.style.width = w + 'px'; l.style.height = h + 'px'; });
  }
  cubrir(); addEventListener('resize', cubrir);

  /* ---------- Chispas en el sobre ---------- */
  const marcoSobre = document.querySelector('#sobre .marco');
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('span'); s.className = 'chispa';
    s.style.left = (14 + Math.random() * 72) + '%'; s.style.top = (22 + Math.random() * 56) + '%'; s.style.animationDelay = (i * .45) + 's';
    marcoSobre.appendChild(s);
  }

  /* ---------- Música ---------- */
  const musica = $('musica'), mb = $('musica-boton');
  if (C.musica) musica.src = C.musica;
  const tocar = () => { if (!C.musica) return; const p = musica.play(); if (p && p.then) p.then(() => mb.classList.remove('pausado')).catch(() => mb.classList.add('pausado')); };
  const alternar = () => { if (musica.paused) tocar(); else { musica.pause(); mb.classList.add('pausado'); } };
  mb.addEventListener('click', alternar);
  mb.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alternar(); } });

  /* ---------- Abrir el sobre ---------- */
  const sobre = $('sobre');
  let abierto = false;
  function abrir() {
    if (abierto) return; abierto = true;
    tocar();
    sobre.classList.add('abierto');
    setTimeout(() => { document.body.classList.remove('cerrado'); document.body.classList.add('abierta'); if (C.musica) mb.classList.add('ver'); flores(); }, 1500);
    setTimeout(() => sobre.remove(), 3400);
  }
  sobre.addEventListener('click', abrir);
  sobre.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); } });

  /* ---------- Florecitas de plumbago ---------- */
  function flores() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const caja = $('flores');
    for (let i = 0; i < 9; i++) {
      const f = document.createElement('i');
      f.style.left = (Math.random() * 92) + '%';
      f.style.setProperty('--t', (10 + Math.random() * 9) + 'px');
      f.style.setProperty('--dur', (13 + Math.random() * 9) + 's');
      f.style.setProperty('--del', (i * 1.6) + 's');
      f.style.setProperty('--x', (Math.random() * 70 - 35) + 'px');
      caja.appendChild(f);
    }
  }

  /* ---------- Aparecer al bajar ---------- */
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('ver'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px', threshold: .12 });
  document.querySelectorAll('.revela').forEach(el => io.observe(el));

  /* ---------- Cuenta regresiva (hora de Sinaloa) ---------- */
  const meta = new Date(C.evento).getTime();
  const dos = n => String(n).padStart(2, '0');
  function cuenta() {
    let r = Math.max(0, meta - Date.now());
    $('dias').textContent = Math.floor(r / 86400000);
    $('horas').textContent = dos(Math.floor(r % 86400000 / 3600000));
    $('minutos').textContent = dos(Math.floor(r % 3600000 / 60000));
    $('segundos').textContent = dos(Math.floor(r % 60000 / 1000));
  }
  cuenta(); setInterval(cuenta, 1000);

  /* ---------- Avisos ---------- */
  const MU = C.muestra || {};
  const aviso = document.createElement('div'); aviso.id = 'aviso'; document.body.appendChild(aviso);
  let tAviso;
  const avisar = (msg) => (e) => { e.preventDefault(); aviso.textContent = msg; aviso.classList.add('ver'); clearTimeout(tAviso); tAviso = setTimeout(() => aviso.classList.remove('ver'), 2400); };
  const enMuestra = MU.activa && !location.search.includes('sinmarca');
  if (!co.whatsapp && !enMuestra) $('confirmacion-boton').addEventListener('click', avisar('Falta el número de WhatsApp para confirmar'));

  /* ---------- Vista previa: marca de agua (?sinmarca = sin marca, para revisar) ---------- */
  if (enMuestra) {
    document.body.classList.add('muestra');
    const t = (MU.texto || 'MUESTRA').replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const fila = (x, y) => "<text x='" + x + "' y='" + y + "' text-anchor='middle' font-family='Georgia,serif' font-size='14' font-weight='700' letter-spacing='2.5' fill='rgba(184,135,58,.42)' stroke='rgba(255,255,255,.25)' stroke-width='.5'>" + t + "</text>";
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='260' height='200'><g transform='rotate(-28 130 100)'>" + fila(130, 70) + fila(0, 160) + fila(260, 160) + "</g></svg>";
    const capa = document.createElement('div'); capa.id = 'marca-agua'; capa.setAttribute('aria-hidden', 'true');
    capa.style.setProperty('--marca', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
    document.body.appendChild(capa);
    ['contextmenu', 'dragstart', 'selectstart', 'copy', 'cut'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
    document.addEventListener('keydown', e => {
      const k = (e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey;
      if (e.key === 'F12' || (mod && ['s', 'u', 'p', 'c', 'a'].includes(k)) || (mod && e.shiftKey && ['i', 'j', 'c'].includes(k))) e.preventDefault();
    });
    ['misa-mapa', 'fiesta-mapa', 'confirmacion-boton'].forEach(id => $(id).addEventListener('click', avisar(MU.aviso), true));
  }
})();
</script>
</body>
</html>
