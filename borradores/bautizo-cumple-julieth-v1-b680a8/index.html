#musica-boton::after { content: "♪"; animation: baila 1.2s ease-in-out infinite; }
#musica-boton.pausado::after { content: "♪"; animation: none; opacity: .55; }
#musica-boton.pausado::before { content: ""; position: absolute; width: 60%; height: 2.5px; background: #fff; rotate: -45deg; border-radius: 2px; }
@keyframes baila { 0%,100% { transform: rotate(-10deg) translateY(0); } 50% { transform: rotate(10deg) translateY(-3px); } }

/* ---------- vista previa (muestra) ---------- */
#marca-agua { position: fixed; inset: 0; z-index: 101; pointer-events: none; background: var(--marca) 0 0 / 260px 200px repeat; }
body.muestra { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
body.muestra img, body.muestra video { pointer-events: none; -webkit-user-drag: none; }
#aviso { position: fixed; left: 50%; bottom: 88px; z-index: 203; translate: -50% 0; padding: 10px 18px; border-radius: 99px; background: rgba(120,70,170,.94); color: #fff; font: 700 15px/1.2 var(--cuerpo); white-space: nowrap; opacity: 0; transform: translateY(10px); transition: opacity .3s, transform .3s; pointer-events: none; }
#aviso.ver { opacity: 1; transform: none; }
@media print { body.muestra > * { display: none !important; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; } }
</style>
</head>
<body class="cerrado">

<div id="escenario" aria-hidden="true"></div>
<div id="apertura" role="button" tabindex="0" aria-label="Toca el sobre para abrir la invitación">
  <div class="fondo-sobre"></div>
  <video playsinline webkit-playsinline muted preload="auto"></video>
  <div class="anillo"></div>
  <div class="flash"></div>
  <div class="toca"></div>
</div>
<div id="brillos" aria-hidden="true"></div>

<main>
  <section id="portada">
    <div class="imagen" id="pt-imagen">
      <div class="arriba"><img class="nombre" id="pt-nombre" alt=""></div>
    </div>
    <div class="pie">
      <div class="titulo t1" id="pt-t1"></div>
      <div class="titulo t2" id="pt-t2"></div>
      <div class="fecha" id="pt-fecha"></div>
    </div>
  </section>

  <section id="mensaje">
    <div class="tarjeta rev">
      <div class="hola" id="ms-hola"></div>
      <img class="nombre-chico" id="ms-nombre" alt=""><div class="apellidos" id="ms-apellidos"></div>
      <p id="ms-texto"></p>
    </div>
  </section>

  <section id="padres">
    <div class="tarjeta rev">
      <p class="bendicion" id="pa-bendicion"></p>
      <div class="grupo"><h3 id="pa-t1"></h3><div id="pa-n1"></div></div>
      <div class="grupo"><h3 id="pa-t2"></h3><div id="pa-n2"></div></div>
      <div class="corazones">♥ ✦ ♥ ✦ ♥</div>
    </div>
  </section>

  <section id="cuenta">
    <div class="tarjeta rev">
      <img class="icono" id="cu-icono" alt="">
      <div class="titulo" id="cu-titulo" style="font-size:8.6cqw"></div>
      <div class="dia" id="cu-dia"></div>
      <div class="grande" id="cu-numero"></div>
      <div class="mes" id="cu-mes"></div>
      <div class="reloj" id="cu-reloj"></div>
      <div class="reloj-fin" id="cu-fin" hidden></div>
    </div>
  </section>

  <section id="bautizo" class="evento">
    <div class="ilustracion rev"><img id="ba-img" alt="Julieth con su vestido de bautizo"></div>
    <div class="tarjeta rev">
      <img class="icono" id="ba-icono" alt="">
      <div class="titulo" id="ba-titulo"></div>
      <p class="texto" id="ba-texto"></p>
      <div id="ba-datos"></div>
      <a class="boton" id="ba-mapa" target="_blank" rel="noopener"></a>
    </div>
  </section>

  <section id="fiesta" class="evento">
    <div class="tarjeta rev">
      <img class="icono" id="fi-icono" alt="">
      <div class="titulo" id="fi-titulo"></div>
      <p class="texto" id="fi-texto"></p>
      <div id="fi-datos"></div>
      <a class="boton" id="fi-mapa" target="_blank" rel="noopener"></a>
    </div>
  </section>

  <section id="foto">
    <div class="titulo rev" id="fo-titulo"></div>
    <figure class="polaroid rev">
      <img id="fo-img" alt="Foto de Julieth">
      <figcaption id="fo-pie"></figcaption>
      <span class="sticker" style="top:-5cqw;right:-5cqw">🎀</span>
      <span class="sticker" style="top:30%;left:-7cqw">💖</span>
    </figure>
  </section>

  <section id="confirmacion">
    <div class="tarjeta rev">
      <img class="icono" id="co-icono" alt="">
      <div class="titulo" id="co-titulo" style="font-size:8.6cqw"></div>
      <p class="texto" id="co-texto" style="margin:3cqw 0 0;font:600 4.4cqw/1.5 var(--cuerpo)"></p>
      <a class="boton" id="co-boton" target="_blank" rel="noopener"></a>
    </div>
  </section>

  <section id="despedida">
    <div class="titulo rev" id="de-titulo" style="font-size:14cqw;margin-bottom:5cqw"></div>
    <div class="escena" id="de-escena"></div>
    <p class="frase rev" id="de-frase"></p>
    <a class="credito" id="credito" target="_blank" rel="noopener"><span></span><b></b><em></em></a>
  </section>
</main>

<button id="musica-boton" aria-label="Pausar o reanudar la música"></button>
<audio id="musica" loop preload="auto"></audio>
<div id="aviso" role="status"></div>

<script>
(function () {
  const C = CONFIG, I = C.imagenes, $ = id => document.getElementById(id);
  const url = s => 'url("' + s + '")';
  const txt = (id, s) => { const e = $(id); if (e) e.textContent = s; };
  const img = (id, s) => { const e = $(id); if (!e) return; if (s) e.src = s; else e.remove(); };

  /* ---------- fecha ---------- */
  const F = C.fecha, pad = n => String(n).padStart(2, '0');
  const meta = new Date(`${F.anio}-${pad(F.mes)}-${pad(F.dia)}T${pad(F.hora)}:${pad(F.minuto)}:00${C.zona}`);
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const diaSemana = DIAS[new Date(F.anio, F.mes - 1, F.dia).getDay()];
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  /* ---------- textos e imágenes ---------- */
  $('escenario').style.backgroundImage = url(I.fondo);
  $('pt-imagen').style.backgroundImage = url(I.portada);
  img('pt-nombre', I.nombre); $('pt-nombre').alt = C.nombre;
  txt('pt-t1', C.titulo1); txt('pt-t2', C.titulo2);
  txt('pt-fecha', `${cap(diaSemana)} ${F.dia} · ${cap(MESES[F.mes - 1])} · ${F.anio}`);

  txt('ms-hola', C.mensaje.arriba); img('ms-nombre', I.nombre); $('ms-nombre').alt = C.nombre; txt('ms-apellidos', C.apellidos || ''); txt('ms-texto', C.mensaje.texto);

  txt('pa-bendicion', C.bendicion);
  [[C.padres, 'pa-t1', 'pa-n1'], [C.padrinos, 'pa-t2', 'pa-n2']].forEach(([g, t, n]) => {
    txt(t, g.titulo); $(n).innerHTML = ''; g.nombres.forEach(x => { const d = document.createElement('div'); d.className = 'persona'; d.textContent = x; $(n).appendChild(d); });
  });

  img('cu-icono', I.iconoReloj); txt('cu-titulo', C.cuenta.titulo);
  txt('cu-dia', cap(diaSemana)); txt('cu-numero', F.dia); txt('cu-mes', `${MESES[F.mes - 1]} ${F.anio}`);
  $('cu-reloj').innerHTML = C.cuenta.etiquetas.map(e => `<div><b>00</b><span>${e}</span></div>`).join('');
  const celdas = $('cu-reloj').querySelectorAll('b');
  function tic() {
    let s = Math.max(0, Math.floor((meta - Date.now()) / 1000));
    if (s === 0) { $('cu-reloj').hidden = true; $('cu-fin').hidden = false; txt('cu-fin', C.cuenta.terminado); return; }
    const v = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60];
    v.forEach((n, i) => celdas[i].textContent = pad(n));
  }
  tic(); setInterval(tic, 1000);

  function evento(E, pre, icono, ilus) {
    if (ilus !== undefined) img(pre + '-img', ilus);
    img(pre + '-icono', icono); txt(pre + '-titulo', E.titulo); txt(pre + '-texto', E.texto);
    const filas = [['📍', 'Lugar', E.lugar], ['🗺️', 'Dirección', E.direccion], ['🕒', 'Hora', E.hora]];
    $(pre + '-datos').innerHTML = '';
    filas.forEach(([ic, et, v]) => {
      if (et === 'Dirección' && !v) return;
      const d = document.createElement('div'); d.className = 'dato';
      d.innerHTML = `<i>${ic}</i><div><small>${et}</small><strong${v ? '' : ' class="pendiente"'}></strong></div>`;
      d.querySelector('strong').textContent = v || 'Por confirmar';
      $(pre + '-datos').appendChild(d);
    });
    const b = $(pre + '-mapa'); b.textContent = '📍 ' + E.boton;
    if (E.enlace) b.href = E.enlace; else b.addEventListener('click', aviso);
  }
  evento(C.bautizo, 'ba', I.iconoIglesia, I.bautizo);
  evento(C.fiesta, 'fi', I.iconoTorta);

  if (C.foto.imagen) { txt('fo-titulo', C.foto.titulo); img('fo-img', C.foto.imagen); txt('fo-pie', C.foto.pie); } else $('foto').remove();

  const co = C.confirmacion;
  img('co-icono', I.iconoSobre); txt('co-titulo', co.titulo); txt('co-texto', co.texto);
  const cb = $('co-boton'); cb.textContent = '💌 ' + co.boton;
  if (co.whatsapp) cb.href = `https://wa.me/${co.whatsapp}?text=${encodeURIComponent(co.mensaje)}`; else cb.addEventListener('click', aviso);

  $('de-escena').style.backgroundImage = url(I.cierre);
  txt('de-titulo', C.despedida.titulo); txt('de-frase', C.despedida.frase);
  const cr = $('credito'), cd = C.credito; cr.href = cd.enlace;
  cr.children[0].textContent = cd.texto; cr.children[1].textContent = cd.marca; cr.children[2].textContent = cd.boton + ' ›';

  /* ---------- aviso (botones que se activan en la final) ---------- */
  let tAviso;
  function aviso(e) { e.preventDefault(); const a = $('aviso'); a.textContent = C.muestra.aviso; a.classList.add('ver'); clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove('ver'), 2200); }

  /* ---------- marca de agua ---------- */
  const MU = C.muestra;
  if (MU.activa && !location.search.includes('sinmarca')) {
    document.body.classList.add('muestra');
    const t = MU.texto.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const fila = (x, y) => "<text x='" + x + "' y='" + y + "' text-anchor='middle' font-family='Georgia,serif' font-size='14' font-weight='700' letter-spacing='2.5' fill='rgba(90,40,110,.42)' stroke='rgba(255,255,255,.35)' stroke-width='.5'>" + t + "</text>";
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='260' height='200'><g transform='rotate(-28 130 100)'>" + fila(130, 70) + fila(0, 160) + fila(260, 160) + "</g></svg>";
    const capa = document.createElement('div'); capa.id = 'marca-agua'; capa.setAttribute('aria-hidden', 'true');
    capa.style.setProperty('--marca', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
    document.body.appendChild(capa);
    ['contextmenu', 'dragstart', 'selectstart', 'copy', 'cut'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
    document.addEventListener('keydown', e => { const k = (e.key || '').toLowerCase(), m = e.ctrlKey || e.metaKey; if (e.key === 'F12' || (m && ['s','u','p','c','a'].includes(k)) || (m && e.shiftKey && ['i','j','c'].includes(k))) e.preventDefault(); });
  }

  /* ---------- brillos ---------- */
  const br = $('brillos'), formas = ['✦', '♥', '✧', '★', '♥'], colores = ['#ff9fcf', '#c8a8f5', '#ffffff', '#f7b8de', '#b393ee'];
  for (let i = 0; i < 16; i++) {
    const e = document.createElement('i'); e.textContent = formas[i % formas.length];
    e.style.cssText = `--x:${Math.random() * 100}%;--t:${10 + Math.random() * 12}px;--c:${colores[i % colores.length]};--d:${9 + Math.random() * 9}s;--r:-${Math.random() * 16}s;--dx:${(Math.random() * 60 - 30).toFixed(0)}px`;
    br.appendChild(e);
  }

  /* ---------- aparecer al bajar ---------- */
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('ver'); io.unobserve(e.target); } }), { threshold: .15 });
  document.querySelectorAll('.rev').forEach(e => io.observe(e));

  /* ---------- música ---------- */
  const mu = $('musica'), mb = $('musica-boton');
  if (C.musica) mu.src = C.musica; else mb.remove();
  function sonar() { if (!C.musica) return; const p = mu.play(); if (p && p.then) p.then(() => mb.classList.remove('pausado')).catch(() => mb.classList.add('pausado')); }
  mb && mb.addEventListener('click', e => { e.stopPropagation(); if (mu.paused) { delete mu.dataset.pausa; sonar(); } else { mu.pause(); mu.dataset.pausa = '1'; mb.classList.add('pausado'); } });

  /* ---------- sobre ---------- */
  const A = C.apertura, ap = $('apertura');
  ap.querySelector('.fondo-sobre').style.backgroundImage = url(A.imagen);
  ap.querySelector('.toca').textContent = A.textoAbrir;
  const an = ap.querySelector('.anillo'); an.style.left = A.selloX + '%'; an.style.top = A.selloY + '%';
  ap.querySelector('.flash').style.setProperty('--x', A.selloX + '%'); ap.querySelector('.flash').style.setProperty('--y', A.selloY + '%');
  const vid = ap.querySelector('video'); if (A.video) vid.src = A.video; else vid.remove();
  let abierto = false;
  function terminar() { if (ap.classList.contains('fuera')) return; ap.classList.add('fuera'); document.body.classList.remove('cerrado'); document.body.classList.add('abierto'); window.scrollTo(0, 0); setTimeout(() => ap.remove(), 1000); }
  function chispas() {
    const sim = ['♥', '✦', '★', '♥', '✧'], col = ['#ff8cc6', '#b48ef0', '#fff', '#ffc1e3'];
    for (let i = 0; i < 26; i++) {
      const s = document.createElement('span'); s.className = 'chispa'; s.textContent = sim[i % sim.length];
      const ang = Math.random() * Math.PI * 2, d = 120 + Math.random() * 220;
      s.style.cssText = `left:${A.selloX}%;top:${A.selloY}%;--t:${14 + Math.random() * 22}px;--c:${col[i % col.length]};--dx:${Math.cos(ang) * d}px;--dy:${Math.sin(ang) * d}px;--r:${Math.random() * 360}deg`;
      ap.appendChild(s);
    }
  }
  function abrir() {
    if (abierto) return; abierto = true; sonar();
    if (A.video) {
      ap.classList.add('reproduciendo'); vid.style.opacity = 1; vid.play().catch(() => { vid.style.opacity = 0; ap.classList.add('abriendo'); chispas(); setTimeout(terminar, 1500); }); vid.onended = terminar; setTimeout(terminar, 8000);
    } else { ap.classList.add('abriendo'); chispas(); setTimeout(terminar, 1500); }
  }
  ap.addEventListener('click', abrir);
  ap.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') abrir(); });
  if (location.search.includes('directo')) { abierto = true; ap.remove(); document.body.classList.remove('cerrado'); document.body.classList.add('abierto'); }
})();
</script>
</body>
</html>
