    <div class="zona aparece" id="z-espejo"><h2 class="script script-lila" id="espejo-titulo"></h2><p id="espejo-texto"></p></div>

    <div class="zona pergamino aparece" id="z-padres"><h3 class="cinzel" id="padres-titulo"></h3><div class="divisor" style="width:14cqw;margin:0"></div><p id="padres-nombres"></p></div>
    <div class="zona pergamino aparece" id="z-padrinos"><h3 class="cinzel" id="padrinos-titulo"></h3><div class="divisor" style="width:14cqw;margin:0"></div><p id="padrinos-nombres"></p></div>

    <div class="zona aparece brillo-claro" id="z-reserva"><h2 class="cinzel">Reserva la fecha</h2><p id="fecha-texto"></p></div>
    <div class="zona aparece" id="z-reloj"><span class="script script-lila" id="reloj-texto"></span></div>
    <div class="zona aparece" id="z-cuenta">
      <div class="caja"><b id="c-dias">0</b><small>Días</small></div>
      <div class="caja"><b id="c-horas">0</b><small>Horas</small></div>
      <div class="caja"><b id="c-min">0</b><small>Min</small></div>
      <div class="caja"><b id="c-seg">0</b><small>Seg</small></div>
    </div>

    <div class="zona aparece brillo-claro" id="z-fiesta"><h2 class="script script-lila" id="fiesta-titulo"></h2><p id="fiesta-lugar"></p><p id="fiesta-hora"></p><a class="boton" id="fiesta-boton" target="_blank" rel="noopener">Cómo llegar</a></div>
    <div class="zona aparece" id="z-vestimenta"><h3 class="cinzel" id="vest-titulo"></h3><span class="script" id="vest-estilo"></span><p id="vest-nota"></p></div>

    <div class="zona aparece brillo-claro" id="z-confirma"><h2 class="script script-lila" id="conf-titulo"></h2><p id="conf-texto"></p></div>
    <div class="zona aparece" id="z-boton"><a class="boton" id="conf-boton" target="_blank" rel="noopener"></a></div>

    <div class="zona aparece" id="z-cierre"><span class="script script-oro" id="cierre-titulo"></span><p id="cierre-frase"></p></div>
  </div>
</main>

<footer id="pie"><p id="cr-texto"></p><b id="cr-marca"></b><a id="cr-boton" target="_blank" rel="noopener"></a></footer>

<audio id="musica" loop preload="none"></audio>
<div id="musica-boton" class="pausado" role="button" aria-label="Música">
  <svg class="pausa" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
  <svg class="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
</div>
<div id="aviso"></div>

<script>
(() => {
  const C = CONFIG, $ = id => document.getElementById(id);
  const txt = (id, t) => { const e = $(id); if (e) e.textContent = t; };
  const qs = new URLSearchParams(location.search);

  /* ---------- Textos ---------- */
  txt('espejo-titulo', C.espejo.titulo); $('espejo-titulo').innerHTML = $('espejo-titulo').textContent.replace(/\n/g, '<br>');
  txt('espejo-texto', C.espejo.texto);
  const nombres = (id, lista) => { const e = $(id); if (!lista.length) { e.textContent = 'Por confirmar'; e.className = 'pend'; } else e.innerHTML = lista.map(n => n.replace(/</g, '&lt;')).join('<br>'); };
  txt('padres-titulo', C.padres.titulo); nombres('padres-nombres', C.padres.nombres);
  txt('padrinos-titulo', C.padrinos.titulo); nombres('padrinos-nombres', C.padrinos.nombres);
  txt('fecha-texto', C.fechaTexto); txt('reloj-texto', C.reloj);
  const fi = C.fiesta; txt('fiesta-titulo', fi.titulo);
  txt('fiesta-lugar', fi.lugar ? fi.lugar + (fi.direccion ? ' · ' + fi.direccion : '') : 'Lugar por confirmar');
  txt('fiesta-hora', fi.hora ? fi.hora : 'Hora por confirmar');
  if (!fi.lugar) { $('fiesta-lugar').classList.add('pend'); $('fiesta-hora').classList.add('pend'); }
  if (fi.enlace) $('fiesta-boton').href = fi.enlace; else $('fiesta-boton').remove();
  txt('vest-titulo', C.vestimenta.titulo); txt('vest-estilo', C.vestimenta.estilo); if (C.vestimenta.nota) txt('vest-nota', C.vestimenta.nota); else $('vest-nota').remove();
  const co = C.confirmacion; txt('conf-titulo', co.titulo); txt('conf-texto', co.texto); txt('conf-boton', co.boton);
  if (co.whatsapp) $('conf-boton').href = 'https://wa.me/' + co.whatsapp + '?text=' + encodeURIComponent(co.mensaje);
  txt('cierre-titulo', C.cierre.titulo); txt('cierre-frase', C.cierre.frase);
  txt('cr-texto', C.credito.texto); txt('cr-marca', C.credito.marca); txt('cr-boton', C.credito.boton + ' ›'); $('cr-boton').href = C.credito.enlace;

  /* ---------- Cuenta regresiva (hora de Colombia) ---------- */
  const f = C.fecha, meta = Date.UTC(f.anio, f.mes - 1, f.dia, f.hora - f.zona, f.minuto);
  const dos = n => String(n).padStart(2, '0');
  function contar() {
    let s = Math.max(0, Math.floor((meta - Date.now()) / 1000));
    txt('c-dias', Math.floor(s / 86400)); s %= 86400; txt('c-horas', dos(Math.floor(s / 3600))); s %= 3600; txt('c-min', dos(Math.floor(s / 60))); txt('c-seg', dos(s % 60));
  }
  contar(); setInterval(contar, 1000);

  /* ---------- Aparecer al bajar ---------- */
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visto'); io.unobserve(e.target); } }), { threshold: .25 });
  document.querySelectorAll('.aparece').forEach(e => io.observe(e));

  /* ---------- Mariposas que vuelan y aletean ---------- */
  const vida = $('capa-vida');
  const rnd = (a, b) => a + Math.random() * (b - a);
  // [y en % del dibujo, cuántas] · repartidas por todo el cuento
  const grupos = [[4, 2], [9, 3], [14, 2], [21, 2], [27, 2], [33, 2], [39, 2], [45, 2], [51, 3], [56, 1], [62, 2], [68, 2], [75, 3], [80, 2], [88, 2], [94, 3]];
  const anim = [];
  grupos.forEach(([y, n]) => { for (let k = 0; k < n; k++) {
    const m = document.createElement('div'); m.className = 'mariposa';
    const src = 'recursos/mariposa-' + (1 + Math.floor(Math.random() * 6)) + '.webp';
    m.innerHTML = '<i class="ai"></i><i class="ad"></i>';
    m.querySelectorAll('i').forEach(i => i.style.backgroundImage = 'url(' + src + ')');
    m.style.width = rnd(6, 10) + 'cqw'; m.style.left = rnd(4, 84) + '%'; m.style.top = (y + rnd(-1.5, 1.5)) + '%';
    m.style.setProperty('--vel', rnd(.22, .4).toFixed(2) + 's');
    vida.appendChild(m);
    // vuelo: puntos al azar alrededor de su lugar, de ida y vuelta, girando hacia donde va
    const pasos = [], P = 6; let x = 0, yy = 0;
    for (let p = 0; p <= P; p++) { const nx = p === 0 ? 0 : rnd(-22, 22), ny = p === 0 ? 0 : rnd(-14, 14); const ang = Math.atan2(ny - yy, nx - x) * 180 / Math.PI + 90; pasos.push({ transform: `translate(${nx}cqw, ${ny}cqw) rotate(${(p === 0 ? rnd(-20, 20) : Math.max(-50, Math.min(50, ang > 180 ? ang - 360 : ang))).toFixed(0)}deg)` }); x = nx; yy = ny; }
    if (m.animate) anim.push(m.animate(pasos, { duration: rnd(16000, 26000), iterations: Infinity, direction: 'alternate', easing: 'ease-in-out', delay: -rnd(0, 16000) }));
  } });
  for (let k = 0; k < 70; k++) { const d = document.createElement('div'); d.className = 'destello'; d.style.left = rnd(2, 96) + '%'; d.style.top = rnd(1, 99) + '%'; d.style.animationDelay = -rnd(0, 3) + 's'; d.style.animationDuration = rnd(2.2, 4.2) + 's'; vida.appendChild(d); }

  /* ---------- Muestra: marca de agua y protección ---------- */
  const aviso = $('aviso'); let tA;
  const mostrarAviso = e => { e.preventDefault(); aviso.textContent = C.muestra.aviso; aviso.classList.add('ver'); clearTimeout(tA); tA = setTimeout(() => aviso.classList.remove('ver'), 2200); };
  if (!co.whatsapp) $('conf-boton').addEventListener('click', mostrarAviso);
  if (C.muestra.activa && !qs.has('sinmarca')) {
    document.body.classList.add('muestra');
    const t = C.muestra.texto.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const fila = (x, y) => "<text x='" + x + "' y='" + y + "' text-anchor='middle' font-family='Georgia,serif' font-size='14' font-weight='700' letter-spacing='2.5' fill='rgba(15,8,8,.45)' stroke='rgba(255,255,255,.3)' stroke-width='.5'>" + t + "</text>";
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='260' height='200'><g transform='rotate(-28 130 100)'>" + fila(130, 70) + fila(0, 160) + fila(260, 160) + "</g></svg>";
    const capa = document.createElement('div'); capa.id = 'marca-agua'; capa.style.setProperty('--marca', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")'); document.body.appendChild(capa);
    ['contextmenu', 'dragstart', 'selectstart', 'copy', 'cut'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
    document.addEventListener('keydown', e => { const k = (e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey; if (e.key === 'F12' || (mod && ['s', 'u', 'p', 'c', 'a'].includes(k)) || (mod && e.shiftKey && ['i', 'j', 'c'].includes(k))) e.preventDefault(); });
  }

  /* ---------- Música ---------- */
  const musica = $('musica'), mb = $('musica-boton');
  const tocar = () => { if (!C.musica) return; if (!musica.src) musica.src = C.musica; const p = musica.play(); if (p && p.then) p.then(() => mb.classList.remove('pausado')).catch(() => mb.classList.add('pausado')); };
  mb.addEventListener('click', e => { e.stopPropagation(); if (musica.paused) { delete musica.dataset.usuario; tocar(); } else { musica.pause(); musica.dataset.usuario = '1'; mb.classList.add('pausado'); } });

  /* ---------- Puertas ---------- */
  const pu = $('puertas');
  const abrir = () => {
    if (pu.classList.contains('abierta')) return;
    pu.classList.add('abierta'); tocar(); mb.classList.add('visible');
    setTimeout(() => { document.body.classList.remove('cerrada'); }, 900);
    setTimeout(() => pu.remove(), 2800);
  };
  if (qs.has('directo')) { pu.remove(); document.body.classList.remove('cerrada'); mb.classList.add('visible'); }
  else pu.addEventListener('click', abrir);
})();
</script>
</body>
</html>
