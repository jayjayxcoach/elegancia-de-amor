<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Melissa · portada</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #f6e3ea; }
.pt { position: relative; width: 100%; max-width: 500px; aspect-ratio: 9 / 16; margin: 0 auto; overflow: hidden; container-type: inline-size; }
.pt img { width: 100%; height: 100%; object-fit: cover; display: block; }
.brillo { position: absolute; width: var(--t, 1.6cqw); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, #fff4c8 35%, rgba(255, 230, 160, 0) 70%);
  animation: titila var(--d, 3s) ease-in-out infinite; animation-delay: var(--r, 0s); opacity: 0; }
@keyframes titila { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1.2); } }
</style></head><body>
<section class="pt"><img src="portada.webp" alt="Portada: Melissa en un salón rosa, su nombre en dorado con tiara y rosas pastel"></section>
<script>
const pt = document.querySelector('.pt');
for (let i = 0; i < 18; i++) {
  const b = document.createElement('i'); b.className = 'brillo';
  b.style.cssText = `left:${8 + Math.random() * 84}%;top:${52 + Math.random() * 30}%;--t:${1 + Math.random() * 1.8}cqw;--d:${2.2 + Math.random() * 2.5}s;--r:${Math.random() * 3}s`;
  pt.appendChild(b);
}
</script>
</body></html>
