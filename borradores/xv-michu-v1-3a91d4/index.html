  <div class="capa revela" id="invita">

  <div class="celda" style="left:18.33cqw;top:845.93cqw"><b id="c0">00</b></div><div class="etiqueta" style="left:18.33cqw;top:852.41cqw">Días</div><div class="celda" style="left:39.54cqw;top:845.93cqw"><b id="c1">00</b></div><div class="etiqueta" style="left:39.54cqw;top:852.41cqw">Horas</div><div class="celda" style="left:60.37cqw;top:845.93cqw"><b id="c2">00</b></div><div class="etiqueta" style="left:60.37cqw;top:852.41cqw">Min</div><div class="celda" style="left:81.30cqw;top:845.93cqw"><b id="c3">00</b></div><div class="etiqueta" style="left:81.30cqw;top:852.41cqw">Seg</div>

<footer id="credito"></footer>
<button id="musica-boton" aria-label="Pausar o poner la música">♪</button>
<audio id="musica" loop preload="auto"></audio>
<div id="aviso"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const C = CONFIG;
  document.querySelectorAll('[data-campo]').forEach(e => e.textContent = C[e.dataset.campo] || '');
  document.querySelectorAll('[data-campo-c]').forEach(e => e.textContent = C.confirmacion[e.dataset.campoC] || '');
  $('invitacion').innerHTML = C.invitacion;
  if (!C.hora) $('fecha-hora').remove();
  if (!C.apellidos) document.querySelector('#espejo .apellidos').remove();
  const nombres = (id, lista) => lista.forEach(n => { const d = document.createElement('div'); d.className = 'nombre script oro sombra-oro'; d.textContent = n; $(id).appendChild(d); });
  $('padres-titulo').textContent = C.padres.titulo; nombres('padres-nombres', C.padres.nombres);
  if (C.padrinos.nombres.length) { $('padrinos-titulo').textContent = C.padrinos.titulo; nombres('padrinos-nombres', C.padrinos.nombres); }
  ['misa', 'fiesta'].forEach(k => { $(k + '-lugar').textContent = C[k].lugar; $(k + '-direccion').textContent = C[k].direccion; $(k + '-hora').textContent = C[k].hora; $(k + '-mapa').href = C[k].mapa; if (!C[k].direccion) $(k + '-direccion').remove(); if (!C[k].hora) $(k + '-hora').remove(); });
  $('vestimenta-estilo').textContent = C.vestimenta.estilo; $('vestimenta-nota').textContent = C.vestimenta.nota;
  const cr = C.credito;
  $('credito').innerHTML = cr.texto + '<br><a href="' + cr.enlace + '" target="_blank" rel="noopener">' + cr.marca + ' · ' + cr.boton + ' ›</a>';

  /* WhatsApp: solo se activa en la versión final pagada */
  const aviso = $('aviso'); aviso.textContent = C.muestra.aviso; let tA;
  const mostrarAviso = e => { e.preventDefault(); aviso.classList.add('ver'); clearTimeout(tA); tA = setTimeout(() => aviso.classList.remove('ver'), 2200); };
  const boton = $('confirmacion-boton');
  if (C.confirmacion.whatsapp && !C.muestra.activa) boton.href = 'https://wa.me/' + C.confirmacion.whatsapp.replace(/\D/g, '') + '?text=' + encodeURIComponent(C.confirmacion.mensaje);
  else { boton.removeAttribute('href'); boton.addEventListener('click', mostrarAviso); }

  /* marca de agua (antes del pago); ?sinmarca solo la quita para revisar */
  if (C.muestra.activa && !location.search.includes('sinmarca')) {
    document.body.classList.add('muestra');
    const t = C.muestra.texto;
    const fila = (x, y) => "<text x='" + x + "' y='" + y + "' text-anchor='middle' font-family='Georgia,serif' font-size='14' font-weight='700' letter-spacing='2.5' fill='rgba(30,50,90,.38)' stroke='rgba(255,255,255,.35)' stroke-width='.5'>" + t + "</text>";
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='260' height='200'><g transform='rotate(-28 130 100)'>" + fila(130, 70) + fila(0, 160) + fila(260, 160) + "</g></svg>";
    const capa = document.createElement('div'); capa.id = 'marca-agua'; capa.setAttribute('aria-hidden', 'true');
    capa.style.setProperty('--marca', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
    document.body.appendChild(capa);
    ['contextmenu', 'dragstart', 'selectstart', 'copy', 'cut'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
    document.addEventListener('keydown', e => { const k = (e.key || '').toLowerCase(), m = e.ctrlKey || e.metaKey;
      if (e.key === 'F12' || (m && ['s', 'u', 'p', 'c', 'a'].includes(k)) || (m && e.shiftKey && ['i', 'j', 'c'].includes(k))) e.preventDefault(); });
  }

  /* cuenta regresiva */
  const meta = new Date(C.cuentaHasta).getTime(), dos = n => String(n).padStart(2, '0');
  const cuenta = () => { if (!C.cuentaHasta) { ['c0', 'c1', 'c2', 'c3'].forEach(i => $(i).textContent = '--'); return; } const r = Math.max(0, meta - Date.now());
    $('c0').textContent = Math.floor(r / 864e5); $('c1').textContent = dos(Math.floor(r % 864e5 / 36e5));
    $('c2').textContent = dos(Math.floor(r % 36e5 / 6e4)); $('c3').textContent = dos(Math.floor(r % 6e4 / 1e3)); };
  cuenta(); setInterval(cuenta, 1000);

  /* destellos y mariposas de cristal por todo el dibujo */
  const esc = $('escena');
  for (let i = 0; i < 50; i++) {
    const l = document.createElement('span'); l.className = 'chispa';
    l.style.left = (4 + Math.random() * 92) + '%'; l.style.top = (Math.random() * 100) + '%';
    l.style.setProperty('--t', (6 + Math.random() * 7).toFixed(1) + 's'); l.style.setProperty('--d', (-Math.random() * 8).toFixed(1) + 's');
    esc.appendChild(l);
  }
  for (let i = 0; i < 14; i++) {
    const m = document.createElement('span'); m.className = 'mariposa'; m.innerHTML = '<img src="recursos/mariposa.webp" alt="" loading="lazy">';
    m.style.left = (i % 2 ? 78 + Math.random() * 12 : 4 + Math.random() * 12) + '%'; m.style.top = (4 + i * 6.8 + Math.random() * 3) + '%';
    m.style.setProperty('--t', (9 + Math.random() * 6).toFixed(1) + 's'); m.style.setProperty('--d', (-Math.random() * 9).toFixed(1) + 's');
    esc.appendChild(m);
  }

  /* aparecen al bajar */
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visto'); io.unobserve(e.target); } }), { threshold: .15 });
  document.querySelectorAll('.revela').forEach(e => io.observe(e));

  /* música */
  const musica = $('musica'), mb = $('musica-boton'); musica.src = C.musica;
  const tocar = () => { const p = musica.play(); if (p && p.then) p.then(() => mb.classList.remove('pausado')).catch(() => mb.classList.add('pausado')); };
  mb.addEventListener('click', () => { if (musica.paused) tocar(); else { musica.pause(); mb.classList.add('pausado'); } });

  /* puertas: tocar → se abren → la escena */
  const ap = $('apertura'), apEsc = ap.querySelector('.escena');
  [[18, 62], [80, 58], [30, 40], [70, 36], [50, 30], [24, 78], [76, 80], [60, 70], [40, 66]].forEach((p, i) => {
    const s = document.createElement('span'); s.className = 'destello'; s.style.left = p[0] + '%'; s.style.top = p[1] + '%'; s.style.animationDelay = (i * .45) + 's'; apEsc.appendChild(s); });
  let cargadas = 0, abierto = false, listo = false;
  const imgs = ap.querySelectorAll('img');
  const una = () => { if (++cargadas >= imgs.length) apEsc.classList.add('lista'); };
  imgs.forEach(i => { if (i.complete) una(); else i.onload = i.onerror = una; });
  setTimeout(() => apEsc.classList.add('lista'), 3000);
  const terminar = () => { if (listo) return; listo = true; ap.remove(); document.body.classList.remove('cerrado'); window.scrollTo(0, 0); };
  ap.addEventListener('click', () => {
    if (abierto) return; abierto = true; ap.classList.add('tocado'); tocar(); mb.classList.add('ver');
    apEsc.classList.add('lista'); ap.classList.add('abriendo'); setTimeout(terminar, 2950);
  });
  if (location.search.includes('directo')) { ap.remove(); document.body.classList.remove('cerrado'); mb.classList.add('ver'); }
})();
</script>
</body>
