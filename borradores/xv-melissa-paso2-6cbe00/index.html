<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Melissa · portadas y sobre</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #f6e3ea; font-family: Georgia, serif; }
.pt { position: relative; width: 100%; max-width: 500px; aspect-ratio: 9 / 16; margin: 0 auto 14px; overflow: hidden; container-type: inline-size; }
.pt img { width: 100%; height: 100%; object-fit: cover; display: block; }
.etiqueta { position: absolute; z-index: 5; left: 3cqw; top: 3cqw; padding: 1.2cqw 3cqw; border-radius: 99px; background: rgba(60, 20, 40, .62);
  color: #fff; font-size: 3.4cqw; letter-spacing: .06em; }
.brillo { position: absolute; z-index: 4; width: var(--t, 1.6cqw); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, #fff4c8 35%, rgba(255, 230, 160, 0) 70%);
  animation: titila var(--d, 3s) ease-in-out infinite; animation-delay: var(--r, 0s); opacity: 0; }
@keyframes titila { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1.2); } }
</style></head><body>
<section class="pt"><span class="etiqueta">1 · Portada en el salón rosa</span><img src="portada-rosa.webp" alt="Portada: Melissa en un salón rosa con candelabros, su nombre en dorado y rosas pastel"></section>
<section class="pt"><span class="etiqueta">2 · Portada con su foto completa</span><img src="portada-farol.webp" alt="Portada: Melissa con el farol junto al estanque, su nombre en dorado y rosas pastel"></section>
<section class="pt"><span class="etiqueta">Sobre en rosa con rosas</span><img src="sobre-rosa.webp" alt="Sobre de satín rosa con lacre dorado XV, corona de perlas y rosas"></section>
<script>
// destellos dorados suaves sobre la zona del nombre de cada portada
document.querySelectorAll('.pt').forEach((pt, k) => {
  for (let i = 0; i < 16; i++) {
    const b = document.createElement('i'); b.className = 'brillo';
    const top = k < 2 ? 50 + Math.random() * 30 : 25 + Math.random() * 50;
    b.style.cssText = `left:${8 + Math.random() * 84}%;top:${top}%;--t:${1 + Math.random() * 1.8}cqw;--d:${2.2 + Math.random() * 2.5}s;--r:${Math.random() * 3}s`;
    pt.appendChild(b);
  }
});
</script>
</body></html>
