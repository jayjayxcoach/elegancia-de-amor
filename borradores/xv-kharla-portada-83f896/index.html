<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kharla · portada</title>
<link rel="preload" href="recursos/kharla.webp" as="image">
<style>
/* Portada XV Kharla (La Bella Durmiente, rosa y dorado). Estructura de Niralys: plano medio, ella grande arriba,
   la foto se funde abajo; tiara, nombre (Gemini), MIS XV AÑOS, frase y adorno; rosas de joyería al pie.
   ?fondo=B (salón) o ?fondo=C (bosque) cambia el fondo; ?quieta deja todo sin animación (para exportar). */
@font-face { font-family: 'Cinzel'; font-weight: 600; src: url('recursos/fuente-cinzel-600.woff2') format('woff2'); font-display: block; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #5e2a38; min-height: 100%; }
.pt { position: relative; width: 100%; max-width: 480px; aspect-ratio: 9 / 16; margin: 0 auto; overflow: hidden; container-type: inline-size;
  --base: 94, 42, 56; background: rgb(var(--base)); }
.fondo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%;
  filter: blur(.9cqw) saturate(1.04); transform: scale(1.06); animation: acerca 14s ease-out forwards; }
.luz { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 38% at 50% 30%, rgba(255, 222, 180, .5), rgba(255, 222, 180, 0) 100%); }
/* Kharla en plano medio: la foto es de cuerpo entero, se agranda y se deja de la cadera para arriba */
.kharla { position: absolute; z-index: 2; left: 50%; top: var(--k-top, 9cqw); width: var(--k-ancho, 168cqw); max-width: none; translate: -50% 0;
  filter: drop-shadow(0 2cqw 4cqw rgba(60, 20, 30, .35));
  -webkit-mask-image: linear-gradient(#000 var(--k-f1, 48%), transparent var(--k-f2, 64%)); mask-image: linear-gradient(#000 var(--k-f1, 48%), transparent var(--k-f2, 64%)); }
.velo { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; height: 92cqw;
  background: linear-gradient(rgba(var(--base), 0) 0%, rgba(var(--base), .55) 30%, rgba(var(--base), .9) 55%, rgb(var(--base)) 75%); }
.rosas { position: absolute; z-index: 5; left: -2cqw; bottom: -6cqw; width: 104cqw; max-width: none; filter: drop-shadow(0 -1cqw 2cqw rgba(40, 10, 20, .4)); }
.letras { position: absolute; z-index: 6; left: 0; right: 0; top: var(--l-top, 87cqw); text-align: center; }
.letras::before { content: ""; position: absolute; z-index: -1; left: 2cqw; right: 2cqw; top: 6cqw; bottom: -2cqw;
  background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(70, 25, 38, .5) 0%, rgba(70, 25, 38, .25) 55%, rgba(70, 25, 38, 0) 100%); }
.corona { display: block; width: 30cqw; margin: 0 auto -1.5cqw; filter: drop-shadow(0 .6cqw 1cqw rgba(50, 15, 25, .55));
  opacity: 0; transform: translateY(-3cqw); animation: sube 1s .2s ease-out forwards; }
.nombre { display: block; width: 84cqw; margin: 0 auto; filter: drop-shadow(0 .5cqw .8cqw rgba(40, 10, 20, .75)) drop-shadow(0 0 2.5cqw rgba(255, 220, 160, .35));
  opacity: 0; transform: scale(.92); animation: aparece 1.4s .5s cubic-bezier(.2, .8, .3, 1) forwards; }
.oro { background: linear-gradient(100deg, #b7852e 0%, #f4d98f 18%, #fff3cc 28%, #ecc86e 40%, #bd8b32 55%, #f7e1a0 70%, #fff6d6 78%, #c9973c 92%, #b7852e 100%);
  background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
.xv { display: block; margin-top: .5cqw; font: 600 5.4cqw/1 'Cinzel', Georgia, serif; letter-spacing: .3em; padding-left: .3em;
  filter: drop-shadow(0 .3cqw .4cqw rgba(40, 10, 20, .8)); opacity: 0; transform: translateY(3cqw); animation: sube .9s 1.1s ease-out forwards, brillo 6s 2s ease-in-out infinite; }
.frase { display: block; width: 80cqw; margin: 3cqw auto 0; font: 600 3.6cqw/1.55 'Cinzel', Georgia, serif; letter-spacing: .1em; text-transform: uppercase;
  color: #f6e2b8; text-shadow: 0 .3cqw .6cqw rgba(40, 10, 20, .85); opacity: 0; transform: translateY(3cqw); animation: sube .9s 1.5s ease-out forwards; }
.adorno { display: flex; align-items: center; justify-content: center; gap: 2.2cqw; width: 52cqw; margin: 3cqw auto 0; opacity: 0; animation: sube .9s 1.9s ease-out forwards; }
.adorno::before, .adorno::after { content: ""; flex: 1; height: 1.6px; background: linear-gradient(90deg, transparent, #e9c56e); box-shadow: 0 0 4px rgba(255, 220, 150, .7); }
.adorno::after { background: linear-gradient(270deg, transparent, #e9c56e); }
.adorno i { width: 1.6cqw; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6d6, #e2b85c 60%, #a8762c); box-shadow: 0 0 5px rgba(255, 225, 160, .9); }
.adorno b { width: 3cqw; aspect-ratio: 1; rotate: 45deg; background: linear-gradient(135deg, #fff1c4, #e2b85c 55%, #a8762c); box-shadow: 0 0 6px rgba(255, 225, 160, .9); }
.chispa { position: absolute; z-index: 7; width: var(--t, 1.6cqw); aspect-ratio: 1; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, #fff 0%, #fff4c8 35%, rgba(255, 230, 160, 0) 70%); opacity: 0; animation: titila var(--d, 3s) ease-in-out infinite; animation-delay: var(--r, 0s); }
@keyframes sube { to { opacity: 1; transform: none; } }
@keyframes aparece { to { opacity: 1; transform: none; } }
@keyframes acerca { from { transform: scale(1.12); } to { transform: scale(1.06); } }
@keyframes brillo { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
@keyframes titila { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1.2); } }
.pt.quieta { max-width: none; }
.quieta *, .quieta *::before, .quieta *::after { animation: none !important; opacity: 1 !important; transform: none; }
.quieta .fondo { transform: scale(1.06); }
.quieta .chispa { opacity: .8 !important; }
@media (prefers-reduced-motion: reduce) { .pt *, .pt *::before { animation: none !important; opacity: 1 !important; transform: none; } .pt .fondo { transform: scale(1.06); } }
</style></head><body>

<section class="pt" id="portada">
  <img class="fondo" id="fondo" src="recursos/fondo-A.webp" alt="">
  <div class="luz"></div>
  <img class="kharla" src="recursos/kharla.webp" alt="Kharla con su vestido rosa de encaje dorado y su tiara">
  <div class="velo"></div>
  <img class="rosas" src="recursos/rosas-joyeria.webp" alt="">
  <div class="letras">
    <img class="corona" src="recursos/corona.webp" alt="">
    <img class="nombre" src="recursos/nombre.webp" alt="Kharla">
    <span class="xv oro">Mis XV Años</span>
    <span class="frase">Como en un cuento de hadas,<br>mi sueño se hace realidad</span>
    <div class="adorno"><i></i><b></b><i></i></div>
  </div>
</section>

<script>
const q = new URLSearchParams(location.search);
const f = (q.get('fondo') || 'A').toUpperCase();
if ('ABC'.includes(f)) document.getElementById('fondo').src = 'recursos/fondo-' + f + '.webp';
const pt = document.getElementById('portada');
if (q.has('quieta')) pt.classList.add('quieta');
for (let i = 0; i < 18; i++) {
  const c = document.createElement('i'); c.className = 'chispa';
  let x, y; do { x = 4 + Math.random() * 92; y = 8 + Math.random() * 80; } while (x > 28 && x < 72 && y < 48);  // nunca sobre su cara ni su torso
  c.style.cssText = `left:${x}%;top:${y}%;--t:${1 + Math.random() * 1.8}cqw;--d:${2.2 + Math.random() * 2.5}s;--r:${Math.random() * 3}s`;
  pt.appendChild(c);
}
</script>
</body></html>
