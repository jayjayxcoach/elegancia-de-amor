$('mensaje-txt').textContent = C.mensaje; $('bendicion').textContent = C.bendicion;
$('padre1').textContent = C.padres[0]; $('padre2').textContent = C.padres[1];
$('lugar-nombre').textContent = C.lugar.nombre; $('mapa').href = C.lugar.mapa;
$('estilo').textContent = C.vestimenta.estilo; $('reservados').textContent = C.vestimenta.reservados;
$('ninos-txt').textContent = C.ninos; $('cierre-txt').textContent = C.cierre;
const co = C.confirmacion;
$('confirmar').href = co.whatsapp ? 'https://wa.me/' + co.whatsapp + '?text=' + encodeURIComponent(co.mensaje) : '#';

/* cuenta regresiva (hora de Perú) */
const meta = new Date(C.fecha.iso).getTime(), dos = n => String(n).padStart(2, '0');
function tic() {
  let s = Math.max(0, Math.floor((meta - Date.now()) / 1000));
  $('cd-d').textContent = Math.floor(s / 86400); $('cd-h').textContent = dos(Math.floor(s % 86400 / 3600));
  $('cd-m').textContent = dos(Math.floor(s % 3600 / 60)); $('cd-s').textContent = dos(s % 60);
}
tic(); setInterval(tic, 1000);

/* aparecer al bajar */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('ver'); io.unobserve(e.target); } }), { threshold: .12 });
document.querySelectorAll('.aparece').forEach(el => io.observe(el));

/* música */
const musica = $('musica'), btn = $('musica-btn'), play = $('play');
musica.src = C.musica;
const pintar = () => { const s = !musica.paused; play.classList.toggle('sonando', s); btn.classList.toggle('pausado', !s); };
const sonar = () => { const p = musica.play(); if (p && p.then) p.then(pintar).catch(pintar); };
musica.addEventListener('play', pintar); musica.addEventListener('pause', pintar);
musica.addEventListener('timeupdate', () => { if (musica.duration) $('progreso').style.width = (musica.currentTime / musica.duration * 100) + '%'; });
const alternar = e => { e.stopPropagation(); musica.paused ? sonar() : musica.pause(); };
play.addEventListener('click', alternar); btn.addEventListener('click', alternar);

/* sobre */
function abrir() {
  const s = $('sobre'); if (s.classList.contains('abierto')) return;
  musica.currentTime = 0; sonar();
  s.classList.add('abierto'); btn.classList.add('ver');
  setTimeout(() => { document.body.classList.remove('cerrado'); scrollTo(0, 0); }, 900);
}
$('sobre').addEventListener('click', abrir);
if (location.search.includes('directo')) { $('sobre').style.display = 'none'; document.body.classList.remove('cerrado'); btn.classList.add('ver'); }

/* modo muestra */
const MU = C.muestra;
const aviso = document.createElement('div'); aviso.id = 'aviso'; aviso.textContent = MU.aviso; document.body.appendChild(aviso);
let tA; const mostrarAviso = e => { e.preventDefault(); aviso.classList.add('ver'); clearTimeout(tA); tA = setTimeout(() => aviso.classList.remove('ver'), 2200); };
if (!co.whatsapp) $('confirmar').addEventListener('click', mostrarAviso);
if (MU.activa && !location.search.includes('sinmarca')) {
  const t = MU.texto.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const fila = (x, y) => "<text x='" + x + "' y='" + y + "' text-anchor='middle' font-family='Georgia,serif' font-size='13' font-weight='700' letter-spacing='2' fill='rgba(30,50,75,.42)' stroke='rgba(255,255,255,.35)' stroke-width='.5'>" + t + "</text>";
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='400' height='240'><g transform='rotate(-24 200 120)'>" + fila(200, 80) + fila(0, 190) + fila(400, 190) + "</g></svg>";
  const capa = document.createElement('div'); capa.id = 'marca-agua'; capa.setAttribute('aria-hidden', 'true');
  capa.style.setProperty('--marca', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
  document.body.appendChild(capa);
  ['contextmenu', 'dragstart', 'selectstart', 'copy', 'cut'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
}
</script>
</body>
</html>
