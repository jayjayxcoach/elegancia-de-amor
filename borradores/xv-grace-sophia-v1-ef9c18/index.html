<!--

  Escenas de cine a pantalla completa (Gemini Pro), cada una sigue a la anterior (modelo Kimberly v2):
  sobre (negro con sello de corona, animado) → portada (su foto en la escalinata art déco) → rejas de la mansión (bienvenida) →
  vestíbulo (papás) → gran salón (15 años) → terraza del reloj (fecha) → pista de jazz (falta poco) → torre de champaña (recepción) →
  vestidor (vestimenta) → su foto → escritorio (confirmar) → la mansión con fuegos artificiales (te espero). TODOS LOS DATOS ESTÁN EN CONFIG.
-->

               mapa: "", boton: "Cómo llegar" },
  vestimenta: { titulo: "Código de Vestimenta", estilo: "Elegante", nota: "Inspiración años 20", colores: [] },   // [MUESTRA: no lo dijo]

  confirmacion: { titulo: "Confirma tu Asistencia", texto: "Me encantaría compartir esta noche contigo. Ayúdame confirmando tu asistencia.",
                  boton: "Confirmar", whatsapp: "",   // número con código de país, sin + ni espacios (SOLO cuando pague)
                  mensaje: "¡Hola! Confirmo mi asistencia a los XV años de Grace Sophia 👑" },
  despedida: { frase: "Gracias por ser parte de mi noche de oro", lema: "Una noche de los años 20\npara recordar siempre" },

};

<div id="petalos" aria-hidden="true"></div>
<button id="musica-boton" aria-label="Pausar o reanudar la música"><svg class="pausa" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg><svg class="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
<audio id="musica" loop preload="none"></audio>
<div id="aviso" role="status"></div>

<script>
const C = CONFIG, $ = id => document.getElementById(id);
const pon = (id, t) => { const e = $(id); if (e) e.textContent = t; };
const el = (tag, cls, txt, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; if (css) e.style.cssText = css; return e; };
const PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
// ---- textos ----
const fe = C.fecha, MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DIA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
pon('pt-nombre', C.nombre); pon('pt-fecha', String(fe.dia).padStart(2, '0') + ' · ' + String(fe.mes).padStart(2, '0') + ' · ' + fe.anio);
pon('m1', C.mensaje[0]); pon('m2', C.mensaje[1] || '');
(() => {
  const f = $('familia');
  f.appendChild(el('p', 'caps revela', C.familia.titulo));
  const n = el('p', 'revela', null, 'margin-top: 4cqw');
  C.familia.nombres.forEach((x, i) => { if (i) n.appendChild(el('span', 'y', '&')); const s = el('span', 'script', x); s.style.setProperty('--tam', Math.min(11, 150 / x.length).toFixed(1) + 'cqw'); n.appendChild(s); n.appendChild(document.createElement('br')); });
  f.appendChild(n);
})();
pon('invito', C.invitacion); pon('reserva', C.reserva); pon('falta', C.faltaPoco);
pon('dia-semana', DIA[new Date(fe.anio, fe.mes - 1, fe.dia).getDay()]); pon('dia', fe.dia); pon('anio', fe.anio); pon('mes', MES[fe.mes - 1]);
function lugar(id, d) {
  const t = $(id);
  t.appendChild(el('h2', 'script revela', d.titulo, '--tam: 15cqw'));
  const l = el('p', 'lugar revela'); l.appendChild(el('b', null, d.lugar)); if (d.direccion) l.appendChild(el('span', 'parrafo', d.direccion, 'font-size: 4.8cqw; display: block')); t.appendChild(l);
  const s = el('div', 'sep revela', null, 'margin: 4cqw auto'); s.innerHTML = '<i></i>'; t.appendChild(s);
  t.appendChild(el('p', 'hora revela', d.hora));
  if (d.mapa) { const p = el('p', 'revela'); const a = el('a', 'boton'); a.href = d.mapa; a.target = '_blank'; a.rel = 'noopener'; a.innerHTML = PIN; a.appendChild(el('span', null, d.boton)); p.appendChild(a); t.appendChild(p); }
}
lugar('recepcion', C.recepcion);
pon('vest-titulo', C.vestimenta.titulo); pon('vest-estilo', C.vestimenta.estilo); pon('vest-nota', C.vestimenta.nota);
(C.vestimenta.colores || []).forEach(c => $('vest-colores').appendChild(el('i', null, null, 'background:' + c)));
pon('sesion', C.sesion.titulo);
pon('conf-titulo', C.confirmacion.titulo); pon('conf-texto', C.confirmacion.texto); $('confirmar').querySelector('span').textContent = C.confirmacion.boton;
pon('frase', C.despedida.frase); pon('lema', C.despedida.lema); pon('cierre-nombre', C.nombre);
pon('fecha-corta', String(fe.dia).padStart(2, '0') + ' · ' + String(fe.mes).padStart(2, '0') + ' · ' + fe.anio);
// ---- cuenta regresiva (hora del lugar del evento) ----
const evento = new Date(Date.UTC(fe.anio, fe.mes - 1, fe.dia, fe.hora - C.zonaUTC, fe.minuto));
function contar() {
  let r = Math.max(0, evento - new Date()); const d = Math.floor(r / 864e5); r -= d * 864e5; const h = Math.floor(r / 36e5); r -= h * 36e5; const m = Math.floor(r / 6e4); const s = Math.floor((r - m * 6e4) / 1e3);
  pon('dias', d); pon('horas', String(h).padStart(2, '0')); pon('minutos', String(m).padStart(2, '0')); pon('segundos', String(s).padStart(2, '0'));
}
contar(); setInterval(contar, 1000);
// ---- aparecer al bajar ----
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } }), { threshold: .2 });
const observar = () => document.querySelectorAll('.revela').forEach(x => io.observe(x));
// ---- confeti dorado ----
const PE = $('petalos'), CO = [['#fff3c8', '#d9a94e'], ['#f6dc9c', '#b9852f'], ['#fffaf0', '#e2c27d']];
for (let i = 0; i < 14; i++) { const e = document.createElement('i'), c = CO[i % 3];
  e.style.cssText = `left:${Math.random() * 100}%;--w:${5 + Math.random() * 6}px;--c1:${c[0]};--c2:${c[1]};--d:${9 + Math.random() * 9}s;--r:${-Math.random() * 18}s;--x:${-40 + Math.random() * 80}px`; PE.appendChild(e); }
// ---- música ----
const mu = $('musica'), mb = $('musica-boton');
function sonar() { if (!mu.src) mu.src = C.musica; mu.volume = .7; mu.play().then(() => mb.classList.remove('pausado')).catch(() => mb.classList.add('pausado')); }
mb.addEventListener('click', e => { e.stopPropagation(); if (mu.paused) sonar(); else { mu.pause(); mb.classList.add('pausado'); } });
// ---- sobre: el sello brilla; al tocar → video del sobre, o se acerca al sello y entra la luz ----
const ap = $('apertura');
ap.innerHTML = '<div class="sobre" style="--sobre:url(recursos/sobre.webp?v=1)"><div class="s-sello" aria-hidden="true"></div><div class="s-luz"></div></div><div class="toca"></div>';
ap.querySelector('.toca').textContent = C.textoAbrir;
const sobre = ap.querySelector('.sobre');
[[30, 22], [70, 20], [50, 16], [8, 40], [92, 44], [10, 70], [88, 72], [60, 80], [36, 78], [20, 12], [82, 12]].forEach((p, i) => {
  const c = el('i', 's-chispa'); c.style.cssText = 'left:' + p[0] + '%;top:' + p[1] + '%;--t:' + (1.4 + Math.random() * 1.8).toFixed(1) + '%;--d:' + (2.2 + Math.random() * 2).toFixed(1) + 's;--r:' + (i * .35).toFixed(2) + 's'; sobre.appendChild(c);
});
const imgSobre = new Image(); imgSobre.onload = () => ap.classList.add('listo'); imgSobre.src = 'recursos/sobre.webp?v=1'; setTimeout(() => ap.classList.add('listo'), 2500);
let pidio = false, termino = false;
function terminar() {
  if (termino) return; termino = true;
  ap.remove(); document.body.classList.remove('cerrado'); $('portada').classList.add('visible'); observar();
}
function abrirConCodigo() { ap.classList.add('abriendo'); setTimeout(() => $('portada').classList.add('visible'), 1900); setTimeout(terminar, 2900); }
let sv = null;
if (C.videoSobre) { sv = el('video', 's-video'); sv.muted = true; sv.playsInline = true; sv.setAttribute('playsinline', ''); sv.setAttribute('webkit-playsinline', ''); sv.preload = 'auto'; sv.src = C.videoSobre; sobre.appendChild(sv); }
function salir() { if (termino) return; ap.classList.add('sale'); $('portada').classList.add('visible'); setTimeout(terminar, 1000); }
ap.addEventListener('click', () => {
  if (pidio) return; pidio = true;
  sonar(); mb.classList.add('visible');
  if (!sv) { abrirConCodigo(); return; }
  sv.playbackRate = sv.defaultPlaybackRate = C.velocidadSobre || 1;
  sv.addEventListener('playing', () => ap.classList.add('con-video'), { once: true });   // el video aparece solo cuando ya se mueve
  sv.addEventListener('timeupdate', () => { if (sv.duration && sv.currentTime >= sv.duration - .45) salir(); });
  sv.addEventListener('ended', salir); sv.addEventListener('error', () => { if (!ap.classList.contains('con-video')) abrirConCodigo(); });
  sv.play().catch(() => abrirConCodigo());
  setTimeout(() => { if (sv.currentTime < .1 && !ap.classList.contains('abriendo')) abrirConCodigo(); }, 3500);   // si el video no arranca, se abre con la animación de código
});
if (location.search.includes('directo')) { pidio = true; terminar(); }
// ---- aviso flotante ----
let tAviso; function aviso(t) { const a = $('aviso'); a.textContent = t; a.classList.add('ver'); clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove('ver'), 2600); }
// ---- confirmar por WhatsApp (en la muestra: solo avisa; el mapa sí funciona) ----
$('confirmar').addEventListener('click', () => {
  const n = (C.confirmacion.whatsapp || '').replace(/\D/g, '');
  if (C.muestra.activa && !location.search.includes('sinmarca') || !n) { aviso(C.muestra.aviso); return; }
  open('https://wa.me/' + n + '?text=' + encodeURIComponent(C.confirmacion.mensaje), '_blank');
});
// ---- modo muestra: marca de agua desde el sobre y protección ----
if (C.muestra.activa && !location.search.includes('sinmarca')) {
  document.body.classList.add('muestra');
  const t = C.muestra.texto, tinta = ['rgba(15,8,8,.45)', 'rgba(255,255,255,.3)'];
  const fila = (x, y) => "<text x='" + x + "' y='" + y + "' text-anchor='middle' font-family='Georgia,serif' font-size='14' font-weight='700' letter-spacing='2.5' fill='" + tinta[0] + "' stroke='" + tinta[1] + "' stroke-width='.5'>" + t + "</text>";
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='260' height='200'><g transform='rotate(-28 130 100)'>" + fila(130, 70) + fila(0, 160) + fila(260, 160) + "</g></svg>";
  const capa = el('div'); capa.id = 'marca-agua'; capa.setAttribute('aria-hidden', 'true');
  capa.style.setProperty('--marca', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")'); document.body.appendChild(capa);
  ['contextmenu', 'dragstart', 'selectstart', 'copy', 'cut'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener('keydown', e => { const k = (e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey; if (e.key === 'F12' || (mod && ['s', 'u', 'p', 'c', 'a'].includes(k))) e.preventDefault(); });
}
</script>
