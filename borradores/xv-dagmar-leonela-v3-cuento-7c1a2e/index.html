  <section class="escena" style="--img: url('recursos/e04.webp'); --ty: 14.5%; --vy: 26%; --vh: 24%">

    <div data-bloque class="texto">
      <h2 class="script revela" id="fiesta-titulo" style="--tam: 12.5cqw"></h2>
      <p class="lugar revela"><b id="fiesta-lugar"></b><span class="parrafo" id="fiesta-dir" style="--fp: 4.8cqw; display: block"></span></p>
      <div class="sep revela" style="margin: 3cqw auto"><i></i></div>

      <p class="revela"><a class="boton" id="mapa" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span></span></a></p>

  <section class="escena" style="--img: url('recursos/e05.webp'); --ty: 16%; --vy: 24%; --vh: 18%">

  </section>

  <!-- 6 arco de lirios: recuerdos (sus 3 fotos reales) -->
  <section class="escena" style="--img: url('recursos/e06.webp'); --ty: 13.5%; --vy: 18%; --vh: 9%; --vo: .5; --fy: 29.5%; --fw: 45cqw">
    <div class="velo"></div>

    <div data-bloque class="recuerdos revela" id="recuerdos"><div class="marco"><div class="pista" id="pista"></div></div><div class="puntos" id="puntos"></div><p class="parrafo pie" id="rec-pie"></p></div>
  </section>

  <!-- 7 banco junto al agua con el mismo sobre: confirmar -->
  <section class="escena" style="--img: url('recursos/e07.webp'); --ty: 15.5%; --vy: 24%; --vh: 16%">
    <div class="velo"></div>
    <div data-bloque class="texto"><h2 class="script revela" id="conf-titulo" style="--tam: 11cqw"></h2><p class="parrafo revela" id="conf-texto" style="--fp: 4.9cqw; margin-top: 1cqw"></p></div>
    <div data-bloque class="texto revela" style="top: 77.5%"><button class="boton" id="confirmar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.2-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.8-.1 1.4z"/></svg><span></span></button></div>
  </section>

  <!-- 8 muelle con la cúpula del lirio y la estrella: te espero -->
  <section class="escena" id="cierre" style="--img: url('recursos/e08.webp'); --ty: 15.5%; --vy: 24%; --vh: 15%; --vo: .55">
    <div class="velo"></div>
    <div class="velo" style="--vy: 77%; --vh: 11%; --vo: .6"></div>
    <div data-bloque class="texto"><p class="parrafo revela" id="frase" style="--fp: 5.2cqw"></p><h2 class="script revela" id="te-espero" style="--tam: 18cqw; margin-top: 0"></h2></div>
    <div data-bloque class="texto" style="top: 71%"><h3 class="script revela" id="nombre-cierre" style="--tam: 11cqw"></h3><p class="caps revela" id="fecha-corta" style="margin-top: 1.5cqw; font-size: 4cqw; letter-spacing: .24em; color: #fff4d4"></p></div>
  </section>

  <a id="credito" href="https://eleganciadeamor.com/#nuestros-trabajos" target="_blank" rel="noopener"><span>Página hecha con amor por</span><b>Invitaciones de Amor</b><em>Ver nuestros trabajos ›</em></a>
</div>

<div id="luces" aria-hidden="true"></div>
<button id="musica-boton" aria-label="Pausar o reanudar la música"><svg class="pausa" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg><svg class="play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
<audio id="musica" loop preload="none"></audio>
<div id="aviso" role="status"></div>

<script>
const C = CONFIG, $ = id => document.getElementById(id);
const pon = (id, t) => { const e = $(id); if (e) e.textContent = t; };
// ---- textos ----
pon('toca', C.textoAbrir); pon('nombre', C.nombre); pon('nombre-cierre', C.nombre);
$('sello').style.left = C.sello.x + '%'; $('sello').style.top = C.sello.y + '%';
pon('sueno-titulo', C.sueno.titulo); pon('sueno', C.sueno.texto);
pon('inv-titulo', C.invitacion.titulo); pon('inv-texto', C.invitacion.texto);
pon('reserva', C.reserva); pon('falta', C.faltaPoco);
const fe = C.fecha, MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DIA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const evento = C.zonaUTC == null ? new Date(fe.anio, fe.mes - 1, fe.dia, fe.hora, fe.minuto) : new Date(Date.UTC(fe.anio, fe.mes - 1, fe.dia, fe.hora - C.zonaUTC, fe.minuto));
pon('dia-semana', DIA[new Date(fe.anio, fe.mes - 1, fe.dia).getDay()]); pon('dia', fe.dia); pon('anio', fe.anio); pon('mes', MES[fe.mes - 1]);
pon('fecha-portada', fe.dia + ' de ' + MES[fe.mes - 1] + ' · ' + fe.anio);
pon('fiesta-titulo', C.fiesta.titulo); pon('fiesta-lugar', C.fiesta.lugar); pon('fiesta-dir', C.fiesta.direccion); pon('fiesta-hora', C.horaTexto);
if (C.fiesta.mapa) { $('mapa').href = C.fiesta.mapa; $('mapa').querySelector('span').textContent = C.fiesta.boton; } else $('mapa').parentNode.remove();
pon('vest-titulo', C.vestimenta.titulo); pon('vest-estilo', C.vestimenta.estilo); if (C.vestimenta.nota) pon('vest-nota', C.vestimenta.nota); else $('vest-nota').remove();
pon('rec-titulo', C.recuerdos.titulo); pon('rec-pie', C.recuerdos.pie);
pon('conf-titulo', C.confirmacion.titulo); pon('conf-texto', C.confirmacion.texto); $('confirmar').querySelector('span').textContent = C.confirmacion.boton;
pon('frase', C.despedida.frase); pon('te-espero', C.despedida.cierre);
pon('fecha-corta', String(fe.dia).padStart(2, '0') + ' · ' + String(fe.mes).padStart(2, '0') + ' · ' + fe.anio);
// ---- recuerdos: deslizar (y pasan solas) ----
(() => {
  const pista = $('pista'), puntos = $('puntos');
  C.recuerdos.fotos.forEach((f, i) => { const im = document.createElement('img'); im.src = f; im.alt = C.nombre + ' · recuerdo ' + (i + 1); im.loading = 'lazy'; pista.appendChild(im); puntos.appendChild(document.createElement('i')); });
  const marcar = () => { const k = Math.round(pista.scrollLeft / pista.clientWidth); [...puntos.children].forEach((p, i) => p.classList.toggle('on', i === k)); return k; };
  pista.addEventListener('scroll', () => requestAnimationFrame(marcar), { passive: true }); marcar();
  let toco = false; pista.addEventListener('pointerdown', () => toco = true, { passive: true }); pista.addEventListener('touchstart', () => toco = true, { passive: true });
  setInterval(() => { if (toco || document.hidden) return; const k = (marcar() + 1) % C.recuerdos.fotos.length; pista.scrollTo({ left: k * pista.clientWidth, behavior: 'smooth' }); }, 3800);
})();
// ---- cuenta regresiva ----
function contar() {
  let r = Math.max(0, evento - new Date()); const d = Math.floor(r / 864e5); r -= d * 864e5; const h = Math.floor(r / 36e5); r -= h * 36e5; const m = Math.floor(r / 6e4); const s = Math.floor((r - m * 6e4) / 1e3);
  pon('dias', d); pon('horas', String(h).padStart(2, '0')); pon('minutos', String(m).padStart(2, '0')); pon('segundos', String(s).padStart(2, '0'));
}
contar(); setInterval(contar, 1000);
// ---- aparecer al bajar ----
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } }), { threshold: .2 });
const observar = () => document.querySelectorAll('.revela').forEach(el => io.observe(el));
// ---- luciérnagas ----
const LU = $('luces');
for (let i = 0; i < 16; i++) { const e = document.createElement('i');
  e.style.cssText = `left:${Math.random() * 100}%;--w:${3 + Math.random() * 4}px;--d:${11 + Math.random() * 10}s;--r:${-Math.random() * 20}s;--x:${-40 + Math.random() * 80}px`; LU.appendChild(e); }
// ---- música ----
const mu = $('musica'), mb = $('musica-boton');
function sonar() { if (!mu.src) mu.src = C.musica; mu.volume = .7; mu.play().then(() => mb.classList.remove('pausado')).catch(() => mb.classList.add('pausado')); }
mb.addEventListener('click', () => { if (mu.paused) sonar(); else { mu.pause(); mb.classList.add('pausado'); } });
// ---- sobre ----
let abierto = false, entro = false;
const sv = $('sobre-video');
if (C.videoSobre) { sv.src = C.videoSobre; sv.poster = 'recursos/sobre-cerrado.webp'; }
function entrar() {
  if (entro) return; entro = true;
  $('apertura').classList.add('sale'); document.body.classList.remove('cerrado'); observar();
  setTimeout(() => $('apertura').remove(), 1100);
}
function abrir() {
  if (abierto) return; abierto = true;
  $('apertura').classList.add('abierto'); sonar(); mb.classList.add('visible');
  if (!C.videoSobre) { setTimeout(entrar, 1300); return; }
  sv.muted = true; sv.playbackRate = sv.defaultPlaybackRate = parseFloat(new URLSearchParams(location.search).get('vel')) || C.velocidadSobre || 2;
  sv.addEventListener('playing', () => $('apertura').classList.add('con-video'), { once: true });
  sv.play().catch(() => setTimeout(entrar, 600));
  sv.addEventListener('timeupdate', () => { if (sv.duration && sv.currentTime >= sv.duration - .45) entrar(); });
  sv.addEventListener('ended', entrar); sv.addEventListener('error', () => setTimeout(entrar, 800));
  setTimeout(() => { if (sv.currentTime < .1) entrar(); }, 6000);
}
$('apertura').addEventListener('click', abrir);
if (location.search.includes('directo')) { abierto = true; $('apertura').remove(); document.body.classList.remove('cerrado'); observar(); }
// ---- aviso flotante ----
let tAviso; function aviso(t) { const a = $('aviso'); a.textContent = t; a.classList.add('ver'); clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove('ver'), 2600); }
// ---- confirmar por WhatsApp (en la muestra: solo avisa) ----
$('confirmar').addEventListener('click', () => {
  const n = (C.confirmacion.whatsapp || '').replace(/\D/g, '');
  if (C.muestra.activa && !location.search.includes('sinmarca') || !n) { aviso(C.muestra.aviso); return; }
  open('https://wa.me/' + n + '?text=' + encodeURIComponent(C.confirmacion.mensaje), '_blank');
});
// ---- modo muestra: marca de agua y protección ----
if (C.muestra.activa && !location.search.includes('sinmarca')) {
  document.body.classList.add('muestra');
  const t = C.muestra.texto, tinta = ['rgba(15,8,8,.45)', 'rgba(255,255,255,.3)'];
  const fila = (x, y) => "<text x='" + x + "' y='" + y + "' text-anchor='middle' font-family='Georgia,serif' font-size='14' font-weight='700' letter-spacing='2.5' fill='" + tinta[0] + "' stroke='" + tinta[1] + "' stroke-width='.5'>" + t + "</text>";
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='260' height='200'><g transform='rotate(-28 130 100)'>" + fila(130, 70) + fila(0, 160) + fila(260, 160) + "</g></svg>";
  const capa = document.createElement('div'); capa.id = 'marca-agua'; capa.setAttribute('aria-hidden', 'true');
  capa.style.setProperty('--marca', 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")'); document.body.appendChild(capa);
  ['contextmenu', 'dragstart', 'selectstart', 'copy', 'cut'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener('keydown', e => { const k = (e.key || '').toLowerCase(), mod = e.ctrlKey || e.metaKey; if (e.key === 'F12' || (mod && ['s', 'u', 'p', 'c', 'a'].includes(k))) e.preventDefault(); });
}
</script>
