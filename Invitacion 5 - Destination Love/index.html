#formulario-ventana .cerrar { position: absolute; top: -34px; right: 8px; width: 23px; height: 23px; cursor: pointer; background: none; border: 0; }
#formulario-ventana .cerrar::before, #formulario-ventana .cerrar::after { content: ""; position: absolute; left: 10px; top: -4px; width: 2px; height: 30px; background: #fff; transform: rotate(45deg); }
#formulario-ventana .cerrar::after { transform: rotate(-45deg); }
#formulario-ventana img { width: 100%; }
#formulario-ventana .interior { padding: 40px 45px; font-family: Georgia, serif; color: var(--texto); }
#formulario-ventana h3 { font-weight: 400; font-size: 22px; line-height: 1.23; text-align: center; margin-bottom: 11px; }
#formulario-ventana .descripcion { font-size: 18px; line-height: 1.55; text-align: center; margin-bottom: 30px; }
#formulario-ventana .campo { display: block; font-size: 20px; line-height: 1.55; margin-bottom: 6px; }
#formulario-ventana input[type=text] { width: 100%; height: 56px; padding: 0 20px; margin-bottom: 20px; font-family: Georgia, serif; font-size: 16px; color: var(--texto); border: 1px solid #c9c9c9; border-radius: 5px; outline: none; }
#formulario-ventana .opciones { margin-bottom: 20px; }
#formulario-ventana .opcion { display: flex; align-items: center; gap: 10px; font-size: 16px; line-height: 1.55; cursor: pointer; }
#formulario-ventana .opcion input { width: 20px; height: 20px; accent-color: var(--verde); }
#formulario-ventana .enviar { display: block; margin: 10px auto 0; height: 60px; padding: 0 60px; background: var(--verde); color: #fff; border: 0; border-radius: 20px; font-family: Georgia, serif; font-size: 16px; cursor: pointer; }
#formulario-ventana .gracias { display: none; text-align: center; font-size: 20px; padding: 20px 0; }
@media (max-width: 560px) { #formulario-ventana { padding: 0; } #formulario-ventana .caja { min-height: 100%; } #formulario-ventana .cerrar { top: 12px; right: 12px; z-index: 2; } #formulario-ventana .interior { padding: 30px 20px; } }

/* ------------------------------------------------------------
   9. MAPA Y DESPEDIDA
   ------------------------------------------------------------ */
#mapa-titulo { height: 158px; }
#mapa-titulo .titulo { --x: 100px; top: 66px; width: 240px; color: var(--texto-suave); }
#mapa { height: 400px; }
#mapa iframe { position: absolute; left: calc(50% - 220px); top: 0; width: 440px; height: 400px; border: 0; }
#despedida { height: 247px; }
#despedida .despedida-titulo { --x: 60px; top: 48px; width: 320px; text-align: center; font-size: 33px; color: var(--texto-suave); white-space: nowrap; }
#despedida .nombres { --x: 20px; top: 100px; width: 400px; text-align: center; font-size: 29px; line-height: 1.25; }
#despedida .corazon { --x: 205px; top: 161px; width: 30px; }

/* Celulares más angostos que la columna de 440 px */
@media (max-width: 439px) {
  #mapa iframe { left: 0; width: 100%; }
}
</style>

<script>
/* ============================================================
   FUNCIONAMIENTO (no hace falta tocar nada de aquí abajo)
   ============================================================ */
(function () {
  const $ = (id) => document.getElementById(id);

  /* ---------- Rellenar textos desde CONFIG ---------- */
  const b = CONFIG.bienvenida;
  $('bienvenida-marco').style.backgroundImage = 'url("' + b.marco + '")';
  $('bienvenida-titulo').textContent = b.titulo;
  $('bienvenida-texto').textContent = b.texto;
  $('bienvenida-boton').textContent = b.boton;

  const p = CONFIG.portada;
  for (let i = 0; i < 24; i++) { const s = document.createElement('span'); s.textContent = p.franja; $('franja-pista').appendChild(s); }
  window.addEventListener('load', () => { $('franja-pista').style.setProperty('--paso', $('franja-pista').firstChild.offsetWidth + 'px'); });
  $('portada-nombres').textContent = CONFIG.noviosTexto;
  $('portada-subtitulo').textContent = p.subtitulo;
  $('portada-mapa').style.backgroundImage = 'url("' + p.mapa + '")';
  $('portada-destino').textContent = p.destino;
  $('portada-invitados').textContent = p.invitados;
  $('portada-texto').textContent = p.texto;
  $('portada-fecha').textContent = p.fechaLugar;

  const ps = CONFIG.pasaporte;
  $('pasaporte-titulo').textContent = ps.titulo;
  $('pasaporte-tipo').textContent = ps.tipo;
  $('pasaporte-codigo').textContent = ps.codigo;
  $('pasaporte-numero').textContent = ps.numero;
  $('pasaporte-foto').style.backgroundImage = 'url("' + ps.foto + '")';
  $('pasaporte-etq-novios').textContent = ps.etiquetaNovios;
  $('pasaporte-novios').textContent = CONFIG.noviosCompleto;
  $('pasaporte-etq-fecha').textContent = ps.etiquetaFecha;
  $('pasaporte-fecha').textContent = ps.fecha;
  $('pasaporte-etq-hora').textContent = ps.etiquetaHora;
  $('pasaporte-hora').textContent = ps.hora;
  $('pasaporte-etq-destino').textContent = ps.etiquetaDestino;
  $('pasaporte-destino').textContent = ps.destino;
  $('pasaporte-linea-1').textContent = ps.linea1;
  $('pasaporte-linea-2').textContent = ps.linea2;
  $('pasaporte-sello').src = ps.sello;

  $('cronograma-titulo').textContent = CONFIG.cronograma.titulo;
  CONFIG.cronograma.eventos.slice(0, 6).forEach((t, i) => { $('evento-' + (i + 1)).textContent = t; });

  $('lugar-titulo').textContent = CONFIG.lugar.titulo;
  $('lugar-nombre').textContent = CONFIG.lugar.nombre;
  $('lugar-direccion').textContent = CONFIG.lugar.direccion;
  $('lugar-foto').style.backgroundImage = 'url("' + CONFIG.lugar.foto + '")';

  const v = CONFIG.vestimenta;
  $('vestimenta-titulo').textContent = v.titulo;
  $('vestimenta-texto').textContent = v.texto;
  v.galeria.forEach((src) => { const im = document.createElement('img'); im.src = src; im.alt = ''; im.loading = 'lazy'; $('galeria-tira').appendChild(im); });
  $('colores-etiqueta').textContent = v.etiquetaColores;
  v.colores.forEach((c, i) => { const d = document.createElement('div'); d.className = 'circulo aparece'; d.style.background = c; d.style.transitionDelay = (i * .1) + 's'; $('colores-circulos').appendChild(d); });
  $('colores-detalle').innerHTML = v.detalle;

  $('detalles-titulo').textContent = CONFIG.detalles.titulo;
  CONFIG.detalles.tarjetas.slice(0, 3).forEach((t, i) => {
    const el = $('boleto-' + (i + 1));
    el.innerHTML = '<div class="talon"><div class="rotulo"></div><img src="recursos/avion.png" alt=""></div><div class="perforado"></div><div class="cuerpo"><div class="texto"></div>' + (t.destacado ? '<div class="destacado"></div>' : '') + '</div>';
    el.querySelector('.rotulo').textContent = t.etiqueta;
    el.querySelector('.texto').textContent = t.texto;
    if (t.destacado) el.querySelector('.destacado').textContent = t.destacado;
  });

  const c = CONFIG.confirmacion, f = c.formulario;
  $('confirmacion-titulo').textContent = c.titulo;
  $('confirmacion-texto').textContent = c.texto;
  $('confirmacion-boton').textContent = c.boton;
  $('confirmacion-foto-img').style.backgroundImage = 'url("' + c.foto + '")';
  $('formulario-imagen').src = f.imagen;
  $('formulario-titulo').textContent = f.titulo;
  $('formulario-texto').textContent = f.texto;
  $('etiqueta-nombre').textContent = f.campoNombre;
  $('etiqueta-asistencia').textContent = f.campoAsistencia;
  f.opcionesAsistencia.forEach((op) => {
    const l = document.createElement('label'); l.className = 'opcion';
    l.innerHTML = '<input type="checkbox" name="asistencia" value="' + op + '"><span>' + op + '</span>';
    $('opciones-asistencia').appendChild(l);
  });
  $('etiqueta-intolerancias').textContent = f.campoIntolerancias;
  $('boton-enviar').textContent = f.botonEnviar;
  $('gracias').textContent = f.gracias;

  $('mapa-titulo-texto').textContent = CONFIG.mapa.titulo;
  $('mapa-iframe').src = CONFIG.mapa.enlace;
  $('despedida-titulo').textContent = CONFIG.despedida.titulo;
  $('despedida-nombres').textContent = CONFIG.noviosDespedida;
  $('despedida-corazon').src = CONFIG.despedida.corazon;

  /* ---------- Pantalla de bienvenida ---------- */
  $('bienvenida-boton').addEventListener('click', () => {
    $('bienvenida').classList.add('fuera');
    document.body.classList.remove('bloqueado');
    setTimeout(() => $('bienvenida').remove(), 500);
    document.querySelectorAll('#portada .aparece').forEach(e => e.classList.add('visible'));
    iniciarMusica();
  });

  /* ---------- Música (solo si hay archivo en CONFIG) ---------- */
  const audio = $('musica'), botonMusica = $('musica-boton');
  function iniciarMusica() {
    if (!CONFIG.musica.archivo) return;
    audio.src = CONFIG.musica.archivo;
    audio.play().then(() => botonMusica.classList.add('visible')).catch(() => {});
  }
  botonMusica.addEventListener('click', () => {
    if (audio.paused) { audio.play(); $('icono-play').style.display = 'none'; $('icono-pausa').style.display = 'block'; }
    else { audio.pause(); $('icono-play').style.display = 'block'; $('icono-pausa').style.display = 'none'; }
  });

  /* ---------- Ventana del formulario (solo visual por ahora) ---------- */
  const ventana = $('formulario-ventana');
  $('confirmacion-boton').addEventListener('click', () => { ventana.classList.add('abierta'); document.body.classList.add('bloqueado'); });
  const cerrarVentana = () => { ventana.classList.remove('abierta'); document.body.classList.remove('bloqueado'); };
  $('formulario-cerrar').addEventListener('click', cerrarVentana);
  ventana.addEventListener('click', (e) => { if (e.target === ventana) cerrarVentana(); });
  $('formulario').addEventListener('submit', (e) => { e.preventDefault(); $('formulario').style.display = 'none'; $('gracias').style.display = 'block'; });

  /* ---------- Animaciones al entrar en pantalla ---------- */
  const observador = new IntersectionObserver((entradas) => {
    entradas.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observador.unobserve(e.target); } });
  }, { threshold: .1 });
  document.querySelectorAll('.aparece, .aparece-izq, .aparece-der').forEach(el => { if (!el.closest('#portada')) observador.observe(el); });
  const obsSello = new IntersectionObserver((entradas) => {
    entradas.forEach(e => { if (e.isIntersecting) { $('pasaporte-sello').classList.add('estampado'); obsSello.disconnect(); } });
  }, { threshold: .6 });
  obsSello.observe($('pasaporte'));

  /* ---------- Aviones que avanzan por la ruta al hacer scroll ---------- */
  // pasos: [desplazamiento x, desplazamiento y, giro, distancia de scroll hasta llegar]
  function avionPorScroll(el, pasos) {
    const total = pasos.reduce((s, q) => s + q[3], 0);
    const seccion = el.parentElement;
    function actualizar() {
      const r = seccion.getBoundingClientRect();
      const avance = Math.max(0, Math.min(total, window.innerHeight - r.top - 200));
      let acumulado = 0, x = 0, y = 0, g = 0;
      for (const q of pasos) {
        if (avance >= acumulado + q[3]) { acumulado += q[3]; x = q[0]; y = q[1]; g = q[2]; continue; }
