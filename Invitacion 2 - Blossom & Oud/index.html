    <div class="circulos" id="circulos"></div>
    <div class="grupo">
      <div class="titulo-md" id="damas-titulo"></div>
      <p class="texto aparece" id="damas-texto"></p>
    </div>
    <div class="grupo">
      <div class="titulo-md" id="caballeros-titulo"></div>
      <p class="texto aparece" id="caballeros-texto"></p>
    </div>
  </section>

  <!-- ============================================================
       8. CONFIRMACIÓN
       ============================================================ -->
  <section id="confirmacion">
    <h2 class="titulo" id="confirmacion-titulo"></h2>
    <img class="divisor" src="recursos/divisor.png" alt="">
    <form id="formulario" class="aparece-lento">
      <label for="campo-nombre" id="etq-nombre"></label>
      <input type="text" id="campo-nombre" required>
      <label for="campo-personas" id="etq-personas"></label>
      <input type="text" id="campo-personas" inputmode="numeric" required>
      <div class="grupo-titulo" id="etq-asistencia"></div>
      <div id="opciones-asistencia"></div>
      <button type="submit" class="enviar" id="boton-enviar"></button>
    </form>
    <div id="gracias"></div>
  </section>

  <!-- ============================================================
       9. MAPA
       ============================================================ -->
  <section id="mapa">
    <h2 class="titulo" id="mapa-titulo"></h2>
    <img class="divisor" src="recursos/divisor.png" alt="">
    <div class="caja"><iframe id="mapa-iframe" src="" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe></div>
  </section>

  <!-- ============================================================
       10. DESPEDIDA
       ============================================================ -->
  <section id="despedida">
    <img class="lampara" src="recursos/despedida-lampara.png" alt="">
    <h2 class="titulo" id="despedida-titulo"></h2>
    <img class="linea" src="recursos/despedida-linea.png" alt="">
    <img class="flor" src="recursos/despedida-flor.png" alt="">
  </section>

</div><!-- /.invitacion -->

<!-- Música -->
<audio id="musica" loop></audio>
<div id="musica-boton" class="pausado">
  <svg class="pausa" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  <svg class="play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
</div>

<script>
/* ============================================================
   FUNCIONAMIENTO (no hace falta tocar nada de aquí abajo)
   ============================================================ */
(function () {
  const $ = (id) => document.getElementById(id);

  /* ---------- Rellenar textos desde CONFIG ---------- */
  $('sello').src = CONFIG.sobre.sello;
  $('sobre-texto').textContent = CONFIG.sobre.textoAbrir;

  $('video-portada').src = CONFIG.portada.video;
  $('video-portada').poster = CONFIG.portada.foto;
  $('portada-foto').src = CONFIG.portada.foto;
  $('portada-novia').textContent = CONFIG.novia;
  $('portada-novio').textContent = CONFIG.novio;
  $('portada-fecha').textContent = CONFIG.fechaTexto;
  $('portada-hora').textContent = CONFIG.horaTexto;

  $('tarjeta-texto').innerHTML = CONFIG.tarjeta.texto;
  $('tarjeta-lugar').textContent = CONFIG.tarjeta.lugar;

  $('cuenta-titulo').textContent = CONFIG.cuentaRegresiva.titulo;
  ['dias', 'horas', 'minutos', 'segundos'].forEach((k, i) => { $('etq-' + k).textContent = CONFIG.cuentaRegresiva.etiquetas[i]; });

  $('cronograma-titulo').textContent = CONFIG.cronograma.titulo;
  // Eventos: cada 82 px sobre la línea, hora a la izquierda y nombre a la derecha
  const cont = $('cronograma-eventos');
  CONFIG.cronograma.eventos.forEach((ev, i) => {
    const top = 213 + i * 82;
    const rombo = new Image(); rombo.src = 'recursos/cronograma-rombo.png'; rombo.className = 'rombo'; rombo.style.top = top + 'px';
    const hora = document.createElement('div'); hora.className = 'evento-hora'; hora.style.top = (top - 16) + 'px'; hora.textContent = ev.hora;
    const nombre = document.createElement('div'); nombre.className = 'evento-nombre'; nombre.style.top = (top - 3) + 'px'; nombre.textContent = ev.nombre;
    cont.append(rombo, hora, nombre);
  });

  $('lugar-titulo').textContent = CONFIG.lugar.titulo;
  $('lugar-nombre').textContent = CONFIG.lugar.nombre;
  $('lugar-ciudad').textContent = CONFIG.lugar.ciudad;
  $('lugar-ilustracion').src = CONFIG.lugar.ilustracion;
  $('mapa-titulo').textContent = CONFIG.lugar.tituloMapa;
  $('mapa-iframe').src = CONFIG.lugar.mapa;

  $('vestimenta-titulo').textContent = CONFIG.vestimenta.titulo;
  $('vestimenta-texto').textContent = CONFIG.vestimenta.texto;
  $('vestimenta-ilustracion').src = CONFIG.vestimenta.ilustracion;
  $('vestimenta-titulo-colores').textContent = CONFIG.vestimenta.tituloColores;
  CONFIG.vestimenta.colores.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'circulo aparece'; d.style.transitionDelay = (i * .1) + 's';
    d.innerHTML = '<span style="background:' + c + '"></span>';
    $('circulos').appendChild(d);
  });
  $('damas-titulo').textContent = CONFIG.vestimenta.damas.titulo;
  $('damas-texto').textContent = CONFIG.vestimenta.damas.texto;
  $('caballeros-titulo').textContent = CONFIG.vestimenta.caballeros.titulo;
  $('caballeros-texto').textContent = CONFIG.vestimenta.caballeros.texto;

  $('confirmacion-titulo').textContent = CONFIG.confirmacion.titulo;
  $('etq-nombre').textContent = CONFIG.confirmacion.campoNombre;
  $('etq-personas').textContent = CONFIG.confirmacion.campoPersonas;
  $('etq-asistencia').textContent = CONFIG.confirmacion.campoAsistencia;
  CONFIG.confirmacion.opciones.forEach((op, i) => {
    const l = document.createElement('label'); l.className = 'opcion';
    l.innerHTML = '<input type="radio" name="asistencia" value="' + op + '"' + (i === 0 ? ' required' : '') + '><span>' + op + '</span>';
    $('opciones-asistencia').appendChild(l);
  });
  $('boton-enviar').textContent = CONFIG.confirmacion.boton;
  $('gracias').textContent = CONFIG.confirmacion.gracias;

  $('despedida-titulo').textContent = CONFIG.despedida.titulo;
  $('musica').src = CONFIG.musica;

  /* ---------- Sobre: abrir con un toque ---------- */
  const sobre = $('sobre'), video = $('video-portada'), musica = $('musica'), musicaBoton = $('musica-boton');
  let abierto = false;
  sobre.addEventListener('click', () => {
    if (abierto) return; abierto = true;
    sobre.classList.add('abriendo');                                  // el sello se agranda y desaparece
    setTimeout(() => sobre.classList.add('solapas'), 1500);            // las solapas se abren
    setTimeout(() => {                                                 // el sobre desaparece
      sobre.classList.add('abierto');
      document.body.classList.remove('bloqueado');
      video.play().catch(() => {});
      $('video-brillos').play().catch(() => {});
      musica.play().then(() => musicaBoton.classList.remove('pausado')).catch(() => {});
      musicaBoton.classList.add('visible');
      setTimeout(() => sobre.remove(), 800);
      setTimeout(() => document.querySelectorAll('.aparece-tarde').forEach(e => e.classList.add('visible')), 1500);
    }, 3300);
  });
  $('video-brillos').play().catch(() => {});

  /* ---------- Música: pausar / reanudar ---------- */
  musicaBoton.addEventListener('click', () => {
    if (musica.paused) { musica.play(); musicaBoton.classList.remove('pausado'); }
    else { musica.pause(); musicaBoton.classList.add('pausado'); }
  });

  /* ---------- Animaciones al entrar en pantalla ---------- */
  const observador = new IntersectionObserver((entradas) => {
    entradas.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observador.unobserve(e.target); } });
  }, { threshold: .2 });
  document.querySelectorAll('.aparece, .aparece-lento, .divisor, #despedida').forEach(el => observador.observe(el));

  /* ---------- Cuenta regresiva ---------- */
  const f = CONFIG.fecha;
  const fechaEvento = new Date(f.anio, f.mes - 1, f.dia, f.hora, f.minuto, 0);
  function actualizarCuenta() {
    const resta = fechaEvento - new Date();
    if (resta <= 0) { $('contador').innerHTML = '<div class="terminado">' + CONFIG.cuentaRegresiva.terminado + '</div>'; clearInterval(reloj); return; }
    const p = (n) => String(n).padStart(2, '0');
    $('dias').textContent = p(Math.floor(resta / 86400000));
    $('horas').textContent = p(Math.floor(resta % 86400000 / 3600000));
    $('minutos').textContent = p(Math.floor(resta % 3600000 / 60000));
    $('segundos').textContent = p(Math.floor(resta % 60000 / 1000));
  }
  const reloj = setInterval(actualizarCuenta, 1000); actualizarCuenta();

  /* ---------- Cronograma: la flor baja por la línea con el scroll ---------- */
  const cronograma = $('cronograma'), flor = $('cronograma-flor');
  function moverFlor() {
    const r = cronograma.getBoundingClientRect();
    let p = (window.innerHeight * .75 - r.top - 216) / 258;   // 0 = flor arriba, 1 = flor abajo
    p = Math.max(0, Math.min(1, p));
    flor.style.transform = 'translateY(' + (p * 247) + 'px) rotate(' + (p * 134) + 'deg)';
  }
  window.addEventListener('scroll', moverFlor, { passive: true });
  window.addEventListener('resize', moverFlor);
  moverFlor();

  /* ---------- Formulario (solo visual por ahora) ---------- */
  $('formulario').addEventListener('submit', (e) => {
    e.preventDefault();
    $('formulario').style.display = 'none';
    $('gracias').style.display = 'block';
  });
})();
</script>
</body>
</html>
