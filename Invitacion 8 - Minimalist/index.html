#sobre.abierto .abrir { opacity: 0; }

  <section id="portada" class="papel">
    <div class="pos marco"></div>
    <div class="pos nombres script" id="portada-nombres"></div>
    <div class="pos subtitulo" id="portada-subtitulo"></div>
    <div class="pos foto" id="portada-foto"></div>
    <div class="pos titulo aparece" id="portada-titulo"></div>
    <div class="pos texto-1 aparece" id="portada-texto-1"></div>
    <div class="pos texto-2 aparece" id="portada-texto-2"></div>
  </section>

  <!-- ========== 3. CUÁNDO Y DÓNDE ========== -->
  <section id="lugar" class="papel">
    <div class="pos foto" id="lugar-foto"></div>
    <div class="pos degradado"></div>
    <div class="pos titulo cuando-titulo" id="cuando-titulo"></div>
    <div class="pos cuando-texto aparece" id="cuando-texto"></div>
    <div class="pos titulo donde-titulo" id="donde-titulo"></div>
    <div class="pos donde-texto aparece" id="donde-texto"></div>
  </section>

  <!-- ========== 4. PROGRAMA DEL EVENTO ========== -->
  <section id="cronograma" class="papel">
    <div class="titulo" id="cronograma-titulo"></div>
    <div class="lista" id="cronograma-lista"></div>
  </section>

  <!-- ========== 5. CUENTA REGRESIVA ========== -->
  <section id="cuenta" class="papel">
    <div class="pos titulo" id="cuenta-titulo"></div>
    <div class="pos contador" id="contador">
      <div class="bloque"><div class="numero" id="dias">00</div><div class="etiqueta" id="etq-dias"></div></div>
      <div class="separador">:</div>
      <div class="bloque"><div class="numero" id="horas">00</div><div class="etiqueta" id="etq-horas"></div></div>
      <div class="separador">:</div>
      <div class="bloque"><div class="numero" id="minutos">00</div><div class="etiqueta" id="etq-minutos"></div></div>
      <div class="separador">:</div>
      <div class="bloque"><div class="numero" id="segundos">00</div><div class="etiqueta" id="etq-segundos"></div></div>
    </div>
  </section>

  <!-- ========== 6. ASPECTOS ORGANIZATIVOS ========== -->
  <section id="detalles" class="papel">
    <div class="marco aparece">
      <div class="titulo" id="detalles-titulo"></div>
      <div class="texto" id="detalles-texto"></div>
      <div class="telefono" id="detalles-telefono"></div>
      <div class="texto-2" id="detalles-texto-2"></div>
    </div>
    <div class="foto" id="detalles-foto"></div>
  </section>

  <!-- ========== 7. CÓDIGO DE VESTIMENTA ========== -->
  <section id="vestimenta" class="papel">
    <div class="pos titulo" id="vestimenta-titulo"></div>
    <div class="pos texto" id="vestimenta-texto"></div>
    <div class="pos colores" id="vestimenta-colores"></div>

    <div class="pos marco-foto marco-1" style="background-image:url('recursos/marco-1.png')"></div>
    <div class="pos marco-foto foto-1" id="vestimenta-foto-1"></div>
    <div class="pos hombres-titulo aparece-der" id="hombres-titulo"></div>
    <div class="pos hombres-texto aparece-der" id="hombres-texto"></div>
    <div class="pos flecha-1 aparece-der"><svg viewBox="0 0 67.962 29.711" fill="none"><path d="M0.541 0.023L1.955 3.842C3.445 7.866 5.787 11.899 8.883 15.771C12.726 21.401 19.851 25.969 27.426 27.660L30.302 28.303C32.520 28.798 34.716 29.080 36.835 29.143L40.609 29.255C47.990 29.474 54.809 28.468 60.628 26.302L67.591 23.709" stroke="#4A4A4A"/></svg></div>
    <div class="pos punta-1 aparece-der"><svg viewBox="0 0 7.281 5.485" fill="none"><path d="M0.023 0.382L6.284 1.757L4.271 5.082" stroke="#4A4A4A"/></svg></div>

    <div class="pos marco-foto marco-2 aparece-sub" style="background-image:url('recursos/marco-2.png')"></div>
    <div class="pos marco-foto foto-2 aparece-sub" id="vestimenta-foto-2"></div>

    <div class="pos marco-foto marco-3" style="background-image:url('recursos/marco-3.png')"></div>
    <div class="pos marco-foto foto-3" id="vestimenta-foto-3"></div>
    <div class="pos mujeres-titulo aparece-izq" id="mujeres-titulo"></div>
    <div class="pos mujeres-texto aparece-izq" id="mujeres-texto"></div>
    <div class="pos flecha-2 aparece-izq"><svg viewBox="0 0 64.548 35.123" fill="none"><path d="M64.013 0.088L63.072 4.050C62.079 8.225 60.242 12.512 57.637 16.729C54.503 22.783 47.983 28.179 40.668 30.774L37.890 31.760C35.750 32.519 33.604 33.065 31.508 33.384L27.774 33.952C20.475 35.062 13.584 34.888 7.545 33.441L0.320 31.710" stroke="#4A4A4A"/></svg></div>
    <div class="pos punta-2 aparece-izq"><svg viewBox="0 0 7.081 6.041" fill="none"><path d="M7.058 0.393L0.844 2.573L3.310 5.713" stroke="#4A4A4A"/></svg></div>

    <div class="pos nota aparece" id="vestimenta-nota"></div>
  </section>

  <!-- ========== 8. CONFIRMACIÓN ========== -->
  <section id="confirmacion" class="papel">
    <div class="titulo" id="confirmacion-titulo"></div>
    <form id="formulario" autocomplete="off">
      <label class="campo" for="nombre" id="etiqueta-nombre"></label>
      <input type="text" id="nombre" name="nombre" required>
      <div class="campo" id="etiqueta-asistencia"></div>
      <div class="opciones" id="opciones-asistencia"></div>
      <div class="campo" id="etiqueta-bebida"></div>
      <div class="opciones" id="opciones-bebida"></div>
      <button type="submit" class="boton" id="boton-enviar"></button>
    </form>
    <div class="gracias" id="gracias"></div>
  </section>

  <!-- ========== 9. MAPA ========== -->
  <section id="mapa-titulo" class="papel">
    <div class="pos titulo" id="mapa-titulo-texto"></div>
  </section>
  <section id="mapa">
    <iframe id="mapa-iframe" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade" title="Mapa"></iframe>
  </section>

  <!-- ========== 10. DESPEDIDA ========== -->
  <section id="despedida" class="papel">
    <div class="pos despedida-titulo script aparece" id="despedida-titulo"></div>
    <div class="pos nombres aparece" id="despedida-nombres"></div>
    <img class="pos corazon aparece" id="despedida-corazon" src="" alt="">
  </section>

</div>
</div>

<script>
/* ============================================================
   FUNCIONAMIENTO (no hace falta tocar nada de aquí abajo)
   ============================================================ */
(function () {
  const $ = (id) => document.getElementById(id);

  /* ---------- Rellenar textos desde CONFIG ---------- */
  $('sobre-sello').src = CONFIG.sobre.sello;
  $('sobre-abrir').textContent = CONFIG.sobre.textoAbrir;

  $('portada-nombres').textContent = CONFIG.noviosTexto;
  $('portada-subtitulo').textContent = CONFIG.portada.subtitulo;
  $('portada-foto').style.backgroundImage = 'url("' + CONFIG.portada.foto + '")';
  $('portada-titulo').textContent = CONFIG.portada.titulo;
  $('portada-texto-1').textContent = CONFIG.portada.texto1;
  $('portada-texto-2').textContent = CONFIG.portada.texto2;

  const cd = CONFIG.cuandoDonde;
  $('lugar-foto').style.backgroundImage = 'url("' + cd.foto + '")';
  $('cuando-titulo').textContent = cd.cuandoTitulo;
  $('cuando-texto').textContent = cd.cuandoTexto;
  $('donde-titulo').textContent = cd.dondeTitulo;
  $('donde-texto').textContent = cd.dondeTexto;

  $('cronograma-titulo').textContent = CONFIG.cronograma.titulo;
  CONFIG.cronograma.eventos.forEach((ev, i) => {
    const e = document.createElement('div'); e.className = 'evento aparece'; e.style.transitionDelay = (i * .1) + 's';
    const h = document.createElement('div'); h.className = 'hora'; h.textContent = ev.hora;
    const n = document.createElement('div');
    const nombre = document.createElement('div'); nombre.className = 'nombre'; nombre.textContent = ev.nombre; n.appendChild(nombre);
    if (ev.detalle) { const d = document.createElement('div'); d.className = 'detalle'; d.textContent = ev.detalle; n.appendChild(d); }
    e.appendChild(h); e.appendChild(n);
    $('cronograma-lista').appendChild(e);
  });

  $('cuenta-titulo').textContent = CONFIG.cuentaRegresiva.titulo;
  ['dias', 'horas', 'minutos', 'segundos'].forEach((k, i) => { $('etq-' + k).textContent = CONFIG.cuentaRegresiva.etiquetas[i]; });

  $('detalles-titulo').textContent = CONFIG.detalles.titulo;
  $('detalles-texto').textContent = CONFIG.detalles.texto;
  $('detalles-telefono').textContent = CONFIG.detalles.telefono;
  $('detalles-texto-2').textContent = CONFIG.detalles.texto2;
  $('detalles-foto').style.backgroundImage = 'url("' + CONFIG.detalles.foto + '")';

  const v = CONFIG.vestimenta;
  $('vestimenta-titulo').textContent = v.titulo;
  $('vestimenta-texto').textContent = v.texto;
  v.colores.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'color aparece'; d.style.background = c; d.style.transitionDelay = (i * .1) + 's';
    $('vestimenta-colores').appendChild(d);
  });
  $('vestimenta-foto-1').style.backgroundImage = 'url("' + v.hombres.foto + '")';
  $('vestimenta-foto-2').style.backgroundImage = 'url("' + v.fotoExtra + '")';
  $('vestimenta-foto-3').style.backgroundImage = 'url("' + v.mujeres.foto + '")';
  $('hombres-titulo').textContent = v.hombres.titulo;
  $('hombres-texto').innerHTML = v.hombres.texto;
  $('mujeres-titulo').textContent = v.mujeres.titulo;
  $('mujeres-texto').innerHTML = v.mujeres.texto;
  $('vestimenta-nota').textContent = v.nota;

  $('confirmacion-titulo').innerHTML = CONFIG.confirmacion.titulo;
  const f = CONFIG.confirmacion.formulario;
  $('etiqueta-nombre').textContent = f.campoNombre;
  $('etiqueta-asistencia').textContent = f.campoAsistencia;
  $('etiqueta-bebida').textContent = f.campoBebida;
  const opciones = (lista, nombre, cont) => lista.forEach((op) => {
    const l = document.createElement('label'); l.className = 'opcion';
    l.innerHTML = '<input type="checkbox" name="' + nombre + '" value="' + op + '"><span>' + op + '</span>';
    cont.appendChild(l);
  });
  opciones(f.opcionesAsistencia, 'asistencia', $('opciones-asistencia'));
  opciones(f.opcionesBebida, 'bebida', $('opciones-bebida'));
  $('boton-enviar').textContent = f.botonEnviar;
  $('gracias').textContent = f.gracias;

  $('mapa-titulo-texto').textContent = CONFIG.mapa.titulo;
  $('mapa-iframe').src = CONFIG.mapa.enlace;

  $('despedida-titulo').textContent = CONFIG.despedida.titulo;
  $('despedida-nombres').textContent = CONFIG.noviosDespedida;
  $('despedida-corazon').src = CONFIG.despedida.corazon;

  /* ---------- Sobre: se abre al tocar el sello ---------- */
  let abierto = false;
  function abrirSobre() {
    if (abierto) return; abierto = true;
    $('sobre').classList.add('abierto');
    iniciarMusica();
    setTimeout(() => {
      $('sobre').classList.add('fuera');
      document.body.classList.remove('bloqueado');
      document.querySelectorAll('#portada .aparece').forEach(e => e.classList.add('visible'));
      setTimeout(() => $('sobre').remove(), 700);
    }, 5000);
  }
  $('sobre-sello').addEventListener('click', abrirSobre);
  $('sobre-abrir').addEventListener('click', abrirSobre);

  /* ---------- Música (solo si hay archivo en CONFIG) ---------- */
  const audio = $('musica'), botonMusica = $('musica-boton');
  function iniciarMusica() {
    if (!CONFIG.musica.archivo) return;
    audio.src = CONFIG.musica.archivo;
    audio.play().then(() => { botonMusica.classList.add('visible'); }).catch(() => {});
  }
  botonMusica.addEventListener('click', () => {
    if (audio.paused) { audio.play(); $('icono-play').style.display = 'none'; $('icono-pausa').style.display = 'block'; }
    else { audio.pause(); $('icono-play').style.display = 'block'; $('icono-pausa').style.display = 'none'; }
  });

  /* ---------- Animaciones al entrar en pantalla ---------- */
  const observador = new IntersectionObserver((entradas) => {
    entradas.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observador.unobserve(e.target); } });
  }, { threshold: .1 });
  document.querySelectorAll('.aparece, .aparece-izq, .aparece-der, .aparece-sub').forEach(el => { if (!el.closest('#portada')) observador.observe(el); });

  /* ---------- Cuenta regresiva ---------- */
  const fe = CONFIG.fecha;
  const fechaEvento = new Date(fe.anio, fe.mes - 1, fe.dia, fe.hora, fe.minuto, 0);
  function actualizarCuenta() {
    const resta = fechaEvento - new Date();
    if (resta <= 0) { $('contador').innerHTML = '<div class="terminado">' + CONFIG.cuentaRegresiva.terminado + '</div>'; clearInterval(reloj); return; }
    const p = (n) => String(n).padStart(2, '0');
    $('dias').textContent = p(Math.floor(resta / 86400000));
    $('horas').textContent = p(Math.floor(resta % 86400000 / 3600000));
    $('minutos').textContent = p(Math.floor(resta % 3600000 / 60000));
    $('segundos').textContent = p(Math.floor(resta % 60000 / 1000));
  }
  const reloj = setInterval(actualizarCuenta, 1000); actualizarCuenta();

  /* ---------- Formulario (solo visual por ahora) ---------- */
  $('formulario').addEventListener('submit', (e) => {
    e.preventDefault();
    $('formulario').style.display = 'none';
    $('gracias').style.display = 'block';
  });
})();
</script>
</body>
</html>
